<!-- features/mensajes/contactos.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>◈ Contactos · Sariel's</title>
    <link rel="stylesheet" href="/styles.css" />
    <!-- ===== FAVICON OFICIAL CSARIEL'S ===== -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
</head>
<body>
    <div id="app">

        <!-- ===== HEADER CON LOGOTIPO OFICIAL ===== -->
        <header class="header">
            <div class="header-content">
                <a href="/" class="logo">
                    <span class="logo-icon"><span class="hex">◈</span></span>
                    <span class="logo-text">Sariel's</span>
                    <span class="logo-badge">✦ WEB3</span>
                </a>
                <div class="header-info">
                    <span class="network-badge">🟢 Polygon</span>
                    <button id="connectWallet" class="btn-connect">
                        <span class="btn-icon">🔗</span>
                        Conectar Wallet
                    </button>
                </div>
            </div>
        </header>

        <!-- ===== CONTACTOS ===== -->
        <main class="main">
            <div class="container">

                <!-- ===== TABS ===== -->
                <div class="tabs">
                    <button class="tab active" data-tab="contactos" onclick="cambiarTab('contactos')">
                        <i class="fas fa-users"></i> Contactos
                    </button>
                    <button class="tab" data-tab="solicitudes" onclick="cambiarTab('solicitudes')">
                        <i class="fas fa-user-plus"></i> Solicitudes
                        <span class="badge hidden" id="badgeSolicitudes">0</span>
                    </button>
                    <button class="tab" data-tab="descubrir" onclick="cambiarTab('descubrir')">
                        <i class="fas fa-compass"></i> Descubrir
                    </button>
                    <button class="tab" data-tab="grupos" onclick="cambiarTab('grupos')">
                        <i class="fas fa-layer-group"></i> Grupos
                    </button>
                    <button class="tab" data-tab="bloqueados" onclick="cambiarTab('bloqueados')">
                        <i class="fas fa-ban"></i> Bloqueados
                    </button>
                </div>

                <!-- ===== CONTACTOS ===== -->
                <div id="tab-contactos">
                    <div class="search-filter-bar">
                        <input type="text" id="searchContactos" placeholder="🔍 Buscar contactos..." oninput="filtrarContactos()">
                        <button class="filter-btn active" data-filter="todos" onclick="filtrarContactosPor('todos')">Todos</button>
                        <button class="filter-btn" data-filter="online" onclick="filtrarContactosPor('online')">🟢 En línea</button>
                        <button class="filter-btn" data-filter="favoritos" onclick="filtrarContactosPor('favoritos')">⭐ Favoritos</button>
                        <button class="filter-btn" data-filter="recientes" onclick="filtrarContactosPor('recientes')">🕐 Recientes</button>
                    </div>
                    <div class="contact-list" id="listaContactos"></div>
                </div>

                <!-- ===== SOLICITUDES ===== -->
                <div id="tab-solicitudes" style="display:none;">
                    <div id="listaSolicitudes"></div>
                </div>

                <!-- ===== DESCUBRIR ===== -->
                <div id="tab-descubrir" style="display:none;">
                    <div id="listaDescubrir"></div>
                </div>

                <!-- ===== GRUPOS ===== -->
                <div id="tab-grupos" style="display:none;">
                    <div id="listaGrupos"></div>
                </div>

                <!-- ===== BLOQUEADOS ===== -->
                <div id="tab-bloqueados" style="display:none;">
                    <div id="listaBloqueados"></div>
                </div>

            </div>
        </main>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <div class="footer-content">
                <p class="footer-brand">✦ Sariel's · Sabor al Paladar ✦</p>
                <p>◈ Galleta Domo · Powered by Polygon</p>
                <p class="footer-small">
                    <a href="/terminos.html" target="_blank">📜 Términos y Condiciones</a>
                    &nbsp;·&nbsp;
                    <a href="/privacidad.html" target="_blank">🔒 Privacidad</a>
                </p>
            </div>
        </footer>

    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.0/dist/web3.min.js"></script>
    <script src="/app.js"></script>
    <script src="/features/mensajes/contactos.js"></script>
</body>
</html>
