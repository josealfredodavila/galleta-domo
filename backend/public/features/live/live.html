function showToast(msg, type = '', duration = 3500) {
    let t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.className = 'toast show';
    if (type === 'error') t.classList.add('error');
    else if (type === 'warning') t.classList.add('warning');
    else if (type === 'success') t.classList.add('success');
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => t.classList.remove('show'), duration);
}

function escapeHTML(texto) { if (!texto) return ''; const div = document.createElement('div'); div.textContent = texto; return div.innerHTML; }

function attrHTML(t) {
    return String(t ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
}

function mensajeErrorCamara(e) {
    const name = e?.name || '';
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError') return 'Permiso de cámara/micrófono denegado. Revisa los permisos del sitio en tu navegador (icono de candado en la barra de direcciones) y actívalos.';
    if (name === 'NotFoundError' || name === 'DevicesNotFoundError') return 'No se encontró cámara o micrófono en este dispositivo.';
    if (name === 'NotReadableError' || name === 'TrackStartError') return 'La cámara o el micrófono están siendo usados por otra app. Ciérrala e inténtalo de nuevo.';
    if (name === 'SecurityError') return 'El sitio no se está sirviendo por HTTPS o el contexto no es seguro; la cámara no se puede activar.';
    if (name === 'OverconstrainedError') return 'La cámara no soporta la configuración solicitada.';
    return e?.message || 'Error desconocido al conectar con LiveKit';
}

async function getSession() {

async function cargarLiveKit() { return await import('https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.esm.mjs'); }

async function obtenerTokenLiveKit(roomName, participantName, role = 'subscriber') {
    const session = await getSession();
    if (!session) throw new Error('No autenticado');
    const response = await fetch('/api/livekit/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ roomName: roomName, participantName: participantName })
    });
    if (!response.ok) { let error = { message: 'Error' }; try { error = await response.json(); } catch (e) {} throw new Error(error.message || error.error || `HTTP ${response.status}`); }
    const data = await response.json();
    return data.token;
}

async function verificarLivePassAntesDeTransmitir() {
    try {
        const session = await getSession();
        if (!session) return { puede: false, razon: 'sin_sesion' };
        if (!supabaseClient) supabaseClient = await window.supabaseReady;
        const { data, error } = await supabaseClient.rpc('puede_transmitir_live', {
            p_usuario_id: session.user.id
        });
        if (error) { console.error('Error verificando Live Pass:', error); return { puede: false, razon: 'error' }; }
        const info = Array.isArray(data) ? data[0] : data;
        if (!info.puede) {
            return { puede: false, razon: info.razon || 'sin_pass', mensaje: info.mensaje || 'No puedes transmitir ahora', minutos_restantes: info.minutos_restantes || 0 };
        }
        infoLivePass = info;
        return { puede: true, minutos_limite: info.minutos_limite, minutos_usados: info.minutos_usados, minutos_restantes: info.minutos_restantes, plan_horas_dia: info.plan_horas_dia };
    } catch (e) { console.error('Error:', e); return { puede: false, razon: 'error' }; }
}

function iniciarConteoMinutos() {
    if (timerConteoMinutos) clearInterval(timerConteoMinutos);
    tiempoInicioTransmision = Date.now();
    minutosTransmitiendo = 0;
    if (timerBarraTiempo) clearInterval(timerBarraTiempo);
    timerBarraTiempo = setInterval(() => { actualizarBarraTiempo(); }, 1000);
    timerConteoMinutos = setInterval(async () => { await registrarMinutoBackend(); }, 60000);
}

function detenerConteoMinutos() {
    if (timerConteoMinutos) { clearInterval(timerConteoMinutos); timerConteoMinutos = null; }
    if (timerBarraTiempo) { clearInterval(timerBarraTiempo); timerBarraTiempo = null; }
    tiempoInicioTransmision = null;
    minutosTransmitiendo = 0;
    const barra = document.getElementById('livepassTimeBar');
    if (barra) barra.classList.remove('visible');
}

function actualizarBarraTiempo() {
    if (!infoLivePass || !tiempoInicioTransmision) return;
    const barra = document.getElementById('livepassTimeBar');
    const restanteEl = document.getElementById('tiempoRestante');
    const progressEl = document.getElementById('tiempoProgress');
    if (!barra) return;
    const minutosTranscurridos = Math.floor((Date.now() - tiempoInicioTransmision) / 60000);
    const minutosRestantesTotales = infoLivePass.minutos_restantes - minutosTranscurridos;
    if (minutosRestantesTotales <= 0) { finalizarPorTiempoAgotado(); return; }
    barra.classList.add('visible');
    const horas = Math.floor(minutosRestantesTotales / 60);
    const mins = minutosRestantesTotales % 60;
    const tiempoTexto = horas > 0 ? `${horas}h ${mins}m` : `${mins} min`;
    if (restanteEl) restanteEl.textContent = tiempoTexto;
    const porcentaje = (minutosRestantesTotales / infoLivePass.minutos_limite) * 100;
    if (progressEl) progressEl.style.width = porcentaje + '%';
}

async function registrarMinutoBackend() {
    try {
        const session = await getSession();
        if (!session) return;
        const response = await fetch('/api/live/registrar-minuto', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${session.access_token}` }
        });
        if (response.status === 403) {
            console.warn('[Live] Límite de Live Pass alcanzado');
            finalizarPorTiempoAgotado();
            return;
        }
        if (response.ok) {
            minutosTransmitiendo++;
            console.log('✅ Minuto registrado. Total:', minutosTransmitiendo);
        }
    } catch (e) {
        console.error('Error registrando minuto:', e);
    }
}

async function iniciarTransmisionGeneral() {
    try {
        console.log('🎬 [1] Iniciando transmisión PROFESIONAL...');
        const session = await getSession();
        if (!session) { showToast('⚠️ Inicia sesión para transmitir', 'error'); return; }
        currentUser = session.user;
        if (!supabaseClient) supabaseClient = await window.supabaseReady;

        const verificacion = await verificarLivePassAntesDeTransmitir();
        if (!verificacion.puede) {
            if (verificacion.razon === 'sin_live_pass') mostrarModalLivePass('Necesitas un Live Pass activo para transmitir');
            else if (verificacion.razon === 'expirado') mostrarModalLivePass('Tu Live Pass ha expirado. Renueva para seguir transmitiendo');
            else if (verificacion.razon === 'sin_horas') mostrarModalLivePass('Ya usaste todas tus horas de hoy. Vuelve mañana o mejora tu plan');
            else mostrarModalLivePass(verificacion.mensaje || 'No puedes transmitir en este momento');
            return;
        }

        const { data: streamGrupo, error: checkGrupoError } = await supabaseClient.from('transmisiones').select('id').eq('streamer_id', currentUser.id).eq('estado', 'en_vivo').eq('is_live', true).not('grupo_id', 'is', null).maybeSingle();
        if (checkGrupoError) throw checkGrupoError;
        if (streamGrupo) { showToast('⚠️ Estás transmitiendo en un grupo. Finalízalo primero.', 'warning', 6000); return; }

        const { data: streamActivo, error: checkError } = await supabaseClient.from('transmisiones').select('id').eq('streamer_id', currentUser.id).eq('estado', 'en_vivo').eq('is_live', true).is('grupo_id', null).maybeSingle();
        if (checkError) throw checkError;
        if (streamActivo) { showToast('⚠️ Ya tienes una transmisión profesional activa', 'warning'); return; }

        showToast('⏳ Iniciando transmisión...', '', 3000);
        const titulo = prompt('Título de tu transmisión:', 'Mi live en Csariel\'s') || 'Live en Csariel\'s';
        const categoria = prompt('Categoría (gaming, musica, educacion, comunidad, tecnologia, general):', 'general') || 'general';

        const roomNameNuevo = `live-${currentUser.id}-${Date.now()}`;

        const { data: rpcResult, error: streamError } = await supabaseClient.rpc('crear_transmision', {
            p_titulo: titulo, p_categoria: categoria, p_room_name: roomNameNuevo, p_grupo_id: null
        });

        if (streamError) { console.error('❌ Error en RPC:', streamError); throw new Error(streamError.message || 'Error al crear transmisión'); }
        const nuevoId = (typeof rpcResult === 'object' && rpcResult !== null) ? rpcResult.id : rpcResult;
        if (!nuevoId) throw new Error('No se pudo crear la transmisión');

        const { data: transmision, error: fetchError } = await supabaseClient.from('transmisiones').select('*').eq('id', nuevoId).single();
        if (fetchError || !transmision) throw new Error('No se pudo recuperar la transmisión');

        currentStream = transmision;
        currentStreamId = transmision.id;
        document.getElementById('liveTitle').textContent = titulo;

        try {
            showToast('🔗 Conectando a LiveKit...', '', 2000);
            const { Room, Track } = await cargarLiveKit();
            liveKitRoom = new Room();
            const token = await obtenerTokenLiveKit(transmision.room_name, currentUser.id, 'publisher');
            await liveKitRoom.connect(LIVEKIT_CONFIG.url, token);
            await liveKitRoom.localParticipant.setCameraEnabled(true);
            await liveKitRoom.localParticipant.setMicrophoneEnabled(true);
            const localVideoTrack = liveKitRoom.localParticipant.getTrackPublication(Track.Source.Camera)?.videoTrack;
            if (localVideoTrack) localVideoTrack.attach(document.getElementById('liveVideo'));
            else throw new Error('La cámara se activó pero no se pudo obtener el video track');
            liveKitRoom.on('participantConnected', () => { espectadores++; document.getElementById('viewersCount').textContent = `● ${espectadores}`; });
            liveKitRoom.on('participantDisconnected', () => { espectadores = Math.max(0, espectadores - 1); document.getElementById('viewersCount').textContent = `● ${espectadores}`; });
        } catch (e) {
            console.error('❌ Error LiveKit/Cámara:', e);
            throw new Error(mensajeErrorCamara(e));
        }

        isLive = true;
        document.getElementById('viewersCount').textContent = '● 0';
        infoLivePass = verificacion;
        iniciarConteoMinutos();
        iniciarContadorEspectadores();
        suscribirseAlChat();
        await notificarSeguidores();
        adCerrado = false;
        iniciarRefrescoAnuncios();
        const horas = verificacion.plan_horas_dia || 2;
        showToast(`🎥 ¡Transmisión iniciada! Tienes ${horas}h disponibles hoy`, 'success', 5000);
    } catch (error) {
        console.error('❌ Error:', error);
        showToast('❌ Error: ' + error.message, 'error', 6000);
        if (liveKitRoom) { try { await liveKitRoom.disconnect(); } catch (e) {} liveKitRoom = null; }
        if (currentStreamId && supabaseClient) {
            try { await supabaseClient.rpc('finalizar_transmision', { p_transmision_id: currentStreamId }); }
            catch (cleanupErr) { console.error('No se pudo limpiar la transmisión fallida:', cleanupErr); }
        }
        detenerConteoMinutos();
        currentStream = null; currentStreamId = null; isLive = false;
    }
}

async function finalizarTransmisionGeneral() {
    try {
        const streamId = transmisionParamId || currentStreamId || currentStream?.id;
        if (!streamId) { showToast('⚠️ No se encontró el ID', 'error'); return; }
        if (currentUser) {
            if (!currentStream || currentStream.id !== streamId) {
                const { data: stream } = await supabaseClient.from('transmisiones').select('streamer_id, estado').eq('id', streamId).maybeSingle();
                if (!stream || stream.streamer_id !== currentUser.id) { showToast('⚠️ Solo el streamer puede finalizar', 'error'); return; }
                if (stream.estado === 'finalizada') { showToast('⚠️ Ya finalizó', 'warning'); return; }
                currentStream = stream;
            }
        }
        if (!confirm('¿Finalizar la transmisión?')) return;
        showToast('⏳ Finalizando...', '', 3000);
        detenerConteoMinutos();
        detenerSondeoDonacion();
        const video = document.getElementById('liveVideo');
        if (video && video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
        if (gameScreenStream) { gameScreenStream.getTracks().forEach(t => t.stop()); gameScreenStream = null; }
        if (liveKitRoom) { try { await liveKitRoom.disconnect(); } catch (e) {} liveKitRoom = null; }
        const { error } = await supabaseClient.rpc('finalizar_transmision', { p_transmision_id: streamId });
        if (error) {
            await supabaseClient.from('transmisiones').update({ estado: 'finalizada', is_live: false, fecha_fin: new Date().toISOString() }).eq('id', streamId);
        }
        if (streamInterval) { clearInterval(streamInterval); streamInterval = null; }
        if (channelChat) { supabaseClient.removeChannel(channelChat); channelChat = null; }
        detenerRefrescoAnuncios(); cerrarAnuncio();
        isLive = false; currentStream = null; currentStreamId = null; transmisionParamId = null;
        showToast('✅ Transmisión finalizada', 'success');
        setTimeout(() => { window.location.href = '/features/muro/muro.html'; }, 1500);
    } catch (error) {
        console.error(error);
        detenerConteoMinutos();
        detenerSondeoDonacion();
        showToast('❌ Error: ' + error.message, 'error');
    }
}

async function unirseATransmision(streamId) {
    try {
        const session = await getSession();
        if (!session) { showToast('⚠️ Inicia sesión', 'error'); return; }
        showToast('⏳ Uniéndose...', '', 2000);

        if (error) throw error;
        currentStream = stream;

        try {

function suscribirseAlChat() {

    if (channelChat) supabaseClient.removeChannel(channelChat);
    channelChat = supabaseClient.channel(`live-${currentStream.id}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes_live', filter: `transmision_id=eq.${currentStream.id}` },
            (payload) => { agregarMensajeAlChat(payload.new); })
        .subscribe();
}

async function enviarMensaje() {
    const input = document.getElementById('chatInput');
    const mensaje = input.value.trim();
    if (!mensaje) return;
    const session = await getSession();
    if (!session || !currentStream) { showToast('⚠️ Inicia sesión', 'error'); return; }
    const mod = verificarContenido(mensaje);
    if (mod.prohibido) { showToast(`⚠️ ${mod.razon}`, 'warning'); input.value = ''; return; }
    try {
        await supabaseClient.from('mensajes_live').insert({ transmision_id: currentStream.id, usuario_id: session.user.id, mensaje, nombre_usuario: session.user.user_metadata?.nombre || 'Explorador', creado_en: new Date().toISOString() });

function agregarMensajeAlChat(mensaje) {
    const container = document.getElementById('chatMessages');
    if (!container) return;
    const div = document.createElement('div');
    div.className = 'chat-msg';
    const avatar = mensaje.nombre_usuario ? mensaje.nombre_usuario.charAt(0).toUpperCase() : '◈';
    div.innerHTML = `<div class="avatar">${avatar}</div><div class="msg"><span class="name">${escapeHTML(mensaje.nombre_usuario || 'Explorador')}</span><span class="time">${new Date(mensaje.creado_en || mensaje.created_at).toLocaleTimeString()}</span><div class="text">${escapeHTML(mensaje.mensaje)}</div></div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    const c = document.getElementById('chatCount');
    if (c) c.textContent = `${container.querySelectorAll('.chat-msg').length} mensajes`;
}

function verificarContenido(texto) {
    const regex = new RegExp(`\\b(${PALABRAS_PROHIBIDAS.join('|')})\\b`, 'i');
    if (regex.test(texto)) return { prohibido: true, razon: 'Contenido inapropiado' };
    if (/(acoso|bullying|hostigamiento|amenaza)/i.test(texto)) return { prohibido: true, razon: 'Contenido de acoso' };
    const palabras = texto.split(' ');
    if (palabras.filter((p, i) => palabras.indexOf(p) !== i).length > 5) return { prohibido: true, razon: 'Posible spam' };
    return { prohibido: false };
}

    const btn = document.getElementById('btnConfirmarDonacion');

async function confirmarDonacion() {
    if (!montoDonacionSeleccionado || !redDonacionSeleccionada) return;
    if (!currentStream) { showToast('⚠️ No hay transmisión activa', 'error'); return; }

    const btn = document.getElementById('btnConfirmarDonacion');
    btn.disabled = true;
    btn.textContent = '⏳ Procesando...';

    try {
        const session = await getSession();
        if (!session) { showToast('⚠️ Inicia sesión', 'error'); return; }

        const response = await fetch('/api/live/donacion/crear', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${session.access_token}`
            },
            body: JSON.stringify({
                transmision_id: currentStream.id,
                monto_usd: montoDonacionSeleccionado,
                pay_currency: redDonacionSeleccionada
            })
        });

        if (response.status !== 201) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error || `Error HTTP ${response.status}`);
        }

        const data = await response.json();
        const paymentUrl = data.payment_url;
        const donacionId = data.id || data.donacion_id;

        if (!paymentUrl || !donacionId) throw new Error('Respuesta inválida del servidor');

        cerrarModalDonacion();
        window.open(paymentUrl, '_blank', 'noopener');
        showToast('⏳ Esperando confirmación del pago…', 'warning', 8000);
        iniciarSondeoDonacion(donacionId, montoDonacionSeleccionado);
    } catch (e) {
        console.error('Error creando donación:', e);
        showToast('❌ ' + (e.message || 'Error al crear donación'), 'error', 6000);
        btn.disabled = false;
        btn.textContent = '◆ Donar';
    }
}

function iniciarSondeoDonacion(donacionId, monto) {
    detenerSondeoDonacion();
    donacionActualId = donacionId;
    const INTERVALO_MS = 5000;
    const TIMEOUT_MS = 20 * 60 * 1000;
    const inicio = Date.now();

    donacionPollingInterval = setInterval(async () => {
        if (Date.now() - inicio > TIMEOUT_MS) {
            detenerSondeoDonacion();
            showToast('⏰ Tiempo de espera agotado. La donación no se confirmó.', 'warning', 8000);
            return;
        }
        try {
            const session = await getSession();
            if (!session) return;
            const resp = await fetch(`/api/live/donacion/${donacionId}/estado`, {
                headers: { 'Authorization': `Bearer ${session.access_token}` }
            });
            if (!resp.ok) return;
            const data = await resp.json();
            const estado = data.estado;
            if (estado === 'pagada') {
                detenerSondeoDonacion();
                const d = DONACIONES[monto];
                if (d && currentUser) {
                    mostrarEfectoDonacion(monto, d, currentUser);
                    agregarMensajeAlChat({
                        nombre_usuario: currentUser.user_metadata?.nombre || 'Explorador',
                        mensaje: `🎉 ¡Donó $${monto} USD (${d.nombre})!`,
                        creado_en: new Date().toISOString()
                    });
                }
                showToast(`🎉 ¡Donación de $${monto} confirmada!`, 'success', 6000);
            } else if (estado === 'fallida') {
                detenerSondeoDonacion();
                showToast('❌ La donación falló. Intenta de nuevo.', 'error', 6000);
            }
        } catch (e) { console.error('Error consultando estado de donación:', e); }
    }, INTERVALO_MS);
}

function detenerSondeoDonacion() {
    if (donacionPollingInterval) { clearInterval(donacionPollingInterval); donacionPollingInterval = null; }
    if (donacionPollingTimeout) { clearTimeout(donacionPollingTimeout); donacionPollingTimeout = null; }
    donacionActualId = null;
}

async function toggleMute() {

    try {
        const en = liveKitRoom.localParticipant.isMicrophoneEnabled;
        await liveKitRoom.localParticipant.setMicrophoneEnabled(!en);

        const btn = document.getElementById('muteBtn');

        if (isMuted) { btn.classList.add('muted'); if (muteLine) muteLine.style.display = ''; }

async function capturarPantalla() {
    if (!liveKitRoom) { showToast('⚠️ No estás transmitiendo', 'error'); return; }
    if (!navigator.mediaDevices?.getDisplayMedia) { showToast('⚠️ No soportado', 'error'); return; }
    try {
        const { LocalVideoTrack } = await cargarLiveKit();
        const ss = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        const svt = ss.getVideoTracks()[0];
        await liveKitRoom.localParticipant.publishTrack(new LocalVideoTrack(svt), { name: 'screen', source: 'screen_share' });
        const video = document.getElementById('liveVideo');
        if (video) { video.srcObject = ss; try { await video.play(); } catch (e) {} }
        showToast('🖥️ Compartiendo pantalla', 'success');
        svt.onended = async () => {
            try { const pub = liveKitRoom.localParticipant.getTrackPublicationByName('screen'); if (pub?.track) await liveKitRoom.localParticipant.unpublishTrack(pub.track); } catch (e) {}
            await restaurarCamara();
        };
    } catch (e) { showToast('⚠️ ' + mensajeErrorCamara(e), 'error'); }
}

async function restaurarCamara() {
    if (liveKitRoom) {
        const { Track } = await cargarLiveKit();
        await liveKitRoom.localParticipant.setCameraEnabled(true);
        const video = document.getElementById('liveVideo');
        const cam = liveKitRoom.localParticipant.getTrackPublication(Track.Source.Camera);
        if (video && cam?.videoTrack) cam.videoTrack.attach(video);
    }
}

    await iniciarTransmisionJuego(juego);
}

async function iniciarTransmisionJuego(juego) {
    try {
        const nj = juego?.nombre || 'Juego';
        if (esIOS()) { showToast('Compartir pantalla no disponible en iOS.', 'warning', 6000); return; }
        if (!soportaCompartirPantalla()) { showToast('⚠️ Tu navegador no soporta compartir pantalla.', 'error', 6000); return; }

        const verificacion = await verificarLivePassAntesDeTransmitir();
        if (!verificacion.puede) {
            if (verificacion.razon === 'sin_live_pass') mostrarModalLivePass('Necesitas un Live Pass activo para transmitir juegos');
            else if (verificacion.razon === 'expirado') mostrarModalLivePass('Tu Live Pass ha expirado. Renueva para seguir transmitiendo');
            else if (verificacion.razon === 'sin_horas') mostrarModalLivePass('Ya usaste todas tus horas de hoy. Vuelve mañana o mejora tu plan');
            else mostrarModalLivePass(verificacion.mensaje || 'No puedes transmitir en este momento');
            return;
        }

        showToast('🖥️ Elige la pantalla...', '', 5000);
        gameScreenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30, max: 60 } }, audio: true });
        const session = await getSession();
        if (!session) { gameScreenStream.getTracks().forEach(t => t.stop()); gameScreenStream = null; showToast('⚠️ Inicia sesión', 'error'); return; }
        currentUser = session.user;

        const { data: streamGrupo } = await supabaseClient.from('transmisiones').select('id').eq('streamer_id', currentUser.id).eq('estado', 'en_vivo').eq('is_live', true).not('grupo_id', 'is', null).maybeSingle();
        if (streamGrupo) { gameScreenStream.getTracks().forEach(t => t.stop()); gameScreenStream = null; showToast('⚠️ Estás transmitiendo en un grupo. Finalízalo primero.', 'warning', 6000); return; }

        const { data: act } = await supabaseClient.from('transmisiones').select('id').eq('streamer_id', currentUser.id).eq('estado', 'en_vivo').eq('is_live', true).is('grupo_id', null).maybeSingle();
        if (act) { gameScreenStream.getTracks().forEach(t => t.stop()); gameScreenStream = null; showToast('⚠️ Ya tienes una transmisión activa', 'warning'); return; }

        gameScreenTrack = gameScreenStream.getVideoTracks()[0];
        if (!gameScreenTrack) throw new Error('No se obtuvo la pista');

        const titulo = `◈ Jugando ${nj}`;
        const roomNameNuevo = `live-${currentUser.id}-${Date.now()}`;

        const { data: rpcResult, error: rpcError } = await supabaseClient.rpc('crear_transmision', {
            p_titulo: titulo, p_categoria: 'gaming', p_room_name: roomNameNuevo, p_grupo_id: null
        });
        if (rpcError) throw rpcError;

        const nuevoId = (typeof rpcResult === 'object' && rpcResult !== null) ? rpcResult.id : rpcResult;
        if (!nuevoId) throw new Error('Sin ID');

        const { data: transmision } = await supabaseClient.from('transmisiones').select('*').eq('id', nuevoId).single();
        if (!transmision) throw new Error('No se pudo recuperar');

        currentStream = transmision;
        currentStreamId = transmision.id;
        document.getElementById('liveTitle').textContent = titulo;

        const video = document.getElementById('liveVideo');
        if (video) { video.srcObject = gameScreenStream; video.muted = true; await video.play().catch(() => {}); }

        const { Room, LocalVideoTrack, LocalAudioTrack } = await cargarLiveKit();
        liveKitRoom = new Room();
        const token = await obtenerTokenLiveKit(transmision.room_name, currentUser.id, 'publisher');
        await liveKitRoom.connect(LIVEKIT_CONFIG.url, token);
        await liveKitRoom.localParticipant.publishTrack(new LocalVideoTrack(gameScreenTrack), { name: 'game-screen', source: 'screen_share' });
        const sa = gameScreenStream.getAudioTracks()[0];
        if (sa && LocalAudioTrack) await liveKitRoom.localParticipant.publishTrack(new LocalAudioTrack(sa), { name: 'game-audio', source: 'screen_share_audio' });
        await liveKitRoom.localParticipant.setMicrophoneEnabled(true);

        isLive = true; espectadores = 0;
        infoLivePass = verificacion;
        iniciarConteoMinutos();
        iniciarContadorEspectadores(); suscribirseAlChat(); await notificarSeguidores();
        adCerrado = false; iniciarRefrescoAnuncios();
        const horas = verificacion.plan_horas_dia || 2;
        showToast(`◈ ¡Transmitiendo ${nj}! Tienes ${horas}h disponibles hoy`, 'success', 5000);
        gameScreenTrack.onended = async () => { if (isLive && currentStreamId) { try { await finalizarTransmisionGeneral(); } catch (_) {} } };
    } catch (error) {
        console.error(error);
        showToast('✕ ' + mensajeErrorCamara(error), 'error', 6000);
        if (gameScreenStream) { gameScreenStream.getTracks().forEach(t => t.stop()); gameScreenStream = null; }
        gameScreenTrack = null;
        if (liveKitRoom) { try { await liveKitRoom.disconnect(); } catch (_) {} liveKitRoom = null; }
        if (currentStreamId) {
            try { await supabaseClient.rpc('finalizar_transmision', { p_transmision_id: currentStreamId }); }
            catch (cleanupErr) { console.error('No se pudo limpiar la transmisión de juego fallida:', cleanupErr); }
        }
        detenerConteoMinutos();
        currentStream = null; currentStreamId = null; isLive = false;
    }
}

async function cargarEstadisticas() {
    const session = await getSession();
    if (!session) { showToast('⚠️ Inicia sesión', 'error'); return; }
    const { data, error } = await supabaseClient.from('transmisiones').select('*').eq('streamer_id', session.user.id).is('grupo_id', null).order('fecha_inicio', { ascending: false });
    if (error) { showToast('✕ Error', 'error'); return; }
    if (!data || data.length === 0) { showToast('◈ Sin estadísticas aún', 'warning'); return; }
    const totalStreams = data.length;
    const totalHoras = data.reduce((a, s) => { if (s.fecha_inicio && s.fecha_fin) { const d = (new Date(s.fecha_fin) - new Date(s.fecha_inicio)) / 1000; return a + (d > 0 ? d : 0); } return a; }, 0) / 3600;
    const totalEspectadores = data.reduce((a, s) => a + (s.viewers_count || 0), 0);
    showToast(`◈ Transmisiones: ${totalStreams} · Horas: ${totalHoras.toFixed(1)}h · Espectadores: ${totalEspectadores}`, 'success', 6000);
}

    console.log('◈ Csariel\'s Live - cargando...');

    // Esperar al cliente singleton
    try {
        supabaseClient = await window.supabaseReady;
        if (!supabaseClient) supabaseClient = window.supabaseClient;
    } catch (e) {
        console.warn('[Live] No se pudo obtener el cliente:', e);
    }

    const session = await getSession();
    if (session) currentUser = session.user;
    else showToast('⚠️ Inicia sesión', 'warning');

    const params = new URLSearchParams(window.location.search);
    transmisionParamId = params.get('transmision');
    if (transmisionParamId) {
        currentStreamId = Number(transmisionParamId) || transmisionParamId;
        try {
            const { data: stream } = await supabaseClient.from('transmisiones').select('*').eq('id', currentStreamId).single();
            if (stream) { currentStream = stream; currentStreamId = stream.id; document.getElementById('liveTitle').textContent = stream.titulo || 'EN VIVO'; adCerrado = false; iniciarRefrescoAnuncios(); }
        } catch (e) { console.error(e); }
    }

    cargarTransmisionesActivas();
    setInterval(cargarTransmisionesActivas, 30000);

    const ci = document.getElementById('chatInput');
    if (ci) ci.addEventListener('keydown', e => { if (e.key === 'Enter') enviarMensaje(); });

    setTimeout(async () => {
        try {
            if (typeof window.inicializarIdiomas === 'function') {
                await window.inicializarIdiomas();
                console.log('✅ Idiomas aplicados al live');
            }
        } catch (e) { console.warn('⚠️ Error aplicando idiomas:', e); }
    }, 500);

    console.log('◈ Live PROFESIONAL listo');
});
