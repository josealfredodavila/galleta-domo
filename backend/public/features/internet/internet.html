let supabase = null;
let _supabaseInitIntento = 0;
const _supabaseInitMax = 30; // 3s

function inicializarSupabase() {
    try {
        if (supabase) return true;
        if (window.supabase && typeof window.supabase.createClient === 'function') {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            window.supabaseClient = supabase;
            console.log('✅ Supabase inicializado');
            return true;
        }
    } catch (e) {
        console.error('💥 Error createClient:', e);
    }
    return false;
}

function esperarSupabase() {
    return new Promise((resolve) => {
        if (inicializarSupabase()) { resolve(true); return; }
        const int = setInterval(() => {
            _supabaseInitIntento++;
            if (inicializarSupabase()) {
                clearInterval(int);
                resolve(true);
            } else if (_supabaseInitIntento >= _supabaseInitMax) {
                clearInterval(int);
                console.error('❌ Supabase SDK no cargó en 3s');
                resolve(false);
            }
        }, 100);
    });
}

// ═══════════════════════════════════════════════════════════
// FIX #5 y #6: fetch con timeout
// ═══════════════════════════════════════════════════════════
async function fetchConTimeout(url, opciones = {}, msTimeout = FETCH_TIMEOUT_MS) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), msTimeout);
    try {
        const resp = await fetch(url, Object.assign({}, opciones, { signal: controller.signal }));
        clearTimeout(timeoutId);
        return resp;
    } catch (e) {
        clearTimeout(timeoutId);
        if (e.name === 'AbortError') {
            throw new Error('Timeout: el servidor tardó demasiado en responder');
        }
        throw e;
    }
}

function showToast(mensaje, tipo = '') {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = mensaje;
    toast.className = 'toast show';
    if (tipo === 'error') toast.classList.add('error');
    else if (tipo === 'success') toast.classList.add('success');
    else if (tipo === 'warning') toast.classList.add('warning');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('show'), 3500);
}

function escapeHTML(t) {
    if (t === null || t === undefined) return '';
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function formatearMB(mb) {
    const n = Number(mb);
    if (!Number.isFinite(n) || n <= 0) return '0 MB';
    if (n >= 1000) return (n / 1000).toFixed(2) + ' GB';
    return Math.round(n) + ' MB';
}

// FIX #4: cargarSesion con verificación de supabase
// ═══════════════════════════════════════════════════════════
let currentSession = null;

async function cargarSesion() {
    try {
        if (!supabase) {
            console.warn('⚠️ Supabase no disponible — saltando verificación de sesión');
            return null;
        }
        const timeoutPromise = new Promise((resolve) =>
            setTimeout(() => resolve({ data: { session: null }, _timeout: true }), 5000)
        );
        const sessionPromise = supabase.auth.getSession();
        const result = await Promise.race([sessionPromise, timeoutPromise]);

        if (result._timeout) {
            console.warn('⏱️ getSession() tardó demasiado');
            return null;
        }

        const session = result?.data?.session;
        if (!session) {
            console.warn('❌ Sin sesión');
            return null;
        }
        currentSession = session;
        console.log('✅ Sesión cargada:', session.user.email);
        return session;
    } catch (e) {
        console.error('💥 Error en cargarSesion:', e);
        return null;
    }
}

// ═══════════════════════════════════════════════════════════
// fetchAutenticado con timeout
// ═══════════════════════════════════════════════════════════
async function fetchAutenticado(url, opciones = {}) {
    let session = currentSession;
    if (!session && supabase) {
        try {
            const timeoutPromise = new Promise((r) =>
                setTimeout(() => r({ data: { session: null } }), 3000)
            );
            const result = await Promise.race([supabase.auth.getSession(), timeoutPromise]);
            session = result?.data?.session;
        } catch (e) {
            session = null;
        }
    }
    if (!session) {
        throw new Error('Sin sesión activa');
    }
    const headers = Object.assign({}, opciones.headers || {}, {
        'Authorization': 'Bearer ' + session.access_token,
        'Content-Type': 'application/json'
    });
    const resp = await fetchConTimeout(url, Object.assign({}, opciones, { headers }));
    if (resp.status === 401) {
        console.warn('401 No autorizado');
        throw new Error('Sesión expirada');
    }
    return resp;
}

function getRedesDisponibles(montoMxn) {
    const monto = Number(montoMxn);
    if (!Number.isFinite(monto) || monto <= 0) return [];
    const montoUsd = monto * MXN_A_USD_APROX;
    return REDES_PAGO.filter(r => montoUsd >= r.min);
}

function poblarRedesDePago(montoMxn) {
    const select = document.getElementById('pay-currency');
    const info = document.getElementById('red-info');
    if (!select) return;
    const monto = Number(montoMxn);
    if (!Number.isFinite(monto) || monto <= 0) {
        select.innerHTML = '<option value="">Selecciona un paquete primero…</option>';
        if (info) info.innerHTML = '◈ Elige un paquete para ver las redes disponibles.';
        return;
    }
    const redes = getRedesDisponibles(monto);
    if (redes.length === 0) {
        const minimoMxn = Math.ceil(1 / MXN_A_USD_APROX);
        select.innerHTML = '<option value="">Monto insuficiente</option>';
        if (info) info.innerHTML = '<span class="warn">⚠ El paquete es menor al mínimo. Mínimo: ~$' + minimoMxn + ' MXN (1 USD).</span>';
        return;
    }
    const previo = select.value;
    select.innerHTML = redes.map(r => '<option value="' + r.value + '">' + r.label + ' · mín ' + r.min + ' USD</option>').join('');
    if (redes.some(r => r.value === previo)) select.value = previo;
    const montoUsd = (monto * MXN_A_USD_APROX).toFixed(2);
    const descartadas = REDES_PAGO.length - redes.length;
    if (info) {
        info.innerHTML = '◈ Precio: <strong>$' + monto.toFixed(2) + ' MXN</strong> ≈ <strong>$' + montoUsd + ' USD</strong><br>◈ ' + redes.length + ' red(es) disponibles' + (descartadas > 0 ? ' · ' + descartadas + ' ocultas por mínimo' : '');
    }
}

async function comprarInternet() {
    const phoneEl = document.getElementById('netPhone');
    const status = document.getElementById('netStatus');
    const terms = document.getElementById('checkNetTerms')?.checked;
    const btn = document.getElementById('btnPagar');
    const phone = phoneEl ? phoneEl.value.trim() : '';

    if (!selectedPack) { if (status) status.innerText = '⚠️ Selecciona un paquete'; return; }
    if (!phone) { if (status) status.innerText = '⚠️ Pon tu número o ID'; return; }
    if (!terms) { if (status) status.innerText = '⚠️ Acepta términos'; return; }
    const payCurrency = document.getElementById('pay-currency')?.value;
    if (!payCurrency) { if (status) status.innerText = '⚠️ Selecciona una red de pago'; return; }
    if (!supabase) { if (status) status.innerText = '❌ Sin conexión a datos'; return; }

    if (status) status.innerText = '⏳ Autenticando...';
    if (btn) btn.disabled = true;

    try {
        const session = currentSession || (await supabase.auth.getSession()).data?.session;
        if (!session) { window.location.replace('/'); return; }

        if (status) status.innerText = '⏳ Creando orden segura...';
        const { data: orden, error } = await supabase.rpc('crear_orden_internet', {
            p_plan_id: selectedPack.id,
            p_telefono: phone
        });
        if (error) throw error;
        if (!orden || !orden.id) throw new Error('Orden inválida del servidor');

        if (status) status.innerText = '⏳ Generando pago...';
        const resp = await fetchAutenticado(BACKEND_URL + '/api/payments/internet/create', {
            method: 'POST',
            body: JSON.stringify({ ordenId: orden.id, payCurrency: payCurrency })
        });
        const pagoData = await resp.json();
        if (!resp.ok || !pagoData.success || !pagoData.data?.payment_url) {
            if (status) status.innerText = '❌ ' + (pagoData.error || 'Error generando el pago');
            showToast('✕ ' + (pagoData.error || 'Error generando pago'), 'error');
            return;
        }

        window.open(pagoData.data.payment_url, '_blank', 'noopener,noreferrer');

        ordenActual = {
            id: orden.id,
            plan_nombre: orden.plan_nombre || selectedPack.nombre,
            datos_gb: orden.datos_gb || selectedPack.datos_gb,
            duracion_dias: orden.duracion_dias || selectedPack.duracion_dias,
            monto_mxn: orden.monto_mxn || selectedPack.precio_mxn,
            payCurrency: payCurrency,
            payment_url: pagoData.data.payment_url
        };
        planActual = selectedPack;

        mostrarVistaEsperando();
        iniciarPolling();
        showToast('◈ Redirigiendo a pago...', 'success');

    } catch (error) {
        console.error('Error en compra:', error);
        if (status) status.innerText = '❌ ' + error.message;
        showToast('❌ ' + error.message, 'error');
    } finally {
        if (btn) btn.disabled = false;
    }
}

let pollingInterval = null;
let pollingIntentos = 0;
let ordenActual = null;

function mostrarVistaEsperando() {
    if (!ordenActual) return;
    const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
    set('espPlan', ordenActual.plan_nombre || '—');

    const btn = document.getElementById('btnVerificar');
    if (btn) { btn.disabled = false; btn.innerHTML = '🔄 Ya pagué, verificar ahora'; }
    mostrarVista('esperando');
}

function iniciarPolling() {
    detenerPolling();
    pollingIntentos = 0;
    pollingInterval = setInterval(async () => {
        pollingIntentos++;
        if (pollingIntentos > POLLING_MAX_INTENTOS) {
            detenerPolling();
            showToast('⏳ Tiempo de espera agotado', 'warning', 6000);
            return;
        }
        await verificarEstadoOrden(false);
    }, POLLING_INTERVAL_MS);
}

function detenerPolling() {
    if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
    }
}

async function verificarPagoManual() {
    const btn = document.getElementById('btnVerificar');
    if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Verificando...'; }
    await verificarEstadoOrden(true);
    if (btn) { btn.disabled = false; btn.innerHTML = '🔄 Ya pagué, verificar ahora'; }
}

async function verificarEstadoOrden(manual = false) {
    if (!ordenActual || !ordenActual.id) return;
    try {
        const resp = await fetchAutenticado(BACKEND_URL + '/api/payments/internet/status/' + encodeURIComponent(ordenActual.id));
        const data = await resp.json();
        if (!resp.ok || !data.success) {
            if (manual) showToast('⚠️ ' + (data.error || 'No se pudo verificar'), 'warning');
            return;
        }
        const estado = data.data?.estado;
        const activated = data.activated === true || estado === 'activa' || estado === 'activada' || estado === 'completado';
        if (activated) {
            detenerPolling();
            showToast('🎉 ¡Pago confirmado! eSIM activada', 'success', 5000);
            setTimeout(async () => {
                await cargarEsimActual();
                mostrarVista('esim');
            }, 800);
            return;
        }
        if (estado === 'cancelada' || data.failed === true) {
            detenerPolling();
            showToast('❌ El pago fue cancelado o falló', 'error', 6000);
            setTimeout(volverACompra, 3000);
            return;
        }
        if (manual) showToast('⏳ Aún no se confirma el pago', 'warning', 4000);
    } catch (error) {
        console.error('Error verificando orden:', error);
        if (manual) showToast('❌ Error al verificar: ' + error.message, 'error');
    }
}

    const qrCanvas = document.getElementById('qrCanvas');
    const lpaBox = document.getElementById('esimLpaBox');

        try {
            QRCode.toCanvas(qrCanvas, activationCode, {
                width: 220, margin: 1,
                color: { dark: '#05080f', light: '#ffffff' }
            }, (err) => { if (err) console.error('Error generando QR:', err); });
        } catch (e) {
            console.error('Error QRCode.toCanvas:', e);
        }
        if (lpaBox) lpaBox.style.display = 'block';
        if (lpaValue) lpaValue.textContent = activationCode;
    } else if (qrCanvas) {
        const ctx = qrCanvas.getContext('2d');
        qrCanvas.width = 220; qrCanvas.height = 220;
        ctx.fillStyle = '#05080f'; ctx.fillRect(0, 0, 220, 220);
        ctx.fillStyle = '#D4AF37';
        ctx.font = '14px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(typeof QRCode === 'undefined' ? 'QR no disponible' : 'QR no generado', 110, 110);
        if (lpaBox) lpaBox.style.display = 'none';
    }

    const btnCambiar = document.getElementById('btnCambiarCelular');
    if (btnCambiar) {
        if (esim.puede_reemplazar) {
            btnCambiar.disabled = false;
            btnCambiar.title = 'Cambiar la eSIM a otro celular';
        } else {
            btnCambiar.disabled = true;
            const desde = esim.reemplazo_disponible_desde ? new Date(esim.reemplazo_disponible_desde) : null;
            btnCambiar.title = desde ? 'Disponible desde ' + desde.toLocaleDateString('es-MX') : 'Aún no disponible';
        }
    }
}

async function sincronizarEsim() {
    showToast('⏳ Sincronizando consumo...', '', 3000);
    try {
        const resp = await fetchAutenticado(BACKEND_URL + '/api/telnyx/esim/sync', { method: 'POST' });
        const data = await resp.json();
        if (!resp.ok || !data.success) {
            showToast('❌ ' + (data.error || 'No se pudo sincronizar'), 'error');
            return;
        }
        renderEsim(data.data);
        showToast('✅ Datos actualizados', 'success');
    } catch (error) {
        showToast('❌ Error al sincronizar: ' + error.message, 'error');
    }
}

async function cambiarCelular() {
    if (!confirm('¿Seguro que quieres cambiar tu eSIM a otro celular?\n\nSe generará una nueva eSIM con los GB restantes. Solo puedes hacer esto una vez cada 30 días.')) return;
    showToast('⏳ Generando nueva eSIM...', '', 8000);
    try {
        const resp = await fetchAutenticado(BACKEND_URL + '/api/telnyx/esim/reemplazar', { method: 'POST' });
        const data = await resp.json();
        if (!resp.ok || !data.success) {
            const err = data.error || 'No se pudo cambiar la eSIM';
            showToast(resp.status === 429 ? '⏳ ' + err : '❌ ' + err, resp.status === 429 ? 'warning' : 'error', 6000);
            return;
        }
        renderEsim(data.data);
        showToast('🎉 eSIM reemplazada. Escanea el nuevo QR.', 'success', 6000);
    } catch (error) {
        showToast('❌ Error: ' + error.message, 'error');
    }
}

function copiarLPA() {
    const lpa = document.getElementById('esimLpaValue')?.textContent;
    if (!lpa || lpa === '—') { showToast('⚠️ No hay código para copiar', 'warning'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lpa).then(() => showToast('📋 Código copiado', 'success')).catch(() => showToast('❌ No se pudo copiar', 'error'));
    } else {
        showToast('❌ Copiado no disponible', 'error');
    }
}

// STARS
// ═══════════════════════════════════════════════════════════
function initStars() {
    const canvas = document.getElementById('stars-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let width, height, stars = [];
    let isVisible = true;
    const isMobile = window.innerWidth < 600;
    const STAR_COUNT = isMobile ? 60 : 120;
    function resize() {
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width; canvas.height = height;
        createStars();
    }
    function createStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * width, y: Math.random() * height,
                radius: Math.random() * 0.8 + 0.2,
                speed: Math.random() * 0.005 + 0.002,
                opacity: Math.random() * 0.5 + 0.2,
                twinklePhase: Math.random() * Math.PI * 2
            });
        }
    }
    function draw() {
        if (!isVisible) { requestAnimationFrame(draw); return; }
        ctx.clearRect(0, 0, width, height);
        for (let star of stars) {
            const opacity = star.opacity * (0.6 + 0.4 * Math.sin(star.twinklePhase));
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, ' + opacity + ')';
            ctx.fill();
            star.twinklePhase += 0.02;
            star.y += star.speed;
            if (star.y > height) { star.y = 0; star.x = Math.random() * width; }
        }
        requestAnimationFrame(draw);
    }
    resize();
    draw();
    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', function() { isVisible = !document.hidden; });
}

window.addEventListener('beforeunload', detenerPolling);
document.addEventListener('visibilitychange', function() {
    if (document.hidden) detenerPolling();
});

// FIX #3: INIT que se ejecuta SIEMPRE, sin depender de DOMContentLoaded
// ═══════════════════════════════════════════════════════════
async function iniciarApp() {
    console.log('◈ Internet.html · iniciando...');

    // FIX: ocultar loading INMEDIATAMENTE
    ocultarLoading();

    try { initStars(); } catch (e) { console.warn('Error stars:', e); }

    // Esperar a que Supabase cargue (con timeout interno)
    const supabaseOk = await esperarSupabase();

    if (!supabaseOk) {
        console.warn('⚠️ Continuando sin Supabase');
        ocultarLoading();
        return;
    }

    // Intentar cargar sesión
    const session = await cargarSesion();
    if (!session) {
        // No hay sesión → mostrar vista compra igual, sin redirigir
        // (por si acaso el usuario llega sin login, igual ve la UI)
        try {
            await cargarPlanes();
            mostrarVista('compra');
        } catch (_) {}
        ocultarLoading();
        return;
    }

    // Intentar cargar eSIM
    let tieneEsim = false;
    try {
        tieneEsim = await cargarEsimActual();
        console.log('◈ ¿Tiene eSIM?', tieneEsim);
    } catch (e) {
        console.warn('⚠️ Error cargando eSIM:', e);
    }

    if (!tieneEsim) {
        try {
            await cargarPlanes();
            mostrarVista('compra');
            console.log('◈ Vista: compra ·', planes.length, 'paquetes');
        } catch (_) {}
    }

    // Listeners
    const phoneInput = document.getElementById('netPhone');
    if (phoneInput) {
        phoneInput.addEventListener('input', function() {
            if (selectedPack) selectPack(selectedPack.id);
        });
        phoneInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') comprarInternet();
        });
    }

    ocultarLoading();
    console.log('◈ Internet.html · listo');
}

// Ejecutar cuando el DOM esté listo (verificando readyState)
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciarApp);
} else {
    // El DOM ya está listo
    iniciarApp();
}

window.sincronizarEsim = sincronizarEsim;
window.cambiarCelular = cambiarCelular;
window.copiarLPA = copiarLPA;
window.showToast = showToast;
</script>
