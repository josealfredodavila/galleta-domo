<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f10" />
  <title>Noticias · Sariel's</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;800&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/features/shared/js/auth-global.js"></script>
  <style>
    :root {
      --bg: #0f0f10;
      --bg-2: #161618;
      --surface: #1b1b1e;
      --surface-2: #232327;
      --line: rgba(255, 255, 255, 0.09);
      --text: #f4f4f5;
      --muted: #9b9ba3;
      --gold: #d4af37;
      --cyan: #00e5ff;
      --green: #19e39a;
      --danger: #ff6b7a;
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { padding-bottom: calc(96px + var(--safe-bottom)); }
    button { font: inherit; color: inherit; }
    a { color: inherit; }

    /* ---------- Header ---------- */
    .top {
      position: sticky; top: 0; z-index: 20;
      padding: calc(14px + var(--safe-top)) 16px 10px;
      background: rgba(15, 15, 16, 0.9);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand {
      font-family: Orbitron, Inter, sans-serif; font-weight: 800; font-size: 1.35rem;
      letter-spacing: .5px; color: var(--gold); margin: 0;
    }
    .brand span { color: var(--cyan); }
    .session {
      font-size: .72rem; color: var(--muted); max-width: 55%;
      background: rgba(0, 229, 255, .06); border: 1px solid rgba(0, 229, 255, .2);
      border-radius: 999px; padding: 6px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .session.error { color: var(--danger); border-color: rgba(255, 107, 122, .35); }

    .chips {
      display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px 0; padding: 2px 16px 4px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
      color: var(--muted); padding: 9px 16px; border-radius: 999px; cursor: pointer;
      font-size: .88rem; font-weight: 600; transition: background .2s, color .2s, border-color .2s, transform .15s;
    }
    .chip:active { transform: scale(.97); }
    .chip[aria-selected="true"] {
      background: #f4f4f5; color: #0f0f10; border-color: #f4f4f5;
    }

    /* ---------- Feed ---------- */
    main { padding: 8px 16px 16px; max-width: 720px; margin: 0 auto; }

    .serif { font-family: 'Source Serif 4', Georgia, serif; }

    /* Portadas: foto real o color de respaldo por categoría */
    .cover {
      position: relative; overflow: hidden; background: linear-gradient(135deg, #1f2a26, #111514);
    }
    .cover::after {
      content: ''; position: absolute; inset: 0; z-index: 1;
      background: radial-gradient(circle at 80% 15%, rgba(255,255,255,.12), transparent 50%);
      pointer-events: none;
    }
    .photo {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;
      display: block;
    }
    .cat-general      { background: linear-gradient(135deg, #1d3a44, #0e1a1f); }
    .cat-mexico       { background: linear-gradient(135deg, #1f4a33, #0c1a13); }
    .cat-tecnologia   { background: linear-gradient(135deg, #2c2a58, #11112a); }
    .cat-conectividad { background: linear-gradient(135deg, #1d4b57, #0b1b20); }
    .cat-cripto       { background: linear-gradient(135deg, #5a430f, #1b1407); }
    .cat-negocios     { background: linear-gradient(135deg, #4d3418, #17100a); }
    .cover .letra {
      position: absolute; left: 16px; bottom: 10px; z-index: 1;
      font-family: Orbitron, sans-serif; font-weight: 800; font-size: 2.8rem; color: rgba(255,255,255,.2);
    }

    /* Hero: foto a sección completa con titular encima */
    .hero {
      position: relative; overflow: hidden; border-radius: 6px; min-height: 380px;
      display: flex; flex-direction: column; justify-content: flex-end;
      margin: 0 -16px 22px; animation: rise .45s ease both;
    }
    .hero .cover { position: absolute; inset: 0; }
    .hero .scrim {
      position: absolute; inset: 0; z-index: 2;
      background: linear-gradient(180deg, rgba(15,15,16,0) 30%, rgba(15,15,16,.92) 100%);
    }
    .hero .content { position: relative; z-index: 3; padding: 20px 16px 16px; }
    .hero h2 {
      font-family: 'Source Serif 4', Georgia, serif; font-weight: 700;
      font-size: 1.7rem; line-height: 1.2; margin: 8px 0 10px;
    }
    .hero p {
      font-family: 'Source Serif 4', Georgia, serif; color: #d3d3d8;
      font-size: 1rem; line-height: 1.5; margin: 0 0 12px;
    }

    .card {
      border-bottom: 1px solid var(--line); padding: 4px 0 20px; margin-bottom: 18px;
      animation: rise .4s ease both;
    }
    .card .cover {
      width: 100%; aspect-ratio: 16 / 10; border-radius: 14px; margin-bottom: 14px;
    }
    .card h2 {
      font-family: 'Source Serif 4', Georgia, serif; font-weight: 600;
      font-size: 1.32rem; line-height: 1.25; margin: 4px 0 8px;
    }
    .card p {
      font-family: 'Source Serif 4', Georgia, serif; color: #c9c9cf;
      font-size: 1rem; line-height: 1.5; margin: 0;
    }

    .eyebrow {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      font-size: .76rem; font-weight: 600; color: var(--muted);
    }
    .eyebrow .cat { color: var(--cyan); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }

    .summary { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .summary.open { display: block; -webkit-line-clamp: unset; }
    .more {
      background: none; border: 0; padding: 6px 0 0; color: var(--cyan);
      font-size: .88rem; font-weight: 600; cursor: pointer;
    }

    .actions {
      display: flex; align-items: center; gap: 6px; margin-top: 12px;
      padding-top: 10px; border-top: 1px solid var(--line);
    }
    .src { flex: 1; min-width: 0; color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .act {
      display: inline-flex; align-items: center; justify-content: center; background: none; border: 0;
      width: 38px; height: 38px; border-radius: 50%; color: var(--muted); cursor: pointer;
      transition: color .2s, background .2s, transform .15s;
    }
    .act:hover { background: rgba(255, 255, 255, .05); color: var(--text); }
    .act:active { transform: scale(.92); }
    .act[aria-pressed="true"] { color: var(--gold); }
    .act svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .act[aria-pressed="true"] svg { fill: currentColor; }
    .read {
      text-decoration: none; background: var(--cyan); color: #04141a; font-weight: 700;
      padding: 8px 16px; border-radius: 999px; font-size: .84rem;
    }

    /* Skeleton */
    .skeleton { background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    .sk-card { height: 300px; border-radius: 14px; margin-bottom: 18px; }
    .sk-hero { height: 380px; margin: 0 -16px 22px; }

    .empty {
      text-align: center; padding: 48px 20px; color: var(--muted);
      border: 1px dashed var(--line); border-radius: var(--radius);
    }
    .empty h3 { color: var(--text); margin: 0 0 8px; }
    .retry {
      margin-top: 14px; background: var(--cyan); color: #04141a; border: 0; font-weight: 700;
      padding: 10px 18px; border-radius: 12px; cursor: pointer;
    }

    /* ---------- Botón flotante y hoja de preguntas ---------- */
    .fab {
      position: fixed; right: 16px; bottom: calc(18px + var(--safe-bottom)); z-index: 30;
      background: linear-gradient(135deg, var(--cyan), var(--green)); color: #04141a; border: 0;
      padding: 14px 20px; border-radius: 999px; font-weight: 800; cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 229, 255, .3);
    }
    .fab:active { transform: scale(.96); }

    .backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .backdrop.on { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 82vh; overflow-y: auto;
      background: var(--bg-2); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0;
      padding: 12px 18px calc(18px + var(--safe-bottom));
      transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
    }
    .sheet.on { transform: translateY(0); }
    .grab { width: 44px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 12px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .sheet-head h3 { margin: 0; font-size: 1.1rem; }
    .close {
      background: var(--surface); border: 1px solid var(--line); width: 36px; height: 36px;
      border-radius: 50%; cursor: pointer; font-size: 1.1rem;
    }
    .ask-row { display: flex; gap: 10px; }
    .ask-row input {
      flex: 1; min-width: 0; background: var(--surface); color: var(--text); border: 1px solid var(--line);
      border-radius: 14px; padding: 13px 14px; font-size: .98rem; outline: none;
    }
    .ask-row input:focus { border-color: var(--cyan); }
    .ask-row button {
      background: var(--cyan); color: #04141a; border: 0; font-weight: 800; padding: 0 18px;
      border-radius: 14px; cursor: pointer;
    }
    .ask-row button:disabled { opacity: .5; }
    .suggest { display: flex; gap: 8px; overflow-x: auto; margin: 12px 0; padding-bottom: 2px; scrollbar-width: none; }
    .suggest::-webkit-scrollbar { display: none; }
    .suggest button {
      flex: 0 0 auto; background: var(--surface); border: 1px solid var(--line); color: var(--muted);
      padding: 8px 12px; border-radius: 999px; font-size: .8rem; cursor: pointer;
    }
    .answer {
      background: var(--surface); border: 1px solid rgba(0, 229, 255, .2); border-radius: 16px;
      padding: 16px; line-height: 1.55; white-space: pre-wrap; min-height: 60px; color: #e4e4e8;
    }
    .answer.err { color: var(--danger); border-color: rgba(255,107,122,.3); }
    .answer-src { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .answer-src a {
      display: block; text-decoration: none; background: var(--surface-2); border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 12px; font-size: .84rem; color: var(--cyan);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .thinking { display: inline-flex; gap: 5px; align-items: center; color: var(--muted); }
    .thinking i {
      width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); display: inline-block;
      animation: pulse 1s infinite ease-in-out;
    }
    .thinking i:nth-child(2) { animation-delay: .15s; }
    .thinking i:nth-child(3) { animation-delay: .3s; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; left: 50%; bottom: calc(92px + var(--safe-bottom)); transform: translateX(-50%) translateY(20px);
      background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
      padding: 10px 16px; border-radius: 12px; font-size: .86rem; opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; z-index: 60; max-width: 90vw;
    }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1 class="brand">Noticias<span>.</span></h1>
      <div class="session" id="session">Comprobando sesión…</div>
    </div>
    <nav class="chips" id="chips" role="tablist" aria-label="Categorías">
      <button class="chip" role="tab" aria-selected="true" data-category="general">Para ti</button>
      <button class="chip" role="tab" aria-selected="false" data-category="mexico">México</button>
      <button class="chip" role="tab" aria-selected="false" data-category="tecnologia">Tecnología</button>
      <button class="chip" role="tab" aria-selected="false" data-category="conectividad">Conectividad</button>
      <button class="chip" role="tab" aria-selected="false" data-category="cripto">Cripto</button>
      <button class="chip" role="tab" aria-selected="false" data-category="negocios">Negocios</button>
    </nav>
  </header>

  <main>
    <section id="feed" aria-live="polite"></section>
  </main>

  <button class="fab" id="fab" type="button">✦ Preguntar</button>

  <div class="backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grab"></div>
    <div class="sheet-head">
      <h3 id="sheet-title">Pregunta sobre la actualidad</h3>
      <button class="close" id="close" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="ask-row">
      <input id="pregunta-input" type="text" maxlength="1000" placeholder="Ej. ¿Qué pasa con eSIM en México hoy?" autocomplete="off" />
      <button id="consultar-btn" type="button">Preguntar</button>
    </div>
    <div class="suggest" id="suggest">
      <button type="button" data-q="¿Qué pasa hoy en México?">Hoy en México</button>
      <button type="button" data-q="Últimas noticias de criptomonedas">Cripto</button>
      <button type="button" data-q="Novedades de tecnología esta semana">Tecnología</button>
    </div>
    <div id="respuesta" class="answer" hidden></div>
    <div id="respuesta-fuentes" class="answer-src"></div>
  </section>

  <div class="toast" id="toast" role="status"></div>

  <script src="/features/noticias/noticias.js"></script>
</body>
</html>
