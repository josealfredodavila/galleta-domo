<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noticias · Sariel's</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/features/shared/js/auth-global.js"></script>
  <style>
    :root {
      --bg: #0b1d13;
      --panel: #123224;
      --panel-2: #1d4130;
      --gold: #d4af37;
      --cyan: #00e5ff;
      --text: #edf8f1;
      --muted: #b6c9bf;
      --border: rgba(0,229,255,0.28);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, sans-serif; }
    body { padding: 24px 16px 80px; }

    .container {
      max-width: 1100px; margin: 0 auto;
    }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; padding: 14px 18px; border-radius: 12px; background: rgba(18, 50, 36, 0.9);
      border: 1px solid var(--border); margin-bottom: 16px;
    }

    h1 {
      margin: 0; color: var(--gold); font-size: clamp(1.8rem, 3vw, 2.6rem);
      font-family: 'Orbitron', sans-serif;
    }

    .status {
      font-size: 0.8rem; color: var(--muted); background: rgba(0,229,255,0.08);
      border: 1px solid var(--border); border-radius: 999px; padding: 8px 12px;
    }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 24px;
    }

    .pill {
      border: 1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--text);
      border-radius: 999px; padding: 10px 16px; cursor: pointer; transition: 0.2s ease;
    }

    .pill.active, .pill:hover {
      background: var(--cyan); color: #0a1d13; border-color: var(--cyan); font-weight: 700;
    }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px;
    }

    .card {
      background: linear-gradient(180deg, rgba(29,65,48,.92), rgba(11,29,19,.95));
      border: 1px solid var(--border); border-radius: 16px; padding: 18px;
      display: flex; flex-direction: column; gap: 12px; min-height: 220px;
    }

    .card h3 { margin: 0; color: var(--cyan); line-height: 1.3; }
    .card p { margin: 0; color: var(--muted); }
    .card .meta { color: var(--gold); font-size: 0.8rem; }
    .card .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    .card a {
      color: var(--cyan); text-decoration: none; border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 10px; font-size: 0.8rem;
    }

    .panel {
      margin-top: 26px; padding: 18px; background: rgba(18,50,36,.9); border: 1px solid var(--gold); border-radius: 16px;
    }

    .row {
      display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px;
    }

    input {
      flex: 1 1 260px; background: rgba(11,29,19,.9); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; font-size: 1rem;
    }

    button {
      border: none; background: var(--cyan); color: #0b1d13; padding: 12px 18px; border-radius: 10px;
      font-weight: 700; cursor: pointer;
    }

    button:disabled { opacity: .55; cursor: not-allowed; }

    .respuesta {
      margin-top: 16px; border-left: 3px solid var(--cyan); background: rgba(0,229,255,0.05); padding: 14px;
      border-radius: 8px; color: var(--text); white-space: pre-wrap;
    }

    .error { color: #ff8d8d; }
    .notice { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Noticias</h1>
      <div class="status" id="status">Comprobando sesión…</div>
    </div>

    <div class="toolbar" id="toolbar">
      <button class="pill active" data-category="general">General</button>
      <button class="pill" data-category="mexico">México</button>
      <button class="pill" data-category="tecnologia">Tecnología</button>
      <button class="pill" data-category="conectividad">Conectividad</button>
      <button class="pill" data-category="cripto">Cripto</button>
      <button class="pill" data-category="negocios">Negocios</button>
    </div>

    <div id="news-grid" class="grid"></div>

    <section class="panel">
      <h2 style="margin:0 0 12px; color: var(--gold);">Pregunta sobre la actualidad</h2>
      <div class="row">
        <input id="pregunta-input" type="text" placeholder="Ej. ¿Qué pasa con eSIM en México hoy?" maxlength="1000" />
        <button id="consultar-btn" type="button">Consultar</button>
      </div>
      <div id="respuesta" class="respuesta" style="display:none;"></div>
      <div class="notice" style="margin-top: 12px;">Se usa la sesión autenticada de Supabase y el token se envía como Bearer.</div>
    </section>
  </div>

  <script src="/features/noticias/noticias.js"></script>
</body>
</html>
