<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión · Csariel's</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #05080f; color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background-image: radial-gradient(ellipse at 20% 50%, rgba(26, 74, 42, 0.4) 0%, transparent 60%), radial-gradient(ellipse at 80% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 60%); }
        .card { background: rgba(15, 45, 26, 0.55); padding: 2rem; border-radius: 20px; border: 2px solid rgba(212, 175, 55, 0.25); width: 100%; max-width: 420px; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
        .logo { font-family: 'Orbitron', monospace; font-size: 2rem; color: #D4AF37; margin-bottom: 8px; text-shadow: 0 0 30px rgba(212, 175, 55, 0.3); }
        h2 { font-family: 'Orbitron', monospace; color: #D4AF37; font-size: 1.2rem; margin-bottom: 8px; }
        .sub { color: #8aa8b8; font-size: 0.8rem; margin-bottom: 20px; }
        input { width: 100%; padding: 12px 16px; margin: 8px 0; border-radius: 10px; border: 1px solid rgba(212, 175, 55, 0.2); background: rgba(0, 0, 0, 0.5); color: #fff; font-size: 0.9rem; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #D4AF37; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #D4AF37, #b8923a); color: #05080f; border: none; border-radius: 10px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 12px; transition: transform 0.2s; font-family: 'Inter', sans-serif; }
        button:hover { transform: translateY(-2px); }
        button:disabled { opacity: 0.6; cursor: wait; transform: none; }
        .error { color: #ff3366; font-size: 0.75rem; margin-top: 12px; min-height: 18px; }
        .footer { margin-top: 20px; font-size: 0.7rem; color: #8aa8b8; }
        .footer a { color: #D4AF37; text-decoration: none; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(5, 8, 15, 0.9); display: none; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; gap: 16px; }
        .loading-overlay.show { display: flex; }
        .loading-overlay .spinner { font-family: 'Orbitron', monospace; font-size: 2rem; color: #D4AF37; animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .loading-overlay .loading-text { color: #8aa8b8; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="loading-overlay show" id="loadingOverlay">
        <div class="spinner">◈</div>
        <div class="loading-text">Verificando sesión...</div>
    </div>

    <div class="card" id="loginCard" style="visibility: hidden;">
        <div class="logo">◈</div>
        <h2>Iniciar Sesión</h2>
        <p class="sub">Ingresa para acceder a tu ecosistema</p>
        <input type="email" id="email" placeholder="Correo electrónico" autocomplete="email" inputmode="email">
        <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
        <button id="btnLogin" type="button">Entrar</button>
        <div id="errorMsg" class="error"></div>
        <div class="footer">¿No tienes cuenta? <a href="/registro.html">Regístrate</a></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script>
    (function () {
        'use strict';

        var RUTA_PERFIL = '/features/perfil/perfil.html';
        var FALLBACK_URL = 'https://zultnlogdoajehbswlih.supabase.co';
        var FALLBACK_KEY = 'sb_publishable_S3jONAz3mRO4JKBRhUdI1A_-nsyVhKu';

        var overlay = document.getElementById('loadingOverlay');
        var card = document.getElementById('loginCard');
        var errorDiv = document.getElementById('errorMsg');
        var client = null;

        function conTimeout(promise, ms) {
            return new Promise(function (resolve, reject) {
                var t = setTimeout(function () {
                    reject(new Error('Tiempo de espera agotado. Revisa tu conexión.'));
                }, ms);
                Promise.resolve(promise).then(
                    function (v) { clearTimeout(t); resolve(v); },
                    function (e) { clearTimeout(t); reject(e); }
                );
            });
        }

        function mostrarCard() {
            overlay.classList.remove('show');
            card.style.visibility = 'visible';
        }

        function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
        function lsDel(k) { try { localStorage.removeItem(k); } catch (_) {} }

        function esRutaInternaSegura(v) {
            if (typeof v !== 'string') return false;
            if (!v.startsWith('/') || v.startsWith('//') || v.startsWith('/\\')) return false;
            if (v.indexOf('://') !== -1) return false;
            var l = v.toLowerCase();
            if (l.startsWith('javascript:') || l.startsWith('data:') || l.startsWith('vbscript:')) return false;
            // Evita bucles: nunca volver a login / registro / inicio
            if (l === '/' || l.indexOf('login') !== -1 || l.indexOf('registro') !== -1 || l.indexOf('index.html') !== -1) return false;
            return true;
        }

        function calcularDestino() {
            var raw = new URLSearchParams(window.location.search).get('returnTo') || lsGet('wallet_returnTo');
            lsDel('wallet_returnTo');
            return esRutaInternaSegura(raw) ? raw : RUTA_PERFIL;
        }

        async function obtenerCliente() {
            if (client) return client;
            if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                throw new Error('No se pudo cargar Supabase. Recarga la página.');
            }

            var url = null, key = null;
            try {
                var ctrl = new AbortController();
                var timer = setTimeout(function () { ctrl.abort(); }, 6000);
                var r = await fetch('/api/config/public', {
                    credentials: 'same-origin',
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' },
                    signal: ctrl.signal
                });
                clearTimeout(timer);
                if (r.ok) {
                    var cfg = await r.json();
                    url = cfg && cfg.supabaseUrl;
                    key = cfg && cfg.supabaseAnonKey;
                }
            } catch (e) {
                console.warn('[Login] /api/config/public falló, uso fallback', e);
            }

            client = window.supabase.createClient(url || FALLBACK_URL, key || FALLBACK_KEY, {
                auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
            });
            window.supabaseClient = client;
            return client;
        }

        function traducir(msg) {
            var m = (msg || '').toLowerCase();
            if (m.indexOf('invalid login credentials') !== -1) return 'Correo o contraseña incorrectos';
            if (m.indexOf('email not confirmed') !== -1) return 'Debes confirmar tu correo antes de iniciar sesión. Revisa tu bandeja.';
            if (m.indexOf('too many requests') !== -1 || m.indexOf('rate limit') !== -1) return 'Demasiados intentos. Espera unos minutos.';
            if (m.indexOf('failed to fetch') !== -1 || m.indexOf('network') !== -1) return 'Sin conexión con el servidor. Revisa tu internet.';
            return msg || 'Error al iniciar sesión';
        }

        async function verificarSesionExistente() {
            try {
                var c = await conTimeout(obtenerCliente(), 10000);
                var res = await conTimeout(c.auth.getSession(), 8000);
                if (res && res.data && res.data.session) {
                    window.location.replace(calcularDestino());
                    return;
                }
            } catch (e) {
                console.warn('[Login] No se pudo verificar sesión:', e);
            }
            mostrarCard();
        }

        async function hacerLogin() {
            var btn = document.getElementById('btnLogin');
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            errorDiv.textContent = '';

            if (!email || !password) { errorDiv.textContent = 'Ingresa tu correo y contraseña'; return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errorDiv.textContent = 'Ingresa un correo válido'; return; }

            btn.disabled = true;
            btn.textContent = 'Entrando...';
            var redirigiendo = false;

            try {
                var c = await conTimeout(obtenerCliente(), 10000);
                var result = await conTimeout(
                    c.auth.signInWithPassword({ email: email, password: password }),
                    15000
                );

                if (result.error) throw new Error(result.error.message);
                if (!result.data || !result.data.session) throw new Error('No se pudo iniciar sesión');

                // Confirma que la sesión quedó guardada antes de cambiar de página
                await conTimeout(c.auth.getSession(), 8000);

                redirigiendo = true;
                overlay.classList.add('show');
                overlay.querySelector('.loading-text').textContent = 'Entrando...';
                window.location.replace(calcularDestino());
            } catch (err) {
                console.error('[Login] Error:', err);
                errorDiv.textContent = traducir(err && err.message);
            } finally {
                if (!redirigiendo) {
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                }
            }
        }

        document.getElementById('btnLogin').addEventListener('click', hacerLogin);
        document.getElementById('password').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') hacerLogin();
        });
        document.getElementById('email').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });

        verificarSesionExistente();
    })();
    </script>
</body>
</html>
