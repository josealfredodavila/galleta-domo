<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sariel's - Perfil</title>
</head>
<body>

    <!-- Tu estructura HTML visual se mantiene aquí -->

    <!-- Carga de Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CÓDIGO JAVASCRIPT UNIFICADO -->
    <script type="module">
        let sessionUser = null;
        let membresiaActual = null;
        let perfilUsuario = null;
        let pubSeleccionadaParaComentarios = null;

        // ===== TOAST =====
        function showToast(msg, type) {
            let t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.className = 'toast';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.className = 'toast show';
            if (type === 'error') t.classList.add('error');
            else if (type === 'warning') t.classList.add('warning');
            else if (type === 'success') t.classList.add('success');
            else t.classList.remove('error', 'warning', 'success');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3500);
        }

        // ===== INICIALIZACIÓN =====
        async function initPerfil() {
            try {
                const sessionResult = await window.supabase.auth.getSession();

                if (sessionResult.error || !sessionResult.data?.session) {
                    document.getElementById('perfilNombre').innerHTML = 'Inicia sesión';
                    document.getElementById('perfilHandle').textContent = '@invitado';
                    renderMembresiaFree();
                    return;
                }

                sessionUser = sessionResult.data.session.user;

                // Ejecución independiente con try/catch para evitar bloqueos
                cargarPerfilData();
                cargarMembresia();
                cargarPublicaciones();
                cargarEmojis();

            } catch (error) {
                console.error('Error inicializando perfil:', error);
                showToast('❌ Error inicializando el perfil', 'error');
            }
        }

        // ===== CARGAR PERFIL =====
        async function cargarPerfilData() {
            try {
                const { data: rpcData, error: rpcError } = await window.supabase.rpc('obtener_mi_perfil');

                if (!rpcError && rpcData) {
                    perfilUsuario = Array.isArray(rpcData) ? rpcData[0] : rpcData;
                } else {
                    const { data: tableData, error: tableError } = await window.supabase
                        .from('usuarios')
                        .select('*')
                        .eq('id', sessionUser.id)
                        .single();

                    if (tableError) throw tableError;
                    perfilUsuario = tableData;
                }

                if (perfilUsuario) actualizarUI(perfilUsuario);
            } catch (error) {
                console.error('Error al cargar perfil:', error);
            }
        }

        function actualizarUI(data) {
            const nombreEl = document.getElementById('perfilNombre');
            if (nombreEl) nombreEl.innerHTML = data.nombre || 'Usuario';

            const handleEl = document.getElementById('perfilHandle');
            if (handleEl) handleEl.textContent = '@' + (data.handle || 'usuario');

            const bioEl = document.getElementById('perfilBio');
            if (bioEl) bioEl.textContent = data.bio || 'Sin biografía';
        }

        // ===== CARGAR MEMBRESÍA =====
        async function cargarMembresia() {
            try {
                if (!sessionUser) return renderMembresiaFree();

                const { data, error } = await window.supabase.rpc('obtener_membresia_usuario', {
                    p_usuario_id: sessionUser.id
                });

                const membData = Array.isArray(data) ? data[0] : data;

                if (error || !membData || !membData.activa) {
                    renderMembresiaFree();
                    return;
                }

                renderMembresiaActiva(membData);
            } catch (error) {
                renderMembresiaFree();
            }
        }

        function renderMembresiaFree() {
            const container = document.getElementById('membresiaContainer');
            if (!container) return;
            container.innerHTML = `
                <div style="padding:15px; border:1px solid var(--glass-border); border-radius:12px;">
                    <h4>Plan Gratuito (FREE)</h4>
                    <p>Sin suscripción activa.</p>
                </div>
            `;
        }

        function renderMembresiaActiva(m) {
            const container = document.getElementById('membresiaContainer');
            if (!container) return;
            container.innerHTML = `
                <div style="padding:15px; border:1px solid var(--gold); border-radius:12px;">
                    <h4 style="color:var(--gold);">${m.plan_nombre || 'Plan Activo'}</h4>
                    <p>● ACTIVA</p>
                </div>
            `;
        }

        // ===== CARGAR PUBLICACIONES =====
        async function cargarPublicaciones() {
            const container = document.getElementById('postsList');
            if (!container || !sessionUser) return;

            try {
                const { data, error } = await window.supabase
                    .from('publicaciones')
                    .select('*')
                    .eq('usuario_id', sessionUser.id)
                    .order('created_at', { ascending: false });

                if (error || !data || data.length === 0) {
                    container.innerHTML = `<div class="empty-state">Sin publicaciones</div>`;
                    return;
                }

                container.innerHTML = data.map(p => `
                    <div class="publicacion-item">
                        <p>${p.contenido || ''}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error cargando publicaciones:', error);
            }
        }

        async function cargarEmojis() {}

        // ===== NAVEGACIÓN Y EXPOSICIÓN GLOBAL (EVENTOS ONCLICK) =====
        function cambiarTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + tabId)?.classList.add('active');
        }

        function abrirModalPublicacion() {
            document.getElementById('publicacionModal')?.classList.add('active');
        }

        function cerrarModal(id) {
            document.getElementById(id)?.classList.remove('active');
        }

        // EXPORTACIÓN A WINDOW
        window.cambiarTab = cambiarTab;
        window.abrirModalPublicacion = abrirModalPublicacion;
        window.cerrarModal = cerrarModal;
        window.guardarPerfil = () => showToast('Guardando...', 'info');

        document.addEventListener('DOMContentLoaded', initPerfil);
    </script>
</body>
</html>
