<!DOCTYPE html>
<html lang="es" data-require-auth>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Perfil · Csariel's</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/features/shared/js/auth-global.js"></script>
<script src="/features/shared/js/presencia-global.js?v=2"></script>

<link rel="stylesheet" href="/features/perfil/css/perfil.css">

<style>
    html:not(.auth-ready) .app { display: none !important; }
    .pub-aviso {
        margin: 16px auto;
        max-width: 720px;
        padding: 18px;
        border-radius: 16px;
        border: 1px solid var(--line-black, rgba(255,255,255,.12));
        background: rgba(255,255,255,.03);
        text-align: center;
        font-size: .8rem;
        color: var(--text-muted, #8ba0b3);
    }
    .pub-volver {
        display: inline-block;
        margin: 14px 16px 0;
        font-size: .75rem;
        color: var(--cyan, #00e5ff);
        text-decoration: none;
    }
    .pub-estado {
        margin-top: 6px;
        font-size: .72rem;
        display: none;
    }
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<div class="nebula nebula-1"></div>
<div class="nebula nebula-2"></div>
<div class="nebula nebula-3"></div>

<div class="app">

<header class="header">
    <a href="/" class="logo">
        <span class="logo-hex">◈</span>
        <span class="logo-text">Csariel<span>'s</span></span>
        <span class="logo-badge">✦ WEB3</span>
    </a>
    <div class="header-actions">
        <span class="network-badge" data-no-traducir="1"><span class="dot"></span> Polygon</span>
    </div>
</header>

<a class="pub-volver" href="/features/muro/muro.html">← Volver al Muro</a>

<div class="perfil-container">

    <div id="pubEstadoCargando" class="pub-aviso">Cargando perfil…</div>

    <div id="pubNoEncontrado" class="pub-aviso" style="display:none;">
        Este perfil no existe o ya no está disponible.
    </div>

    <div class="perfil-header" id="pubPerfil" style="display:none;">

        <div class="avatar-container" style="position:relative;">
            <div class="avatar" id="pubAvatar">◈</div>
        </div>

        <div class="info">
            <div class="nombre" id="pubNombre">
                <span></span>
                <span class="verified" id="pubVerificado" style="display:none;">
                    <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1 3-6z"/></svg>
                    VERIFICADO
                </span>
            </div>
            <div class="handle" id="pubHandle"></div>
            <div class="pub-estado" id="pubEstado"></div>

            <div class="badges">
                <span class="badge" id="pubWalletChip" data-no-traducir="1" title="Toca para copiar"
                      style="display:none;cursor:pointer;border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,0.05);font-family:monospace;">
                    ◈ 0x…
                </span>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="number" id="pubSeguidores">0</div>
                <div class="label">Seguidores</div>
            </div>
            <div class="stat">
                <div class="number" id="pubSiguiendo">0</div>
                <div class="label">Siguiendo</div>
            </div>
        </div>

    </div>

</div>

</div>

<div class="toast" id="toast"></div>

<script>
(function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };

    var chip = $('pubWalletChip');
    var estadoEl = $('pubEstado');
    var direccionCompleta = null;
    var perfilActual = null;

    function esperar(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    async function obtenerCliente() {
        var inicio = Date.now();
        while (Date.now() - inicio < 10000) {
            if (window.supabaseClient) return window.supabaseClient;
            if (typeof window.getSupabaseClient === 'function') {
                try {
                    var c = await window.getSupabaseClient();
                    if (c) return c;
                } catch (e) {}
            }
            await esperar(150);
        }
        return null;
    }

    function acortar(direccion) {
        return direccion.slice(0, 6) + '...' + direccion.slice(-4);
    }

    function mostrarNoEncontrado() {
        $('pubEstadoCargando').style.display = 'none';
        $('pubPerfil').style.display = 'none';
        $('pubNoEncontrado').style.display = 'block';
    }

    function pintarPerfil(perfil) {
        $('pubEstadoCargando').style.display = 'none';
        $('pubNoEncontrado').style.display = 'none';

        var avatar = $('pubAvatar');
        avatar.textContent = '';
        if (perfil.avatar_url) {
            var img = document.createElement('img');
            img.src = perfil.avatar_url;
            img.alt = '';
            img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;';
            avatar.appendChild(img);
        } else {
            avatar.textContent = '◈';
        }

        $('pubNombre').querySelector('span').textContent = perfil.nombre || 'Explorador';
        if (perfil.verificado) $('pubVerificado').style.display = 'inline-flex';

        $('pubHandle').textContent = '@' + perfil.handle;
        $('pubSeguidores').textContent = perfil.seguidores_count || 0;
        $('pubSiguiendo').textContent = perfil.siguiendo_count || 0;

        $('pubPerfil').style.display = 'flex';
    }

    // Estado en vivo desde presencia. Si el dueño oculta su estado,
    // la vista ya devuelve online=false y ultima_conexion=null: no se muestra nada.
    function pintarEstado() {
        if (!perfilActual) return;

        var mapa = window.presenciaUsuarios || {};
        var enLinea = Object.prototype.hasOwnProperty.call(mapa, perfilActual.id);

        if (enLinea) {
            estadoEl.textContent = '🟢 Activo ahora';
            estadoEl.style.color = 'var(--success)';
            estadoEl.style.display = 'block';
            return;
        }

        var relativo = window.formatearTiempoRelativo
            ? window.formatearTiempoRelativo(perfilActual.ultima_conexion)
            : '';

        if (relativo) {
            estadoEl.textContent = '⭕ Inactivo · ' + relativo;
            estadoEl.style.color = 'var(--text-muted)';
            estadoEl.style.display = 'block';
            return;
        }

        estadoEl.style.display = 'none';
    }

    function pintarWallet(address) {
        if (!address) {
            chip.style.display = 'none';
            direccionCompleta = null;
            return;
        }
        direccionCompleta = address;
        chip.textContent = '◈ ' + acortar(address);
        chip.style.display = 'inline-flex';
    }

    async function copiarWallet() {
        if (!direccionCompleta) return;
        try {
            if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                await navigator.clipboard.writeText(direccionCompleta);
            } else {
                var t = document.createElement('textarea');
                t.value = direccionCompleta;
                t.style.position = 'fixed';
                t.style.opacity = '0';
                document.body.appendChild(t);
                t.select();
                document.execCommand('copy');
                t.remove();
            }
            var previo = chip.textContent;
            chip.textContent = '✓ Copiada';
            setTimeout(function () { chip.textContent = previo; }, 1500);
        } catch (e) {
            console.warn('[PerfilPublico] Error copiando:', e);
        }
    }

    chip.addEventListener('click', copiarWallet);

    async function cargarPerfil() {
        var client = await obtenerCliente();
        if (!client) return mostrarNoEncontrado();

        var sesion = await client.auth.getSession();
        var session = sesion && sesion.data && sesion.data.session;
        if (!session) {
            window.location.replace('/');
            return;
        }

        var u = (new URLSearchParams(window.location.search).get('u') || '')
            .replace(/^@/, '').trim();
        if (!u) return mostrarNoEncontrado();

        var perfilRes = await client
            .from('perfiles_publicos')
            .select('id, nombre, handle, avatar_url, verificado, seguidores_count, siguiendo_count, online, ultima_conexion')
            .eq('handle', u)
            .maybeSingle();

        if (perfilRes.error || !perfilRes.data) return mostrarNoEncontrado();

        var perfil = perfilRes.data;

        if (perfil.id === session.user.id) {
            window.location.replace('/features/perfil/perfil.html');
            return;
        }

        perfilActual = perfil;
        pintarPerfil(perfil);

        var walletRes = await client
            .from('wallet_publica')
            .select('wallet_address')
            .eq('id', perfil.id)
            .maybeSingle();

        pintarWallet(!walletRes.error && walletRes.data ? walletRes.data.wallet_address : null);

        // Escucha presencia en vivo (solo observa; no anuncia a este visitante)
        window.addEventListener('sar:presence:sync', pintarEstado);
        if (window.Presencia) {
            await window.Presencia.iniciar(session.user.id, { track: false });
        }
        pintarEstado();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', cargarPerfil, { once: true });
    } else {
        cargarPerfil();
    }
})();
</script>

</body>
</html>
