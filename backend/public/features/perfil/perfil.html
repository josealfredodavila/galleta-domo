<style>
    html:not(.auth-ready) .app { display: none !important; }

    /* ================================================================
       PERFIL · MICROINTERACCIONES (v4, plano)
       ================================================================ */
    .btn, .btn-estado, .btn-conexion, .accion-btn, .tab-btn, .btn-publicar, .config-btn, .rep-btn, .pro-btn, .internet-filter, .nav-link, .avatar-menu button {
        -webkit-tap-highlight-color: transparent;
        transition: transform 140ms cubic-bezier(0.2, 0.8, 0.2, 1), filter 160ms ease, background-color 180ms ease, color 160ms ease, opacity 160ms ease;
    }
    .btn:active, .btn-estado:active, .btn-conexion:active, .accion-btn:active, .tab-btn:active, .btn-publicar:active, .config-btn:active, .rep-btn:active, .pro-btn:active, .internet-filter:active {
        transform: scale(0.97);
        filter: brightness(1.08);
    }
    .nav-link:active { opacity: 0.8; }
    @keyframes perfilTabIn { from { opacity: 0; } to { opacity: 1; } }
    .tab-content.active { animation: perfilTabIn 240ms ease both; }
    @media (prefers-reduced-motion: reduce) {
        .btn, .btn-estado, .btn-conexion, .accion-btn, .tab-btn, .btn-publicar, .config-btn, .rep-btn, .pro-btn, .internet-filter, .nav-link, .avatar-menu button, .tab-content.active { transition: none !important; animation: none !important; }
        .btn:active, .btn-estado:active, .btn-conexion:active, .accion-btn:active, .tab-btn:active, .btn-publicar:active, .config-btn:active, .rep-btn:active, .pro-btn:active, .internet-filter:active { transform: none !important; }
    }
