    /* ============================================================
       ICONOS
       ============================================================ */

    function icon(name) {

        if (
            window.CFG_ICONS &&
            window.CFG_ICONS[name]
        ) {
            return window.CFG_ICONS[name];
        }

        if (
            typeof window.cfgIcon ===
            "function"
        ) {
            return window.cfgIcon(name);
        }

        return "";
    }


    /* ============================================================
       ITEM DE CONFIGURACIÓN
       ============================================================ */

    function renderItem(options) {

        const {
            icon: iconName,
            title,
            desc,
            href,
            onclick,
            danger
        } = options;

        const element =
            document.createElement(
                href ? "a" : "button"
            );

        element.className =
            "cfg-item" +
            (
                danger
                    ? " cfg-item-danger"
                    : ""
            );

        if (href) {

            element.href =
                href;

        } else {

            element.type =
                "button";

            if (typeof onclick === "function") {

                element.addEventListener(
                    "click",
                    onclick
                );
            }
        }

        element.innerHTML = `
            <span class="cfg-item-icon">
                ${icon(iconName)}
            </span>

            <span class="cfg-item-content">
                <span class="cfg-item-title">
                    ${escapeHtml(title)}
                </span>

                <span class="cfg-item-desc">
                    ${escapeHtml(desc)}
                </span>
            </span>

            <span class="cfg-item-chevron">
                ${icon("chevronRight")}
            </span>
        `;

        return element;
    }


    /* ============================================================
       SEGURIDAD HTML
       ============================================================ */

    function escapeHtml(value) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            value == null
                ? ""
                : String(value);

        return div.innerHTML;
    }


    /* ============================================================
       TOAST
       ============================================================ */

    function toast(message, type) {

        let element =
            document.getElementById(
                "cfgToast"
            );

        if (!element) {

            element =
                document.createElement(
                    "div"
                );

            element.id =
                "cfgToast";

            element.className =
                "cfg-toast";

            document.body.appendChild(
                element
            );
        }

        element.textContent =
            message;

        element.className =
            "cfg-toast show" +
            (
                type
                    ? " cfg-toast-" + type
                    : ""
            );

        clearTimeout(
            toast.timer
        );

        toast.timer =
            setTimeout(
                function () {

                    element.className =
                        "cfg-toast";

                },
                3000
            );
    }


    /* ============================================================
       RUTAS INTERNAS
       ============================================================ */

    function rutaSegura(path) {

        if (
            typeof path !==
            "string"
        ) {
            return false;
        }

        if (
            !path.startsWith("/")
        ) {
            return false;
        }

        if (
            path.startsWith("//")
        ) {
            return false;
        }

        return true;
    }


    /* ============================================================
       RETURN TO
       ============================================================ */

    function guardarReturnTo() {

        try {

            const current =
                window.location.pathname +
                window.location.search +
                window.location.hash;

            if (
                rutaSegura(current)
            ) {

                localStorage.setItem(
                    "wallet_returnTo",
                    current
                );
            }

        } catch (error) {

            console.warn(
                "[Configuración] No se pudo guardar returnTo:",
                error
            );
        }
    }


    /* ============================================================
       ERROR CONTROLADO
       ============================================================ */

    function mostrarError(message) {

        document.documentElement
            .classList
            .add("auth-ready");

        const main =
            document.querySelector(
                ".cfg-content"
            );

        if (!main) {
            return;
        }

        main.innerHTML = `
            <div class="cfg-error-panel">

                <h2>
                    ⚠️ No se pudo cargar la configuración
                </h2>

                <p>
                    ${escapeHtml(message)}
                </p>

                <button
                    type="button"
                    id="cfgErrorBack"
                >
                    Volver al inicio
                </button>

            </div>
        `;

        const button =
            document.getElementById(
                "cfgErrorBack"
            );

        if (button) {

            button.addEventListener(
                "click",
                function () {

                    window.location.replace(
                        "/"

                }

        }
    }


    /* ============================================================
       SUPABASE
       ============================================================ */

    async function inicializarSupabase() {

        if (
            window.supabaseClient
        ) {

            supabaseClient =
                window.supabaseClient;

            return supabaseClient;
        }

        if (
            !window.supabase ||
            typeof window.supabase.createClient !==
                "function"
        ) {

            throw new Error(
                "Supabase SDK no disponible."
            );
        }


        const response =
            await fetch(
                "/api/config/public",
                {
                    method: "GET",
                    credentials:
                        "same-origin",
                    cache: "no-store",
                    headers: {
                        Accept:
                            "application/json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "No se pudo obtener la configuración pública de Supabase. HTTP " +
                response.status
            );
        }


        const config =
            await response.json();


        const url =
            config &&
            config.supabaseUrl;

        const anonKey =
            config &&
            config.supabaseAnonKey;


        if (
            typeof url !==
                "string" ||
            !url.trim()
        ) {

            throw new Error(
                "supabaseUrl no está disponible."
            );
        }


        if (
            typeof anonKey !==
                "string" ||
            !anonKey.trim()
        ) {

            throw new Error(
                "supabaseAnonKey no está disponible."
            );
        }


        supabaseClient =
            window.supabase.createClient(
                url.trim(),
                anonKey.trim(),
                {
                    auth: {
                        persistSession:
                            true,

                        autoRefreshToken:
                            true,

                        detectSessionInUrl:
                            true
                    }
                }
            );


        window.supabaseClient =
            supabaseClient;


        return supabaseClient;
    }


    /* ============================================================
       AUTENTICACIÓN
       ============================================================ */

    async function comprobarSesion() {

        let timeoutId;

        const timeout =
            new Promise(
                function (_, reject) {

                    timeoutId =
                        setTimeout(
                            function () {

                                reject(
                                    new Error(
                                        "Tiempo de espera agotado verificando la sesión."
                                    )
                                );

                            },
                            AUTH_TIMEOUT_MS
                        );
                }
            );


        try {

            const client =
                await Promise.race([
                    inicializarSupabase(),
                    timeout
                ]);


            clearTimeout(
                timeoutId
            );


            const result =
                await Promise.race([
                    client.auth.getSession(),
                    timeout
                ]);


            clearTimeout(
                timeoutId
            );


            const session =
                result &&
                result.data
                    ? result.data.session
                    : null;


            if (!session) {

                guardarReturnTo();

                window.location.replace(
                    "/"
                );

                return null;
            }


            window.__sarielsAuthenticated =
                true;

            document.documentElement
                .classList
                .add("auth-ready");


            return client;

        } catch (error) {

            clearTimeout(
                timeoutId
            );

            console.error(
                "[Configuración] Error de autenticación:",
                error
            );


            window.__sarielsAuthenticated =
                false;


            mostrarError(
                error &&
                error.message
                    ? error.message
                    : "No fue posible verificar tu sesión."
            );


            return null;
        }
    }

    /* ============================================================
       CARGAR USUARIO
       ============================================================ */

    async function cargarUsuario(
        client
    ) {

        try {

            const result =
                await client.auth.getUser();

            const user =
                result &&
                result.data
                    ? result.data.user
                    : null;


            if (!user) {
                return;
            }


            const subtitle =
                document.getElementById(
                    "cfgHeaderSubtitle"
                );


            if (!subtitle) {
                return;
            }


            const email =
                user.email || "";


            const handle =
                email
                    ? email.split("@")[0]
                    : "usuario";


            subtitle.textContent =
                "@" + handle;

        } catch (error) {

            console.warn(
                "[Configuración] No se pudo cargar el usuario:",
                error
            );
        }
    }

    async function cerrarSesion() {

        const confirmed =
            window.confirm(
                "¿Quieres cerrar sesión en este dispositivo?"
            );


        if (!confirmed) {
            return;
        }


        try {

            if (
                supabaseClient &&
                supabaseClient.auth
            ) {

                const result =
                    await supabaseClient
                        .auth
                        .signOut();


                if (result.error) {
                    throw result.error;
                }
            }


            window.location.replace(
                "/"
            );

        } catch (error) {

            console.error(
                "[Configuración] Error cerrando sesión:",
                error
            );

            toast(
                "No se pudo cerrar la sesión.",
                "error"
            );
        }
    }


    /* ============================================================
       PANEL REPARTIDOR
       ============================================================ */

    async function abrirPanelRepartidor() {

        try {

            const client =
                supabaseClient ||
                window.supabaseClient;


            if (!client) {

                window.location.href =
                    "/features/mercado/repartidor/registro.html";

                return;
            }


            const {
                data:
                    sessionData,
                error:
                    sessionError
            } =
                await client.auth.getSession();


            if (sessionError) {
                throw sessionError;
            }


            const session =
                sessionData &&
                sessionData.session;


            if (!session) {

                guardarReturnTo();

                window.location.replace(
                    "/"
                );

                return;
            }


            const result =
                await client
                    .from(
                        "mercado_repartidores"
                    )
                    .select(
                        "estado_verificacion"
                    )
                    .eq(
                        "usuario_id",
                        session.user.id
                    )
                    .maybeSingle();


            if (
                result.error
            ) {

                console.error(
                    "[Configuración] Error mercado_repartidores:",
                    result.error
                );

                window.location.href =
                    "/features/mercado/repartidor/registro.html";

                return;
            }


            if (
                !result.data
            ) {

                window.location.href =
                    "/features/mercado/repartidor/registro.html";

                return;
            }


            const estado =
                result.data
                    .estado_verificacion;


            if (
                estado ===
                "activo"
            ) {

                window.location.href =
                    "/features/mercado/repartidor/panel.html";

                return;
            }


            if (
                estado ===
                    "procesando" ||
                estado ===
                    "revision_manual" ||
                estado ===
                    "rechazado"
            ) {

                window.location.href =
                    "/features/mercado/repartidor/estado-verificacion.html";

                return;
            }


            window.location.href =
                "/features/mercado/repartidor/registro.html";

        } catch (error) {

            console.error(
                "[Configuración] Error del panel repartidor:",
                error
            );

            window.location.href =
                "/features/mercado/repartidor/registro.html";
        }
    }


    /* ============================================================
       INICIALIZACIÓN
       ============================================================ */

    async function iniciar() {

        inicializarHeader();


        const client =
            await comprobarSesion();


        if (!client) {
            return;
        }


        renderConfiguracion();


        await cargarUsuario(
            client
        );


        client.auth.onAuthStateChange(
            function (
                event,
                session
            ) {

                if (
                    !session &&
                    event !==
                        "INITIAL_SESSION"
                ) {

                    guardarReturnTo();

                    window.location.replace(
                        "/"
                    );
                }
            }
        );
    }


    iniciar();

})();
</script>
