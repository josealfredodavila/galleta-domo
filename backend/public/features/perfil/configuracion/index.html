        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron,monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>"
    />

    />

    <style>
        html:not(.auth-ready) body {
            visibility: hidden;
        }

        html.auth-ready body {
            visibility: visible;
        }

        .cfg-error-panel {
            max-width: 480px;
            margin: 80px auto;
            padding: 28px 22px;
            background: rgba(255, 51, 102, 0.08);
            border: 1px solid rgba(255, 51, 102, 0.35);
            border-radius: 16px;
            text-align: center;
            color: #f0f4f8;
            font-family: 'Inter', sans-serif;
        }

        .cfg-error-panel h2 {
            color: #ff3366;
            margin: 0 0 12px;
            font-size: 1.1rem;
        }

        .cfg-error-panel p {
            color: #8aa8b8;
            font-size: .85rem;
            line-height: 1.6;
            margin: 0 0 18px;
        }

        .cfg-error-panel button {
            border: 0;
            padding: 10px 20px;
            background: linear-gradient(135deg, #d4af37, #b8923a);
            color: #05080f;
            font-weight: 800;
            border-radius: 10px;
            font-size: .85rem;
            cursor: pointer;
        }

        .cfg-item-danger .cfg-item-icon,
        .cfg-item-danger .cfg-item-title {
            color: var(--cfg-danger);
        }
    </style>

</header>

              title: 'Panel Repartidor', desc: 'Accede a tu panel de entregas y gestiona tu disponibilidad',
              onclick: function () { abrirPanelRepartidor(); } }
        ],

        seccionRecursos: [
            { icon: 'info', tk: 'rec_terminos_titulo', dk: 'rec_terminos_desc',
              title: 'Términos y condiciones', desc: 'Consulta los términos de uso de Csariel\'s',
              href: '/terminos' },
            { icon: 'shield', tk: 'rec_privacidad_titulo', dk: 'rec_privacidad_desc',
              title: 'Política de privacidad', desc: 'Consulta cómo protegemos tus datos',
              href: '/privacidad.html' },
            { icon: 'fileText', tk: 'rec_cookies_titulo', dk: 'rec_cookies_desc',
              title: 'Cookies', desc: 'Consulta la política de cookies',
              href: '/cookies.html' },
            { icon: 'info', tk: 'rec_live_titulo', dk: 'rec_live_desc',
              title: 'Términos del Live', desc: 'Consulta los términos de transmisiones en vivo',
              href: '/live-terminos.html' }
        ],

        seccionSesion: [
            { icon: 'logout', tk: 'ses_cerrar_titulo', dk: 'ses_cerrar_desc',
              title: 'Cerrar sesión', desc: 'Salir de tu cuenta en este dispositivo',
              danger: true,
              onclick: function () { cerrarSesion(); } }
        ]
    };

    /* ============================================================
       HELPERS
       ============================================================ */

    function icon(name) {
        if (window.CFG_ICONS && window.CFG_ICONS[name]) {
            return window.CFG_ICONS[name];
        }

        if (typeof window.cfgIcon === 'function') {
            return window.cfgIcon(name);
        }

        return '';
    }

    function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value == null ? '' : String(value);
        return div.innerHTML;
    }

    // Texto traducido con respaldo en español
    function tt(clave, respaldo) {
        return typeof window.tConFallback === 'function'
            ? window.tConFallback(clave, respaldo)
            : respaldo;
    }

    // Aplica traducciones a un contenedor (si idiomas.js ya cargó)
    function traducir(raiz) {
        if (typeof window.aplicarTraducciones === 'function') {
            window.aplicarTraducciones(raiz || document);
        }
    }

    // Espera a que idiomas.js esté listo (máximo ~5 s)
    async function esperarIdiomasListos() {
        for (let i = 0; i < 50 && typeof window.esperarIdiomas !== 'function'; i++) {
            await new Promise(resolve => setTimeout(resolve, 100));
        }

        if (typeof window.esperarIdiomas === 'function') {
            try {
                await window.esperarIdiomas();
            } catch (e) {
                console.warn('[Configuración] Error esperando idiomas:', e);
            }
        }
    }

    /* ============================================================
       ITEM DE CONFIGURACIÓN
       ============================================================ */

    function renderItem(op) {
        const element = document.createElement(op.href ? 'a' : 'button');

        element.className = 'cfg-item' + (op.danger ? ' cfg-item-danger' : '');

        if (op.href) {
            element.href = op.href;
        } else {
            element.type = 'button';

            if (typeof op.onclick === 'function') {
                element.addEventListener('click', op.onclick);
            }
        }

        element.innerHTML = `
            <span class="cfg-item-icon">${icon(op.icon)}</span>
            <span class="cfg-item-content">
                <span class="cfg-item-title" data-clave="${escapeHtml(op.tk)}">${escapeHtml(op.title)}</span>
                <span class="cfg-item-desc" data-clave="${escapeHtml(op.dk)}">${escapeHtml(op.desc)}</span>
            </span>
            <span class="cfg-item-chevron">${icon('chevronRight')}</span>
        `;

        return element;
    }

    function renderConfiguracion() {
        Object.keys(SECCIONES).forEach(function (idContenedor) {
            const contenedor = document.getElementById(idContenedor);

            if (!contenedor) {
                return;
            }

            SECCIONES[idContenedor].forEach(function (op) {
                contenedor.appendChild(renderItem(op));
            });
        });
    }

    /* ============================================================
       TOAST
       ============================================================ */

    function toast(message, type) {
        let element = document.getElementById('cfgToast');

        if (!element) {
            element = document.createElement('div');
            element.id = 'cfgToast';
            element.className = 'cfg-toast';
            document.body.appendChild(element);
        }

        element.textContent = message;
        element.className = 'cfg-toast show' + (type ? ' cfg-toast-' + type : '');

        clearTimeout(toast.timer);

        toast.timer = setTimeout(function () {
            element.className = 'cfg-toast';
        }, 3000);
    }

    /* ============================================================
       RUTAS INTERNAS Y RETURN TO
       ============================================================ */

    function rutaSegura(path) {
        return typeof path === 'string' &&
               path.startsWith('/') &&
               !path.startsWith('//');
    }

    function guardarReturnTo() {
        try {
            const current =
                window.location.pathname +
                window.location.search +
                window.location.hash;

            if (rutaSegura(current)) {
                localStorage.setItem('wallet_returnTo', current);
            }
        } catch (error) {
            console.warn('[Configuración] No se pudo guardar returnTo:', error);
        }
    }

    /* ============================================================
       ERROR CONTROLADO
       ============================================================ */

    function mostrarError(message) {
        document.documentElement.classList.add('auth-ready');

        const main = document.querySelector('.cfg-content');

        if (!main) {
            return;
        }

        main.innerHTML = `
            <div class="cfg-error-panel">
                <h2 data-clave="cfg_error_titulo">⚠️ No se pudo cargar la configuración</h2>
                <p>${escapeHtml(message)}</p>
                <button type="button" id="cfgErrorBack" data-clave="cfg_volver_inicio">Volver al inicio</button>
            </div>
        `;

        const button = document.getElementById('cfgErrorBack');

        if (button) {
            button.addEventListener('click', function () {
                window.location.replace('/');
            });
        }

        esperarIdiomasListos().then(function () {
            traducir(main);
        });
    }

    /* ============================================================
       SUPABASE
       ============================================================ */

    async function inicializarSupabase() {
        if (window.supabaseClient) {
            supabaseClient = window.supabaseClient;
            return supabaseClient;
        }

        if (
            !window.supabase ||
            typeof window.supabase.createClient !== 'function'
        ) {
            throw new Error('Supabase SDK no disponible.');
        }

        const response = await fetch('/api/config/public', {
            method: 'GET',
            credentials: 'same-origin',
            cache: 'no-store',
            headers: { Accept: 'application/json' }
        });

        if (!response.ok) {
            throw new Error(
                'No se pudo obtener la configuración pública de Supabase. HTTP ' +
                response.status
            );
        }

        const config = await response.json();
        const url = config && config.supabaseUrl;
        const anonKey = config && config.supabaseAnonKey;

        if (typeof url !== 'string' || !url.trim()) {
            throw new Error('supabaseUrl no está disponible.');
        }

        if (typeof anonKey !== 'string' || !anonKey.trim()) {
            throw new Error('supabaseAnonKey no está disponible.');
        }

        supabaseClient = window.supabase.createClient(
            url.trim(),
            anonKey.trim(),
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );

        window.supabaseClient = supabaseClient;

        return supabaseClient;
    }

    /* ============================================================
       AUTENTICACIÓN
       ============================================================ */

    async function comprobarSesion() {
        let timeoutId;

        const timeout = new Promise(function (_, reject) {
            timeoutId = setTimeout(function () {
                reject(new Error('Tiempo de espera agotado verificando la sesión.'));
            }, AUTH_TIMEOUT_MS);
        });

        try {
            const client = await Promise.race([inicializarSupabase(), timeout]);
            clearTimeout(timeoutId);

            const result = await Promise.race([client.auth.getSession(), timeout]);
            clearTimeout(timeoutId);

            const session = result && result.data ? result.data.session : null;

            if (!session) {
                guardarReturnTo();
                window.location.replace('/');
                return null;
            }

            window.__sarielsAuthenticated = true;
            document.documentElement.classList.add('auth-ready');

            return client;
        } catch (error) {
            clearTimeout(timeoutId);

            console.error('[Configuración] Error de autenticación:', error);

            window.__sarielsAuthenticated = false;

            mostrarError(
                error && error.message
                    ? error.message
                    : 'No fue posible verificar tu sesión.'
            );

            return null;
        }
    }

    /* ============================================================
       HEADER
       ============================================================ */

    function inicializarHeader() {
        const back = document.getElementById('cfgBackButton');

        if (back) {
            back.innerHTML = icon('back');

            back.addEventListener('click', function () {
                window.location.href = '/features/perfil/perfil.html';
            });
        }
    }

    /* ============================================================
       CARGAR USUARIO (subtítulo con @handle)
       ============================================================ */

    async function cargarUsuario(client) {
        try {
            const result = await client.auth.getUser();
            const user = result && result.data ? result.data.user : null;

            if (!user) {
                return;
            }

            const subtitle = document.getElementById('cfgHeaderSubtitle');

            if (!subtitle) {
                return;
            }

            const email = user.email || '';
            const handle = email ? email.split('@')[0] : 'usuario';

            // Quitar la clave para que la traducción no sobrescriba el @handle
            subtitle.removeAttribute('data-clave');
            subtitle.textContent = '@' + handle;
        } catch (error) {
            console.warn('[Configuración] No se pudo cargar el usuario:', error);
        }
    }

    /* ============================================================
       CERRAR SESIÓN
       ============================================================ */

    async function cerrarSesion() {
        const confirmed = window.confirm(
            tt('cfg_confirm_cerrar_sesion', '¿Quieres cerrar sesión en este dispositivo?')
        );

        if (!confirmed) {
            return;
        }

        try {
            if (supabaseClient && supabaseClient.auth) {
                const result = await supabaseClient.auth.signOut();

                if (result.error) {
                    throw result.error;
                }
            }

            window.location.replace('/');
        } catch (error) {
            console.error('[Configuración] Error cerrando sesión:', error);

            toast(
                tt('cfg_error_cerrar_sesion', 'No se pudo cerrar la sesión.'),
                'error'
            );
        }
    }

    /* ============================================================
       PANEL REPARTIDOR
       ============================================================ */

    async function abrirPanelRepartidor() {
        try {
            const client = supabaseClient || window.supabaseClient;

            if (!client) {
                window.location.href = '/features/mercado/repartidor/registro.html';
                return;
            }

            const { data: sessionData, error: sessionError } =
                await client.auth.getSession();

            if (sessionError) {
                throw sessionError;
            }

            const session = sessionData && sessionData.session;

            if (!session) {
                guardarReturnTo();
                window.location.replace('/');
                return;
            }

            const result = await client
                .from('mercado_repartidores')
                .select('estado_verificacion')
                .eq('usuario_id', session.user.id)
                .maybeSingle();

            if (result.error) {
                console.error('[Configuración] Error mercado_repartidores:', result.error);
                window.location.href = '/features/mercado/repartidor/registro.html';
                return;
            }

            if (!result.data) {
                window.location.href = '/features/mercado/repartidor/registro.html';
                return;
            }

            const estado = result.data.estado_verificacion;

            if (estado === 'activo') {
                window.location.href = '/features/mercado/repartidor/panel.html';
                return;
            }

            if (
                estado === 'procesando' ||
                estado === 'revision_manual' ||
                estado === 'rechazado'
            ) {
                window.location.href = '/features/mercado/repartidor/estado-verificacion.html';
                return;
            }

            window.location.href = '/features/mercado/repartidor/registro.html';
        } catch (error) {
            console.error('[Configuración] Error del panel repartidor:', error);
            window.location.href = '/features/mercado/repartidor/registro.html';
        }
    }

    /* ============================================================
       INICIALIZACIÓN
       ============================================================ */

    async function iniciar() {
        inicializarHeader();

        const client = await comprobarSesion();

        if (!client) {
            return;
        }

        renderConfiguracion();

        await cargarUsuario(client);

        // Esperar traducciones y aplicarlas a todo lo renderizado
        await esperarIdiomasListos();
        traducir(document);

        client.auth.onAuthStateChange(function (event, session) {
            if (!session && event !== 'INITIAL_SESSION') {
                guardarReturnTo();
                window.location.replace('/');
            }
        });
    }

    iniciar();

})();
</script>
