<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Tu cuenta · Sariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../shared/config-layout.css" />
    
    <style>
        .cfg-profile-card {
            padding: 24px 16px;
            text-align: center;
            border-bottom: 1px solid var(--cfg-border);
        }
        .cfg-profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0F2D1A, #D4AF37);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #fff;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            margin: 0 auto 14px;
            overflow: hidden;
            border: 3px solid var(--cfg-gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
        }
        .cfg-profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cfg-profile-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--cfg-text);
            margin-bottom: 4px;
        }
        .cfg-profile-handle {
            font-size: 0.82rem;
            color: var(--cfg-text-muted);
            margin-bottom: 6px;
        }
        .cfg-profile-bio {
            font-size: 0.78rem;
            color: var(--cfg-text-muted);
            line-height: 1.5;
            max-width: 400px;
            margin: 0 auto;
        }
        .cfg-historial-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--cfg-border);
        }
        .cfg-historial-item:last-child {
            border-bottom: none;
        }
        .cfg-historial-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .cfg-historial-info {
            flex: 1;
            min-width: 0;
        }
        .cfg-historial-evento {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--cfg-text);
        }
        .cfg-historial-meta {
            font-size: 0.65rem;
            color: var(--cfg-text-muted);
            margin-top: 2px;
        }
        .cfg-loading-mini {
            padding: 20px;
            text-align: center;
            color: var(--cfg-text-muted);
            font-size: 0.75rem;
        }
        .cfg-empty-mini {
            padding: 30px 20px;
            text-align: center;
            color: var(--cfg-text-muted);
            font-size: 0.75rem;
        }
        .cfg-empty-mini .icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
            opacity: 0.4;
        }
        
        /* Estilos para modal de edición */
        .cfg-edit-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--cfg-border);
            border-radius: 10px;
            color: var(--cfg-text);
            font-size: 0.9rem;
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: var(--cfg-transition);
        }
        .cfg-edit-input:focus {
            border-color: var(--cfg-gold);
            background: rgba(0,0,0,0.4);
        }
        .cfg-edit-textarea {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--cfg-border);
            border-radius: 10px;
            color: var(--cfg-text);
            font-size: 0.9rem;
            outline: none;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            min-height: 80px;
            transition: var(--cfg-transition);
        }
        .cfg-edit-textarea:focus {
            border-color: var(--cfg-gold);
            background: rgba(0,0,0,0.4);
        }
        .cfg-edit-label {
            display: block;
            font-size: 0.72rem;
            color: var(--cfg-text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .cfg-edit-hint {
            font-size: 0.65rem;
            color: var(--cfg-text-dim);
            margin-top: 6px;
            line-height: 1.5;
        }
        .cfg-edit-counter {
            font-size: 0.65rem;
            color: var(--cfg-text-dim);
            margin-top: 4px;
            text-align: right;
        }
        .cfg-edit-error {
            font-size: 0.68rem;
            color: var(--cfg-danger);
            margin-top: 6px;
            display: none;
        }
        .cfg-edit-error.show {
            display: block;
        }
        html:not(.auth-ready) body {
            visibility: hidden;
        }
        html.auth-ready body {
            visibility: visible;
        }
    </style>
</head>
<body class="cfg-page">

    <div id="cfgHeaderSlot"></div>

    <main class="cfg-content">

        <div class="cfg-profile-card" id="perfilCard">
            <div class="cfg-profile-avatar" id="avatarCuenta">◈</div>
            <div class="cfg-profile-name" id="nombreCuenta">Cargando...</div>
            <div class="cfg-profile-handle" id="handleCuenta">@...</div>
            <div class="cfg-profile-bio" id="bioCuenta"></div>
        </div>

        <h2 class="cfg-section-title">Información de la cuenta</h2>
        <div class="cfg-list" id="seccionInfo"></div>

        <h2 class="cfg-section-title">Tu actividad en Sariel's</h2>
        <div class="cfg-list" id="seccionActividad"></div>

        <h2 class="cfg-section-title">Historial de accesos</h2>
        <div class="cfg-list" id="seccionHistorial"></div>

        <h2 class="cfg-section-title">Descarga de datos</h2>
        <div class="cfg-list" id="seccionDescarga"></div>

        <h2 class="cfg-section-title">Zona de peligro</h2>
        <div class="cfg-list" id="seccionPeligro"></div>

        <div class="cfg-footer">
            <strong>◈ Sariel's</strong> · Configuración · Tu cuenta
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../../shared/config-icons.js"></script>
    <script src="../../shared/config-layout.js"></script>

    <script>
    (function () {
        'use strict';

        const $ = (sel) => document.querySelector(sel);

        let clienteSupabase = null;
        let usuarioActual = null;
        let historialAccesos = [];
        let sesionActual = null;

        async function obtenerCliente() {
            if (clienteSupabase) return clienteSupabase;
            if (typeof window.cfgEsperarSupabase === 'function') {
                clienteSupabase = await window.cfgEsperarSupabase();
            }
            if (!clienteSupabase) {
                clienteSupabase = window.supabaseClient || null;
            }
            return clienteSupabase;
        }

        function esRutaInternaSegura(valor) {
            if (typeof valor !== 'string') return false;
            if (!valor.startsWith('/')) return false;
            if (valor.startsWith('//')) return false;
            if (valor.startsWith('/\\')) return false;
            return true;
        }

        function irAlIndexConReturnTo() {
            try {
                var returnTo = window.location.pathname + window.location.search + window.location.hash;
                if (esRutaInternaSegura(returnTo)) {
                    localStorage.setItem('wallet_returnTo', returnTo);
                }
                window.location.replace('/');
            } catch (e) {
                window.location.replace('/');
            }
        }

        // ============================================================
        // GUARD DE AUTENTICACIÓN
        // ============================================================
        async function guardiaDeAutenticacion() {
            var salvaguarda = setTimeout(function () {
                console.warn('[Cuenta] Salvaguarda activada sin confirmación → redirigiendo al index');
                irAlIndexConReturnTo();
            }, 10000);

            try {
                const client = await obtenerCliente();
                if (!client) {
                    throw new Error('Cliente Supabase no disponible.');
                }

                const resultado = await client.auth.getSession();
                const session = resultado && resultado.data ? resultado.data.session : null;

                clearTimeout(salvaguarda);

                if (!session) {
                    irAlIndexConReturnTo();
                    return null;
                }

                sesionActual = session;
                document.documentElement.classList.add('auth-ready');
                return client;

            } catch (error) {
                console.error('[Cuenta] Error crítico de autenticación:', error);
                clearTimeout(salvaguarda);
                irAlIndexConReturnTo();
                return null;
            }
        }

        // ============================================================
        // CARGAR DATOS DEL USUARIO
        // ============================================================
        async function cargarDatosUsuario(client) {
            try {
                if (!client || !sesionActual) return;

                const { data: usuario, error } = await client
                    .from('usuarios')
                    .select('nombre, handle, avatar_url, bio, email, created_at, plan')
                    .eq('id', sesionActual.user.id)
                    .maybeSingle();

                if (error) {
                    console.warn('Error cargando usuario:', error.message);
                }

                usuarioActual = usuario || null;
                renderPerfilCard(usuarioActual);

            } catch (e) {
                console.error('Error cargando usuario:', e);
            }
        }

        function renderPerfilCard(usuario) {
            if (!usuario) return;

            const avatarEl = $('#avatarCuenta');
            if (usuario.avatar_url) {
                avatarEl.innerHTML = `<img src="${escapeHtml(usuario.avatar_url)}" alt="Avatar">`;
            } else {
                avatarEl.textContent = '◈';
            }

            $('#nombreCuenta').textContent = usuario.nombre || 'Explorador';
            $('#handleCuenta').textContent = '@' + (usuario.handle || 'explorador');
            $('#bioCuenta').textContent = usuario.bio || 'Explorando el ecosistema Sariel\'s · WEB3 · Comunidad';
        }

        // ============================================================
        // CARGAR HISTORIAL DE ACCESOS
        // ============================================================
        async function cargarHistorial(client) {
            try {
                if (!client) return;

                const { data, error } = await client.rpc('obtener_mis_accesos', {
                    p_limit: 20
                });

                if (error) {
                    console.warn('Error RPC obtener_mis_accesos:', error.message);
                    historialAccesos = [];
                    return;
                }

                historialAccesos = data || [];

            } catch (e) {
                console.warn('Error historial:', e.message);
                historialAccesos = [];
            }
        }

        // ============================================================
        // RENDERIZAR SECCIONES
        // ============================================================
        function renderSecciones() {
            // ============================================================
            // INFORMACIÓN DE LA CUENTA
            // ============================================================
            const email = usuarioActual?.email || 'No disponible';
            const creado = usuarioActual?.created_at 
                ? new Date(usuarioActual.created_at).toLocaleDateString('es-MX', {
                    year: 'numeric', month: 'long', day: 'numeric'
                })
                : 'Desconocido';
            const plan = usuarioActual?.plan || 'Gratis';

            $('#seccionInfo').innerHTML = [
                cfgRenderItem({
                    icon: 'user',
                    title: 'Nombre de usuario',
                    desc: usuarioActual?.nombre || 'Explorador',
                    onclick: 'window.onEditarNombre()',
                }),
                cfgRenderItem({
                    icon: 'fileText',
                    title: 'Handle',
                    desc: '@' + (usuarioActual?.handle || 'explorador'),
                    onclick: 'window.onEditarHandle()',
                }),
                cfgRenderItem({
                    icon: 'info',
                    title: 'Biografía',
                    desc: usuarioActual?.bio || 'Sin biografía',
                    onclick: 'window.onEditarBio()',
                }),
                cfgRenderItem({
                    icon: 'info',
                    title: 'Correo electrónico',
                    desc: email,
                    onclick: 'window.onEditarEmail()',
                }),
                cfgRenderItem({
                    icon: 'crown',
                    title: 'Plan actual',
                    desc: plan,
                    onclick: 'window.onVerPlan()',
                }),
                cfgRenderItem({
                    icon: 'info',
                    title: 'Cuenta creada el',
                    desc: creado,
                    noChevron: true,
                }),
            ].join('');

            // ============================================================
            // ACTIVIDAD
            // ============================================================
            $('#seccionActividad').innerHTML = [
                cfgRenderItem({
                    icon: 'fileText',
                    title: 'Tus publicaciones',
                    desc: 'Consulta y administra todas tus publicaciones',
                    href: '/features/perfil/perfil.html',
                }),
                cfgRenderItem({
                    icon: 'users',
                    title: 'Tus contactos',
                    desc: 'Administra tus contactos y solicitudes',
                    href: '/features/mensajes/contactos.html',
                }),
                cfgRenderItem({
                    icon: 'coin',
                    title: 'Tu historial de transacciones',
                    desc: 'Consulta tu historial de compras y transacciones',
                    href: '/features/perfil/perfil.html',
                }),
            ].join('');

            // ============================================================
            // HISTORIAL DE ACCESOS
            // ============================================================
            const historialContainer = $('#seccionHistorial');
            if (historialAccesos.length === 0) {
                historialContainer.innerHTML = `
                    <div class="cfg-empty-mini">
                        <span class="icon">📜</span>
                        Sin historial de accesos aún
                    </div>
                `;
            } else {
                historialContainer.innerHTML = historialAccesos.map(h => {
                    const iconos = {
                        'login': '🔓',
                        'logout': '🔒',
                        'login_fallido': '⚠️',
                        'cambio_password': '🔑',
                        'cambio_email': '📧',
                        'activacion_2fa': '🛡️',
                        'desactivacion_2fa': '🔓',
                    };
                    const nombres = {
                        'login': 'Inicio de sesión',
                        'logout': 'Cierre de sesión',
                        'login_fallido': 'Intento fallido',
                        'cambio_password': 'Cambio de contraseña',
                        'cambio_email': 'Cambio de correo',
                        'activacion_2fa': '2FA activado',
                        'desactivacion_2fa': '2FA desactivado',
                    };
                    const icono = iconos[h.evento] || '📜';
                    const nombre = nombres[h.evento] || h.evento || 'Evento';
                    const fecha = h.created_at 
                        ? new Date(h.created_at).toLocaleString('es-MX', {
                            day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
                        })
                        : '';
                    const exitoso = h.exitoso !== false;

                    return `
                        <div class="cfg-historial-item">
                            <span class="cfg-historial-icon">${icono}</span>
                            <div class="cfg-historial-info">
                                <div class="cfg-historial-evento">${escapeHtml(nombre)}</div>
                                <div class="cfg-historial-meta">
                                    ${escapeHtml(h.dispositivo || 'Dispositivo')} · ${fecha}${!exitoso ? ' · <span style="color:var(--cfg-danger);">FALLIDO</span>' : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // ============================================================
            // DESCARGA
            // ============================================================
            $('#seccionDescarga').innerHTML = [
                cfgRenderItem({
                    icon: 'database',
                    title: 'Descargar archivo con tus datos',
                    desc: 'Obtén un archivo con tu información de Sariel\'s',
                    onclick: 'window.onDescargarDatos()',
                }),
            ].join('');

            // ============================================================
            // PELIGRO
            // ============================================================
            $('#seccionPeligro').innerHTML = [
                cfgRenderItem({
                    icon: 'lock',
                    title: 'Desactivar temporalmente mi cuenta',
                    desc: 'Oculta tu perfil y contenido temporalmente',
                    onclick: 'window.onDesactivarCuenta()',
                    class: 'cfg-item-plain',
                    style: 'color: var(--cfg-warning, #f7d44a);',
                }),
                cfgRenderItem({
                    icon: 'logout',
                    title: 'Eliminar mi cuenta',
                    desc: 'Elimina permanentemente tu cuenta y todos tus datos',
                    href: '/eliminar-cuenta.html',
                    class: 'cfg-item-plain',
                    style: 'color: var(--cfg-danger, #ff3366);',
                }),
            ].join('');
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function escapeHtml(texto) {
            if (!texto) return '';
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        // ============================================================
        // MODAL: EDITAR NOMBRE
        // ============================================================
        window.onEditarNombre = () => {
            const valorActual = usuarioActual?.nombre || '';

            const overlay = document.createElement('div');
            overlay.className = 'cfg-modal-overlay';

            overlay.innerHTML = `
                <div class="cfg-modal" style="max-width: 420px;">
                    <h3 class="cfg-modal-title">✏️ Editar nombre</h3>
                    <p class="cfg-modal-text" style="text-align:left;margin-bottom:16px;">
                        Este es el nombre que otros usuarios verán en Sariel's.
                    </p>
                    <div class="form-group" style="margin-bottom:14px;">
                        <label class="cfg-edit-label">Nombre</label>
                        <input type="text" id="inputEditarNombre" class="cfg-edit-input" value="${escapeHtml(valorActual)}" maxlength="50" placeholder="Tu nombre" />
                        <div class="cfg-edit-counter" id="counterNombre">${valorActual.length} / 50</div>
                        <div class="cfg-edit-hint">
                            ℹ️ Mínimo 2 caracteres. Máximo 50.
                        </div>
                    </div>
                    <div class="cfg-modal-actions">
                        <button class="cfg-btn cfg-btn-outline" data-action="cancel">Cancelar</button>
                        <button class="cfg-btn cfg-btn-primary" data-action="save">Guardar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            requestAnimationFrame(() => overlay.classList.add('show'));

            const input = overlay.querySelector('#inputEditarNombre');
            const counter = overlay.querySelector('#counterNombre');
            setTimeout(() => { input.focus(); input.select(); }, 300);

            input.addEventListener('input', () => {
                counter.textContent = input.value.length + ' / 50';
            });

            const close = () => {
                overlay.classList.remove('show');
                setTimeout(() => overlay.remove(), 200);
            };

            overlay.querySelector('[data-action="cancel"]').onclick = close;
            overlay.onclick = (e) => { if (e.target === overlay) close(); };

            overlay.querySelector('[data-action="save"]').onclick = async () => {
                const nuevoNombre = input.value.trim();

                if (nuevoNombre.length < 2) {
                    cfgToast('⚠️ El nombre debe tener al menos 2 caracteres', 'warning');
                    return;
                }

                try {
                    const client = await obtenerCliente();
                    if (!client) throw new Error('Supabase no disponible');

                    const { error } = await client.rpc('actualizar_perfil', {
                        p_nombre: nuevoNombre,
                        p_handle: usuarioActual?.handle || null,
                        p_bio: usuarioActual?.bio || null
                    });

                    if (error) throw error;

                    cfgToast('✅ Nombre actualizado', 'success');
                    close();

                    usuarioActual.nombre = nuevoNombre;
                    $('#nombreCuenta').textContent = nuevoNombre;
                    renderSecciones();

                } catch (e) {
                    console.error('Error guardando nombre:', e);
                    cfgToast('❌ Error: ' + e.message, 'error');
                }
            };
        };

        // ============================================================
        // MODAL: EDITAR HANDLE
        // ============================================================
        window.onEditarHandle = () => {
            const valorActual = usuarioActual?.handle || '';

            const overlay = document.createElement('div');
            overlay.className = 'cfg-modal-overlay';

            overlay.innerHTML = `
                <div class="cfg-modal" style="max-width: 420px;">
                    <h3 class="cfg-modal-title">✏️ Editar handle</h3>
                    <p class="cfg-modal-text" style="text-align:left;margin-bottom:16px;">
                        Tu @handle es único. Solo puede contener letras, números y guion bajo.
                    </p>
                    <div class="form-group" style="margin-bottom:14px;">
                        <label class="cfg-edit-label">Handle (@)</label>
                        <input type="text" id="inputEditarHandle" class="cfg-edit-input" value="${escapeHtml(valorActual)}" maxlength="30" placeholder="usuario" />
                        <div class="cfg-edit-counter" id="counterHandle">${valorActual.length} / 30</div>
                        <div class="cfg-edit-hint">
                            ℹ️ Sin @. Solo letras (a-z), números (0-9) y guion bajo (_).
                        </div>
                        <div class="cfg-edit-error" id="errorHandle"></div>
                    </div>
                    <div class="cfg-modal-actions">
                        <button class="cfg-btn cfg-btn-outline" data-action="cancel">Cancelar</button>
                        <button class="cfg-btn cfg-btn-primary" data-action="save">Guardar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            requestAnimationFrame(() => overlay.classList.add('show'));

            const input = overlay.querySelector('#inputEditarHandle');
            const counter = overlay.querySelector('#counterHandle');
            const errorEl = overlay.querySelector('#errorHandle');
            setTimeout(() => { input.focus(); input.select(); }, 300);

            input.addEventListener('input', () => {
                const val = input.value.replace(/[^a-zA-Z0-9_]/g, '').toLowerCase();
                input.value = val;
                counter.textContent = val.length + ' / 30';
                errorEl.classList.remove('show');
            });

            const close = () => {
                overlay.classList.remove('show');
                setTimeout(() => overlay.remove(), 200);
            };

            overlay.querySelector('[data-action="cancel"]').onclick = close;
            overlay.onclick = (e) => { if (e.target === overlay) close(); };

            overlay.querySelector('[data-action="save"]').onclick = async () => {
                const nuevoHandle = input.value.trim().toLowerCase();

                if (nuevoHandle.length < 3) {
                    errorEl.textContent = '⚠️ El handle debe tener al menos 3 caracteres';
                    errorEl.classList.add('show');
                    return;
                }

                if (!/^[a-z0-9_]+$/.test(nuevoHandle)) {
                    errorEl.textContent = '⚠️ Solo letras, números y guion bajo';
                    errorEl.classList.add('show');
                    return;
                }

                try {
                    const client = await obtenerCliente();
                    if (!client) throw new Error('Supabase no disponible');

                    const { error } = await client.rpc('actualizar_perfil', {
                        p_nombre: usuarioActual?.nombre || null,
                        p_handle: nuevoHandle,
                        p_bio: usuarioActual?.bio || null
                    });

                    if (error) throw error;

                    cfgToast('✅ Handle actualizado', 'success');
                    close();

                    usuarioActual.handle = nuevoHandle;
                    $('#handleCuenta').textContent = '@' + nuevoHandle;
                    renderSecciones();

                } catch (e) {
                    console.error('Error guardando handle:', e);
                    errorEl.textContent = '❌ Error: ' + e.message;
                    errorEl.classList.add('show');
                }
            };
        };

        // ============================================================
        // MODAL: EDITAR BIO
        // ============================================================
        window.onEditarBio = () => {
            const valorActual = usuarioActual?.bio || '';

            const overlay = document.createElement('div');
            overlay.className = 'cfg-modal-overlay';

            overlay.innerHTML = `
                <div class="cfg-modal" style="max-width: 440px;">
                    <h3 class="cfg-modal-title">✏️ Editar biografía</h3>
                    <p class="cfg-modal-text" style="text-align:left;margin-bottom:16px;">
                        Cuéntale a los demás un poco sobre ti.
                    </p>
                    <div class="form-group" style="margin-bottom:14px;">
                        <label class="cfg-edit-label">Biografía</label>
                        <textarea id="inputEditarBio" class="cfg-edit-textarea" maxlength="160" placeholder="Explorando el ecosistema Sariel's · WEB3 · Comunidad">${escapeHtml(valorActual)}</textarea>
                        <div class="cfg-edit-counter" id="counterBio">${valorActual.length} / 160</div>
                    </div>
                    <div class="cfg-modal-actions">
                        <button class="cfg-btn cfg-btn-outline" data-action="cancel">Cancelar</button>
                        <button class="cfg-btn cfg-btn-primary" data-action="save">Guardar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            requestAnimationFrame(() => overlay.classList.add('show'));

            const input = overlay.querySelector('#inputEditarBio');
            const counter = overlay.querySelector('#counterBio');
            setTimeout(() => input.focus(), 300);

            input.addEventListener('input', () => {
                counter.textContent = input.value.length + ' / 160';
            });

            const close = () => {
                overlay.classList.remove('show');
                setTimeout(() => overlay.remove(), 200);
            };

            overlay.querySelector('[data-action="cancel"]').onclick = close;
            overlay.onclick = (e) => { if (e.target === overlay) close(); };

            overlay.querySelector('[data-action="save"]').onclick = async () => {
                const nuevaBio = input.value.trim();

                try {
                    const client = await obtenerCliente();
                    if (!client) throw new Error('Supabase no disponible');

                    const { error } = await client.rpc('actualizar_perfil', {
                        p_nombre: usuarioActual?.nombre || null,
                        p_handle: usuarioActual?.handle || null,
                        p_bio: nuevaBio || null
                    });

                    if (error) throw error;

                    cfgToast('✅ Biografía actualizada', 'success');
                    close();

                    usuarioActual.bio = nuevaBio;
                    $('#bioCuenta').textContent = nuevaBio || 'Explorando el ecosistema Sariel\'s · WEB3 · Comunidad';
                    renderSecciones();

                } catch (e) {
                    console.error('Error guardando bio:', e);
                    cfgToast('❌ Error: ' + e.message, 'error');
                }
            };
        };

        // ============================================================
        // OTROS CALLBACKS
        // ============================================================
        window.onEditarEmail = async () => {
            const nuevoEmail = prompt('Escribe tu nuevo correo electrónico:');
            if (!nuevoEmail) return;

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(nuevoEmail)) {
                cfgToast('❌ Correo inválido', 'error');
                return;
            }

            try {
                const client = await obtenerCliente();
                if (!client) throw new Error('Supabase no disponible');

                cfgToast('⏳ Actualizando correo...', '', 4000);

                const { error } = await client.auth.updateUser({
                    email: nuevoEmail
                });

                if (error) throw error;

                cfgToast('✅ Revisa tu correo para confirmar el cambio', 'success', 5000);

                try {
                    await client.rpc('registrar_acceso', {
                        p_evento: 'cambio_email',
                        p_metadata: { email_nuevo: nuevoEmail }
                    });
                } catch (rpcErr) {
                    console.warn('No se pudo registrar el acceso:', rpcErr);
                }

            } catch (e) {
                console.error('Error cambiando correo:', e);
                cfgToast('❌ Error: ' + e.message, 'error');
            }
        };

        window.onVerPlan = () => {
            window.location.href = '/features/perfil/configuracion/sariels/membresia.html';
        };

        window.onDescargarDatos = async () => {
            const ok = await cfgConfirm({
                title: '¿Descargar tus datos?',
                text: 'Se descargará un archivo con la información de tu cuenta que ya está disponible en Sariel\'s.',
                confirmText: 'Descargar',
                cancelText: 'Cancelar',
                danger: false,
            });

            if (!ok) return;

            try {
                const client = await obtenerCliente();
                if (!client) throw new Error('Supabase no disponible');

                let historial = [];
                try {
                    const { data } = await client.rpc('obtener_mis_accesos', { p_limit: 100 });
                    historial = data || [];
                } catch (e) {
                    console.warn('Sin historial para exportar:', e);
                }

                const exportData = {
                    generado_en: new Date().toISOString(),
                    usuario: {
                        id: sesionActual?.user?.id || null,
                        email: usuarioActual?.email || sesionActual?.user?.email || null,
                        nombre: usuarioActual?.nombre || null,
                        handle: usuarioActual?.handle || null,
                        bio: usuarioActual?.bio || null,
                        avatar_url: usuarioActual?.avatar_url || null,
                        plan: usuarioActual?.plan || null,
                        created_at: usuarioActual?.created_at || null
                    },
                    historial_accesos: historial
                };

                const blob = new Blob(
                    [JSON.stringify(exportData, null, 2)],
                    { type: 'application/json' }
                );
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'sariels-mis-datos-' + Date.now() + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                cfgToast('✅ Archivo descargado', 'success');
            } catch (e) {
                console.error('Error descargando datos:', e);
                cfgToast('❌ Error al generar el archivo', 'error');
            }
        };

        window.onDesactivarCuenta = async () => {
            const ok = await cfgConfirm({
                title: '¿Desactivar tu cuenta?',
                text: 'Esta función estará disponible próximamente. Por ahora puedes contactar a soporte desde la sección de ayuda si necesitas desactivar tu cuenta.',
                confirmText: 'Entendido',
                cancelText: 'Cancelar',
                danger: false,
            });

            if (!ok) return;
        };

        // ============================================================
        // INICIALIZAR
        // ============================================================
        window.addEventListener('DOMContentLoaded', async () => {
            const client = await guardiaDeAutenticacion();
            if (!client) return;

            cfgInitPage({
                title: 'Tu cuenta',
                subtitle: 'Información de tu cuenta',
                backUrl: '/features/perfil/configuracion/index.html',
            });

            await cargarDatosUsuario(client);
            await cargarHistorial(client);
            renderSecciones();
        });

    })();
    </script>
</body>
</html>
