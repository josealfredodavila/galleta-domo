<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" /><title>Tu cuenta · Sariel's</title>

<link rel="stylesheet" href="../../shared/config-layout.css" />

</head><body class="cfg-page"><div id="cfgHeaderSlot"></div><main class="cfg-content"><div class="cfg-profile-card" id="perfilCard">
    <div class="cfg-profile-avatar" id="avatarCuenta">◈</div>
    <div class="cfg-profile-name" id="nombreCuenta">Cargando...</div>
    <div class="cfg-profile-handle" id="handleCuenta">@...</div>
    <div class="cfg-profile-bio" id="bioCuenta"></div>
</div>

<h2 class="cfg-section-title">Información de la cuenta</h2>
<div class="cfg-list" id="seccionInfo"></div>

<h2 class="cfg-section-title">Tu actividad en Sariel's</h2>
<div class="cfg-list" id="seccionActividad"></div>

<h2 class="cfg-section-title">Historial de accesos</h2>
<div class="cfg-list" id="seccionHistorial"></div>

<h2 class="cfg-section-title">Descarga de datos</h2>
<div class="cfg-list" id="seccionDescarga"></div>

<h2 class="cfg-section-title">Zona de peligro</h2>
<div class="cfg-list" id="seccionPeligro"></div>

<div class="cfg-footer">
    <strong>◈ Sariel's</strong> · Configuración · Tu cuenta
</div>

</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="../../shared/config-icons.js"></script><script src="../../shared/config-layout.js"></script><script>
(function () {
    'use strict';

    const $ = (sel) => document.querySelector(sel);

    let clienteSupabase = null;
    let usuarioActual = null;
    let historialAccesos = [];
    let sesionActual = null;

    async function obtenerCliente() {
        if (clienteSupabase) return clienteSupabase;

        if (window.supabaseClient) {
            clienteSupabase = window.supabaseClient;
            return clienteSupabase;
        }

        if (
            !window.supabase ||
            typeof window.supabase.createClient !== 'function'
        ) {
            throw new Error(
                'La librería de Supabase no está disponible.'
            );
        }

        const respuesta = await fetch('/api/config/public', {
            method: 'GET',
            credentials: 'same-origin',
            cache: 'no-store',
            headers: {
                'Accept': 'application/json'
            }
        });

        if (!respuesta.ok) {
            throw new Error(
                'No se pudo cargar la configuración pública de Supabase (' +
                respuesta.status +
                ').'
            );
        }

        const config = await respuesta.json();

        const supabaseUrl = config && config.supabaseUrl;
        const supabaseAnonKey = config && config.supabaseAnonKey;

        if (
            typeof supabaseUrl !== 'string' ||
            !supabaseUrl.trim() ||
            typeof supabaseAnonKey !== 'string' ||
            !supabaseAnonKey.trim()
        ) {
            throw new Error(
                'La configuración pública de Supabase está incompleta.'
            );
        }

        window.supabaseClient = window.supabase.createClient(
            supabaseUrl.trim(),
            supabaseAnonKey.trim(),
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );

        clienteSupabase = window.supabaseClient;

        return clienteSupabase;
    }

    function esRutaInternaSegura(valor) {
        if (typeof valor !== 'string') return false;
        if (!valor.startsWith('/')) return false;
        if (valor.startsWith('//')) return false;
        if (valor.startsWith('/\\')) return false;
        return true;
    }

    function irAlIndexConReturnTo() {
        try {
            const returnTo =
                window.location.pathname +
                window.location.search +
                window.location.hash;

            if (esRutaInternaSegura(returnTo)) {
                localStorage.setItem(
                    'wallet_returnTo',
                    returnTo
                );
            }

            window.location.replace('/');
        } catch (e) {
            window.location.replace('/');
        }
    }

    async function guardiaDeAutenticacion() {
        const salvaguarda = setTimeout(function () {
            console.warn(
                '[Cuenta] Salvaguarda activada sin confirmación → redirigiendo al index'
            );

            irAlIndexConReturnTo();
        }, 10000);

        try {
            const client = await obtenerCliente();

            if (!client) {
                throw new Error(
                    'Cliente Supabase no disponible.'
                );
            }

            const resultado =
                await client.auth.getSession();

            const session =
                resultado && resultado.data
                    ? resultado.data.session
                    : null;

            clearTimeout(salvaguarda);

            if (!session) {
                irAlIndexConReturnTo();
                return null;
            }

            sesionActual = session;

            document.documentElement.classList.add(
                'auth-ready'
            );

            return client;

        } catch (error) {
            console.error(
                '[Cuenta] Error crítico de autenticación:',
                error
            );

            clearTimeout(salvaguarda);

            irAlIndexConReturnTo();

            return null;
        }
    }

    async function cargarDatosUsuario(client) {
        try {
            if (!client || !sesionActual) return;

            const {
                data: usuario,
                error
            } = await client
                .from('usuarios')
                .select(
                    'nombre, handle, avatar_url, bio, email, created_at, plan'
                )
                .eq(
                    'id',
                    sesionActual.user.id
                )
                .maybeSingle();

            if (error) {
                console.warn(
                    'Error cargando usuario:',
                    error.message
                );
            }

            usuarioActual = usuario || null;

            renderPerfilCard(usuarioActual);

        } catch (e) {
            console.error(
                'Error cargando usuario:',
                e
            );
        }
    }

    function renderPerfilCard(usuario) {
        if (!usuario) return;

        const avatarEl =
            $('#avatarCuenta');

        if (usuario.avatar_url) {
            avatarEl.innerHTML =
                `<img src="${escapeHtml(usuario.avatar_url)}" alt="Avatar">`;
        } else {
            avatarEl.textContent = '◈';
        }

        $('#nombreCuenta').textContent =
            usuario.nombre ||
            'Explorador';

        $('#handleCuenta').textContent =
            '@' +
            (
                usuario.handle ||
                'explorador'
            );

        $('#bioCuenta').textContent =
            usuario.bio ||
            'Explorando el ecosistema Sariel\'s · WEB3 · Comunidad';
    }

    async function cargarHistorial(client) {
        try {
            if (!client) return;

            const {
                data,
                error
            } = await client.rpc(
                'obtener_mis_accesos',
                {
                    p_limit: 20
                }
            );

            if (error) {
                console.warn(
                    'Error RPC obtener_mis_accesos:',
                    error.message
                );

                historialAccesos = [];

                return;
            }

            historialAccesos = data || [];

        } catch (e) {
            console.warn(
                'Error historial:',
                e.message
            );

            historialAccesos = [];
        }
    }

    function renderSecciones() {
        const email =
            usuarioActual?.email ||
            'No disponible';

        const creado =
            usuarioActual?.created_at
                ? new Date(
                    usuarioActual.created_at
                ).toLocaleDateString(
                    'es-MX',
                    {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    }
                )
                : 'Desconocido';

        const plan =
            usuarioActual?.plan ||
            'Gratis';

        $('#seccionInfo').innerHTML = [
            cfgRenderItem({
                icon: 'user',
                title: 'Nombre de usuario',
                desc:
                    usuarioActual?.nombre ||
                    'Explorador',
                onclick:
                    'window.onEditarNombre()'
            }),

            cfgRenderItem({
                icon: 'fileText',
                title: 'Handle',
                desc:
                    '@' +
                    (
                        usuarioActual?.handle ||
                        'explorador'
                    ),
                onclick:
                    'window.onEditarHandle()'
            }),

            cfgRenderItem({
                icon: 'info',
                title: 'Biografía',
                desc:
                    usuarioActual?.bio ||
                    'Sin biografía',
                onclick:
                    'window.onEditarBio()'
            }),

            cfgRenderItem({
                icon: 'info',
                title: 'Correo electrónico',
                desc: email,
                onclick:
                    'window.onEditarEmail()'
            }),

            cfgRenderItem({
                icon: 'crown',
                title: 'Plan actual',
                desc: plan,
                onclick:
                    'window.onVerPlan()'
            }),

            cfgRenderItem({
                icon: 'info',
                title: 'Cuenta creada el',
                desc: creado,
                chevron: false
            })
        ].join('');

        $('#seccionActividad').innerHTML = [
            cfgRenderItem({
                icon: 'fileText',
                title: 'Tus publicaciones',
                desc:
                    'Consulta y administra todas tus publicaciones',
                href:
                    '/features/perfil/perfil.html'
            }),

            cfgRenderItem({
                icon: 'users',
                title: 'Tus contactos',
                desc:
                    'Administra tus contactos y solicitudes',
                href:
                    '/features/mensajes/contactos.html'
            }),

            cfgRenderItem({
                icon: 'coin',
                title: 'Tu historial de transacciones',
                desc:
                    'Consulta tu historial de compras y transacciones',
                href:
                    '/features/perfil/perfil.html'
            })
        ].join('');

        const historialContainer =
            $('#seccionHistorial');

        if (historialAccesos.length === 0) {
            historialContainer.innerHTML = `
                <div class="cfg-empty">
                    <span class="cfg-empty-icon">📜</span>
                    <div class="cfg-empty-text">
                        Sin historial de accesos aún
                    </div>
                </div>
            `;
        } else {
            historialContainer.innerHTML =
                historialAccesos.map(h => {

                    const iconos = {
                        login: '🔓',
                        logout: '🔒',
                        login_fallido: '⚠️',
                        cambio_password: '🔑',
                        cambio_email: '📧',
                        activacion_2fa: '🛡️',
                        desactivacion_2fa: '🔓'
                    };

                    const nombres = {
                        login:
                            'Inicio de sesión',

                        logout:
                            'Cierre de sesión',

                        login_fallido:
                            'Intento fallido',

                        cambio_password:
                            'Cambio de contraseña',

                        cambio_email:
                            'Cambio de correo',

                        activacion_2fa:
                            '2FA activado',

                        desactivacion_2fa:
                            '2FA desactivado'
                    };

                    const icono =
                        iconos[h.evento] ||
                        '📜';

                    const nombre =
                        nombres[h.evento] ||
                        h.evento ||
                        'Evento';

                    const fecha =
                        h.created_at
                            ? new Date(
                                h.created_at
                            ).toLocaleString(
                                'es-MX',
                                {
                                    day: '2-digit',
                                    month: 'short',
                                    hour: '2-digit',
                                    minute: '2-digit'
                                }
                            )
                            : '';

                    const exitoso =
                        h.exitoso !== false;

                    return `
                        <div class="cfg-session-item">
                            <span class="cfg-session-icon">
                                ${icono}
                            </span>

                            <div class="cfg-session-info">
                                <div class="cfg-session-title">
                                    ${escapeHtml(nombre)}
                                </div>

                                <div class="cfg-session-subtitle">
                                    ${escapeHtml(
                                        h.dispositivo ||
                                        'Dispositivo'
                                    )}
                                </div>

                                <div class="cfg-session-meta">
                                    ${escapeHtml(fecha)}
                                    ${
                                        !exitoso
                                            ? ' · <span style="color:var(--cfg-danger);">FALLIDO</span>'
                                            : ''
                                    }
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
        }

        $('#seccionDescarga').innerHTML = [
            cfgRenderItem({
                icon: 'database',
                title:
                    'Descargar archivo con tus datos',
                desc:
                    'Obtén un archivo con tu información de Sariel\'s',
                onclick:
                    'window.onDescargarDatos()'
            })
        ].join('');

        $('#seccionPeligro').innerHTML = [
            cfgRenderItem({
                icon: 'lock',
                title:
                    'Desactivar temporalmente mi cuenta',
                desc:
                    'Oculta tu perfil y contenido temporalmente',
                onclick:
                    'window.onDesactivarCuenta()',
                class:
                    'cfg-item-plain',
                style:
                    'color: var(--cfg-warning, #f7d44a);'
            }),

            cfgRenderItem({
                icon: 'logout',
                title:
                    'Eliminar mi cuenta',
                desc:
                    'Elimina permanentemente tu cuenta y todos tus datos',
                href:
                    '/eliminar-cuenta.html',
                class:
                    'cfg-item-plain',
                style:
                    'color: var(--cfg-danger, #ff3366);'
            })
        ].join('');
    }

    function escapeHtml(texto) {
        if (
            texto === null ||
            texto === undefined
        ) {
            return '';
        }

        const div =
            document.createElement('div');

        div.textContent =
            String(texto);

        return div.innerHTML;
    }

    window.onEditarNombre = () => {
        const valorActual =
            usuarioActual?.nombre ||
            '';

        const overlay =
            document.createElement('div');

        overlay.className =
            'cfg-modal-overlay';

        overlay.innerHTML = `
            <div class="cfg-modal" style="max-width:420px;">
                <h3 class="cfg-modal-title">
                    ✏️ Editar nombre
                </h3>

                <p
                    class="cfg-modal-text"
                    style="text-align:left;margin-bottom:16px;"
                >
                    Este es el nombre que otros usuarios
                    verán en Sariel's.
                </p>

                <div
                    class="form-group"
                    style="margin-bottom:14px;"
                >
                    <label class="cfg-edit-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="inputEditarNombre"
                        class="cfg-edit-input"
                        value="${escapeHtml(valorActual)}"
                        maxlength="50"
                        placeholder="Tu nombre"
                    />

                    <div
                        class="cfg-edit-counter"
                        id="counterNombre"
                    >
                        ${valorActual.length} / 50
                    </div>

                    <div class="cfg-edit-hint">
                        ℹ️ Mínimo 2 caracteres. Máximo 50.
                    </div>
                </div>

                <div class="cfg-modal-actions">
                    <button
                        class="cfg-btn cfg-btn-outline"
                        data-action="cancel"
                        type="button"
                    >
                        Cancelar
                    </button>

                    <button
                        class="cfg-btn cfg-btn-primary"
                        data-action="save"
                        type="button"
                    >
                        Guardar
                    </button>
                </div>
            </div>
        `;

        document.body.appendChild(overlay);

        requestAnimationFrame(() =>
            overlay.classList.add('show')
        );

        const input =
            overlay.querySelector(
                '#inputEditarNombre'
            );

        const counter =
            overlay.querySelector(
                '#counterNombre'
            );

        setTimeout(() => {
            input.focus();
            input.select();
        }, 300);

        input.addEventListener(
            'input',
            () => {
                counter.textContent =
                    input.value.length +
                    ' / 50';
            }
        );

        const close = () => {
            overlay.classList.remove(
                'show'
            );

            setTimeout(
                () => overlay.remove(),
                200
            );
        };

        overlay.querySelector(
            '[data-action="cancel"]'
        ).onclick = close;

        overlay.onclick = (e) => {
            if (e.target === overlay) {
                close();
            }
        };

        overlay.querySelector(
            '[data-action="save"]'
        ).onclick = async () => {

            const nuevoNombre =
                input.value.trim();

            if (nuevoNombre.length < 2) {
                cfgToast(
                    '⚠️ El nombre debe tener al menos 2 caracteres',
                    'warning'
                );
                return;
            }

            try {
                const client =
                    await obtenerCliente();

                if (!client) {
                    throw new Error(
                        'Supabase no disponible'
                    );
                }

                const { error } =
                    await client.rpc(
                        'actualizar_perfil',
                        {
                            p_nombre:
                                nuevoNombre,

                            p_handle:
                                usuarioActual?.handle ||
                                null,

                            p_bio:
                                usuarioActual?.bio ||
                                null
                        }
                    );

                if (error) {
                    throw error;
                }

                cfgToast(
                    '✅ Nombre actualizado',
                    'success'
                );

                close();

                usuarioActual.nombre =
                    nuevoNombre;

                $('#nombreCuenta')
                    .textContent =
                    nuevoNombre;

                renderSecciones();

            } catch (e) {
                console.error(
                    'Error guardando nombre:',
                    e
                );

                cfgToast(
                    '❌ Error: ' +
                    e.message,
                    'error'
                );
            }
        };
    };

    window.onEditarHandle = () => {
        const valorActual =
            usuarioActual?.handle ||
            '';

        const overlay =
            document.createElement('div');

        overlay.className =
            'cfg-modal-overlay';

        overlay.innerHTML = `
            <div class="cfg-modal" style="max-width:420px;">
                <h3 class="cfg-modal-title">
                    ✏️ Editar handle
                </h3>

                <p
                    class="cfg-modal-text"
                    style="text-align:left;margin-bottom:16px;"
                >
                    Tu @handle es único. Solo puede contener
                    letras, números y guion bajo.
                </p>

                <div
                    class="form-group"
                    style="margin-bottom:14px;"
                >
                    <label class="cfg-edit-label">
                        Handle (@)
                    </label>

                    <input
                        type="text"
                        id="inputEditarHandle"
                        class="cfg-edit-input"
                        value="${escapeHtml(valorActual)}"
                        maxlength="30"
                        placeholder="usuario"
                    />

                    <div
                        class="cfg-edit-counter"
                        id="counterHandle"
                    >
                        ${valorActual.length} / 30
                    </div>

                    <div class="cfg-edit-hint">
                        ℹ️ Sin @. Solo letras (a-z),
                        números (0-9) y guion bajo (_).
                    </div>

                    <div
                        class="cfg-edit-error"
                        id="errorHandle"
                    ></div>
                </div>

                <div class="cfg-modal-actions">
                    <button
                        class="cfg-btn cfg-btn-outline"
                        data-action="cancel"
                        type="button"
                    >
                        Cancelar
                    </button>

                    <button
                        class="cfg-btn cfg-btn-primary"
                        data-action="save"
                        type="button"
                    >
                        Guardar
                    </button>
                </div>
            </div>
        `;

        document.body.appendChild(overlay);

        requestAnimationFrame(() =>
            overlay.classList.add('show')
        );

        const input =
            overlay.querySelector(
                '#inputEditarHandle'
            );

        const counter =
            overlay.querySelector(
                '#counterHandle'
            );

        const errorEl =
            overlay.querySelector(
                '#errorHandle'
            );

        setTimeout(() => {
            input.focus();
            input.select();
        }, 300);

        input.addEventListener(
            'input',
            () => {
                const val =
                    input.value
                        .replace(
                            /[^a-zA-Z0-9_]/g,
                            ''
                        )
                        .toLowerCase();

                input.value = val;

                counter.textContent =
                    val.length +
                    ' / 30';

                errorEl.classList.remove(
                    'show'
                );
            }
        );

        const close = () => {
            overlay.classList.remove(
                'show'
            );

            setTimeout(
                () => overlay.remove(),
                200
            );
        };

        overlay.querySelector(
            '[data-action="cancel"]'
        ).onclick = close;

        overlay.onclick = (e) => {
            if (e.target === overlay) {
                close();
            }
        };

        overlay.querySelector(
            '[data-action="save"]'
        ).onclick = async () => {

            const nuevoHandle =
                input.value
                    .trim()
                    .toLowerCase();

            if (nuevoHandle.length < 3) {
                errorEl.textContent =
                    '⚠️ El handle debe tener al menos 3 caracteres';

                errorEl.classList.add(
                    'show'
                );

                return;
            }

            if (
                !/^[a-z0-9_]+$/.test(
                    nuevoHandle
                )
            ) {
                errorEl.textContent =
                    '⚠️ Solo letras, números y guion bajo';

                errorEl.classList.add(
                    'show'
                );

                return;
            }

            try {
                const client =
                    await obtenerCliente();

                if (!client) {
                    throw new Error(
                        'Supabase no disponible'
                    );
                }

                const { error } =
                    await client.rpc(
                        'actualizar_perfil',
                        {
                            p_nombre:
                                usuarioActual?.nombre ||
                                null,

                            p_handle:
                                nuevoHandle,

                            p_bio:
                                usuarioActual?.bio ||
                                null
                        }
                    );

                if (error) {
                    throw error;
                }

                cfgToast(
                    '✅ Handle actualizado',
                    'success'
                );

                close();

                usuarioActual.handle =
                    nuevoHandle;

                $('#handleCuenta')
                    .textContent =
                    '@' + nuevoHandle;

                renderSecciones();

            } catch (e) {
                console.error(
                    'Error guardando handle:',
                    e
                );

                errorEl.textContent =
                    '❌ Error: ' +
                    e.message;

                errorEl.classList.add(
                    'show'
                );
            }
        };
    };

    window.onEditarBio = () => {
        const valorActual =
            usuarioActual?.bio ||
            '';

        const overlay =
            document.createElement('div');

        overlay.className =
            'cfg-modal-overlay';

        overlay.innerHTML = `
            <div class="cfg-modal" style="max-width:440px;">
                <h3 class="cfg-modal-title">
                    ✏️ Editar biografía
                </h3>

                <p
                    class="cfg-modal-text"
                    style="text-align:left;margin-bottom:16px;"
                >
                    Cuéntale a los demás un poco sobre ti.
                </p>

                <div
                    class="form-group"
                    style="margin-bottom:14px;"
                >
                    <label class="cfg-edit-label">
                        Biografía
                    </label>

                    <textarea
                        id="inputEditarBio"
                        class="cfg-edit-textarea"
                        maxlength="160"
                        placeholder="Explorando el ecosistema Sariel's · WEB3 · Comunidad"
                    >${escapeHtml(valorActual)}</textarea>                <div
                    class="cfg-edit-counter"
                    id="counterBio"
                >
                    ${valorActual.length} / 160
                </div>
            </div>

            <div class="cfg-modal-actions">
                <button
                    class="cfg-btn cfg-btn-outline"
                    data-action="cancel"
                    type="button"
                >
                    Cancelar
                </button>

                <button
                    class="cfg-btn cfg-btn-primary"
                    data-action="save"
                    type="button"
                >
                    Guardar
                </button>
            </div>
        </div>
    `;

    document.body.appendChild(overlay);

    requestAnimationFrame(() =>
        overlay.classList.add('show')
    );

    const input =
        overlay.querySelector(
            '#inputEditarBio'
        );

    const counter =
        overlay.querySelector(
            '#counterBio'
        );

    setTimeout(
        () => input.focus(),
        300
    );

    input.addEventListener(
        'input',
        () => {
            counter.textContent =
                input.value.length +
                ' / 160';
        }
    );

    const close = () => {
        overlay.classList.remove(
            'show'
        );

        setTimeout(
            () => overlay.remove(),
            200
        );
    };

    overlay.querySelector(
        '[data-action="cancel"]'
    ).onclick = close;

    overlay.onclick = (e) => {
        if (e.target === overlay) {
            close();
        }
    };

    overlay.querySelector(
        '[data-action="save"]'
    ).onclick = async () => {

        const nuevaBio =
            input.value.trim();

        try {
            const client =
                await obtenerCliente();

            if (!client) {
                throw new Error(
                    'Supabase no disponible'
                );
            }

            const { error } =
                await client.rpc(
                    'actualizar_perfil',
                    {
                        p_nombre:
                            usuarioActual?.nombre ||
                            null,

                        p_handle:
                            usuarioActual?.handle ||
                            null,

                        p_bio:
                            nuevaBio ||
                            null
                    }
                );

            if (error) {
                throw error;
            }

            cfgToast(
                '✅ Biografía actualizada',
                'success'
            );

            close();

            usuarioActual.bio =
                nuevaBio;

            $('#bioCuenta')
                .textContent =
                nuevaBio ||
                'Explorando el ecosistema Sariel\'s · WEB3 · Comunidad';

            renderSecciones();

        } catch (e) {
            console.error(
                'Error guardando bio:',
                e
            );

            cfgToast(
                '❌ Error: ' +
                e.message,
                'error'
            );
        }
    };
};

window.onEditarEmail = async () => {
    const nuevoEmail =
        prompt(
            'Escribe tu nuevo correo electrónico:'
        );

    if (!nuevoEmail) return;

    if (
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            nuevoEmail
        )
    ) {
        cfgToast(
            '❌ Correo inválido',
            'error'
        );

        return;
    }

    try {
        const client =
            await obtenerCliente();

        if (!client) {
            throw new Error(
                'Supabase no disponible'
            );
        }

        cfgToast(
            '⏳ Actualizando correo...',
            '',
            4000
        );

        const { error } =
            await client.auth.updateUser({
                email: nuevoEmail
            });

        if (error) {
            throw error;
        }

        cfgToast(
            '✅ Revisa tu correo para confirmar el cambio',
            'success',
            5000
        );

        try {
            await client.rpc(
                'registrar_acceso',
                {
                    p_evento:
                        'cambio_email',

                    p_metadata: {
                        email_nuevo:
                            nuevoEmail
                    }
                }
            );
        } catch (rpcErr) {
            console.warn(
                'No se pudo registrar el acceso:',
                rpcErr
            );
        }

    } catch (e) {
        console.error(
            'Error cambiando correo:',
            e
        );

        cfgToast(
            '❌ Error: ' +
            e.message,
            'error'
        );
    }
};

window.onDescargarDatos = async () => {
    const ok =
        await cfgConfirm({
            title:
                '¿Descargar tus datos?',

            text:
                'Se descargará un archivo con la información de tu cuenta que ya está disponible en Sariel\'s.',

            confirmText:
                'Descargar',

            cancelText:
                'Cancelar',

            danger:
                false
        });

    if (!ok) return;

    try {
        const client =
            await obtenerCliente();

        if (!client) {
            throw new Error(
                'Supabase no disponible'
            );
        }

        let historial = [];

        try {
            const {
                data
            } = await client.rpc(
                'obtener_mis_accesos',
                {
                    p_limit: 100
                }
            );

            historial =
                data || [];

        } catch (e) {
            console.warn(
                'Sin historial para exportar:',
                e
            );
        }

        const exportData = {
            generado_en:
                new Date().toISOString(),

            usuario: {
                id:
                    sesionActual?.user?.id ||
                    null,

                email:
                    usuarioActual?.email ||
                    sesionActual?.user?.email ||
                    null,

                nombre:
                    usuarioActual?.nombre ||
                    null,

                handle:
                    usuarioActual?.handle ||
                    null,

                bio:
                    usuarioActual?.bio ||
                    null,

                avatar_url:
                    usuarioActual?.avatar_url ||
                    null,

                plan:
                    usuarioActual?.plan ||
                    null,

                created_at:
                    usuarioActual?.created_at ||
                    null
            },

            historial_accesos:
                historial
        };

        const blob =
            new Blob(
                [
                    JSON.stringify(
                        exportData,
                        null,
                        2
                    )
                ],
                {
                    type:
                        'application/json'
                }
            );

        const url =
            URL.createObjectURL(
                blob
            );

        const a =
            document.createElement(
                'a'
            );

        a.href = url;

        a.download =
            'sariels-mis-datos-' +
            Date.now() +
            '.json';

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);

        cfgToast(
            '✅ Archivo descargado',
            'success'
        );

    } catch (e) {
        console.error(
            'Error descargando datos:',
            e
        );

        cfgToast(
            '❌ Error al generar el archivo',
            'error'
        );
    }
};
