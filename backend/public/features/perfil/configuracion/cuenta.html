</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="../../shared/config-icons.js"></script><script src="../../shared/config-layout.js"></script><script>
(function () {

    'use strict';

    const $ = function (selector) {
        return document.querySelector(selector);
    };

    let clienteSupabase = null;
    let usuarioActual = null;
    let historialAccesos = [];
    let sesionActual = null;


    /* ============================================================
       ESCAPE HTML
       ============================================================ */

    function escapeHtml(valor) {

        if (
            valor === null ||
            valor === undefined
        ) {
            return '';
        }

        const div =
            document.createElement('div');

        div.textContent =
            String(valor);

        return div.innerHTML;
    }


    /* ============================================================
       SUPABASE
       Usa primero el cliente compartido.
       ============================================================ */

    async function obtenerCliente() {

        if (clienteSupabase) {
            return clienteSupabase;
        }

        if (
            window.supabaseClient &&
            window.supabaseClient.auth
        ) {
            clienteSupabase =
                window.supabaseClient;

            return clienteSupabase;
        }

        if (
            typeof window.cfgEsperarSupabase ===
            'function'
        ) {
            clienteSupabase =
                await window.cfgEsperarSupabase();

            return clienteSupabase;
        }

        throw new Error(
            'No fue posible inicializar Supabase.'
        );
    }


    /* ============================================================
       AUTENTICACIÓN
       ============================================================ */

    async function guardiaDeAutenticacion() {

        try {

            const client =
                await obtenerCliente();

            if (!client) {
                throw new Error(
                    'Cliente Supabase no disponible.'
                );
            }

            const resultado =
                await client.auth.getSession();

            const session =
                resultado &&
                resultado.data
                    ? resultado.data.session
                    : null;

            if (!session) {

                const returnTo =
                    window.location.pathname +
                    window.location.search +
                    window.location.hash;

                try {
                    localStorage.setItem(
                        'wallet_returnTo',
                        returnTo
                    );
                } catch (_) {}

                window.location.replace('/');

                return null;
            }

            sesionActual =
                session;

            document.documentElement.classList.add(
                'auth-ready'
            );

            return client;

        } catch (error) {

            console.error(
                '[Cuenta] Error de autenticación:',
                error
            );

            const returnTo =
                window.location.pathname +
                window.location.search +
                window.location.hash;

            try {
                localStorage.setItem(
                    'wallet_returnTo',
                    returnTo
                );
            } catch (_) {}

            window.location.replace('/');

            return null;
        }
    }


    /* ============================================================
       DATOS DEL USUARIO
       
       Estructura REAL confirmada en Supabase:
       public.usuarios

       id
       email
       nombre
       handle
       bio
       avatar_url
       created_at
       plan
       ============================================================ */

    async function cargarDatosUsuario(client) {

        if (
            !client ||
            !sesionActual ||
            !sesionActual.user
        ) {
            return;
        }

        const userId =
            sesionActual.user.id;

        try {

            const resultado =
                await client
                    .from('usuarios')
                    .select(
                        [
                            'id',
                            'email',
                            'nombre',
                            'handle',
                            'bio',
                            'avatar_url',
                            'created_at',
                            'plan'
                        ].join(', ')
                    )
                    .eq(
                        'id',
                        userId
                    )
                    .maybeSingle();

            if (resultado.error) {

                console.error(
                    '[Cuenta] Error leyendo usuarios:',
                    resultado.error
                );

                throw resultado.error;
            }

            const usuario =
                resultado.data;

            /*
             * Si existe la fila de usuarios usamos
             * exclusivamente sus datos reales.
             */

            if (usuario) {

                usuarioActual =
                    usuario;

            } else {

                /*
                 * Respaldo: si todavía no existe la fila
                 * en usuarios, no dejamos la interfaz
                 * congelada en "Cargando...".
                 */

                let perfilRpc = null;

                try {

                    const rpc =
                        await client.rpc(
                            'obtener_mi_perfil'
                        );

                    if (
                        !rpc.error &&
                        Array.isArray(rpc.data) &&
                        rpc.data.length > 0
                    ) {
                        perfilRpc =
                            rpc.data[0];
                    }

                } catch (rpcError) {

                    console.warn(
                        '[Cuenta] obtener_mi_perfil no devolvió perfil:',
                        rpcError
                    );
                }

                usuarioActual = {

                    id:
                        userId,

                    email:
                        sesionActual.user.email ||
                        null,

                    nombre:
                        perfilRpc?.nombre ||
                        sesionActual.user.user_metadata?.nombre ||
                        'Explorador',

                    handle:
                        perfilRpc?.handle ||
                        sesionActual.user.user_metadata?.handle ||
                        'explorador',

                    bio:
                        perfilRpc?.bio ||
                        sesionActual.user.user_metadata?.bio ||
                        null,

                    avatar_url:
                        perfilRpc?.avatar_url ||
                        sesionActual.user.user_metadata?.avatar_url ||
                        null,

                    created_at:
                        null,

                    plan:
                        'Gratis'
                };
            }

            renderPerfilCard(
                usuarioActual
            );

        } catch (error) {

            console.error(
                '[Cuenta] No se pudieron cargar los datos:',
                error
            );

            /*
             * Último respaldo usando Supabase Auth.
             * Esto evita que la página quede eternamente
             * mostrando "Cargando...".
             */

            usuarioActual = {

                id:
                    userId,

                email:
                    sesionActual.user.email ||
                    null,

                nombre:
                    sesionActual.user.user_metadata?.nombre ||
                    'Explorador',

                handle:
                    sesionActual.user.user_metadata?.handle ||
                    'explorador',

                bio:
                    sesionActual.user.user_metadata?.bio ||
                    null,

                avatar_url:
                    sesionActual.user.user_metadata?.avatar_url ||
                    null,

                created_at:
                    null,

                plan:
                    'Gratis'
            };

            renderPerfilCard(
                usuarioActual
            );
        }
    }


    /* ============================================================
       TARJETA DEL PERFIL
       ============================================================ */

    function renderPerfilCard(usuario) {

        if (!usuario) {
            return;
        }

        const avatarEl =
            $('#avatarCuenta');

        if (avatarEl) {

            avatarEl.innerHTML = '';

            if (usuario.avatar_url) {

                const img =
                    document.createElement('img');

                img.src =
                    usuario.avatar_url;

                img.alt =
                    'Avatar';

                img.loading =
                    'lazy';

                img.onerror =
                    function () {
                        avatarEl.textContent =
                            '◈';
                    };

                avatarEl.appendChild(
                    img
                );

            } else {

                avatarEl.textContent =
                    '◈';
            }
        }


        const nombreEl =
            $('#nombreCuenta');

        if (nombreEl) {

            nombreEl.textContent =
                usuario.nombre ||
                'Explorador';
        }


        const handleEl =
            $('#handleCuenta');

        if (handleEl) {

            const handle =
                usuario.handle ||
                'explorador';

            handleEl.textContent =
                handle.startsWith('@')
                    ? handle
                    : '@' + handle;
        }


        const bioEl =
            $('#bioCuenta');

        if (bioEl) {

            bioEl.textContent =
                usuario.bio ||
                'Explorando el ecosistema Sariel\'s · WEB3 · Comunidad';
        }
    }


    /* ============================================================
       HISTORIAL DE ACCESOS
       
       RPC REAL CONFIRMADA:
       obtener_mis_accesos(p_limit integer)

       Retorna:
       id
       evento
       ip_address
       user_agent
       dispositivo
       ubicacion_aproximada
       exitoso
       metadata
       created_at
       ============================================================ */

    async function cargarHistorial(client) {

        historialAccesos = [];

        if (!client) {
            return;
        }

        try {

            const resultado =
                await client.rpc(
                    'obtener_mis_accesos',
                    {
                        p_limit: 20
                    }
                );

            if (resultado.error) {

                console.warn(
                    '[Cuenta] obtener_mis_accesos:',
                    resultado.error.message
                );

                return;
            }

            historialAccesos =
                Array.isArray(resultado.data)
                    ? resultado.data
                    : [];

        } catch (error) {

            console.warn(
                '[Cuenta] Error cargando historial:',
                error
            );

            historialAccesos = [];
        }
    }


    /* ============================================================
       SECCIONES
       ============================================================ */

    function renderSecciones() {

        const email =
            usuarioActual?.email ||
            sesionActual?.user?.email ||
            'No disponible';


        const creado =
            usuarioActual?.created_at
                ? new Date(
                    usuarioActual.created_at
                ).toLocaleDateString(
                    'es-MX',
                    {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    }
                )
                : 'No disponible';


        const plan =
            usuarioActual?.plan ||
            'Gratis';


        /* ========================================================
           INFORMACIÓN
           ======================================================== */

        $('#seccionInfo').innerHTML = [

            cfgRenderItem({
                icon: 'user',
                title: 'Nombre de usuario',
                desc:
                    usuarioActual?.nombre ||
                    'Explorador',
                onclick:
                    'window.onEditarNombre()'
            }),

            cfgRenderItem({
                icon: 'fileText',
                title: 'Handle',
                desc:
                    '@' +
                    (
                        usuarioActual?.handle ||
                        'explorador'
                    ),
                onclick:
                    'window.onEditarHandle()'
            }),

            cfgRenderItem({
                icon: 'info',
                title: 'Biografía',
                desc:
                    usuarioActual?.bio ||
                    'Sin biografía',
                onclick:
                    'window.onEditarBio()'
            }),

            cfgRenderItem({
                icon: 'info',
                title: 'Correo electrónico',
                desc:
                    email,
                onclick:
                    'window.onEditarEmail()'
            }),

            cfgRenderItem({
                icon: 'crown',
                title: 'Plan actual',
                desc:
                    plan,
                onclick:
                    'window.onVerPlan()'
            }),

            cfgRenderItem({
                icon: 'info',
                title: 'Cuenta creada el',
                desc:
                    creado,
                chevron: false
            })

        ].join('');


        /* ========================================================
           ACTIVIDAD
           ======================================================== */

        $('#seccionActividad').innerHTML = [

            cfgRenderItem({
                icon: 'fileText',
                title: 'Tus publicaciones',
                desc:
                    'Consulta y administra todas tus publicaciones',
                href:
                    '/features/perfil/perfil.html'
            }),

            cfgRenderItem({
                icon: 'users',
                title: 'Tus contactos',
                desc:
                    'Administra tus contactos y solicitudes',
                href:
                    '/features/mensajes/contactos.html'
            }),

            cfgRenderItem({
                icon: 'coin',
                title: 'Tu historial de transacciones',
                desc:
                    'Consulta tu historial de compras y transacciones',
                href:
                    '/features/perfil/perfil.html'
            })

        ].join('');


        /* ========================================================
           HISTORIAL
           ======================================================== */

        const historialContainer =
            $('#seccionHistorial');


        if (
            !historialAccesos ||
            historialAccesos.length === 0
        ) {

            historialContainer.innerHTML = `
                <div class="cfg-empty">
                    <span class="cfg-empty-icon">◈</span>

                    <div class="cfg-empty-text">
                        Sin historial de accesos aún
                    </div>
                </div>
            `;

        } else {

            const iconos = {

                login: '🔓',

                logout: '🔒',

                login_fallido: '⚠️',

                cambio_password: '🔑',

                cambio_email: '📧',

                activacion_2fa: '🛡️',

                desactivacion_2fa: '🔓'
            };


            const nombres = {

                login:
                    'Inicio de sesión',

                logout:
                    'Cierre de sesión',

                login_fallido:
                    'Intento fallido',

                cambio_password:
                    'Cambio de contraseña',

                cambio_email:
                    'Cambio de correo',

                activacion_2fa:
                    '2FA activado',

                desactivacion_2fa:
                    '2FA desactivado'
            };


            historialContainer.innerHTML =
                historialAccesos
                    .map(function (h) {

                        const icono =
                            iconos[h.evento] ||
                            '◈';


                        const nombre =
                            nombres[h.evento] ||
                            h.evento ||
                            'Evento';


                        const fecha =
                            h.created_at
                                ? new Date(
                                    h.created_at
                                ).toLocaleString(
                                    'es-MX',
                                    {
                                        day: '2-digit',
                                        month: 'short',
                                        hour: '2-digit',
                                        minute: '2-digit'
                                    }
                                )
                                : '';


                        const dispositivo =
                            h.dispositivo ||
                            'Dispositivo';


                        const estado =
                            h.exitoso === false
                                ? `
                                    <span style="color:var(--cfg-danger);">
                                        · FALLIDO
                                    </span>
                                `
                                : '';


                        return `
                            <div class="cfg-session-item">

                                <span class="cfg-session-icon">
                                    ${icono}
                                </span>

                                <div class="cfg-session-info">

                                    <div class="cfg-session-title">
                                        ${escapeHtml(nombre)}
                                    </div>

                                    <div class="cfg-session-subtitle">
                                        ${escapeHtml(dispositivo)}
                                    </div>

                                    <div class="cfg-session-meta">
                                        ${escapeHtml(fecha)}
                                        ${estado}
                                    </div>

                                </div>

                            </div>
                        `;

                    })
                    .join('');
        }


        /* ========================================================
           DESCARGA
           ======================================================== */

        $('#seccionDescarga').innerHTML = [

            cfgRenderItem({
                icon: 'database',
                title:
                    'Descargar archivo con tus datos',
                desc:
                    'Obtén un archivo con tu información de Sariel\'s',
                onclick:
                    'window.onDescargarDatos()'
            })

        ].join('');


        /* ========================================================
           ZONA DE PELIGRO
           ======================================================== */

        $('#seccionPeligro').innerHTML = [

            cfgRenderItem({
                icon: 'lock',
                title:
                    'Desactivar temporalmente mi cuenta',
                desc:
                    'Oculta tu perfil y contenido temporalmente',
                onclick:
                    'window.onDesactivarCuenta()',
                class:
                    'cfg-item-plain',
                style:
                    'color: var(--cfg-warning, #f7d44a);'
            }),

            cfgRenderItem({
                icon: 'logout',
                title:
                    'Eliminar mi cuenta',
                desc:
                    'Elimina permanentemente tu cuenta y todos tus datos',
                href:
                    '/eliminar-cuenta.html',
                class:
                    'cfg-item-plain',
                style:
                    'color: var(--cfg-danger, #ff3366);'
            })

        ].join('');
    }


    /* ============================================================
       EDITAR NOMBRE
       ============================================================ */

    window.onEditarNombre =
        function () {

            const valorActual =
                usuarioActual?.nombre ||
                '';


            const nuevoNombre =
                prompt(
                    'Escribe tu nuevo nombre:',
                    valorActual
                );


            if (
                nuevoNombre === null
            ) {
                return;
            }


            const nombre =
                nuevoNombre.trim();


            if (
                nombre.length < 2
            ) {

                cfgToast(
                    'El nombre debe tener al menos 2 caracteres.',
                    'warning'
                );

                return;
            }


            if (
                nombre.length > 50
            ) {

                cfgToast(
                    'El nombre no puede superar 50 caracteres.',
                    'warning'
                );

                return;
            }


            guardarPerfil({

                nombre:
                    nombre,

                handle:
                    usuarioActual?.handle ||
                    null,

                bio:
                    usuarioActual?.bio ||
                    null
            });
        };


    /* ============================================================
       EDITAR HANDLE
       ============================================================ */

    window.onEditarHandle =
        function () {

            const actual =
                usuarioActual?.handle ||
                '';


            const valor =
                prompt(
                    'Escribe tu nuevo handle sin @:',
                    actual
                );


            if (
                valor === null
            ) {
                return;
            }


            const handle =
                valor
                    .trim()
                    .replace(/^@+/, '')
                    .toLowerCase();


            if (
                !/^[a-z0-9_]{3,30}$/.test(
                    handle
                )
            ) {

                cfgToast(
                    'El handle debe tener entre 3 y 30 caracteres: letras, números y guion bajo.',
                    'warning'
                );

                return;
            }


            guardarPerfil({

                nombre:
                    usuarioActual?.nombre ||
                    null,

                handle:
                    handle,

                bio:
                    usuarioActual?.bio ||
                    null
            });
        };


    /* ============================================================
       EDITAR BIO
       ============================================================ */

    window.onEditarBio =
        function () {

            const actual =
                usuarioActual?.bio ||
                '';


            const valor =
                prompt(
                    'Escribe tu nueva biografía:',
                    actual
                );


            if (
                valor === null
            ) {
                return;
            }


            const bio =
                valor.trim();


            if (
                bio.length > 160
            ) {

                cfgToast(
                    'La biografía no puede superar 160 caracteres.',
                    'warning'
                );

                return;
            }


            guardarPerfil({

                nombre:
                    usuarioActual?.nombre ||
                    null,

                handle:
                    usuarioActual?.handle ||
                    null,

                bio:
                    bio ||
                    null
            });
        };


    /* ============================================================
       GUARDAR PERFIL
       
       RPC REAL:
       actualizar_perfil(
           p_nombre text,
           p_handle text,
           p_bio text
       )
       ============================================================ */

    async function guardarPerfil(datos) {

        try {

            const client =
                await obtenerCliente();


            cfgToast(
                'Guardando cambios...',
                '',
                3000
            );


            const resultado =
                await client.rpc(
                    'actualizar_perfil',
                    {
                        p_nombre:
                            datos.nombre,

                        p_handle:
                            datos.handle,

                        p_bio:
                            datos.bio
                    }
                );


            if (resultado.error) {
                throw resultado.error;
            }


            usuarioActual.nombre =
                datos.nombre;

            usuarioActual.handle =
                datos.handle;

            usuarioActual.bio =
                datos.bio;


            renderPerfilCard(
                usuarioActual
            );

            renderSecciones();


            cfgToast(
                'Cambios guardados correctamente.',
                'success'
            );

        } catch (error) {

            console.error(
                '[Cuenta] Error actualizando perfil:',
                error
            );


            cfgToast(
                'No se pudieron guardar los cambios: ' +
                (
                    error.message ||
                    'Error desconocido'
                ),
                'error',
                5000
            );
        }
    }


    /* ============================================================
       CAMBIAR CORREO
       
       Supabase Auth updateUser sí existe.
       registrar_acceso también está confirmado.
       ============================================================ */

    window.onEditarEmail =
        async function () {

            const actual =
                usuarioActual?.email ||
                sesionActual?.user?.email ||
                '';


            const nuevoEmail =
                prompt(
                    'Escribe tu nuevo correo electrónico:',
                    actual
                );


            if (
                nuevoEmail === null
            ) {
                return;
            }


            const email =
                nuevoEmail.trim();


            if (
                !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
                    email
                )
            ) {

                cfgToast(
                    'El correo electrónico no es válido.',
                    'error'
                );

                return;
            }


            try {

                const client =
                    await obtenerCliente();


                cfgToast(
                    'Actualizando correo...',
                    '',
                    4000
                );


                const resultado =
                    await client.auth.updateUser({
                        email:
                            email
                    });


                if (resultado.error) {
                    throw resultado.error;
                }


                try {

                    await client.rpc(
                        'registrar_acceso',
                        {
                            p_evento:
                                'cambio_email',

                            p_metadata:
                                {
                                    email_nuevo:
                                        email
                                }
                        }
                    );

                } catch (rpcError) {

                    console.warn(
                        '[Cuenta] No se pudo registrar cambio de correo:',
                        rpcError
                    );
                }


                cfgToast(
                    'Revisa tu correo para confirmar el cambio.',
                    'success',
                    5000
                );


                usuarioActual.email =
                    email;


            } catch (error) {

                console.error(
                    '[Cuenta] Error cambiando correo:',
                    error
                );


                cfgToast(
                    'No se pudo cambiar el correo: ' +
                    (
                        error.message ||
                        'Error desconocido'
                    ),
                    'error',
                    5000
                );
            }
        };


    /* ============================================================
       PLAN
       ============================================================ */

    window.onVerPlan =
        function () {

            window.location.href =
                '/features/perfil/configuracion/sariels/membresia.html';
        };


    /* ============================================================
       DESCARGA DE DATOS
       ============================================================ */

    window.onDescargarDatos =
        async function () {

            const ok =
                await cfgConfirm({

                    title:
                        '¿Descargar tus datos?',

                    text:
                        'Se descargará un archivo con la información disponible de tu cuenta.',

                    confirmText:
                        'Descargar',

                    cancelText:
                        'Cancelar',

                    danger:
                        false
                });


            if (!ok) {
                return;
            }


            try {

                const client =
                    await obtenerCliente();


                let historial =
                    [];


                try {

                    const resultado =
                        await client.rpc(
                            'obtener_mis_accesos',
                            {
                                p_limit: 100
                            }
                        );


                    if (!resultado.error) {

                        historial =
                            Array.isArray(
                                resultado.data
                            )
                                ? resultado.data
                                : [];
                    }

                } catch (error) {

                    console.warn(
                        '[Cuenta] No se pudo exportar historial:',
                        error
                    );
                }


                const exportData = {

                    generado_en:
                        new Date().toISOString(),

                    usuario: {

                        id:
                            sesionActual?.user?.id ||
                            null,

                        email:
                            usuarioActual?.email ||
                            sesionActual?.user?.email ||
                            null,

                        nombre:
                            usuarioActual?.nombre ||
                            null,

                        handle:
                            usuarioActual?.handle ||
                            null,

                        bio:
                            usuarioActual?.bio ||
                            null,

                        avatar_url:
                            usuarioActual?.avatar_url ||
                            null,

                        plan:
                            usuarioActual?.plan ||
                            null,

                        created_at:
                            usuarioActual?.created_at ||
                            null
                    },

                    historial_accesos:
                        historial
                };


                const blob =
                    new Blob(
                        [
                            JSON.stringify(
                                exportData,
                                null,
                                2
                            )
                        ],
                        {
                            type:
                                'application/json;charset=utf-8'
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const enlace =
                    document.createElement(
                        'a'
                    );


                enlace.href =
                    url;

                enlace.download =
                    'sariels-mis-datos-' +
                    Date.now() +
                    '.json';


                document.body.appendChild(
                    enlace
                );


                enlace.click();


                enlace.remove();


                URL.revokeObjectURL(
                    url
                );


                cfgToast(
                    'Archivo descargado correctamente.',
                    'success'
                );

            } catch (error) {

                console.error(
                    '[Cuenta] Error descargando datos:',
                    error
                );


                cfgToast(
                    'No se pudo generar el archivo.',
                    'error'
                );
            }
        };


    /* ============================================================
       DESACTIVAR CUENTA
       
       No inventamos RPC.
       La función real todavía no se ejecuta aquí.
       ============================================================ */

    window.onDesactivarCuenta =
        async function () {

            const ok =
                await cfgConfirm({

                    title:
                        '¿Desactivar tu cuenta?',

                    text:
                        'La desactivación temporal de la cuenta requiere el flujo específico de cuenta. No se ejecutará ninguna modificación todavía.',

                    confirmText:
                        'Entendido',

                    cancelText:
                        'Cancelar',

                    danger:
                        false
                });


            if (!ok) {
                return;
            }
        };


    /* ============================================================
       INICIO
       ============================================================ */

    window.addEventListener(
        'DOMContentLoaded',
        async function () {

            try {

                const client =
                    await guardiaDeAutenticacion();


                if (!client) {
                    return;
                }


                cfgInitPage({

                    title:
                        'Tu cuenta',

                    subtitle:
                        'Información de tu cuenta',

                    backUrl:
                        '/features/perfil/configuracion/index.html'
                });


                await cargarDatosUsuario(
                    client
                );


                await cargarHistorial(
                    client
                );


                renderSecciones();

            } catch (error) {

                console.error(
                    '[Cuenta] Error inicializando página:',
                    error
                );


                const nombre =
                    $('#nombreCuenta');

                if (nombre) {
                    nombre.textContent =
                        'No se pudo cargar';
                }


                const handle =
                    $('#handleCuenta');

                if (handle) {
                    handle.textContent =
                        '@explorador';
                }


                const historial =
                    $('#seccionHistorial');

                if (historial) {

                    historial.innerHTML = `
                        <div class="cfg-empty">
                            <div class="cfg-empty-text">
                                No se pudo cargar el historial de accesos.
                            </div>
                        </div>
                    `;
                }


                cfgToast(
                    'No se pudieron cargar todos los datos de la cuenta.',
                    'error',
                    5000
                );
            }

        },
        {
            once: true
        }
    );

})();
</script></body>
</html>
