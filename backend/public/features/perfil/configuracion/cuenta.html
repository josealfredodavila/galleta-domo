<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Tu cuenta · Sariel's</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="../../shared/config-layout.css" />
<style>
#perfilCard{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 16px 20px;min-height:208px;box-sizing:border-box}
#avatarCuenta{width:96px;height:96px;flex:0 0 96px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:36px;color:#D4AF37;background:rgba(212,175,55,.10);border:2px solid rgba(212,175,55,.45);margin:0 auto 12px;contain:layout paint size}
#avatarCuenta img{width:100%;height:100%;max-width:none;object-fit:cover;display:block;opacity:0;transition:opacity .25s ease}
#avatarCuenta img.ok{opacity:1}
#nombreCuenta{font-size:20px;font-weight:700;line-height:1.25;max-width:100%;overflow-wrap:anywhere}
#handleCuenta{font-size:14px;opacity:.7;margin-top:2px;max-width:100%;overflow-wrap:anywhere}
#bioCuenta{font-size:14px;opacity:.85;margin-top:8px;max-width:420px;line-height:1.4;overflow-wrap:anywhere;min-height:20px}
.cu-skel{height:64px;margin:6px 0;border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:cuSh 1.2s linear infinite}
@keyframes cuSh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.cu-skel{animation:none}#avatarCuenta img{transition:none}}
.cu-banner{margin:12px 0;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.4;background:rgba(247,212,74,.10);border:1px solid rgba(247,212,74,.35)}
.cu-banner button,.cu-retry{margin-top:8px;padding:8px 14px;border-radius:10px;border:1px solid rgba(212,175,55,.6);background:transparent;color:#D4AF37;font:inherit;cursor:pointer}
.cu-nota{font-size:12px;opacity:.6;padding:8px 4px}
.cu-item-off{opacity:.55;cursor:not-allowed}
.cu-ov{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.cu-sheet{width:100%;max-width:520px;box-sizing:border-box;background:#0d1410;border:1px solid rgba(212,175,55,.35);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));color:#fff}
.cu-sheet h3{margin:0 0 4px;font-size:17px}.cu-sheet p{margin:0 0 12px;font-size:13px;opacity:.7}
.cu-sheet input,.cu-sheet textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:16px;resize:none}
.cu-cnt{font-size:12px;opacity:.6;text-align:right;margin-top:4px}
.cu-err{color:#ff3366;font-size:13px;min-height:18px;margin-top:6px}
.cu-btns{display:flex;gap:10px;margin-top:10px}
.cu-btns button{flex:1;padding:12px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff}
.cu-btns .go{background:#D4AF37;color:#05080F;border-color:#D4AF37}
.cu-btns .peligro{background:#ff3366;color:#fff;border-color:#ff3366}
.cu-btns button:disabled{opacity:.5}
.cu-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#0d1410;border:1px solid rgba(212,175,55,.5);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:10000;transition:.25s;max-width:92%;text-align:center;pointer-events:none}
.cu-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cu-toast.error{border-color:#ff3366}.cu-toast.success{border-color:#00d68f}.cu-toast.warning{border-color:#f7d44a}
</style>
</head>
<body class="cfg-page">
<div id="cfgHeaderSlot"></div>
<main class="cfg-content">

<div class="cfg-profile-card" id="perfilCard">
  <div class="cfg-profile-avatar" id="avatarCuenta" aria-hidden="true">◈</div>
  <div class="cfg-profile-name" id="nombreCuenta">Cargando...</div>
  <div class="cfg-profile-handle" id="handleCuenta">@...</div>
  <div class="cfg-profile-bio" id="bioCuenta"></div>
</div>
<div id="avisoCuenta"></div>

<h2 class="cfg-section-title">Información de la cuenta</h2>
<div class="cfg-list" id="seccionInfo"><div class="cu-skel"></div><div class="cu-skel"></div><div class="cu-skel"></div><div class="cu-skel"></div></div>

<h2 class="cfg-section-title">Tu actividad en Sariel's</h2>
<div class="cfg-list" id="seccionActividad"></div>

<h2 class="cfg-section-title">Historial de accesos</h2>
<div class="cfg-list" id="seccionHistorial"><div class="cu-skel"></div><div class="cu-skel"></div></div>

<h2 class="cfg-section-title">Descarga de datos</h2>
<div class="cfg-list" id="seccionDescarga"></div>

<h2 class="cfg-section-title">Zona de peligro</h2>
<div class="cfg-list" id="seccionPeligro"></div>

<div class="cfg-footer"><strong>◈ Sariel's</strong> · Configuración · Tu cuenta</div>
</main>

<div id="cuToast" class="cu-toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../shared/config-icons.js"></script>
<script src="../../shared/config-layout.js"></script>
<script>
(function () {
'use strict';

/* Pon en true SOLO cuando exista una desactivación temporal real en Supabase. */
const HABILITAR_DESACTIVACION = false;

const $ = (s) => document.querySelector(s);
let clienteSupabase = null, sesionActual = null, usuarioActual = null;
let historialAccesos = [], estadoPerfil = 'cargando', estadoHistorial = 'cargando';
let ocupado = false;

function escapeHtml(v) {
  if (v === null || v === undefined) return '';
  const d = document.createElement('div'); d.textContent = String(v); return d.innerHTML;
}

function icono(n) {
  if (typeof window.cfgIcon === 'function') return window.cfgIcon(n) || '';
  return (window.CFG_ICONS && window.CFG_ICONS[n]) || '';
}

/* Ítem propio: no depende de cfgRenderItem del layout. */
function item(o) {
  const esLink = Boolean(o.href);
  const tag = esLink ? 'a' : 'button';
  const attr = esLink ? ' href="' + escapeHtml(o.href) + '"' : (o.onclick ? ' onclick="' + o.onclick + '"' : '');
  const cls = 'cfg-item' + (o.disabled ? ' cu-item-off' : '');
  const estilo = o.danger ? ' style="color:var(--cfg-danger,#ff3366);"' : '';
  const tipo = esLink ? '' : ' type="button"';
  const dis = o.disabled ? ' disabled' : '';
  const chevron = o.chevron === false ? '' : '<div class="cfg-item-chevron">' + icono('chevronRight') + '</div>';
  return '<' + tag + ' class="' + cls + '"' + attr + estilo + tipo + dis + '>' +
    '<div class="cfg-item-icon">' + icono(o.icon || 'settings') + '</div>' +
    '<div class="cfg-item-content"><div class="cfg-item-title">' + escapeHtml(o.title) + '</div>' +
    '<div class="cfg-item-desc">' + escapeHtml(o.desc || '') + '</div></div>' + chevron +
    '</' + tag + '>';
}

function fmtFecha(v, opts) {
  if (!v) return '';
  const d = new Date(v);
  return isNaN(d.getTime()) ? '' : d.toLocaleDateString('es-MX', opts || { year: 'numeric', month: 'long', day: 'numeric' });
}

/* ---------- Toast y confirmación propios ---------- */
let toastTimer = null;
function toast(msg, tipo, ms) {
  const t = $('#cuToast'); if (!t) return;
  clearTimeout(toastTimer);
  t.className = 'cu-toast' + (tipo ? ' ' + tipo : '');
  t.textContent = msg || '';
  requestAnimationFrame(() => t.classList.add('show'));
  toastTimer = setTimeout(() => t.classList.remove('show'), ms || 3000);
}

function confirmar(cfg) {
  return new Promise((resolve) => {
    const ov = document.createElement('div'); ov.className = 'cu-ov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    ov.innerHTML = '<div class="cu-sheet"><h3>' + escapeHtml(cfg.titulo) + '</h3><p>' + escapeHtml(cfg.texto || '') + '</p>' +
      '<div class="cu-btns"><button type="button" id="cfNo">' + escapeHtml(cfg.cancelar || 'Cancelar') + '</button>' +
      '<button type="button" class="' + (cfg.peligro ? 'peligro' : 'go') + '" id="cfSi">' + escapeHtml(cfg.aceptar || 'Confirmar') + '</button></div></div>';
    document.body.appendChild(ov);
    const cerrar = (v) => { document.removeEventListener('keydown', teclas); ov.remove(); resolve(v); };
    const teclas = (e) => { if (e.key === 'Escape') cerrar(false); };
    ov.querySelector('#cfNo').onclick = () => cerrar(false);
    ov.querySelector('#cfSi').onclick = () => cerrar(true);
    ov.addEventListener('click', (e) => { if (e.target === ov) cerrar(false); });
    document.addEventListener('keydown', teclas);
  });
}

/* ---------- Supabase ---------- */
async function obtenerCliente() {
  if (clienteSupabase) return clienteSupabase;
  if (window.supabaseClient && window.supabaseClient.auth) return (clienteSupabase = window.supabaseClient);
  if (!window.supabase || typeof window.supabase.createClient !== 'function') throw new Error('Supabase no disponible.');
  const r = await fetch('/api/config/public', { credentials: 'same-origin', cache: 'no-store', headers: { Accept: 'application/json' } });
  if (!r.ok) throw new Error('Configuración pública no disponible (' + r.status + ').');
  const cfg = await r.json();
  if (!cfg || !cfg.supabaseUrl || !cfg.supabaseAnonKey) throw new Error('Configuración pública incompleta.');
  clienteSupabase = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  window.supabaseClient = clienteSupabase;
  return clienteSupabase;
}

function irAlInicio() {
  try { localStorage.setItem('wallet_returnTo', location.pathname + location.search + location.hash); } catch (_) {}
  location.replace('/');
}

async function guardiaDeAutenticacion() {
  try {
    const client = await obtenerCliente();
    const { data } = await client.auth.getSession();
    if (!data || !data.session) { irAlInicio(); return null; }
    sesionActual = data.session;
    document.documentElement.classList.add('auth-ready');
    client.auth.onAuthStateChange((evento, session) => {
      if (evento === 'SIGNED_OUT' || !session) { irAlInicio(); return; }
      sesionActual = session;
    });
    return client;
  } catch (e) {
    console.error('[Cuenta] Error de autenticación:', e);
    irAlInicio();
    return null;
  }
}

/* ---------- Carga ---------- */
const COLUMNAS = ['id','email','nombre','handle','bio','avatar_url','created_at','plan','plan_expira_at','wallet_address','telefono','ciudad','pais_codigo','ubicacion','sitio_web'].join(', ');

async function cargarDatosUsuario(client) {
  const user = sesionActual.user, meta = user.user_metadata || {};
  try {
    const r = await client.from('usuarios').select(COLUMNAS).eq('id', user.id).maybeSingle();
    if (r.error) throw r.error;
    if (r.data) { usuarioActual = r.data; estadoPerfil = 'ok'; return; }
    estadoPerfil = 'incompleto';
  } catch (e) {
    console.error('[Cuenta] No se pudo leer usuarios:', e);
    estadoPerfil = 'error';
  }
  /* Respaldo de solo lectura: no se permite editar datos que no pudimos confirmar */
  usuarioActual = { id: user.id, email: user.email || null, nombre: meta.nombre || 'Explorador', handle: meta.handle || 'explorador',
    bio: meta.bio || null, avatar_url: meta.avatar_url || null, created_at: null, plan: 'Gratis' };
}

async function cargarHistorial(client) {
  try {
    const r = await client.rpc('obtener_mis_accesos', { p_limit: 20 });
    if (r.error) throw r.error;
    historialAccesos = Array.isArray(r.data) ? r.data : [];
    estadoHistorial = 'ok';
  } catch (e) {
    console.warn('[Cuenta] Historial:', e);
    historialAccesos = []; estadoHistorial = 'error';
  }
}

/* ---------- Render ---------- */
function renderPerfilCard() {
  const u = usuarioActual; if (!u) return;
  const av = $('#avatarCuenta');
  av.textContent = '◈';
  if (u.avatar_url && /^https:\/\//i.test(u.avatar_url)) {
    const img = new Image();
    img.alt = 'Foto de perfil'; img.width = 96; img.height = 96; img.decoding = 'async';
    img.onload = () => { av.textContent = ''; av.appendChild(img); requestAnimationFrame(() => img.classList.add('ok')); };
    img.onerror = () => { av.textContent = '◈'; };
    img.src = u.avatar_url;
  }
  $('#nombreCuenta').textContent = u.nombre || 'Explorador';
  const h = u.handle || 'explorador';
  $('#handleCuenta').textContent = h.startsWith('@') ? h : '@' + h;
  $('#bioCuenta').textContent = u.bio || "Explorando el ecosistema Sariel's · WEB3 · Comunidad";
}

function renderAviso() {
  const a = $('#avisoCuenta');
  if (estadoPerfil === 'ok') { a.innerHTML = ''; return; }
  const txt = estadoPerfil === 'incompleto'
    ? 'Tu perfil todavía no está completo en el sistema. Mostramos solo los datos de tu sesión; la edición está desactivada.'
    : 'No pudimos cargar tu perfil. Revisa tu conexión e inténtalo de nuevo; la edición está desactivada.';
  a.innerHTML = '<div class="cu-banner">' + escapeHtml(txt) + '<br><button type="button" onclick="window.cuentaReintentar()">Reintentar</button></div>';
}

function renderSecciones() {
  const u = usuarioActual || {}, au = (sesionActual && sesionActual.user) || {};
  const editable = estadoPerfil === 'ok';
  const ed = (fn, o) => Object.assign({ onclick: editable ? 'window.' + fn + '()' : undefined, disabled: !editable, chevron: editable }, o);

  const email = u.email || au.email || 'No disponible';
  const pendiente = au.new_email ? ' · pendiente de confirmar: ' + au.new_email : '';
  const creado = fmtFecha(au.created_at || u.created_at) || 'No disponible';
  const vence = fmtFecha(u.plan_expira_at, { year: 'numeric', month: 'short', day: 'numeric' });
  const plan = (u.plan || 'Gratis') + (vence && u.plan && u.plan !== 'Gratis' ? ' · vence ' + vence : '');

  $('#seccionInfo').innerHTML = [
    item(ed('onEditarNombre', { icon: 'user', title: 'Nombre de usuario', desc: u.nombre || 'Explorador' })),
    item(ed('onEditarHandle', { icon: 'fileText', title: 'Handle', desc: '@' + (u.handle || 'explorador') })),
    item(ed('onEditarBio', { icon: 'info', title: 'Biografía', desc: u.bio || 'Sin biografía' })),
    item({ icon: 'info', title: 'Correo electrónico', desc: email + pendiente, onclick: 'window.onEditarEmail()' }),
    item({ icon: 'crown', title: 'Plan actual', desc: plan, onclick: 'window.onVerPlan()' }),
    item({ icon: 'info', title: 'Cuenta creada el', desc: creado, chevron: false, disabled: true })
  ].join('');

  $('#seccionActividad').innerHTML = [
    item({ icon: 'fileText', title: 'Tus publicaciones', desc: 'Consulta y administra tus publicaciones', href: '/features/perfil/perfil.html' }),
    item({ icon: 'users', title: 'Tus contactos', desc: 'Administra tus contactos y solicitudes', href: '/features/mensajes/contactos.html' })
  ].join('');

  $('#seccionDescarga').innerHTML = item({ icon: 'database', title: 'Descargar archivo con tus datos',
    desc: "Obtén un archivo con tu información de Sariel's", onclick: 'window.onDescargarDatos()' });

  let peligro = '';
  if (HABILITAR_DESACTIVACION) {
    peligro += item({ icon: 'lock', title: 'Desactivar temporalmente mi cuenta', desc: 'Oculta tu perfil y contenido temporalmente',
      onclick: 'window.onDesactivarCuenta()', danger: true });
  }
  peligro += item({ icon: 'logout', title: 'Eliminar mi cuenta', desc: 'Elimina permanentemente tu cuenta y todos tus datos',
    href: '/eliminar-cuenta.html', danger: true });
  $('#seccionPeligro').innerHTML = peligro;
}

const ICONOS = { login: '🔓', logout: '🔒', login_fallido: '⚠️', cambio_password: '🔑', cambio_email: '📧', activacion_2fa: '🛡️', desactivacion_2fa: '🔓' };
const NOMBRES = { login: 'Inicio de sesión', logout: 'Cierre de sesión', login_fallido: 'Intento fallido', cambio_password: 'Cambio de contraseña',
  cambio_email: 'Cambio de correo', activacion_2fa: '2FA activado', desactivacion_2fa: '2FA desactivado' };

function renderHistorial() {
  const c = $('#seccionHistorial');
  if (estadoHistorial === 'error') {
    c.innerHTML = '<div class="cfg-empty"><div class="cfg-empty-text">No se pudo cargar el historial de accesos.</div><button type="button" class="cu-retry" onclick="window.cuentaReintentarHistorial()">Reintentar</button></div>';
    return;
  }
  if (!historialAccesos.length) {
    c.innerHTML = '<div class="cfg-empty"><span class="cfg-empty-icon">◈</span><div class="cfg-empty-text">Sin historial de accesos aún</div></div>';
    return;
  }
  c.innerHTML = historialAccesos.map((h) => {
    const f = h.created_at ? new Date(h.created_at).toLocaleString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    const fallido = h.exitoso === false ? ' <span style="color:#ff3366;">· FALLIDO</span>' : '';
    return '<div class="cfg-session-item"><span class="cfg-session-icon">' + (ICONOS[h.evento] || '◈') + '</span><div class="cfg-session-info">' +
      '<div class="cfg-session-title">' + escapeHtml(NOMBRES[h.evento] || h.evento || 'Evento') + '</div>' +
      '<div class="cfg-session-subtitle">' + escapeHtml(h.dispositivo || 'Dispositivo') + '</div>' +
      '<div class="cfg-session-meta">' + escapeHtml(f) + fallido + '</div></div></div>';
  }).join('') + '<div class="cu-nota">Se muestran tus últimos 20 accesos.</div>';
}

function renderTodo() { renderPerfilCard(); renderAviso(); renderSecciones(); renderHistorial(); }

/* ---------- Modal de texto (reemplaza prompt(), que se bloquea en móvil) ---------- */
function pedirTexto(cfg) {
  return new Promise((resolve) => {
    const ov = document.createElement('div'); ov.className = 'cu-ov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    const campo = cfg.multilinea ? '<textarea id="cuIn" rows="3"></textarea>' : '<input id="cuIn" type="' + (cfg.tipo || 'text') + '" autocomplete="off" autocapitalize="off" />';
    ov.innerHTML = '<div class="cu-sheet"><h3>' + escapeHtml(cfg.titulo) + '</h3><p>' + escapeHtml(cfg.ayuda || '') + '</p>' + campo +
      '<div class="cu-cnt" id="cuCnt"></div><div class="cu-err" id="cuErr"></div>' +
      '<div class="cu-btns"><button type="button" id="cuNo">Cancelar</button><button type="button" class="go" id="cuSi">Guardar</button></div></div>';
    document.body.appendChild(ov);
    const inp = ov.querySelector('#cuIn'), err = ov.querySelector('#cuErr'), cnt = ov.querySelector('#cuCnt');
    inp.value = cfg.valor || '';
    const actualizar = () => { cnt.textContent = cfg.max ? inp.value.trim().length + '/' + cfg.max : ''; };
    const cerrar = (v) => { document.removeEventListener('keydown', teclas); ov.remove(); resolve(v); };
    const aceptar = () => {
      const v = inp.value.trim();
      const m = cfg.validar ? cfg.validar(v) : null;
      if (m) { err.textContent = m; return; }
      cerrar(v);
    };
    const teclas = (e) => {
      if (e.key === 'Escape') cerrar(null);
      else if (e.key === 'Enter' && !cfg.multilinea) { e.preventDefault(); aceptar(); }
    };
    inp.addEventListener('input', () => { err.textContent = ''; actualizar(); });
    ov.querySelector('#cuNo').onclick = () => cerrar(null);
    ov.querySelector('#cuSi').onclick = aceptar;
    ov.addEventListener('click', (e) => { if (e.target === ov) cerrar(null); });
    document.addEventListener('keydown', teclas);
    actualizar();
    setTimeout(() => inp.focus(), 50);
  });
}

/* ---------- Guardar perfil (solo mediante la RPC actualizar_perfil) ---------- */
async function guardarPerfil(cambios) {
  if (ocupado) return;
  ocupado = true;
  try {
    const client = await obtenerCliente();
    toast('Guardando cambios...', '', 2500);
    const datos = Object.assign({ nombre: usuarioActual.nombre || null, handle: usuarioActual.handle || null, bio: usuarioActual.bio || null }, cambios);
    const r = await client.rpc('actualizar_perfil', { p_nombre: datos.nombre, p_handle: datos.handle, p_bio: datos.bio });
    if (r.error) throw r.error;
    Object.assign(usuarioActual, datos);
    renderPerfilCard(); renderSecciones();
    toast('Cambios guardados correctamente.', 'success');
  } catch (e) {
    console.error('[Cuenta] Error actualizando perfil:', e);
    const dup = e && (e.code === '23505' || /duplicate|unique/i.test(e.message || ''));
    toast(dup ? 'Ese handle ya está en uso. Prueba con otro.' : 'No se pudieron guardar los cambios: ' + ((e && e.message) || 'Error desconocido'), 'error', 5000);
  } finally { ocupado = false; }
}

window.onEditarNombre = async function () {
  if (estadoPerfil !== 'ok') return;
  const v = await pedirTexto({ titulo: 'Nombre de usuario', ayuda: 'Entre 2 y 50 caracteres.', valor: usuarioActual.nombre, max: 50,
    validar: (t) => (t.length < 2 ? 'El nombre debe tener al menos 2 caracteres.' : t.length > 50 ? 'Máximo 50 caracteres.' : null) });
  if (v !== null && v !== usuarioActual.nombre) guardarPerfil({ nombre: v });
};

window.onEditarHandle = async function () {
  if (estadoPerfil !== 'ok') return;
  const v = await pedirTexto({ titulo: 'Handle', ayuda: 'Sin @. De 3 a 30 caracteres: letras, números y guion bajo.', valor: usuarioActual.handle, max: 30,
    validar: (t) => (/^[a-z0-9_]{3,30}$/.test(t.replace(/^@+/, '').toLowerCase()) ? null : 'Usa 3 a 30 caracteres: letras, números y guion bajo.') });
  if (v === null) return;
  const h = v.replace(/^@+/, '').toLowerCase();
  if (h !== usuarioActual.handle) guardarPerfil({ handle: h });
};

window.onEditarBio = async function () {
  if (estadoPerfil !== 'ok') return;
  const v = await pedirTexto({ titulo: 'Biografía', ayuda: 'Máximo 160 caracteres.', valor: usuarioActual.bio || '', max: 160, multilinea: true,
    validar: (t) => (t.length > 160 ? 'Máximo 160 caracteres.' : null) });
  if (v !== null && v !== (usuarioActual.bio || '')) guardarPerfil({ bio: v || null });
};

window.onEditarEmail = async function () {
  const actual = (usuarioActual && usuarioActual.email) || (sesionActual && sesionActual.user.email) || '';
  const v = await pedirTexto({ titulo: 'Correo electrónico', ayuda: 'Te enviaremos un enlace de confirmación. El cambio se aplica al confirmarlo.', valor: actual, tipo: 'email',
    validar: (t) => (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t) ? null : 'El correo electrónico no es válido.') });
  if (v === null) return;
  const email = v.toLowerCase();
  if (email === actual.toLowerCase()) { toast('Ese ya es tu correo actual.', 'warning'); return; }
  if (ocupado) return;
  ocupado = true;
  try {
    const client = await obtenerCliente();
    toast('Enviando confirmación...', '', 4000);
    const r = await client.auth.updateUser({ email: email });
    if (r.error) throw r.error;
    try { await client.rpc('registrar_acceso', { p_evento: 'cambio_email', p_metadata: { estado: 'pendiente_confirmacion' } }); }
    catch (re) { console.warn('[Cuenta] No se pudo registrar el cambio de correo:', re); }
    try { const g = await client.auth.getUser(); if (g.data && g.data.user) sesionActual.user = g.data.user; } catch (_) {}
    renderSecciones();
    toast('Revisa tu correo para confirmar el cambio.', 'success', 6000);
    await cargarHistorial(client); renderHistorial();
  } catch (e) {
    console.error('[Cuenta] Error cambiando correo:', e);
    toast('No se pudo cambiar el correo: ' + ((e && e.message) || 'Error desconocido'), 'error', 5000);
  } finally { ocupado = false; }
};

window.onVerPlan = function () { location.href = '/features/perfil/configuracion/sariels/membresia.html'; };

window.onDescargarDatos = async function () {
  if (ocupado) return;
  const ok = await confirmar({ titulo: '¿Descargar tus datos?', texto: 'Se descargará un archivo con los datos de tu cuenta y tu historial de accesos.', aceptar: 'Descargar' });
  if (!ok) return;
  ocupado = true;
  try {
    const client = await obtenerCliente();
    let hist = [];
    try { const r = await client.rpc('obtener_mis_accesos', { p_limit: 100 }); if (!r.error && Array.isArray(r.data)) hist = r.data; } catch (_) {}
    const u = usuarioActual || {};
    const datos = {
      generado_en: new Date().toISOString(),
      usuario: {
        id: sesionActual.user.id, email: u.email || sesionActual.user.email || null, nombre: u.nombre || null, handle: u.handle || null,
        bio: u.bio || null, avatar_url: u.avatar_url || null, plan: u.plan || null, plan_expira_at: u.plan_expira_at || null,
        wallet_address: u.wallet_address || null, telefono: u.telefono || null, ciudad: u.ciudad || null, pais_codigo: u.pais_codigo || null,
        ubicacion: u.ubicacion || null, sitio_web: u.sitio_web || null, created_at: sesionActual.user.created_at || u.created_at || null
      },
      historial_accesos: hist
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = 'sariels-mis-datos-' + Date.now() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Archivo descargado correctamente.', 'success');
  } catch (e) {
    console.error('[Cuenta] Error descargando datos:', e);
    toast('No se pudo generar el archivo.', 'error');
  } finally { ocupado = false; }
};

window.onDesactivarCuenta = async function () {
  await confirmar({ titulo: 'Función no disponible', texto: 'La desactivación temporal aún no está habilitada.', aceptar: 'Entendido', cancelar: 'Cerrar' });
};

window.cuentaReintentarHistorial = async function () {
  $('#seccionHistorial').innerHTML = '<div class="cu-skel"></div><div class="cu-skel"></div>';
  await cargarHistorial(await obtenerCliente());
  renderHistorial();
};

window.cuentaReintentar = async function () {
  const c = await obtenerCliente();
  await Promise.all([cargarDatosUsuario(c), cargarHistorial(c)]);
  renderTodo();
};

/* ---------- Inicio ---------- */
window.addEventListener('DOMContentLoaded', async function () {
  try {
    const client = await guardiaDeAutenticacion();
    if (!client) return;
    if (typeof window.cfgInitPage === 'function') {
      window.cfgInitPage({ title: 'Tu cuenta', subtitle: 'Información de tu cuenta', backUrl: '/features/perfil/configuracion/index.html' });
    }
    await Promise.all([cargarDatosUsuario(client), cargarHistorial(client)]);
    renderTodo();
  } catch (e) {
    console.error('[Cuenta] Error inicializando página:', e);
    $('#nombreCuenta').textContent = 'No se pudo cargar';
    $('#seccionInfo').innerHTML = '';
    $('#seccionActividad').innerHTML = '';
    $('#seccionHistorial').innerHTML = '';
    $('#avisoCuenta').innerHTML = '<div class="cu-banner">No se pudieron cargar los datos de la cuenta.<br><button type="button" onclick="location.reload()">Recargar</button></div>';
    toast('No se pudieron cargar todos los datos de la cuenta.', 'error', 5000);
  }
}, { once: true });

})();
</script>
