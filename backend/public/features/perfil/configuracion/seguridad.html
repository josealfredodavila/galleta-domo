<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Seguridad y acceso · Sariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/config-layout.css" />
    <style>
        .cfg-item-disabled { opacity: .55; cursor: not-allowed; }
        .sec-row { display:flex; align-items:center; gap:12px; padding:12px 14px; }
        .sec-badge { display:inline-block; margin-left:6px; padding:2px 8px; border-radius:999px; font-size:.6rem; font-weight:700;
            background:rgba(247,212,74,.12); color:#f7d44a; border:1px solid rgba(247,212,74,.35); }
    </style>
</head>
<body class="cfg-page">

<div id="cfgHeaderSlot"></div>

<main class="cfg-content">

    <h2 class="cfg-section-title">Autenticación</h2>
    <div class="cfg-list" id="seccionAuth"></div>

    <h2 class="cfg-section-title">Contraseña</h2>
    <div class="cfg-list" id="seccionPassword"></div>

    <h2 class="cfg-section-title">Sesiones</h2>
    <div class="cfg-list" id="seccionSesiones"></div>

    <h2 class="cfg-section-title">Apps conectadas</h2>
    <div class="cfg-list" id="seccionApps"></div>

    <div class="cfg-aviso cfg-aviso-info">
        ℹ️ Mantén tu cuenta segura. Si ves algo sospechoso, cierra las sesiones de otros dispositivos y cambia tu contraseña.
    </div>

    <div class="cfg-footer">
        <strong>◈ Sariel's</strong> · Configuración · Seguridad
    </div>
</main>

<div id="cfgToast" class="cfg-toast" role="status" aria-live="polite"></div>

<div id="cfgModal" class="cfg-modal-overlay" aria-hidden="true">
    <div class="cfg-modal" role="dialog" aria-modal="true">
        <h3 id="cfgModalTitle" class="cfg-modal-title"></h3>
        <p id="cfgModalText" class="cfg-modal-text"></p>
        <div class="cfg-modal-actions">
            <button type="button" id="cfgModalCancel" class="cfg-btn cfg-btn-outline">Cancelar</button>
            <button type="button" id="cfgModalConfirm" class="cfg-btn cfg-btn-primary">Confirmar</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../shared/config-icons.js"></script>

<script>
(function () {
    'use strict';

    let clienteSupabase = null;
    let sesionActual = null;
    let sesionesActivas = [];
    let appsConectadas = [];
    let ocupado = false;

    const $ = function (s) { return document.querySelector(s); };

    function escapeHtml(v) {
        if (v === null || v === undefined) return '';
        const d = document.createElement('div');
        d.textContent = String(v);
        return d.innerHTML;
    }

    function icono(nombre) {
        if (typeof window.cfgIcon === 'function') return window.cfgIcon(nombre) || '';
        return (window.CFG_ICONS && window.CFG_ICONS[nombre]) || '';
    }

    /* Ítem de lista. Los textos pasan por escapeHtml; los onclick son constantes del código. */
    function item(o) {
        const esLink = Boolean(o.href);
        const tag = esLink ? 'a' : 'button';
        const attr = esLink ? ' href="' + escapeHtml(o.href) + '"' : (o.onclick ? ' onclick="' + o.onclick + '"' : '');
        const cls = 'cfg-item' + (o.disabled ? ' cfg-item-disabled' : '');
        const estilo = o.danger ? ' style="color:var(--cfg-danger,#ff3366);"' : '';
        const tipo = esLink ? '' : ' type="button"';
        const dis = o.disabled ? ' disabled' : '';
        const chevron = o.chevron === false ? '' :
            '<div class="cfg-item-chevron">' + icono('chevronRight') + '</div>';
        return '<' + tag + ' class="' + cls + '"' + attr + estilo + tipo + dis + '>' +
            '<div class="cfg-item-icon">' + icono(o.icon || 'settings') + '</div>' +
            '<div class="cfg-item-content">' +
                '<div class="cfg-item-title">' + escapeHtml(o.title) + (o.badge ? ' <span class="sec-badge">' + escapeHtml(o.badge) + '</span>' : '') + '</div>' +
                '<div class="cfg-item-desc">' + escapeHtml(o.desc || '') + '</div>' +
            '</div>' + chevron +
            '</' + tag + '>';
    }

    /* ---------- TOAST ---------- */
    let toastTimer = null;
    function cfgToast(mensaje, tipo, duracion) {
        const toast = $('#cfgToast');
        if (!toast) return;
        clearTimeout(toastTimer);
        toast.className = 'cfg-toast';
        if (tipo === 'success') toast.classList.add('cfg-toast-success');
        else if (tipo === 'error') toast.classList.add('cfg-toast-error');
        else if (tipo === 'warning') toast.classList.add('cfg-toast-warning');
        toast.textContent = mensaje || '';
        requestAnimationFrame(function () { toast.classList.add('show'); });
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, duracion || 3000);
    }
    window.cfgToast = cfgToast;

    /* ---------- MODAL DE CONFIRMACIÓN ---------- */
    let modalResolver = null;
    function cfgConfirm(o) {
        o = o || {};
        return new Promise(function (resolve) {
            const overlay = $('#cfgModal'), titulo = $('#cfgModalTitle'), texto = $('#cfgModalText');
            const cancelar = $('#cfgModalCancel'), confirmar = $('#cfgModalConfirm');
            modalResolver = resolve;
            titulo.textContent = o.title || 'Confirmar acción';
            texto.textContent = o.text || '¿Quieres continuar?';
            cancelar.textContent = o.cancelText || 'Cancelar';
            confirmar.textContent = o.confirmText || 'Confirmar';
            confirmar.className = 'cfg-btn ' + (o.danger ? 'cfg-btn-danger' : 'cfg-btn-primary');
            overlay.classList.add('show');
            overlay.setAttribute('aria-hidden', 'false');
            cancelar.onclick = function () { cerrarModal(false); };
            confirmar.onclick = function () { cerrarModal(true); };
            overlay.onclick = function (e) { if (e.target === overlay) cerrarModal(false); };
        });
    }
    function cerrarModal(resultado) {
        const overlay = $('#cfgModal');
        if (overlay) { overlay.classList.remove('show'); overlay.setAttribute('aria-hidden', 'true'); }
        if (modalResolver) { const r = modalResolver; modalResolver = null; r(resultado); }
    }
    window.cfgConfirm = cfgConfirm;

    /* ---------- HEADER ---------- */
    function cfgInitPage(o) {
        o = o || {};
        const slot = $('#cfgHeaderSlot');
        if (!slot) return;
        const backUrl = o.backUrl || '/features/perfil/configuracion/index.html';
        slot.innerHTML =
            '<header class="cfg-header">' +
                '<a class="cfg-header-back" href="' + escapeHtml(backUrl) + '" aria-label="Volver">' + icono('back') + '</a>' +
                '<div class="cfg-header-text">' +
                    '<h1 class="cfg-header-title">' + escapeHtml(o.title || 'Configuración') + '</h1>' +
                    (o.subtitle ? '<p class="cfg-header-subtitle">' + escapeHtml(o.subtitle) + '</p>' : '') +
                '</div>' +
            '</header>';
    }
    window.cfgInitPage = cfgInitPage;

    /* ---------- SUPABASE ---------- */
    async function obtenerCliente() {
        if (clienteSupabase) return clienteSupabase;
        if (window.supabaseClient && window.supabaseClient.auth) {
            clienteSupabase = window.supabaseClient;
            return clienteSupabase;
        }
        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
            throw new Error('La librería de Supabase no está disponible.');
        }
        const r = await fetch('/api/config/public', { credentials: 'same-origin', cache: 'no-store', headers: { Accept: 'application/json' } });
        if (!r.ok) throw new Error('No se pudo cargar la configuración pública (' + r.status + ').');
        const cfg = await r.json();
        if (!cfg || !cfg.supabaseUrl || !cfg.supabaseAnonKey) throw new Error('Configuración pública incompleta.');
        clienteSupabase = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        window.supabaseClient = clienteSupabase;
        return clienteSupabase;
    }

    function guardarRetornoYSalir() {
        try {
            const retorno = window.location.pathname + window.location.search + window.location.hash;
            if (retorno.startsWith('/') && !retorno.startsWith('//')) {
                localStorage.setItem('wallet_returnTo', retorno);
            }
        } catch (e) {}
        window.location.replace('/');
    }

    async function guardiaDeAutenticacion() {
        let timeoutId = null;
        try {
            timeoutId = setTimeout(guardarRetornoYSalir, 10000);
            const client = await obtenerCliente();
            const resultado = await client.auth.getSession();
            const session = resultado && resultado.data ? resultado.data.session : null;
            clearTimeout(timeoutId);
            if (!session) { guardarRetornoYSalir(); return null; }
            sesionActual = session;
            document.documentElement.classList.add('auth-ready');
            return client;
        } catch (error) {
            clearTimeout(timeoutId);
            console.error('[Seguridad] Error de autenticación:', error);
            guardarRetornoYSalir();
            return null;
        }
    }

    /* ---------- CARGA ---------- */
    async function cargarSesiones(client) {
        sesionesActivas = [];
        try {
            const r = await client
                .from('usuarios_sesiones')
                .select('id, dispositivo, navegador, ubicacion_aproximada, ultima_actividad')
                .eq('usuario_id', sesionActual.user.id)
                .order('ultima_actividad', { ascending: false })
                .limit(10);
            if (r.error) throw r.error;
            sesionesActivas = r.data || [];
        } catch (error) {
            console.warn('[Seguridad] No se pudieron cargar sesiones:', error.message || error);
        }
    }

    async function cargarApps(client) {
        appsConectadas = [];
        try {
            const r = await client.rpc('listar_mis_apps');
            if (r.error) throw r.error;
            appsConectadas = r.data || [];
        } catch (error) {
            console.warn('[Seguridad] No se pudieron cargar apps:', error.message || error);
        }
    }

    /* ---------- RENDER ---------- */
    function renderAutenticacion() {
        $('#seccionAuth').innerHTML = item({
            icon: 'shield',
            title: 'Verificación en 2 pasos',
            desc: 'Próximamente. Todavía no protege tu cuenta; lo estamos preparando.',
            badge: 'Próximamente',
            disabled: true,
            chevron: false
        });
    }

    function renderPassword() {
        $('#seccionPassword').innerHTML = item({
            icon: 'lock',
            title: 'Cambiar contraseña',
            desc: 'Actualiza la contraseña de tu cuenta.',
            href: '/actualizar-contrasena'
        });
    }

    function obtenerDispositivoActual() {
        const ua = navigator.userAgent || '';
        if (/Android/i.test(ua)) return { nombre: 'Android', icono: '📱' };
        if (/iPhone|iPad|iPod/i.test(ua)) return { nombre: 'iPhone / iPad', icono: '📱' };
        if (/Windows/i.test(ua)) return { nombre: 'Windows', icono: '💻' };
        if (/Mac/i.test(ua)) return { nombre: 'Mac', icono: '💻' };
        if (/Linux/i.test(ua)) return { nombre: 'Linux', icono: '💻' };
        return { nombre: 'Navegador web', icono: '💻' };
    }

    function renderSesiones() {
        const actual = obtenerDispositivoActual();
        let html =
            '<div class="cfg-session-item">' +
                '<span class="cfg-session-icon">' + actual.icono + '</span>' +
                '<div class="cfg-session-info">' +
                    '<div class="cfg-session-title">' + escapeHtml(actual.nombre) +
                        ' <span class="cfg-badge cfg-badge-success">Este dispositivo</span></div>' +
                    '<div class="cfg-session-subtitle">Sesión actual activa</div>' +
                '</div>' +
            '</div>';

        sesionesActivas.forEach(function (s) {
            let fecha = 'Desconocido';
            if (s.ultima_actividad) {
                const f = new Date(s.ultima_actividad);
                if (!isNaN(f.getTime())) {
                    fecha = f.toLocaleString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
                }
            }
            const icono = /Android|iPhone|iPad/i.test(String(s.dispositivo || '')) ? '📱' : '💻';
            html +=
                '<div class="cfg-session-item">' +
                    '<span class="cfg-session-icon">' + icono + '</span>' +
                    '<div class="cfg-session-info">' +
                        '<div class="cfg-session-title">' + escapeHtml(s.dispositivo || 'Dispositivo') + '</div>' +
                        '<div class="cfg-session-subtitle">' + escapeHtml(s.navegador || 'Navegador') + '</div>' +
                        '<div class="cfg-session-meta">' + escapeHtml(s.ubicacion_aproximada || 'Ubicación desconocida') + ' · ' + escapeHtml(fecha) + '</div>' +
                    '</div>' +
                '</div>';
        });

        html += item({
            icon: 'logout',
            title: 'Cerrar sesión en otros dispositivos',
            desc: 'Cierra todas las sesiones abiertas en otros dispositivos. Este dispositivo se mantiene abierto.',
            onclick: 'window.onCerrarOtrasSesiones()',
            danger: true
        });

        $('#seccionSesiones').innerHTML = html;
    }

    function renderApps() {
        let html = '';
        appsConectadas.forEach(function (app) {
            html +=
                '<div class="cfg-session-item">' +
                    '<span class="cfg-session-icon">' + escapeHtml(app.app_icono || '🔗') + '</span>' +
                    '<div class="cfg-session-info">' +
                        '<div class="cfg-session-title">' + escapeHtml(app.app_nombre || 'App') + '</div>' +
                        '<div class="cfg-session-subtitle">' + escapeHtml(app.app_descripcion || 'Aplicación conectada') + '</div>' +
                    '</div>' +
                    '<button type="button" class="cfg-session-btn" onclick="window.onRevocarApp(' + JSON.stringify(String(app.id)) + ')">Revocar</button>' +
                '</div>';
        });
        html += item({
            icon: 'wallet',
            title: 'Wallet conectada',
            desc: 'Consulta y administra la wallet vinculada a tu cuenta.',
            href: '/features/perfil/configuracion/sariels/wallet.html'
        });
        $('#seccionApps').innerHTML = html;
    }

    function renderSecciones() {
        renderAutenticacion();
        renderPassword();
        renderSesiones();
        renderApps();
    }

    /* ---------- ACCIONES ---------- */
    window.onCerrarOtrasSesiones = async function () {
        if (ocupado) return;
        const ok = await cfgConfirm({
            title: '¿Cerrar sesión en otros dispositivos?',
            text: 'Los demás dispositivos tendrán que volver a iniciar sesión. Este dispositivo se mantiene abierto.',
            confirmText: 'Cerrar sesiones',
            cancelText: 'Cancelar',
            danger: true
        });
        if (!ok) return;
        ocupado = true;
        try {
            const client = await obtenerCliente();
            const r = await client.auth.signOut({ scope: 'others' });
            if (r && r.error) throw r.error;
            await cargarSesiones(client);
            renderSesiones();
            cfgToast('✓ Sesiones de otros dispositivos cerradas', 'success');
        } catch (error) {
            console.error('[Seguridad] Error cerrando otras sesiones:', error);
            cfgToast('No se pudieron cerrar las sesiones: ' + (error.message || 'Error desconocido'), 'error', 5000);
        } finally {
            ocupado = false;
        }
    };

    window.onRevocarApp = async function (appId) {
        if (ocupado) return;
        const ok = await cfgConfirm({
            title: '¿Revocar acceso?',
            text: "La aplicación ya no podrá acceder a tu cuenta de Sariel's.",
            confirmText: 'Revocar',
            cancelText: 'Cancelar',
            danger: true
        });
        if (!ok) return;
        ocupado = true;
        try {
            const client = await obtenerCliente();
            const r = await client.rpc('revocar_app', { p_app_id: appId });
            if (r.error) throw r.error;
            await cargarApps(client);
            renderApps();
            cfgToast('✓ App revocada', 'success');
        } catch (error) {
            console.error('[Seguridad] Error revocando app:', error);
            cfgToast('No se pudo revocar la app: ' + (error.message || 'Error desconocido'), 'error', 5000);
        } finally {
            ocupado = false;
        }
    };

    /* ---------- INICIO ---------- */
    window.addEventListener('DOMContentLoaded', async function () {
        const client = await guardiaDeAutenticacion();
        if (!client) return;
        cfgInitPage({
            title: 'Seguridad y acceso',
            subtitle: 'Protege tu cuenta',
            backUrl: '/features/perfil/configuracion/index.html'
        });
        await Promise.all([cargarSesiones(client), cargarApps(client)]);
        renderSecciones();
    }, { once: true });

})();
</script>

</body>
</html>
