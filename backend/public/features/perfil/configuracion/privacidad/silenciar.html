<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Silenciar y bloquear · Sariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../../shared/config-layout.css" />
    
    <style>
        .cfg-lista-vacia {
            padding: 24px 16px;
            text-align: center;
            color: var(--cfg-text-muted);
            font-size: 0.78rem;
        }
        .cfg-lista-vacia .icon {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 8px;
            opacity: 0.4;
        }
        .cfg-item-lista {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--cfg-border);
        }
        .cfg-item-lista:last-child {
            border-bottom: none;
        }
        .cfg-item-lista .icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .cfg-item-lista .info {
            flex: 1;
            min-width: 0;
        }
        .cfg-item-lista .info .nombre {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--cfg-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cfg-item-lista .info .handle {
            font-size: 0.68rem;
            color: var(--cfg-text-muted);
        }
        .cfg-item-lista .btn-eliminar {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.3);
            color: var(--cfg-danger);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--cfg-transition);
        }
        .cfg-item-lista .btn-eliminar:hover {
            background: rgba(255, 51, 102, 0.2);
        }
        .cfg-tag-palabra {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            font-size: 0.72rem;
            color: var(--cfg-gold);
            margin: 4px;
        }
        .cfg-tag-palabra .btn-x {
            background: none;
            border: none;
            color: var(--cfg-gold);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0;
            margin-left: 4px;
            line-height: 1;
        }
        .cfg-tag-palabra .btn-x:hover {
            color: var(--cfg-danger);
        }
        .cfg-palabras-container {
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            min-height: 50px;
        }
    </style>
</head>
<body class="cfg-page">

    <div id="cfgHeaderSlot"></div>

    <main class="cfg-content">

        <h2 class="cfg-section-title">Cuentas</h2>
        <div class="cfg-list" id="seccionCuentas"></div>

        <h2 class="cfg-section-title">Palabras silenciadas</h2>
        <div class="cfg-list">
            <div class="cfg-palabras-container" id="palabrasContainer">
                <div class="cfg-lista-vacia">
                    <span class="icon">📝</span>
                    Cargando palabras silenciadas...
                </div>
            </div>
            <button class="cfg-item" onclick="window.onAgregarPalabra()" style="border-top:1px solid var(--cfg-border);">
                <div class="cfg-item-icon">➕</div>
                <div class="cfg-item-content">
                    <div class="cfg-item-title">Agregar palabra o hashtag</div>
                    <div class="cfg-item-desc">Las publicaciones con esta palabra se ocultarán</div>
                </div>
                <div class="cfg-item-chevron">›</div>
            </button>
        </div>

        <h2 class="cfg-section-title">Notificaciones</h2>
        <div class="cfg-list" id="seccionNotificaciones"></div>

        <div class="cfg-aviso">
            ℹ️ Silenciar una cuenta no la notifica. Bloquear sí lo hace.
        </div>

        <div class="cfg-footer">
            <strong>◈ Sariel's</strong> · Privacidad · Silenciar y bloquear
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../../../shared/config-icons.js"></script>
    <script src="../../../shared/config-layout.js"></script>

    <script>
    (function () {
        'use strict';

        const $ = (sel) => document.querySelector(sel);

        // Cliente Supabase
        function sb() {
            return window.supabaseClient || 
                (window.supabase && window.supabase.createClient(
                    'https://zultnlogdoajehbswlih.supabase.co',
                    'sb_publishable_S3jONAz3mRO4JKBRhUdI1A_-nsyVhKu'
                ));
        }

        cfgInitPage({
            title: 'Silenciar y bloquear',
            subtitle: '@tu_usuario',
            backUrl: '/features/perfil/configuracion/index.html',
        });

        let cuentasSilenciadas = [];
        let cuentasBloqueadas = [];
        let palabrasSilenciadas = [];

        // ============================================================
        // CARGAR DATOS DESDE SUPABASE
        // ============================================================
        async function cargarTodo() {
            await Promise.all([
                cargarCuentasSilenciadas(),
                cargarCuentasBloqueadas(),
                cargarPalabrasSilenciadas(),
            ]);
        }

        async function cargarCuentasSilenciadas() {
            try {
                const client = sb();
                if (!client) return;

                const { data, error } = await client.rpc('listar_cuentas_gestionadas', {
                    p_tipo: 'silenciada'
                });

                if (error) {
                    console.warn('Error RPC listar_cuentas_gestionadas:', error.message);
                    cuentasSilenciadas = [];
                    return;
                }

                cuentasSilenciadas = data || [];
            } catch (e) {
                console.warn('Error cargando silenciadas:', e.message);
                cuentasSilenciadas = [];
            }
        }

        async function cargarCuentasBloqueadas() {
            try {
                const client = sb();
                if (!client) return;

                const { data, error } = await client.rpc('listar_cuentas_gestionadas', {
                    p_tipo: 'bloqueada'
                });

                if (error) {
                    console.warn('Error RPC listar_cuentas_gestionadas:', error.message);
                    cuentasBloqueadas = [];
                    return;
                }

                cuentasBloqueadas = data || [];
            } catch (e) {
                console.warn('Error cargando bloqueadas:', e.message);
                cuentasBloqueadas = [];
            }
        }

        async function cargarPalabrasSilenciadas() {
            try {
                const client = sb();
                if (!client) return;

                const { data, error } = await client.rpc('listar_palabras_silenciadas');

                if (error) {
                    console.warn('Error RPC listar_palabras_silenciadas:', error.message);
                    palabrasSilenciadas = [];
                    return;
                }

                palabrasSilenciadas = data || [];
            } catch (e) {
                console.warn('Error cargando palabras:', e.message);
                palabrasSilenciadas = [];
            }
        }

        // ============================================================
        // RENDERIZAR SECCIONES
        // ============================================================
        function renderSecciones() {
            // ============================================================
            // CUENTAS
            // ============================================================
            const totalSilenciadas = cuentasSilenciadas.length;
            const totalBloqueadas = cuentasBloqueadas.length;

            $('#seccionCuentas').innerHTML = [
                cfgRenderItem({
                    icon: 'ban',
                    title: `Cuentas silenciadas (${totalSilenciadas})`,
                    desc: totalSilenciadas === 0 
                        ? 'No has silenciado ninguna cuenta' 
                        : 'Toca para ver y administrar',
                    onclick: 'window.onVerSilenciadas()',
                }),
                cfgRenderItem({
                    icon: 'ban',
                    title: `Cuentas bloqueadas (${totalBloqueadas})`,
                    desc: totalBloqueadas === 0 
                        ? 'No has bloqueado ninguna cuenta' 
                        : 'Toca para ver y administrar',
                    onclick: 'window.onVerBloqueadas()',
                }),
            ].join('');

            // ============================================================
            // PALABRAS SILENCIADAS
            // ============================================================
            const container = $('#palabrasContainer');
            if (palabrasSilenciadas.length === 0) {
                container.innerHTML = `
                    <div class="cfg-lista-vacia">
                        <span class="icon">📝</span>
                        Sin palabras silenciadas
                    </div>
                `;
            } else {
                container.innerHTML = palabrasSilenciadas.map(p => `
                    <div class="cfg-tag-palabra">
                        ${p.tipo === 'hashtag' ? '#' : ''}${escapeHtml(p.palabra)}
                        <button class="btn-x" onclick="window.onEliminarPalabra('${p.id}')" title="Eliminar">×</button>
                    </div>
                `).join('');
            }

            // ============================================================
            // NOTIFICACIONES
            // ============================================================
            $('#seccionNotificaciones').innerHTML = [
                cfgRenderToggle({
                    id: 'toggleNotifSilenciadas',
                    title: 'Notificaciones de cuentas silenciadas',
                    desc: 'Recibe notificaciones cuando alguien que silenciaste interactúe contigo',
                    checked: cfgGetPref('silenciar_notif_cuentas', false),
                    onChange: `window.onToggleNotifSilenciadas(this.checked)`,
                }),
                cfgRenderToggle({
                    id: 'toggleNotifPalabras',
                    title: 'Notificaciones con palabras silenciadas',
                    desc: 'Recibe notificaciones incluso si contienen palabras silenciadas',
                    checked: cfgGetPref('silenciar_notif_palabras', false),
                    onChange: `window.onToggleNotifPalabras(this.checked)`,
                }),
            ].join('');
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function escapeHtml(texto) {
            if (!texto) return '';
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        // ============================================================
        // CALLBACKS
        // ============================================================
        window.onToggleNotifSilenciadas = async (value) => {
            await cfgSetPref('silenciar_notif_cuentas', value);
            cfgToast(
                value ? '🔔 Recibirás notificaciones' : '🔕 Notificaciones silenciadas',
                value ? 'success' : 'warning'
            );
        };

        window.onToggleNotifPalabras = async (value) => {
            await cfgSetPref('silenciar_notif_palabras', value);
            cfgToast(
                value ? '🔔 Recibirás notificaciones' : '🔕 Notificaciones silenciadas',
                value ? 'success' : 'warning'
            );
        };

        window.onVerSilenciadas = () => {
            if (cuentasSilenciadas.length === 0) {
                cfgToast('📭 No tienes cuentas silenciadas', 'warning');
                return;
            }
            mostrarModalCuentas('silenciadas', cuentasSilenciadas);
        };

        window.onVerBloqueadas = () => {
            if (cuentasBloqueadas.length === 0) {
                cfgToast('📭 No tienes cuentas bloqueadas', 'warning');
                return;
            }
            mostrarModalCuentas('bloqueadas', cuentasBloqueadas);
        };

        function mostrarModalCuentas(tipo, lista) {
            const overlay = document.createElement('div');
            overlay.className = 'cfg-modal-overlay';

            const titulo = tipo === 'silenciadas' ? '🔇 Cuentas silenciadas' : '🚫 Cuentas bloqueadas';

            const itemsHtml = lista.map(c => `
                <div class="cfg-item-lista">
                    <div class="icon">${c.avatar_url ? `<img src="${escapeHtml(c.avatar_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : '◈'}</div>
                    <div class="info">
                        <div class="nombre">${escapeHtml(c.nombre || 'Usuario')}</div>
                        <div class="handle">@${escapeHtml(c.handle || 'usuario')}</div>
                    </div>
                    <button class="btn-eliminar" onclick="window.onDesbloquearCuenta('${c.cuenta_id}', '${tipo}')">Quitar</button>
                </div>
            `).join('');

            overlay.innerHTML = `
                <div class="cfg-modal" style="max-width: 420px; max-height: 80vh; overflow-y: auto;">
                    <h3 class="cfg-modal-title">${titulo}</h3>
                    <div style="margin: 0 -24px 16px -24px; max-height: 50vh; overflow-y: auto;">
                        ${itemsHtml}
                    </div>
                    <div class="cfg-modal-actions">
                        <button class="cfg-btn cfg-btn-outline cfg-btn-block" data-action="close">Cerrar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            requestAnimationFrame(() => overlay.classList.add('show'));

            overlay.querySelector('[data-action="close"]').onclick = () => {
                overlay.classList.remove('show');
                setTimeout(() => overlay.remove(), 200);
            };
            overlay.onclick = (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('show');
                    setTimeout(() => overlay.remove(), 200);
                }
            };
        }

        window.onDesbloquearCuenta = async (cuentaId, tipo) => {
            const ok = await cfgConfirm({
                title: tipo === 'silenciadas' ? '¿Dejar de silenciar?' : '¿Desbloquear cuenta?',
                text: 'La cuenta podrá volver a interactuar contigo.',
                confirmText: 'Sí, quitar',
                cancelText: 'Cancelar',
                danger: false,
            });

            if (!ok) return;

            try {
                const client = sb();
                if (!client) throw new Error('Supabase no disponible');

                const { error } = await client.rpc('desbloquear_cuenta', {
                    p_cuenta_id: cuentaId
                });

                if (error) throw error;

                cfgToast('✅ Cuenta removida', 'success');

                // Cerrar modal
                document.querySelectorAll('.cfg-modal-overlay').forEach(m => {
                    m.classList.remove('show');
                    setTimeout(() => m.remove(), 200);
                });

                // Recargar
                await cargarTodo();
                renderSecciones();

            } catch (e) {
                console.error('Error desbloqueando:', e);
                cfgToast('❌ Error: ' + e.message, 'error');
            }
        };

        // ============================================================
        // AGREGAR PALABRA
        // ============================================================
        window.onAgregarPalabra = () => {
            const overlay = document.createElement('div');
            overlay.className = 'cfg-modal-overlay';

            overlay.innerHTML = `
                <div class="cfg-modal" style="max-width: 380px;">
                    <h3 class="cfg-modal-title">📝 Agregar palabra</h3>
                    <p class="cfg-modal-text" style="text-align:left;margin-bottom:12px;">
                        Las publicaciones que contengan esta palabra se ocultarán de tu feed.
                    </p>
                    <div class="form-group" style="margin-bottom:14px;">
                        <label style="display:block;font-size:0.72rem;color:var(--cfg-text-muted);margin-bottom:6px;">Tipo</label>
                        <select id="tipoPalabra" style="width:100%;padding:10px 14px;background:rgba(0,0,0,0.3);border:1px solid var(--cfg-border);border-radius:10px;color:var(--cfg-text);font-size:0.85rem;outline:none;">
                            <option value="palabra">Palabra</option>
                            <option value="hashtag">Hashtag</option>
                            <option value="frase">Frase</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom:16px;">
                        <label style="display:block;font-size:0.72rem;color:var(--cfg-text-muted);margin-bottom:6px;">Texto</label>
                        <input type="text" id="textoPalabra" placeholder="Ej: spam" maxlength="50" style="width:100%;padding:10px 14px;background:rgba(0,0,0,0.3);border:1px solid var(--cfg-border);border-radius:10px;color:var(--cfg-text);font-size:0.85rem;outline:none;" />
                    </div>
                    <div class="cfg-modal-actions">
                        <button class="cfg-btn cfg-btn-outline" data-action="cancel">Cancelar</button>
                        <button class="cfg-btn cfg-btn-primary" data-action="save">Agregar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            requestAnimationFrame(() => overlay.classList.add('show'));

            const input = overlay.querySelector('#textoPalabra');
            setTimeout(() => input.focus(), 300);

            const close = () => {
                overlay.classList.remove('show');
                setTimeout(() => overlay.remove(), 200);
            };

            overlay.querySelector('[data-action="cancel"]').onclick = close;
            overlay.onclick = (e) => { if (e.target === overlay) close(); };

            overlay.querySelector('[data-action="save"]').onclick = async () => {
                const tipo = overlay.querySelector('#tipoPalabra').value;
                const palabra = input.value.trim();

                if (!palabra) {
                    cfgToast('⚠️ Escribe una palabra', 'warning');
                    return;
                }

                try {
                    const client = sb();
                    if (!client) throw new Error('Supabase no disponible');

                    const { error } = await client.rpc('agregar_palabra_silenciada', {
                        p_palabra: palabra,
                        p_tipo: tipo
                    });

                    if (error) throw error;

                    cfgToast(`✅ "${palabra}" silenciada`, 'success');
                    close();

                    await cargarPalabrasSilenciadas();
                    renderSecciones();

                } catch (e) {
                    console.error('Error agregando palabra:', e);
                    cfgToast('❌ Error: ' + e.message, 'error');
                }
            };
        };

        window.onEliminarPalabra = async (id) => {
            const ok = await cfgConfirm({
                title: '¿Eliminar palabra silenciada?',
                text: 'Dejarás de ocultar publicaciones con esta palabra.',
                confirmText: 'Eliminar',
                cancelText: 'Cancelar',
                danger: true,
            });

            if (!ok) return;

            try {
                const client = sb();
                if (!client) throw new Error('Supabase no disponible');

                const { error } = await client.rpc('eliminar_palabra_silenciada', {
                    p_id: id
                });

                if (error) throw error;

                cfgToast('✅ Palabra eliminada', 'success');

                await cargarPalabrasSilenciadas();
                renderSecciones();

            } catch (e) {
                console.error('Error eliminando palabra:', e);
                cfgToast('❌ Error: ' + e.message, 'error');
            }
        };

        // ============================================================
        // INICIALIZAR
        // ============================================================
        window.addEventListener('DOMContentLoaded', async () => {
            await new Promise(resolve => setTimeout(resolve, 400));
            
            // Renderizar primero con placeholders
            renderSecciones();

            // Cargar datos desde Supabase
            await cargarTodo();

            // Re-renderizar con datos reales
            renderSecciones();
        });

        // ============================================================
        // CARGAR HANDLE EN SUBTITLE
        // ============================================================
        (async function cargarUsuario() {
            try {
                const client = sb();
                if (!client) return;
                const { data } = await client.auth.getSession();
                const session = data && data.session;
                if (!session) return;
                const handle = session.user.email ? session.user.email.split('@')[0] : 'usuario';
                const subEl = document.querySelector('.cfg-header-subtitle');
                if (subEl) subEl.textContent = '@' + handle;
            } catch (e) { /* silencioso */ }
        })();

    })();
    </script>
</body>
</html>
