<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Acerca de tu cuenta · Sariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../../shared/config-layout.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        (function () {
            'use strict';

            window.__sarielsAuthenticated = null;
            window.supabaseClient = window.supabaseClient || null;
            window.supabaseReady = null;

            window.getSupabaseClient = function () {
                return window.supabaseReady;
            };

            function esRutaInternaSegura(valor) {
                if (typeof valor !== 'string') return false;
                if (!valor.startsWith('/')) return false;
                if (valor.startsWith('//')) return false;
                if (valor.startsWith('/\\')) return false;
                return true;
            }

            function revelarPagina() {
                document.documentElement.classList.add('auth-ready');
            }

            function irAlIndexConReturnTo() {
                try {
                    var returnTo = window.location.pathname + window.location.search + window.location.hash;
                    if (esRutaInternaSegura(returnTo)) {
                        localStorage.setItem('wallet_returnTo', returnTo);
                    }
                    window.location.replace('/');
                } catch (e) {
                    window.location.replace('/');
                }
            }

            var salvaguarda = setTimeout(function () {
                console.warn('[Ubicacion] Salvaguarda activada.');
                revelarPagina();
            }, 10000);

            async function inicializarSupabase() {
                try {
                    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                        throw new Error('Supabase SDK no disponible.');
                    }

                    if (!window.supabaseClient) {
                        var supabaseUrl = null;
                        var supabaseAnonKey = null;

                        try {
                            const response = await fetch('/api/config/public', {
                                method: 'GET',
                                credentials: 'same-origin',
                                cache: 'no-store',
                                headers: { 'Accept': 'application/json' }
                            });

                            if (response.ok) {
                                const config = await response.json();
                                supabaseUrl = config && config.supabaseUrl;
                                supabaseAnonKey = config && config.supabaseAnonKey;
                            }
                        } catch (fetchErr) {
                            console.warn('[Ubicacion] fetch /api/config/public falló:', fetchErr);
                        }

                        if (!supabaseUrl || !supabaseAnonKey) {
                            throw new Error('Configuración pública de Supabase no disponible.');
                        }

                        window.SupabaseSDK = window.supabase;

                        window.supabaseClient = window.SupabaseSDK.createClient(
                            supabaseUrl,
                            supabaseAnonKey,
                            { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
                        );
                    }

                    const resultado = await window.supabaseClient.auth.getSession();
                    const session = resultado && resultado.data ? resultado.data.session : null;

                    window.__sarielsAuthenticated = !!session;

                    clearTimeout(salvaguarda);

                    if (!session) {
                        irAlIndexConReturnTo();
                    } else {
                        revelarPagina();
                    }

                    return window.supabaseClient;
                } catch (error) {
                    console.error('[Ubicacion] Error inicializando Supabase:', error);
                    window.__sarielsAuthenticated = false;
                    clearTimeout(salvaguarda);
                    revelarPagina();
                    return null;
                }
            }

            window.supabaseReady = inicializarSupabase();
        })();
    </script>

    <style>
        html:not(.auth-ready) body { visibility: hidden; }
        html.auth-ready body { visibility: visible; }

        .cfg-ubicacion-card {
            margin: 0 16px 16px 16px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.06), rgba(15, 45, 26, 0.3));
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 16px;
            text-align: center;
        }
        .cfg-ubicacion-card .icon-grande {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.3));
        }
        .cfg-ubicacion-card .ciudad {
            font-family: 'Orbitron', monospace;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--cfg-text);
            margin-bottom: 4px;
        }
        .cfg-ubicacion-card .coords {
            font-family: monospace;
            font-size: 0.72rem;
            color: var(--cfg-text-muted);
            margin-bottom: 8px;
        }
        .cfg-ubicacion-card .fecha {
            font-size: 0.68rem;
            color: var(--cfg-text-dim);
        }
        .cfg-ubicacion-card .sin-ubicacion {
            color: var(--cfg-text-muted);
            font-size: 0.8rem;
        }
        .cfg-ubicacion-card .aviso-direccion {
            margin-top: 8px;
            font-size: 0.68rem;
            color: var(--cfg-text-muted);
        }
        .cfg-loading-mini {
            padding: 20px;
            text-align: center;
            color: var(--cfg-text-muted);
            font-size: 0.75rem;
        }
    </style>
</head>
<body class="cfg-page">

    <div id="cfgHeaderSlot"></div>

    <main class="cfg-content">

        <h2 class="cfg-section-title">Ubicación actual</h2>
        <div id="ubicacionContainer">
            <div class="cfg-loading-mini">⏳ Cargando ubicación...</div>
        </div>

        <h2 class="cfg-section-title">Ubicación de publicaciones</h2>
        <div class="cfg-list" id="seccionPublicaciones"></div>

        <h2 class="cfg-section-title">Datos de ubicación</h2>
        <div class="cfg-list" id="seccionDatos"></div>

        <div class="cfg-aviso">
            ℹ️ Tu ubicación se convierte en ciudad con Google Maps. Sariel's nunca la comparte con terceros sin tu permiso.
        </div>

        <div class="cfg-footer">
            <strong>◈ Sariel's</strong> · Privacidad · Acerca de tu cuenta
        </div>
    </main>

    <script src="../../../shared/config-icons.js"></script>
    <script src="../../../shared/config-layout.js"></script>

    <script>
    (function () {
        'use strict';

        const $ = (sel) => document.querySelector(sel);

        async function esperarCliente() {
            const inicio = Date.now();
            while (Date.now() - inicio < 10000) {
                if (window.supabaseClient) return window.supabaseClient;
                await new Promise(r => setTimeout(r, 100));
            }
            return null;
        }

        cfgInitPage({
            title: 'Acerca de tu cuenta',
            subtitle: '',
            backUrl: '/features/perfil/configuracion/index.html',
        });

        const PREF_KEYS = {
            ubicacion_posts: 'ubicacion_en_publicaciones',
            ubicacion_precisa: 'ubicacion_precisa',
            ubicacion_historial: 'ubicacion_guardar_historial',
        };

        /* ============================================================
           UBICACIÓN ACTUAL
        ============================================================ */
        async function cargarUltimaUbicacion() {
            try {
                const client = await esperarCliente();
                if (!client) return renderUbicacionVacia();

                const { data, error } = await client.rpc('obtener_ultima_ubicacion');

                if (error) {
                    console.warn('Error RPC obtener_ultima_ubicacion:', error.message);
                    return renderUbicacionVacia();
                }

                const ubicacion = Array.isArray(data) ? (data[0] || null) : data;

                if (ubicacion) renderUbicacionReal(ubicacion);
                else renderUbicacionVacia();
            } catch (e) {
                console.warn('Error cargando ubicación:', e && e.message);
                renderUbicacionVacia();
            }
        }

        function renderUbicacionReal(u) {
            const container = $('#ubicacionContainer');
            if (!container) return;

            const ciudad = u.ciudad || u.municipio || null;
            const estado = u.estado_region || '';
            const pais = u.pais && u.pais !== 'Desconocido' ? u.pais : '';

            const titulo = ciudad
                ? escapeHtml(ciudad) + (estado ? ', ' + escapeHtml(estado) : '')
                : 'Ubicación guardada';

            const coords = (u.latitud != null && u.longitud != null)
                ? Number(u.latitud).toFixed(4) + ', ' + Number(u.longitud).toFixed(4)
                : '';

            const fecha = u.created_at
                ? new Date(u.created_at).toLocaleString('es-MX', {
                    day: '2-digit', month: 'short', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                })
                : '';

            const precision = u.precision === 'exacta' ? 'Precisión exacta' : 'Precisión aproximada (~1 km)';

            container.innerHTML = `
                <div class="cfg-ubicacion-card">
                    <span class="icon-grande">📍</span>
                    <div class="ciudad">${titulo}</div>
                    ${pais ? `<div class="coords">${escapeHtml(pais)}</div>` : ''}
                    <div class="coords">${escapeHtml(coords)}</div>
                    <div class="fecha">${escapeHtml(precision)} · ${escapeHtml(fecha)}</div>
                    ${!ciudad ? '<div class="aviso-direccion">No pudimos obtener el nombre de tu ciudad. Intenta actualizar más tarde.</div>' : ''}
                </div>
            `;
        }

        function renderUbicacionVacia() {
            const container = $('#ubicacionContainer');
            if (!container) return;

            container.innerHTML = `
                <div class="cfg-ubicacion-card">
                    <span class="icon-grande">📍</span>
                    <div class="sin-ubicacion">Sin ubicación guardada</div>
                    <div class="coords" style="margin-top:8px;">Toca "Actualizar mi ubicación ahora" para empezar</div>
                </div>
            `;
        }

        /* ============================================================
           RENDER DE OPCIONES
        ============================================================ */
        function renderSecciones() {
            $('#seccionPublicaciones').innerHTML = [
                cfgRenderToggle({
                    id: 'toggleUbicacionPosts',
                    title: 'Mostrar ubicación en mis publicaciones',
                    desc: 'Añade tu ciudad a las publicaciones que crees',
                    checked: cfgGetPref(PREF_KEYS.ubicacion_posts, false),
                    onChange: `window.onToggleUbicacionPosts(this.checked)`,
                }),
                cfgRenderToggle({
                    id: 'toggleUbicacionPrecisa',
                    title: 'Usar ubicación precisa',
                    desc: 'Usa tu ubicación exacta en lugar de una aproximada (~1 km)',
                    checked: cfgGetPref(PREF_KEYS.ubicacion_precisa, false),
                    onChange: `window.onToggleUbicacionPrecisa(this.checked)`,
                }),
            ].join('');

            $('#seccionDatos').innerHTML = [
                cfgRenderToggle({
                    id: 'toggleUbicacionHistorial',
                    title: 'Guardar historial de ubicaciones',
                    desc: 'Si lo apagas, solo se conserva tu última ubicación',
                    checked: cfgGetPref(PREF_KEYS.ubicacion_historial, true),
                    onChange: `window.onToggleHistorial(this.checked)`,
                }),
                cfgRenderItem({
                    icon: 'search',
                    title: 'Actualizar mi ubicación ahora',
                    desc: 'Obtén tu ubicación actual y guárdala',
                    onclick: 'window.onActualizarUbicacion()',
                }),
                cfgRenderItem({
                    icon: 'ban',
                    title: 'Eliminar historial de ubicaciones',
                    desc: 'Borra todas las ubicaciones guardadas de tu cuenta',
                    onclick: 'window.onEliminarHistorial()',
                    style: 'color: var(--cfg-danger, #ff3366);',
                }),
            ].join('');
        }

        function escapeHtml(texto) {
            if (!texto) return '';
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        /* ============================================================
           OBTENER POSICIÓN Y GUARDAR (vía servidor, con Google)
        ============================================================ */
        function obtenerPosicion(precisa) {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Tu dispositivo no soporta geolocalización'));
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve(pos.coords),
                    () => reject(new Error('Permiso de ubicación denegado o no disponible')),
                    { enableHighAccuracy: precisa, timeout: 15000, maximumAge: 60000 }
                );
            });
        }

        async function guardarUbicacion() {
            const precisa = cfgGetPref(PREF_KEYS.ubicacion_precisa, false) === true;
            const historial = cfgGetPref(PREF_KEYS.ubicacion_historial, true) !== false;

            const coords = await obtenerPosicion(precisa);

            const client = await esperarCliente();
            if (!client) throw new Error('Supabase no disponible');

            const { data: sd } = await client.auth.getSession();
            const token = sd && sd.session ? sd.session.access_token : null;
            if (!token) throw new Error('Inicia sesión');

            const respuesta = await fetch('/api/geo/ubicacion', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    lat: coords.latitude,
                    lng: coords.longitude,
                    precision: precisa ? 'exacta' : 'aproximada',
                    guardar_historial: historial
                })
            });

            const datos = await respuesta.json().catch(() => ({}));

            if (respuesta.status === 429) throw new Error('Demasiadas solicitudes. Espera un minuto.');
            if (!respuesta.ok || !datos.success) throw new Error('No se pudo guardar tu ubicación');

            return datos;
        }

        /* ============================================================
           CALLBACKS
        ============================================================ */
        window.onToggleUbicacionPosts = async (value) => {
            if (!value) {
                await cfgSetPref(PREF_KEYS.ubicacion_posts, false);
                cfgToast('🚫 Ubicación removida de tus publicaciones', 'warning');
                return;
            }

            try {
                await guardarUbicacion();
                await cfgSetPref(PREF_KEYS.ubicacion_posts, true);
                cfgToast('📍 Ubicación activada en publicaciones', 'success');
                await cargarUltimaUbicacion();
            } catch (e) {
                const t = document.getElementById('toggleUbicacionPosts');
                if (t) t.checked = false;
                cfgToast('⚠️ ' + e.message, 'warning');
            }
        };

        window.onToggleUbicacionPrecisa = async (value) => {
            await cfgSetPref(PREF_KEYS.ubicacion_precisa, value);
            cfgToast(
                value ? '🎯 Ubicación precisa activada' : '📍 Usando ubicación aproximada (~1 km)',
                value ? 'success' : 'warning'
            );
        };

        window.onToggleHistorial = async (value) => {
            await cfgSetPref(PREF_KEYS.ubicacion_historial, value);
            cfgToast(
                value ? '📚 Historial de ubicaciones activado' : '🚫 Solo se conservará tu última ubicación',
                value ? 'success' : 'warning'
            );
        };

        window.onActualizarUbicacion = async () => {
            cfgToast('📍 Obteniendo tu ubicación...', '', 2000);
            try {
                const datos = await guardarUbicacion();
                if (datos.aviso === 'sin_direccion') {
                    cfgToast('📍 Ubicación guardada, sin nombre de ciudad por ahora', 'warning');
                } else {
                    cfgToast('✅ Ubicación actualizada', 'success');
                }
                await cargarUltimaUbicacion();
            } catch (e) {
                cfgToast('⚠️ ' + e.message, 'warning');
            }
        };

        window.onEliminarHistorial = async () => {
            const ok = await cfgConfirm({
                title: '¿Eliminar historial de ubicaciones?',
                text: 'Esta acción borrará todas las ubicaciones guardadas de tu cuenta. No se puede deshacer.',
                confirmText: 'Eliminar todo',
                cancelText: 'Cancelar',
                danger: true,
            });

            if (!ok) return;

            try {
                const client = await esperarCliente();
                if (!client) throw new Error('Supabase no disponible');

                const { error } = await client.rpc('eliminar_historial_ubicaciones');
                if (error) throw error;

                cfgToast('✅ Historial de ubicaciones eliminado', 'success');
                await cargarUltimaUbicacion();
            } catch (e) {
                console.error('Error eliminando historial:', e);
                cfgToast('❌ Error: ' + e.message, 'error');
            }
        };

        /* ============================================================
           SUBTÍTULO: handle real del usuario (no el correo)
        ============================================================ */
        async function cargarHandleSubtitulo() {
            try {
                const client = await esperarCliente();
                if (!client) return;

                const { data: sd } = await client.auth.getSession();
                if (!sd || !sd.session) return;

                const { data } = await client.rpc('mi_perfil_privado');
                const perfil = Array.isArray(data) ? data[0] : data;
                const handle = perfil && (perfil.handle || perfil.username);

                const subEl = document.querySelector('.cfg-header-subtitle');
                if (subEl && handle) subEl.textContent = '@' + handle;
            } catch (e) { /* silencioso */ }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await new Promise(resolve => setTimeout(resolve, 400));
            renderSecciones();
            await cargarUltimaUbicacion();
            cargarHandleSubtitulo();
        });

    })();
    </script>
</body>
</html>
