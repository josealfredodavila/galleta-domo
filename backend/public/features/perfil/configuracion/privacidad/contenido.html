<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Contenido que ves · Sariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../../shared/config-layout.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        (function () {
            'use strict';

            window.__sarielsAuthenticated = null;
            window.supabaseClient = window.supabaseClient || null;
            window.supabaseReady = null;

            window.getSupabaseClient = function () {
                return window.supabaseReady;
            };

            function esRutaInternaSegura(valor) {
                if (typeof valor !== 'string') return false;
                if (!valor.startsWith('/')) return false;
                if (valor.startsWith('//')) return false;
                if (valor.startsWith('/\\')) return false;
                return true;
            }

            function revelarPagina() {
                document.documentElement.classList.add('auth-ready');
            }

            function irAlIndexConReturnTo() {
                try {
                    var returnTo = window.location.pathname + window.location.search + window.location.hash;
                    if (esRutaInternaSegura(returnTo)) {
                        localStorage.setItem('wallet_returnTo', returnTo);
                    }
                    window.location.replace('/');
                } catch (e) {
                    window.location.replace('/');
                }
            }

            var salvaguarda = setTimeout(function () {
                console.warn('[Contenido] Salvaguarda activada.');
                revelarPagina();
            }, 10000);

            async function inicializarSupabase() {
                try {
                    if (
                        !window.supabase ||
                        typeof window.supabase.createClient !== 'function'
                    ) {
                        throw new Error('Supabase SDK no disponible.');
                    }

                    if (!window.supabaseClient) {
                        var supabaseUrl = null;
                        var supabaseAnonKey = null;

                        try {
                            const response = await fetch('/api/config/public', {
                                method: 'GET',
                                credentials: 'same-origin',
                                cache: 'no-store',
                                headers: { 'Accept': 'application/json' }
                            });

                            if (response.ok) {
                                const config = await response.json();
                                supabaseUrl = config && config.supabaseUrl;
                                supabaseAnonKey = config && config.supabaseAnonKey;
                            }
                        } catch (fetchErr) {
                            console.warn('[Contenido] fetch /api/config/public falló:', fetchErr);
                        }

                        if (!supabaseUrl || !supabaseAnonKey) {
                            throw new Error('Configuración pública de Supabase no disponible.');
                        }

                        window.SupabaseSDK = window.supabase;

                        window.supabaseClient = window.SupabaseSDK.createClient(
                            supabaseUrl,
                            supabaseAnonKey,
                            {
                                auth: {
                                    persistSession: true,
                                    autoRefreshToken: true,
                                    detectSessionInUrl: true
                                }
                            }
                        );
                    }

                    const resultado = await window.supabaseClient.auth.getSession();
                    const session = resultado && resultado.data ? resultado.data.session : null;

                    window.__sarielsAuthenticated = !!session;

                    clearTimeout(salvaguarda);

                    if (!session) {
                        irAlIndexConReturnTo();
                    } else {
                        revelarPagina();
                    }

                    return window.supabaseClient;
                } catch (error) {
                    console.error('[Contenido] Error inicializando Supabase:', error);
                    window.__sarielsAuthenticated = false;
                    clearTimeout(salvaguarda);
                    revelarPagina();
                    return null;
                }
            }

            window.supabaseReady = inicializarSupabase();
        })();
    </script>

    <style>
        html:not(.auth-ready) body {
            visibility: hidden;
        }
        html.auth-ready body {
            visibility: visible;
        }

        /* ============================================================
           MODAL DE TEMAS E IDIOMAS
           ============================================================ */
        .sariels-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .sariels-modal-overlay.active {
            display: flex;
        }
        .sariels-modal {
            background: rgba(15, 25, 20, 0.98);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .sariels-modal-header {
            padding: 20px 22px 14px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .sariels-modal-header h3 {
            font-family: 'Orbitron', monospace;
            color: #D4AF37;
            font-size: 1rem;
            letter-spacing: 0.5px;
            margin: 0;
        }
        .sariels-modal-close {
            background: transparent;
            border: none;
            color: #8aa8b8;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 8px;
            line-height: 1;
        }
        .sariels-modal-close:hover {
            color: #D4AF37;
        }
        .sariels-modal-search {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }
        .sariels-modal-search input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 10px;
            color: #f0f4f8;
            font-size: 0.85rem;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .sariels-modal-search input:focus {
            border-color: #D4AF37;
        }
        .sariels-modal-body {
            padding: 14px 20px;
            overflow-y: auto;
            flex: 1;
        }
        .sariels-tema-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .sariels-tema-item:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.25);
        }
        .sariels-tema-item.selected {
            background: rgba(212, 175, 55, 0.15);
            border-color: #D4AF37;
        }
        .sariels-tema-emoji {
            font-size: 1.5rem;
            flex-shrink: 0;
            width: 32px;
            text-align: center;
        }
        .sariels-tema-nombre {
            flex: 1;
            color: #f0f4f8;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .sariels-tema-check {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            color: transparent;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .sariels-tema-item.selected .sariels-tema-check {
            background: #D4AF37;
            border-color: #D4AF37;
            color: #05080f;
        }
        .sariels-modal-footer {
            padding: 14px 20px 18px;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .sariels-modal-contador {
            flex: 1;
            color: #8aa8b8;
            font-size: 0.75rem;
        }
        .sariels-modal-btn-cancel {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: #c0d8e8;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }
        .sariels-modal-btn-cancel:hover {
            border-color: #D4AF37;
            color: #D4AF37;
        }
        .sariels-modal-btn-save {
            background: linear-gradient(135deg, #D4AF37, #b8923a);
            color: #05080f;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .sariels-modal-btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .sariels-modal-loading {
            text-align: center;
            padding: 40px 20px;
            color: #8aa8b8;
            font-size: 0.85rem;
        }
        .sariels-modal-empty {
            text-align: center;
            padding: 40px 20px;
            color: #8aa8b8;
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="cfg-page">

    <div id="cfgHeaderSlot"></div>

    <main class="cfg-content">

        <h2 class="cfg-section-title">Intereses</h2>
        <div class="cfg-list" id="seccionIntereses"></div>

        <h2 class="cfg-section-title">Idioma del contenido</h2>
        <div class="cfg-list" id="seccionIdiomaContenido"></div>

        <h2 class="cfg-section-title">Filtros de contenido</h2>
        <div class="cfg-list" id="seccionFiltros"></div>

        <h2 class="cfg-section-title">Calidad de imágenes y videos</h2>
        <div class="cfg-list" id="seccionCalidad"></div>

        <div class="cfg-aviso">
            ℹ️ Los cambios se sincronizan en todos tus dispositivos.
        </div>

        <div class="cfg-footer">
            <strong>◈ Sariel's</strong> · Privacidad · Contenido que ves
        </div>
    </main>

    <!-- ============================================================
         MODAL DE TEMAS / IDIOMAS
         ============================================================ -->
    <div class="sariels-modal-overlay" id="sarielsModal">
        <div class="sariels-modal">
            <div class="sariels-modal-header">
                <h3 id="sarielsModalTitulo">Temas que me interesan</h3>
                <button class="sariels-modal-close" onclick="cerrarModalTemas()" aria-label="Cerrar">×</button>
            </div>
            <div class="sariels-modal-search">
                <input type="text" id="sarielsModalSearch" placeholder="Buscar..." autocomplete="off" />
            </div>
            <div class="sariels-modal-body" id="sarielsModalBody">
                <div class="sariels-modal-loading">Cargando...</div>
            </div>
            <div class="sariels-modal-footer">
                <span class="sariels-modal-contador" id="sarielsModalContador">0 seleccionados</span>
                <button class="sariels-modal-btn-cancel" onclick="cerrarModalTemas()">Cancelar</button>
                <button class="sariels-modal-btn-save" id="sarielsModalBtnGuardar" onclick="guardarSeleccionTemas()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="../../../shared/config-icons.js"></script>
    <script src="../../../shared/config-layout.js"></script>

    <script>
    (function () {
        'use strict';

        const $ = (sel) => document.querySelector(sel);

        async function esperarCliente() {
            const inicio = Date.now();
            while (Date.now() - inicio < 10000) {
                if (window.supabaseClient) return window.supabaseClient;
                await new Promise(r => setTimeout(r, 100));
            }
            return null;
        }

        cfgInitPage({
            title: 'Contenido que ves',
            subtitle: '@tu_usuario',
            backUrl: '/features/perfil/configuracion/index.html',
        });

        const PREF_KEYS = {
            contenido_sensible: 'contenido_mostrar_sensible',
            contenido_auto_reproducir: 'contenido_auto_reproducir',
            contenido_imagenes_alta: 'contenido_imagenes_alta_calidad',
            contenido_videos_alta: 'contenido_videos_alta_calidad',
            contenido_ahorrador: 'contenido_ahorrador_datos',
        };

        function renderSecciones() {
            $('#seccionIntereses').innerHTML = [
                cfgRenderItem({
                    icon: 'search',
                    title: 'Temas que me interesan',
                    desc: 'Personaliza el contenido que ves según tus intereses',
                    onclick: 'window.onConfigurarIntereses()',
                }),
                cfgRenderItem({
                    icon: 'ban',
                    title: 'Temas que no me interesan',
                    desc: 'Oculta contenido relacionado con ciertos temas',
                    onclick: 'window.onConfigurarNoIntereses()',
                }),
            ].join('');

            $('#seccionIdiomaContenido').innerHTML = [
                cfgRenderItem({
                    icon: 'globe',
                    title: 'Idiomas del contenido',
                    desc: 'Elige en qué idiomas quieres ver el contenido',
                    onclick: 'window.onConfigurarIdiomasContenido()',
                }),
            ].join('');

            $('#seccionFiltros').innerHTML = [
                cfgRenderToggle({
                    id: 'toggleSensible',
                    title: 'Mostrar contenido sensible',
                    desc: 'Incluye contenido marcado como sensible en tu feed',
                    checked: cfgGetPref(PREF_KEYS.contenido_sensible, false),
                    onChange: `window.onToggleSensible(this.checked)`,
                }),
                cfgRenderToggle({
                    id: 'toggleAhorrador',
                    title: 'Ahorrador de datos',
                    desc: 'No reproduce videos automáticamente y carga imágenes en calidad reducida',
                    checked: cfgGetPref(PREF_KEYS.contenido_ahorrador, false),
                    onChange: `window.onToggleAhorrador(this.checked)`,
                }),
            ].join('');

            $('#seccionCalidad').innerHTML = [
                cfgRenderToggle({
                    id: 'toggleImgAlta',
                    title: 'Imágenes en alta calidad',
                    desc: 'Carga automáticamente las imágenes en alta calidad (hasta 4K)',
                    checked: cfgGetPref(PREF_KEYS.contenido_imagenes_alta, true),
                    onChange: `window.onToggleImgAlta(this.checked)`,
                }),
                cfgRenderToggle({
                    id: 'toggleVidAlta',
                    title: 'Video en alta calidad',
                    desc: 'Usa la mejor calidad disponible para reproducción de video',
                    checked: cfgGetPref(PREF_KEYS.contenido_videos_alta, true),
                    onChange: `window.onToggleVidAlta(this.checked)`,
                }),
                cfgRenderToggle({
                    id: 'toggleAutoPlay',
                    title: 'Reproducción automática de video',
                    desc: 'Los videos se reproducen automáticamente al aparecer en pantalla',
                    checked: cfgGetPref(PREF_KEYS.contenido_auto_reproducir, true),
                    onChange: `window.onToggleAutoPlay(this.checked)`,
                }),
            ].join('');
        }

        window.onToggleSensible = async (value) => {
            await cfgSetPref(PREF_KEYS.contenido_sensible, value);
            cfgToast(
                value ? '👁️ Contenido sensible visible' : '🚫 Contenido sensible oculto',
                value ? 'warning' : 'success'
            );
        };

        window.onToggleAhorrador = async (value) => {
            await cfgSetPref(PREF_KEYS.contenido_ahorrador, value);
            cfgToast(
                value ? '📉 Ahorrador de datos activado' : '📈 Ahorrador de datos desactivado',
                value ? 'success' : ''
            );
        };

        window.onToggleImgAlta = async (value) => {
            await cfgSetPref(PREF_KEYS.contenido_imagenes_alta, value);
            cfgToast(
                value ? '🖼️ Imágenes en alta calidad' : '📉 Imágenes en calidad reducida',
                value ? 'success' : ''
            );
        };

        window.onToggleVidAlta = async (value) => {
            await cfgSetPref(PREF_KEYS.contenido_videos_alta, value);
            cfgToast(
                value ? '🎬 Video en alta calidad' : '📉 Video en calidad reducida',
                value ? 'success' : ''
            );
        };

        window.onToggleAutoPlay = async (value) => {
            await cfgSetPref(PREF_KEYS.contenido_auto_reproducir, value);
            cfgToast(
                value ? '▶️ Reproducción automática activada' : '⏸️ Reproducción automática desactivada',
                value ? 'success' : ''
            );
        };

        // ============================================================
        // MODAL DE TEMAS E IDIOMAS - LÓGICA
        // ============================================================

        var modalEstado = {
            tipo: null,          // 'interes' | 'bloqueado' | 'idioma'
            items: [],           // lista completa de temas o idiomas
            seleccionados: new Set(),
            guardando: false
        };

        window.onConfigurarIntereses = () => {
            abrirModalTemas('interes');
        };

        window.onConfigurarNoIntereses = () => {
            abrirModalTemas('bloqueado');
        };

        window.onConfigurarIdiomasContenido = () => {
            abrirModalIdiomas();
        };

        async function abrirModalTemas(tipo) {
            var client = await esperarCliente();
            if (!client) {
                cfgToast('❌ Sin conexión', 'error');
                return;
            }

            var sessionResult = await client.auth.getSession();
            var session = sessionResult && sessionResult.data ? sessionResult.data.session : null;
            if (!session) {
                cfgToast('⚠️ Inicia sesión', 'warning');
                return;
            }

            modalEstado.tipo = tipo;
            modalEstado.guardando = false;
            modalEstado.seleccionados = new Set();
            modalEstado.items = [];

            var titulo = tipo === 'interes' ? 'Temas que me interesan' : 'Temas que no me interesan';
            document.getElementById('sarielsModalTitulo').textContent = titulo;
            document.getElementById('sarielsModalBody').innerHTML = '<div class="sariels-modal-loading">Cargando temas...</div>';
            document.getElementById('sarielsModalContador').textContent = '0 seleccionados';
            document.getElementById('sarielsModalSearch').value = '';

            document.getElementById('sarielsModal').classList.add('active');

            try {
                // Cargar temas
                var temasResult = await client
                    .from('temas')
                    .select('id, slug, nombre, emoji')
                    .eq('activo', true)
                    .order('orden', { ascending: true });

                if (temasResult.error) throw temasResult.error;
                modalEstado.items = temasResult.data || [];

                // Cargar selección actual del usuario
                var tabla = tipo === 'interes' ? 'usuarios_temas_interes' : 'usuarios_temas_bloqueados';
                var selResult = await client
                    .from(tabla)
                    .select('tema_id')
                    .eq('usuario_id', session.user.id);

                if (selResult.error) throw selResult.error;
                (selResult.data || []).forEach(function (row) {
                    modalEstado.seleccionados.add(row.tema_id);
                });

                renderListaTemas();
            } catch (e) {
                console.error('Error cargando temas:', e);
                document.getElementById('sarielsModalBody').innerHTML =
                    '<div class="sariels-modal-empty">❌ Error al cargar: ' + (e.message || 'Desconocido') + '</div>';
            }
        }

        function renderListaTemas() {
            var body = document.getElementById('sarielsModalBody');
            var busqueda = (document.getElementById('sarielsModalSearch').value || '').toLowerCase().trim();

            var filtrados = modalEstado.items.filter(function (t) {
                if (!busqueda) return true;
                return (t.nombre || '').toLowerCase().indexOf(busqueda) !== -1 ||
                       (t.slug || '').toLowerCase().indexOf(busqueda) !== -1;
            });

            if (filtrados.length === 0) {
                body.innerHTML = '<div class="sariels-modal-empty">Sin resultados</div>';
                return;
            }

            body.innerHTML = filtrados.map(function (t) {
                var selected = modalEstado.seleccionados.has(t.id);
                return '<div class="sariels-tema-item' + (selected ? ' selected' : '') + '" data-id="' + t.id + '">' +
                    '<span class="sariels-tema-emoji">' + (t.emoji || '◈') + '</span>' +
                    '<span class="sariels-tema-nombre">' + (t.nombre || t.slug || '') + '</span>' +
                    '<span class="sariels-tema-check">✓</span>' +
                '</div>';
            }).join('');

            // Conectar click
            body.querySelectorAll('.sariels-tema-item').forEach(function (el) {
                el.addEventListener('click', function () {
                    toggleSeleccionTema(el.dataset.id, el);
                });
            });

            actualizarContador();
        }

        function toggleSeleccionTema(id, el) {
            if (modalEstado.seleccionados.has(id)) {
                modalEstado.seleccionados.delete(id);
                el.classList.remove('selected');
            } else {
                modalEstado.seleccionados.add(id);
                el.classList.add('selected');
            }
            actualizarContador();
        }

        function actualizarContador() {
            var n = modalEstado.seleccionados.size;
            document.getElementById('sarielsModalContador').textContent =
                n + ' seleccionado' + (n !== 1 ? 's' : '');
        }

        window.cerrarModalTemas = function () {
            document.getElementById('sarielsModal').classList.remove('active');
            modalEstado.items = [];
            modalEstado.seleccionados = new Set();
            modalEstado.tipo = null;
        };

        window.guardarSeleccionTemas = async function () {
            if (modalEstado.guardando) return;
            if (!modalEstado.tipo) return;

            var client = await esperarCliente();
            if (!client) return;

            var sessionResult = await client.auth.getSession();
            var session = sessionResult && sessionResult.data ? sessionResult.data.session : null;
            if (!session) return;

            modalEstado.guardando = true;
            var btn = document.getElementById('sarielsModalBtnGuardar');
            btn.disabled = true;
            btn.textContent = '⏳';

            var tabla = modalEstado.tipo === 'interes' ? 'usuarios_temas_interes' : 'usuarios_temas_bloqueados';

            try {
                // 1. Borrar la selección actual
                var del = await client
                    .from(tabla)
                    .delete()
                    .eq('usuario_id', session.user.id);
                if (del.error) throw del.error;

                // 2. Insertar la nueva selección (si hay)
                var ids = Array.from(modalEstado.seleccionados);
                if (ids.length > 0) {
                    var rows = ids.map(function (temaId) {
                        return { usuario_id: session.user.id, tema_id: temaId };
                    });
                    var ins = await client.from(tabla).insert(rows);
                    if (ins.error) throw ins.error;
                }

                cfgToast('✅ Guardado correctamente', 'success');
                window.cerrarModalTemas();
            } catch (e) {
                console.error('Error guardando:', e);
                cfgToast('❌ Error: ' + (e.message || 'Desconocido'), 'error');
            } finally {
                modalEstado.guardando = false;
                btn.disabled = false;
                btn.textContent = 'Guardar';
            }
        };

        // ============================================================
        // MODAL DE IDIOMAS (usa el mismo modal)
        // ============================================================

        async function abrirModalIdiomas() {
            var client = await esperarCliente();
            if (!client) {
                cfgToast('❌ Sin conexión', 'error');
                return;
            }

            var sessionResult = await client.auth.getSession();
            var session = sessionResult && sessionResult.data ? sessionResult.data.session : null;
            if (!session) {
                cfgToast('⚠️ Inicia sesión', 'warning');
                return;
            }

            modalEstado.tipo = 'idioma';
            modalEstado.guardando = false;
            modalEstado.seleccionados = new Set();
            modalEstado.items = [];

            document.getElementById('sarielsModalTitulo').textContent = 'Idiomas del contenido';
            document.getElementById('sarielsModalBody').innerHTML = '<div class="sariels-modal-loading">Cargando idiomas...</div>';
            document.getElementById('sarielsModalContador').textContent = '0 seleccionados';
            document.getElementById('sarielsModalSearch').value = '';

            document.getElementById('sarielsModal').classList.add('active');

            try {
                var idiomasResult = await client
                    .from('idiomas_sistema')
                    .select('id, codigo, nombre, nombre_nativo, bandera')
                    .eq('activo', true)
                    .order('nombre', { ascending: true });

                if (idiomasResult.error) throw idiomasResult.error;

                // Adaptamos la forma para que sea igual que los temas
                modalEstado.items = (idiomasResult.data || []).map(function (i) {
                    return {
                        id: i.id,
                        slug: i.codigo,
                        nombre: (i.bandera || '🌐') + ' ' + (i.nombre_nativo || i.nombre || i.codigo),
                        emoji: i.bandera || '🌐'
                    };
                });

                var selResult = await client
                    .from('usuarios_idiomas_contenido')
                    .select('idioma_id')
                    .eq('usuario_id', session.user.id);

                if (selResult.error) throw selResult.error;
                (selResult.data || []).forEach(function (row) {
                    modalEstado.seleccionados.add(row.idioma_id);
                });

                renderListaTemas(); // reutiliza la misma función de render
            } catch (e) {
                console.error('Error cargando idiomas:', e);
                document.getElementById('sarielsModalBody').innerHTML =
                    '<div class="sariels-modal-empty">❌ Error al cargar: ' + (e.message || 'Desconocido') + '</div>';
            }
        }

        // Sobrescribir guardar para idiomas (la lógica cambia la tabla y el campo)
        var guardarOriginal = window.guardarSeleccionTemas;
        window.guardarSeleccionTemas = async function () {
            if (modalEstado.guardando) return;
            if (!modalEstado.tipo) return;

            var client = await esperarCliente();
            if (!client) return;

            var sessionResult = await client.auth.getSession();
            var session = sessionResult && sessionResult.data ? sessionResult.data.session : null;
            if (!session) return;

            modalEstado.guardando = true;
            var btn = document.getElementById('sarielsModalBtnGuardar');
            btn.disabled = true;
            btn.textContent = '⏳';

            try {
                if (modalEstado.tipo === 'idioma') {
                    var del2 = await client
                        .from('usuarios_idiomas_contenido')
                        .delete()
                        .eq('usuario_id', session.user.id);
                    if (del2.error) throw del2.error;

                    var ids2 = Array.from(modalEstado.seleccionados);
                    if (ids2.length > 0) {
                        var rows2 = ids2.map(function (idiomaId) {
                            return { usuario_id: session.user.id, idioma_id: idiomaId };
                        });
                        var ins2 = await client.from('usuarios_idiomas_contenido').insert(rows2);
                        if (ins2.error) throw ins2.error;
                    }
                } else {
                    var tabla = modalEstado.tipo === 'interes' ? 'usuarios_temas_interes' : 'usuarios_temas_bloqueados';
                    var del = await client.from(tabla).delete().eq('usuario_id', session.user.id);
                    if (del.error) throw del.error;

                    var ids = Array.from(modalEstado.seleccionados);
                    if (ids.length > 0) {
                        var rows = ids.map(function (temaId) {
                            return { usuario_id: session.user.id, tema_id: temaId };
                        });
                        var ins = await client.from(tabla).insert(rows);
                        if (ins.error) throw ins.error;
                    }
                }

                cfgToast('✅ Guardado correctamente', 'success');
                window.cerrarModalTemas();
            } catch (e) {
                console.error('Error guardando:', e);
                cfgToast('❌ Error: ' + (e.message || 'Desconocido'), 'error');
            } finally {
                modalEstado.guardando = false;
                btn.disabled = false;
                btn.textContent = 'Guardar';
            }
        };

        // Buscador
        document.addEventListener('DOMContentLoaded', function () {
            var searchInput = document.getElementById('sarielsModalSearch');
            if (searchInput) {
                searchInput.addEventListener('input', function () {
                    renderListaTemas();
                });
            }

            // Cerrar al hacer click en el overlay
            var overlay = document.getElementById('sarielsModal');
            if (overlay) {
                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) window.cerrarModalTemas();
                });
            }

            // Cerrar con Escape
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') window.cerrarModalTemas();
            });
        });

        // ============================================================
        // ARRANQUE
        // ============================================================

        window.addEventListener('DOMContentLoaded', async () => {
            await new Promise(resolve => setTimeout(resolve, 400));
            renderSecciones();
        });

        (async function cargarHandleSubtitulo() {
            try {
                const client = await esperarCliente();
                if (!client) return;
                const { data } = await client.auth.getSession();
                const session = data && data.session;
                if (!session) return;
                const handle = session.user.email ? session.user.email.split('@')[0] : 'usuario';
                const subEl = document.querySelector('.cfg-header-subtitle');
                if (subEl) subEl.textContent = '@' + handle;
            } catch (e) { /* silencioso */ }
        })();

    })();
    </script>
</body>
</html>
