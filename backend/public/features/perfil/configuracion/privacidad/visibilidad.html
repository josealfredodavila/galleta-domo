<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Visibilidad y contactos · Sariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../../shared/config-layout.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        (function () {
            'use strict';

            window.__sarielsAuthenticated = null;
            window.supabaseClient = window.supabaseClient || null;
            window.supabaseReady = null;

            window.getSupabaseClient = function () {
                return window.supabaseReady;
            };

            function esRutaInternaSegura(valor) {
                if (typeof valor !== 'string') return false;
                if (!valor.startsWith('/')) return false;
                if (valor.startsWith('//')) return false;
                if (valor.startsWith('/\\')) return false;
                return true;
            }

            function revelarPagina() {
                document.documentElement.classList.add('auth-ready');
            }

            function irAlIndexConReturnTo() {
                try {
                    var returnTo = window.location.pathname + window.location.search + window.location.hash;
                    if (esRutaInternaSegura(returnTo)) {
                        localStorage.setItem('wallet_returnTo', returnTo);
                    }
                    window.location.replace('/');
                } catch (e) {
                    window.location.replace('/');
                }
            }

            var salvaguarda = setTimeout(function () {
                console.warn('[Visibilidad] Salvaguarda activada.');
                revelarPagina();
            }, 10000);

            async function inicializarSupabase() {
                try {
                    if (
                        !window.supabase ||
                        typeof window.supabase.createClient !== 'function'
                    ) {
                        throw new Error('Supabase SDK no disponible.');
                    }

                    if (!window.supabaseClient) {
                        var supabaseUrl = null;
                        var supabaseAnonKey = null;

                        try {
                            const response = await fetch('/api/config/public', {
                                method: 'GET',
                                credentials: 'same-origin',
                                cache: 'no-store',
                                headers: { 'Accept': 'application/json' }
                            });

                            if (response.ok) {
                                const config = await response.json();
                                supabaseUrl = config && config.supabaseUrl;
                                supabaseAnonKey = config && config.supabaseAnonKey;
                            }
                        } catch (fetchErr) {
                            console.warn('[Visibilidad] fetch /api/config/public falló:', fetchErr);
                        }

                        if (!supabaseUrl || !supabaseAnonKey) {
                            throw new Error('Configuración pública de Supabase no disponible.');
                        }

                        window.SupabaseSDK = window.supabase;

                        window.supabaseClient = window.SupabaseSDK.createClient(
                            supabaseUrl,
                            supabaseAnonKey,
                            {
                                auth: {
                                    persistSession: true,
                                    autoRefreshToken: true,
                                    detectSessionInUrl: true
                                }
                            }
                        );
                    }

                    const resultado = await window.supabaseClient.auth.getSession();
                    const session = resultado && resultado.data ? resultado.data.session : null;

                    window.__sarielsAuthenticated = !!session;

                    clearTimeout(salvaguarda);

                    if (!session) {
                        irAlIndexConReturnTo();
                    } else {
                        revelarPagina();
                    }

                    return window.supabaseClient;
                } catch (error) {
                    console.error('[Visibilidad] Error inicializando Supabase:', error);
                    window.__sarielsAuthenticated = false;
                    clearTimeout(salvaguarda);
                    revelarPagina();
                    return null;
                }
            }

            window.supabaseReady = inicializarSupabase();
        })();
    </script>

    <style>
        html:not(.auth-ready) body {
            visibility: hidden;
        }
        html.auth-ready body {
            visibility: visible;
        }
    </style>
</head>
<body class="cfg-page">

    <div id="cfgHeaderSlot"></div>

    <main class="cfg-content">

        <h2 class="cfg-section-title">Visibilidad</h2>
        <div class="cfg-list" id="seccionVisibilidad"></div>

        <h2 class="cfg-section-title">Contactos</h2>
        <div class="cfg-list" id="seccionContactos"></div>

        <div class="cfg-aviso">
            ℹ️ Los cambios se sincronizan automáticamente en todos tus dispositivos.
        </div>

        <div class="cfg-footer">
            <strong>◈ Sariel's</strong> · Privacidad · Visibilidad y contactos
        </div>
    </main>

    <script src="../../../shared/config-icons.js"></script>
    <script src="../../../shared/config-layout.js"></script>

    <script>
    (function () {
        'use strict';

        const $ = (sel) => document.querySelector(sel);

        async function esperarCliente() {
            const inicio = Date.now();
            while (Date.now() - inicio < 10000) {
                if (window.supabaseClient) return window.supabaseClient;
                await new Promise(r => setTimeout(r, 100));
            }
            return null;
        }

        cfgInitPage({
            title: 'Visibilidad y contactos',
            subtitle: '@tu_usuario',
            backUrl: '/features/perfil/configuracion/index.html',
        });

        const PREF_KEYS = {
            encontrarme_email: 'visibilidad_encontrarme_email',
            encontrarme_telefono: 'visibilidad_encontrarme_telefono',
            sync_contactos: 'visibilidad_sync_contactos',
        };

        let contadorContactos = null;

        async function contarContactos() {
            try {
                const client = await esperarCliente();
                if (!client) return null;

                const { data: sessionData } = await client.auth.getSession();
                const session = sessionData && sessionData.session;
                if (!session) return null;

                const { count, error } = await client
                    .from('contactos')
                    .select('*', { count: 'exact', head: true })
                    .eq('usuario_id', session.user.id);

                if (error) {
                    console.warn('Error contando contactos:', error.message);
                    return null;
                }

                return count || 0;
            } catch (e) {
                console.warn('Error contando contactos:', e && e.message);
                return null;
            }
        }

        function renderToggles() {
            $('#seccionVisibilidad').innerHTML = [
                cfgRenderToggle({
                    id: 'toggleEmail',
                    title: 'Permite que otros te encuentren por tu correo electrónico',
                    desc: 'Quienes tengan tu correo electrónico podrán conectarse contigo en Sariel\'s.',
                    checked: cfgGetPref(PREF_KEYS.encontrarme_email, true),
                    onChange: `window.onToggleEmail(this.checked)`,
                }),
                cfgRenderToggle({
                    id: 'toggleTelefono',
                    title: 'Permitir que otros te encuentren por tu número de teléfono',
                    desc: 'Necesitas añadir un número de teléfono para esta configuración.',
                    checked: cfgGetPref(PREF_KEYS.encontrarme_telefono, false),
                    onChange: `window.onToggleTelefono(this.checked)`,
                }),
            ].join('');

            const contactosTxt = contadorContactos === null
                ? ''
                : ' (' + contadorContactos + ')';

            $('#seccionContactos').innerHTML = [
                cfgRenderToggle({
                    id: 'toggleSync',
                    title: 'Sincronizar contactos de la libreta de direcciones',
                    desc: 'Los contactos de tu libreta se cargarán en Sariel\'s de forma continua para ayudarte a conectar con tus amigos y personalizar tu contenido.',
                    checked: cfgGetPref(PREF_KEYS.sync_contactos, false),
                    onChange: `window.onToggleSync(this.checked)`,
                }),
                cfgRenderItem({
                    icon: 'ban',
                    title: 'Eliminar todos los contactos' + contactosTxt,
                    desc: 'Elimina todos los contactos que hayas subido previamente y desactiva la sincronización en todos tus dispositivos.',
                    onclick: 'window.onEliminarContactos()',
                    class: 'cfg-item-plain',
                    style: 'color: var(--cfg-danger, #ff3366);',
                }),
            ].join('');
        }

        window.onToggleEmail = async (value) => {
            await cfgSetPref(PREF_KEYS.encontrarme_email, value);
            cfgToast(
                value ? '✅ Permites ser encontrado por correo' : '🚫 Ya no te encontrarán por correo',
                value ? 'success' : 'warning'
            );
        };

        window.onToggleTelefono = async (value) => {
            if (value) {
                cfgToast('📱 Primero añade un número de teléfono en tu cuenta', 'warning');
                setTimeout(() => {
                    const t = document.getElementById('toggleTelefono');
                    if (t) t.checked = false;
                }, 300);
                return;
            }
            await cfgSetPref(PREF_KEYS.encontrarme_telefono, value);
            cfgToast('🚫 Ya no te encontrarán por teléfono', 'warning');
        };

        window.onToggleSync = async (value) => {
            await cfgSetPref(PREF_KEYS.sync_contactos, value);
            cfgToast(
                value ? '📇 Sincronización activada' : '🚫 Sincronización desactivada',
                value ? 'success' : 'warning'
            );
        };

        window.onEliminarContactos = async () => {
            const totalTxt = contadorContactos !== null
                ? ' (' + contadorContactos + ')'
                : '';

            const ok = await cfgConfirm({
                title: '¿Eliminar todos los contactos' + totalTxt + '?',
                text: 'Esta acción eliminará todos los contactos cargados previamente y desactivará la sincronización. Puede tardar unos minutos.',
                confirmText: 'Eliminar todo',
                cancelText: 'Cancelar',
                danger: true,
            });

            if (!ok) return;

            cfgToast('⏳ Eliminando contactos...', 'error', 3000);

            try {
                const client = await esperarCliente();
                if (!client) throw new Error('Supabase no disponible');

                const { data: sessionData } = await client.auth.getSession();
                const session = sessionData && sessionData.session;
                if (!session) throw new Error('Sin sesión');

                /* Borrar TODAS las filas del usuario en la tabla contactos. */
                const { error } = await client
                    .from('contactos')
                    .delete()
                    .eq('usuario_id', session.user.id);

                if (error) {
                    throw new Error(error.message);
                }

                /* Desactivar sincronización. */
                await cfgSetPref(PREF_KEYS.sync_contactos, false);
                const t = document.getElementById('toggleSync');
                if (t) t.checked = false;

                /* Actualizar contador local. */
                contadorContactos = 0;
                renderToggles();

                cfgToast('✅ Todos los contactos eliminados', 'success', 4000);

            } catch (e) {
                console.error('Error eliminando contactos:', e);
                cfgToast('❌ Error: ' + e.message, 'error');
            }
        };

        window.addEventListener('DOMContentLoaded', async () => {
            await new Promise(resolve => setTimeout(resolve, 400));
            renderToggles();

            contadorContactos = await contarContactos();
            renderToggles();
        });

        (async function cargarHandleSubtitulo() {
            try {
                const client = await esperarCliente();
                if (!client) return;
                const { data } = await client.auth.getSession();
                const session = data && data.session;
                if (!session) return;
                const handle = session.user.email ? session.user.email.split('@')[0] : 'usuario';
                const subEl = document.querySelector('.cfg-header-subtitle');
                if (subEl) subEl.textContent = '@' + handle;
            } catch (e) { /* silencioso */ }
        })();

    })();
    </script>
</body>
</html>
