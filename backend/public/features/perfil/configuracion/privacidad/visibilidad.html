<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Visibilidad y contactos · Sariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../../shared/config-layout.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        (function () {
            'use strict';

            window.__sarielsAuthenticated = null;
            window.supabaseClient = window.supabaseClient || null;
            window.supabaseReady = null;

            window.getSupabaseClient = function () {
                return window.supabaseReady;
            };

            function esRutaInternaSegura(valor) {
                if (typeof valor !== 'string') return false;
                if (!valor.startsWith('/')) return false;
                if (valor.startsWith('//')) return false;
                if (valor.startsWith('/\\')) return false;
                return true;
            }

            function revelarPagina() {
                document.documentElement.classList.add('auth-ready');
            }

            function irAlIndexConReturnTo() {
                try {
                    var returnTo = window.location.pathname + window.location.search + window.location.hash;
                    if (esRutaInternaSegura(returnTo)) {
                        localStorage.setItem('wallet_returnTo', returnTo);
                    }
                    window.location.replace('/');
                } catch (e) {
                    window.location.replace('/');
                }
            }

            var salvaguarda = setTimeout(function () {
                console.warn('[Visibilidad] Salvaguarda activada.');
                revelarPagina();
            }, 10000);

            async function inicializarSupabase() {
                try {
                    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                        throw new Error('Supabase SDK no disponible.');
                    }

                    if (!window.supabaseClient) {
                        var supabaseUrl = null;
                        var supabaseAnonKey = null;

                        try {
                            const response = await fetch('/api/config/public', {
                                method: 'GET',
                                credentials: 'same-origin',
                                cache: 'no-store',
                                headers: { 'Accept': 'application/json' }
                            });

                            if (response.ok) {
                                const config = await response.json();
                                supabaseUrl = config && config.supabaseUrl;
                                supabaseAnonKey = config && config.supabaseAnonKey;
                            }
                        } catch (fetchErr) {
                            console.warn('[Visibilidad] fetch /api/config/public falló:', fetchErr);
                        }

                        if (!supabaseUrl || !supabaseAnonKey) {
                            throw new Error('Configuración pública de Supabase no disponible.');
                        }

                        window.SupabaseSDK = window.supabase;

                        window.supabaseClient = window.SupabaseSDK.createClient(
                            supabaseUrl,
                            supabaseAnonKey,
                            { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
                        );
                    }

                    const resultado = await window.supabaseClient.auth.getSession();
                    const session = resultado && resultado.data ? resultado.data.session : null;

                    window.__sarielsAuthenticated = !!session;

                    clearTimeout(salvaguarda);

                    if (!session) {
                        irAlIndexConReturnTo();
                    } else {
                        revelarPagina();
                    }

                    return window.supabaseClient;
                } catch (error) {
                    console.error('[Visibilidad] Error inicializando Supabase:', error);
                    window.__sarielsAuthenticated = false;
                    clearTimeout(salvaguarda);
                    revelarPagina();
                    return null;
                }
            }

            window.supabaseReady = inicializarSupabase();
        })();
    </script>

    <style>
        html:not(.auth-ready) body { visibility: hidden; }
        html.auth-ready body { visibility: visible; }
    </style>
</head>
<body class="cfg-page">

    <div id="cfgHeaderSlot"></div>

    <main class="cfg-content">

        <h2 class="cfg-section-title">Visibilidad</h2>
        <div class="cfg-list" id="seccionVisibilidad"></div>

        <h2 class="cfg-section-title">Contactos</h2>
        <div class="cfg-list" id="seccionContactos"></div>

        <div class="cfg-aviso">
            ℹ️ Las opciones marcadas como "Próximamente" aún no están activas.
        </div>

        <div class="cfg-footer">
            <strong>◈ Sariel's</strong> · Privacidad · Visibilidad y contactos
        </div>
    </main>

    <script src="../../../shared/config-icons.js"></script>
    <script src="../../../shared/config-layout.js"></script>

    <script>
    (function () {
        'use strict';

        const $ = (sel) => document.querySelector(sel);

        async function esperarCliente() {
            const inicio = Date.now();
            while (Date.now() - inicio < 10000) {
                if (window.supabaseClient) return window.supabaseClient;
                await new Promise(r => setTimeout(r, 100));
            }
            return null;
        }

        cfgInitPage({
            title: 'Visibilidad y contactos',
            subtitle: '',
            backUrl: '/features/perfil/configuracion/index.html',
        });

        const PREF_KEYS = {
            encontrarme_email: 'visibilidad_encontrarme_email',
            encontrarme_telefono: 'visibilidad_encontrarme_telefono',
        };

        function renderToggles() {
            $('#seccionVisibilidad').innerHTML = [
                cfgRenderToggle({
                    id: 'toggleEmail',
                    title: 'Permite que otros te encuentren por tu correo electrónico (Próximamente)',
                    desc: 'Esta opción aún no afecta las búsquedas. Estará disponible pronto.',
                    checked: false,
                    disabled: true,
                }),
                cfgRenderToggle({
                    id: 'toggleTelefono',
                    title: 'Permitir que otros te encuentren por tu número de teléfono (Próximamente)',
                    desc: 'Requiere añadir un número de teléfono. Aún no está disponible.',
                    checked: false,
                    disabled: true,
                }),
            ].join('');

            $('#seccionContactos').innerHTML = [
                cfgRenderToggle({
                    id: 'toggleSync',
                    title: 'Sincronizar contactos de la libreta (Próximamente)',
                    desc: 'Permitirá cargar los contactos de tu teléfono para encontrar a tus amigos. Aún no está disponible.',
                    checked: false,
                    disabled: true,
                }),
            ].join('');
        }

        /* ============================================================
           SUBTÍTULO: handle real del usuario (no el correo)
        ============================================================ */
        async function cargarHandleSubtitulo() {
            try {
                const client = await esperarCliente();
                if (!client) return;

                const { data: sd } = await client.auth.getSession();
                if (!sd || !sd.session) return;

                const { data } = await client.rpc('mi_perfil_privado');
                const perfil = Array.isArray(data) ? data[0] : data;
                const handle = perfil && (perfil.handle || perfil.username);

                const subEl = document.querySelector('.cfg-header-subtitle');
                if (subEl && handle) subEl.textContent = '@' + handle;
            } catch (e) { /* silencioso */ }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await new Promise(resolve => setTimeout(resolve, 300));
            renderToggles();
            cargarHandleSubtitulo();
        });

    })();
    </script>
</body>
</html>
