<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Accesibilidad · Sariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../../shared/config-layout.css" />
</head>
<body class="cfg-page">

    <div id="cfgHeaderSlot"></div>

    <main class="cfg-content">

        <h2 class="cfg-section-title">Movimiento</h2>
        <div class="cfg-list" id="seccionMovimiento"></div>

        <h2 class="cfg-section-title">Contraste y colores</h2>
        <div class="cfg-list" id="seccionContraste"></div>

        <h2 class="cfg-section-title">Texto</h2>
        <div class="cfg-list" id="seccionTexto"></div>

        <h2 class="cfg-section-title">Audio</h2>
        <div class="cfg-list" id="seccionAudio"></div>

        <h2 class="cfg-section-title">Botones flotantes</h2>
        <div class="cfg-list" id="seccionBotones"></div>

        <div class="cfg-aviso cfg-aviso-info">
            ℹ️ Estas opciones afectan a todas las cuentas de Sariel's en este dispositivo. La opción de botones flotantes se guarda en tu cuenta y se aplica en cualquier dispositivo.
        </div>

        <div class="cfg-footer">
            <strong>◈ Sariel's</strong> · Accesibilidad · Opciones generales
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <!-- ✅ CORRECCIÓN: Se agregó apariencia-global.js para que tome el color de acento -->
    <script src="/features/shared/js/apariencia-global.js"></script>
    
    <script src="../../../shared/config-icons.js"></script>
    <script src="../../../shared/config-layout.js"></script>

    <script>
    (function () {
        'use strict';

        const $ = (sel) => document.querySelector(sel);

        cfgInitPage({
            title: 'Accesibilidad',
            subtitle: 'Ajustes del dispositivo',
            backUrl: '/features/perfil/configuracion/index.html',
        });

        const PREF_KEYS = {
            reducir_movimiento: 'accesibilidad_reducir_movimiento',
            alto_contraste: 'accesibilidad_alto_contraste',
            texto_grande: 'accesibilidad_texto_grande',
            subtitulos: 'accesibilidad_subtitulos',
        };

        /* Preferencia guardada en Supabase (tabla preferencias_usuario, columna prefs jsonb).
           Si no existe, el botón se considera visible. */
        const CLAVE_BOTON_LLAMADAS = 'boton_llamadas_visible';
        const SB_URL = 'https://zultnlogdoajehbswlih.supabase.co';
        const SB_KEY = 'sb_publishable_S3jONAz3mRO4JKBRhUdI1A_-nsyVhKu';

        let clienteSb = null;
        let usuarioId = null;
        let prefsRemotas = {};
        let prefsListas = false;

        async function obtenerCliente() {
            if (clienteSb) return clienteSb;
            if (window.supabaseClient && window.supabaseClient.auth) {
                clienteSb = window.supabaseClient;
                return clienteSb;
            }
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                clienteSb = window.supabase.createClient(SB_URL, SB_KEY, {
                    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
                });
                window.supabaseClient = clienteSb;
                return clienteSb;
            }
            return null;
        }

        async function obtenerSesion() {
            const c = await obtenerCliente();
            if (!c) return null;
            const { data } = await c.auth.getSession();
            return (data && data.session) || null;
        }

        async function cargarPrefsRemotas() {
            try {
                const sesion = await obtenerSesion();
                if (!sesion) {
                    usuarioId = null;
                    prefsRemotas = {};
                    return;
                }
                usuarioId = sesion.user.id;
                const c = await obtenerCliente();
                const r = await c
                    .from('preferencias_usuario')
                    .select('prefs')
                    .eq('usuario_id', usuarioId)
                    .maybeSingle();
                if (r.error) throw r.error;
                prefsRemotas = (r.data && r.data.prefs) || {};
            } catch (e) {
                console.warn('[Accesibilidad] No se pudieron leer las preferencias:', e);
                prefsRemotas = {};
            } finally {
                prefsListas = true;
            }
        }

        async function guardarPrefRemota(clave, valor) {
            const sesion = await obtenerSesion();
            if (!sesion) throw new Error('Inicia sesión para guardar esta opción.');
            const c = await obtenerCliente();
            const uid = sesion.user.id;
            const nuevas = Object.assign({}, prefsRemotas, { [clave]: valor });

            const existe = await c
                .from('preferencias_usuario')
                .select('usuario_id')
                .eq('usuario_id', uid)
                .maybeSingle();
            if (existe.error) throw existe.error;

            const ahora = new Date().toISOString();
            const r = existe.data
                ? await c.from('preferencias_usuario').update({ prefs: nuevas, updated_at: ahora }).eq('usuario_id', uid)
                : await c.from('preferencias_usuario').insert({ usuario_id: uid, prefs: nuevas, updated_at: ahora });
            if (r.error) throw r.error;

            prefsRemotas = nuevas;
        }

        function renderSecciones() {
            // ============================================================
            // MOVIMIENTO
            // ============================================================
            $('#seccionMovimiento').innerHTML = [
                cfgRenderToggle({
                    id: 'toggleReducirMovimiento',
                    title: 'Reducir el movimiento',
                    desc: 'Limita la cantidad de animaciones en la aplicación, incluidos los conteos de interacciones en directo.',
                    checked: cfgGetPref(PREF_KEYS.reducir_movimiento, false),
                    onChange: `window.onToggleReducirMovimiento(this.checked)`,
                }),
            ].join('');

            // ============================================================
            // CONTRASTE
            // ============================================================
            $('#seccionContraste').innerHTML = [
                cfgRenderToggle({
                    id: 'toggleAltoContraste',
                    title: 'Aumentar el contraste',
                    desc: 'Aumenta el contraste de los colores para hacer el texto más legible.',
                    checked: cfgGetPref(PREF_KEYS.alto_contraste, false),
                    onChange: `window.onToggleAltoContraste(this.checked)`,
                }),
            ].join('');

            // ============================================================
            // TEXTO
            // ============================================================
            $('#seccionTexto').innerHTML = [
                cfgRenderToggle({
                    id: 'toggleTextoGrande',
                    title: 'Texto más grande',
                    desc: 'Aumenta el tamaño del texto en toda la aplicación.',
                    checked: cfgGetPref(PREF_KEYS.texto_grande, false),
                    onChange: `window.onToggleTextoGrande(this.checked)`,
                }),
                cfgRenderItem({
                    icon: 'type',
                    title: 'Tamaño de fuente',
                    desc: 'Elige el tamaño exacto: 80%, 100%, 120%, 140%',
                    onclick: 'window.onTamanoFuente()',
                }),
            ].join('');

            // ============================================================
            // AUDIO
            // ============================================================
            $('#seccionAudio').innerHTML = [
                cfgRenderToggle({
                    id: 'toggleSubtitulos',
                    title: 'Subtítulos automáticos en videos',
                    desc: 'Muestra subtítulos automáticos en los videos que se reproduzcan.',
                    checked: cfgGetPref(PREF_KEYS.subtitulos, false),
                    onChange: `window.onToggleSubtitulos(this.checked)`,
                }),
            ].join('');

            renderBotones();
        }

        /* Botón de llamadas: se muestra según la preferencia guardada en Supabase. */
        function renderBotones() {
            const el = $('#seccionBotones');
            if (!el) return;

            if (!prefsListas) {
                el.innerHTML = '<div class="cfg-item-desc" style="padding:12px 4px;opacity:.6;">Cargando…</div>';
                return;
            }

            const sinSesion = !usuarioId;
            const visible = prefsRemotas[CLAVE_BOTON_LLAMADAS] !== false;

            el.innerHTML = cfgRenderToggle({
                id: 'toggleBotonLlamadas',
                title: 'Botón de llamadas',
                desc: sinSesion
                    ? 'Inicia sesión para cambiar esta opción.'
                    : 'Muestra u oculta el botón flotante de llamadas en tu perfil.',
                checked: visible,
                onChange: `window.onToggleBotonLlamadas(this.checked)`,
            });
        }

        // ============================================================
        // CALLBACKS
        // ============================================================
        window.onToggleReducirMovimiento = async (value) => {
            await cfgSetPref(PREF_KEYS.reducir_movimiento, value);
            document.body.classList.toggle('reduce-motion', value);
            cfgToast(
                value ? '🎬 Movimiento reducido' : '✨ Animaciones completas activadas',
                value ? 'success' : ''
            );
        };

        window.onToggleAltoContraste = async (value) => {
            await cfgSetPref(PREF_KEYS.alto_contraste, value);
            document.body.classList.toggle('high-contrast', value);
            cfgToast(
                value ? '🎨 Contraste aumentado' : '🎨 Contraste normal',
                value ? 'success' : ''
            );
        };

        window.onToggleTextoGrande = async (value) => {
            await cfgSetPref(PREF_KEYS.texto_grande, value);
            document.body.classList.toggle('text-large', value);
            cfgToast(
                value ? '📝 Texto más grande activado' : '📝 Texto normal',
                value ? 'success' : ''
            );
        };

        window.onToggleSubtitulos = async (value) => {
            await cfgSetPref(PREF_KEYS.subtitulos, value);
            cfgToast(
                value ? '💬 Subtítulos automáticos activados' : '💬 Subtítulos desactivados',
                value ? 'success' : 'warning'
            );
        };

        window.onToggleBotonLlamadas = async (value) => {
            try {
                await guardarPrefRemota(CLAVE_BOTON_LLAMADAS, value);
                cfgToast(
                    value ? '📞 Botón de llamadas visible' : '📞 Botón de llamadas oculto',
                    value ? 'success' : 'warning'
                );
            } catch (e) {
                console.error('[Accesibilidad] Error guardando botón de llamadas:', e);
                cfgToast((e && e.message) || 'No se pudo guardar la opción', 'error');
                renderBotones();
            }
        };

        window.onTamanoFuente = () => {
            cfgToast('⏳ Selector de tamaño próximamente', 'warning');
        };

        // ============================================================
        // INICIALIZAR
        // ============================================================
        window.addEventListener('DOMContentLoaded', async () => {
            await new Promise(resolve => setTimeout(resolve, 400));

            // Aplicar preferencias locales guardadas al cargar
            if (cfgGetPref(PREF_KEYS.reducir_movimiento, false)) {
                document.body.classList.add('reduce-motion');
            }
            if (cfgGetPref(PREF_KEYS.alto_contraste, false)) {
                document.body.classList.add('high-contrast');
            }
            if (cfgGetPref(PREF_KEYS.texto_grande, false)) {
                document.body.classList.add('text-large');
            }

            renderSecciones();
            await cargarPrefsRemotas();
            renderBotones();
        });

    })();
    </script>

    <style>
    /* Estilos que se aplican al activar los toggles */
    body.reduce-motion * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }

    body.high-contrast {
        --cfg-text-muted: #c0d8e8;
        --cfg-border: rgba(255, 255, 255, 0.2);
    }

    body.text-large {
        font-size: 118%;
    }
    </style>
</body>
</html>
