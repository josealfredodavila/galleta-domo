<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Mostrar · Sariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- ✅ APARIENCIA GLOBAL v2.0 - Se carga PRIMERO para evitar flash -->
    <script src="/features/shared/js/apariencia-global.js"></script>
    
    <link rel="stylesheet" href="../../../shared/config-layout.css" />
    
    <style>
        .cfg-preview-box {
            margin: 0 16px 24px 16px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid var(--cfg-border);
        }

        .cfg-tema-selector {
            display: flex;
            gap: 12px;
            padding: 0 16px 20px 16px;
        }

        .cfg-tema-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 8px;
            border-radius: 12px;
            border: 2px solid var(--cfg-border);
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: var(--cfg-transition);
        }

        .cfg-tema-card:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .cfg-tema-card.active {
            border-color: var(--cfg-gold);
            background: rgba(212, 175, 55, 0.08);
        }

        /* ============================================
           PREVIEW DEL TEMA - Ahora contiene SVGs limpios
           en lugar de emojis. El SVG hereda el color:
           - Gris cuando inactivo
           - Dorado (o color de acento) cuando activo
           ============================================ */
        .cfg-tema-card .preview {
            width: 60px;
            height: 40px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--cfg-text-muted); /* Color por defecto: gris */
        }

        .cfg-tema-card.active .preview {
            color: var(--cfg-gold); /* Color activo: dorado (o acento) */
        }

        /* El SVG siempre hereda el color del contenedor */
        .cfg-tema-card .preview svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Fondos de los 3 previews (se mantienen los gradientes visuales) */
        .cfg-tema-card .preview.sistema { background: linear-gradient(135deg, #000 50%, #fff 50%); }
        .cfg-tema-card .preview.dia     { background: #f5f5f5; }
        .cfg-tema-card .preview.noche   { background: #0a0a0a; }

        /* Ajuste específico: en Día el fondo es claro, así que el SVG inactivo debe ser oscuro */
        .cfg-tema-card .preview.dia {
            color: #666;
        }
        .cfg-tema-card.active .preview.dia {
            color: var(--cfg-gold);
        }

        .cfg-tema-card .label {
            font-size: 0.72rem;
            color: var(--cfg-text);
            font-weight: 500;
        }

        .cfg-tema-card.active .label {
            color: var(--cfg-gold);
        }

        .cfg-fuente-slider {
            padding: 0 16px 20px 16px;
        }

        .cfg-fuente-slider .slider-labels {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.75rem;
            color: var(--cfg-text-muted);
        }

        .cfg-fuente-slider .slider-value {
            font-family: 'Orbitron', monospace;
            color: var(--cfg-gold);
            font-weight: 700;
        }

        .cfg-fuente-slider input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .cfg-fuente-slider input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--cfg-gold);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .cfg-fuente-slider input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--cfg-gold);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .cfg-color-selector {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            padding: 0 16px 20px 16px;
            justify-items: center;
        }

        @media (max-width: 380px) {
            .cfg-color-selector {
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
            }
        }

        .cfg-color-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--cfg-transition);
            border: 3px solid transparent;
            position: relative;
        }

        .cfg-color-dot:hover {
            transform: scale(1.1);
        }

        .cfg-color-dot.active {
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .cfg-color-dot.active::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
        }

        .cfg-text-preview {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--cfg-border);
        }

        .cfg-text-preview .avatar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .cfg-text-preview .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0F2D1A, var(--cfg-gold));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
        }

        .cfg-text-preview .username {
            font-weight: 700;
            color: var(--cfg-text);
            font-size: var(--preview-size, 15px);
        }

        .cfg-text-preview .handle {
            color: var(--cfg-text-muted);
            font-size: calc(var(--preview-size, 15px) * 0.8);
        }

        .cfg-text-preview .body {
            color: var(--cfg-text);
            font-size: var(--preview-size, 15px);
            line-height: 1.5;
        }

        /* Tema día */
        [data-tema="dia"] {
            --cfg-bg: #f5f5f5;
            --cfg-bg-2: #ffffff;
            --cfg-bg-3: #f0f0f0;
            --cfg-text: #0a0a0a;
            --cfg-text-muted: #5a6870;
            --cfg-text-dim: #8a8a8a;
            --cfg-border: rgba(0, 0, 0, 0.1);
        }
        [data-tema="dia"] .cfg-header { background: rgba(255, 255, 255, 0.85); }
        [data-tema="dia"] .cfg-page { background: var(--cfg-bg); }
        [data-tema="dia"] .cfg-text-preview { background: rgba(0, 0, 0, 0.05); }
        [data-tema="dia"] .cfg-tema-card { background: rgba(0, 0, 0, 0.03); }
        [data-tema="dia"] .cfg-preview-box { background: rgba(0, 0, 0, 0.03); }
        [data-tema="dia"] .cfg-fuente-slider input[type="range"] { background: rgba(0, 0, 0, 0.15); }

        /* Tema noche */
        [data-tema="noche"] {
            --cfg-bg: #000000;
            --cfg-bg-2: #0a0a0a;
            --cfg-bg-3: #16181c;
            --cfg-text: #f0f4f8;
            --cfg-text-muted: #8aa8b8;
            --cfg-text-dim: #5a6870;
            --cfg-border: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="cfg-page">

    <div id="cfgHeaderSlot"></div>

    <main class="cfg-content">

        <h2 class="cfg-section-title">Tema</h2>
        <div class="cfg-tema-selector" id="seccionTema"></div>

        <h2 class="cfg-section-title">Color de acento</h2>
        <div class="cfg-color-selector" id="seccionAcento"></div>

        <h2 class="cfg-section-title">Tamaño de fuente</h2>
        <div class="cfg-fuente-slider">
            <div class="slider-labels">
                <span>Aa</span>
                <span class="slider-value" id="fuenteValor">100%</span>
                <span style="font-size:1.4rem;">Aa</span>
            </div>
            <input type="range" id="fuenteSlider" min="80" max="140" step="10" value="100" />
        </div>

        <h2 class="cfg-section-title">Vista previa</h2>
        <div class="cfg-preview-box">
            <div class="cfg-text-preview">
                <div class="avatar-row">
                    <div class="avatar">◈</div>
                    <div>
                        <div class="username">Explorador</div>
                        <div class="handle">@explorador · ahora</div>
                    </div>
                </div>
                <div class="body">
                    Así se ve el texto con tus preferencias actuales. Ajusta el tamaño de fuente y el color para personalizar tu experiencia. ✨
                </div>
            </div>
        </div>

        <div class="cfg-footer">
            <strong>◈ Sariel's</strong> · Accesibilidad · Mostrar
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../../../shared/config-icons.js"></script>
    <script src="../../../shared/config-layout.js"></script>

    <script>
    (function () {
        'use strict';

        const $ = (sel) => document.querySelector(sel);

        cfgInitPage({
            title: 'Mostrar',
            subtitle: 'Tema · Fuente · Color',
            backUrl: '/features/perfil/configuracion/index.html',
        });

        // Mismas claves que usa apariencia-global.js
        const PREF_KEYS = {
            tema: 'mostrar_tema',
            tamano_fuente: 'mostrar_tamano_fuente',
            color_acento: 'mostrar_color_acento',
        };

        // ============================================================
        // 16 COLORES DE ACENTO
        // ============================================================
        const COLORES_ACENTO = [
            { valor: '#D4AF37', label: 'Dorado Sariel\'s' },
            { valor: '#1d9bf0', label: 'Azul' },
            { valor: '#f7d44a', label: 'Amarillo' },
            { valor: '#00d68f', label: 'Verde' },
            { valor: '#a855f7', label: 'Morado' },
            { valor: '#ff3366', label: 'Rojo' },
            { valor: '#ec4899', label: 'Rosa' },
            { valor: '#00e5ff', label: 'Cian' },
            { valor: '#f97316', label: 'Naranja' },
            { valor: '#14b8a6', label: 'Turquesa' },
            { valor: '#6366f1', label: 'Índigo' },
            { valor: '#f43f5e', label: 'Rosa fuerte' },
            { valor: '#f59e0b', label: 'Ámbar' },
            { valor: '#84cc16', label: 'Lima' },
            { valor: '#10b981', label: 'Esmeralda' },
            { valor: '#0ea5e9', label: 'Cielo' },
        ];

        // ============================================================
        // SVGs LIMPIOS PARA LOS TEMAS (reemplazan los emojis de juguete)
        // Todos usan stroke: currentColor para heredar el color del contenedor
        // ============================================================
        const SVG_ICONS = {
            // Sistema: teléfono + engranaje (representa "automático")
            sistema: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <rect x="7" y="2" width="10" height="20" rx="2" ry="2"/>
                <line x1="11" y1="18" x2="13" y2="18"/>
                <circle cx="12" cy="10" r="3"/>
                <path d="M12 7v1M12 12v1M9 10h1M14 10h1"/>
            </svg>`,
            // Día: sol outline lineal
            dia: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="4"/>
                <line x1="12" y1="2" x2="12" y2="4"/>
                <line x1="12" y1="20" x2="12" y2="22"/>
                <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/>
                <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
                <line x1="2" y1="12" x2="4" y2="12"/>
                <line x1="20" y1="12" x2="22" y2="12"/>
                <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/>
                <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
            </svg>`,
            // Noche: luna creciente outline lineal
            noche: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>`,
        };

        // ✅ Usar la API global para guardar en localStorage + Supabase
        function guardarPreferencia(key, valor) {
            const api = window.SarielApariencia;
            if (!api) {
                try { localStorage.setItem(key, valor); } catch(e) {}
                return;
            }

            if (key === PREF_KEYS.tema) api.setTema(valor);
            else if (key === PREF_KEYS.color_acento) api.setColor(valor);
            else if (key === PREF_KEYS.tamano_fuente) api.setFuente(valor);
        }

        // Leer preferencia local
        function getPref(key, fallback) {
            try {
                const v = localStorage.getItem(key);
                return v !== null ? v : fallback;
            } catch(e) { return fallback; }
        }

        // ============================================================
        // TEMA
        // ============================================================
        function renderTemas() {
            const temaActual = getPref(PREF_KEYS.tema, 'sistema');
            const temas = [
                { id: 'sistema', label: 'Sistema', svg: SVG_ICONS.sistema },
                { id: 'dia',     label: 'Día',     svg: SVG_ICONS.dia },
                { id: 'noche',   label: 'Noche',   svg: SVG_ICONS.noche },
            ];

            $('#seccionTema').innerHTML = temas.map(t => `
                <div class="cfg-tema-card ${t.id === temaActual ? 'active' : ''}" onclick="window.onCambiarTema('${t.id}')">
                    <div class="preview ${t.id}">${t.svg}</div>
                    <div class="label">${t.label}</div>
                </div>
            `).join('');
        }

        window.onCambiarTema = function(tema) {
            guardarPreferencia(PREF_KEYS.tema, tema);
            renderTemas();
            cfgToast(
                tema === 'dia' ? '☀️ Tema día activado' :
                tema === 'noche' ? '🌙 Tema noche activado' :
                '📱 Siguiendo tema del sistema',
                'success'
            );
        };

        // ============================================================
        // COLOR DE ACENTO
        // ============================================================
        function renderColores() {
            const colorActual = (getPref(PREF_KEYS.color_acento, '#D4AF37') || '').toLowerCase();
            $('#seccionAcento').innerHTML = COLORES_ACENTO.map(c => `
                <div class="cfg-color-dot ${c.valor.toLowerCase() === colorActual ? 'active' : ''}" 
                     style="background:${c.valor};"
                     title="${c.label}"
                     onclick="window.onCambiarColor('${c.valor}')">
                </div>
            `).join('');
        }

        window.onCambiarColor = function(color) {
            guardarPreferencia(PREF_KEYS.color_acento, color);
            renderColores();
            cfgToast('🎨 Color de acento actualizado', 'success');
        };

        // ============================================================
        // TAMAÑO DE FUENTE
        // ============================================================
        function renderFuente() {
            const size = parseInt(getPref(PREF_KEYS.tamano_fuente, 100)) || 100;
            const slider = $('#fuenteSlider');
            const valor = $('#fuenteValor');
            if (slider) slider.value = size;
            if (valor) valor.textContent = size + '%';
            aplicarTamanoFuente(size);
        }

        function aplicarTamanoFuente(size) {
            const valor = Math.max(80, Math.min(140, parseInt(size)));
            if (window.SarielApariencia) {
                window.SarielApariencia.aplicarTamanoFuente(valor);
            } else {
                document.documentElement.style.fontSize = (16 * valor / 100) + 'px';
                document.documentElement.style.setProperty('--preview-size', (15 * valor / 100) + 'px');
            }
        }

        window.onCambiarFuente = function(size) {
            const sizeNum = parseInt(size);
            guardarPreferencia(PREF_KEYS.tamano_fuente, sizeNum);
            const valor = $('#fuenteValor');
            if (valor) valor.textContent = sizeNum + '%';
        };

        // ============================================================
        // INICIALIZAR
        // ============================================================
        window.addEventListener('DOMContentLoaded', async () => {
            await new Promise(resolve => setTimeout(resolve, 500));

            renderTemas();
            renderColores();
            renderFuente();

            const slider = $('#fuenteSlider');
            if (slider) {
                slider.addEventListener('input', (e) => {
                    const valor = $('#fuenteValor');
                    if (valor) valor.textContent = e.target.value + '%';
                    aplicarTamanoFuente(e.target.value);
                });
                slider.addEventListener('change', (e) => {
                    window.onCambiarFuente(e.target.value);
                });
            }

            console.log('[Mostrar] ✅ Página inicializada con 16 colores y SVGs en temas');
        });

    })();
    </script>
</body>
</html>
