<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Mostrar · Csariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%23000000' stroke='%23ffffff' stroke-width='4'/><text x='50' y='68' font-family='Inter, sans-serif' font-size='50' font-weight='900' fill='%23ffffff' text-anchor='middle'>◈</text></svg>" />

    <!-- Apariencia global: se carga primero para evitar parpadeo -->
    <script src="/features/shared/js/apariencia-global.js"></script>

    <link rel="stylesheet" href="../../../shared/config-layout.css" />

    <style>
        /* Estilos propios de la página. Solo blanco, negro y grises neutros.
           Usan las variables que define apariencia-global.js según el tema. */

        .mos-seccion-titulo {
            margin: 0;
        }

        /* ---------- Selector de tema ---------- */
        .mos-temas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 16px 20px 16px;
        }

        .mos-tema-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 16px 8px;
            border-radius: 12px;
            border: 2px solid var(--border-color, #2f3336);
            background: transparent;
            color: var(--text-color, #e7e9ea);
            cursor: pointer;
            transition: border-color 160ms ease, background-color 160ms ease;
            font: inherit;
        }

        .mos-tema-card[aria-checked="true"] {
            border-color: var(--text-color, #e7e9ea);
        }

        .mos-tema-card:focus-visible {
            outline: 2px solid var(--text-color, #e7e9ea);
            outline-offset: 2px;
        }

        .mos-tema-preview {
            width: 72px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color, #2f3336);
        }

        .mos-tema-preview.oscuro { background: #000000; color: #ffffff; }
        .mos-tema-preview.claro  { background: #ffffff; color: #000000; border-color: #d4d4d4; }

        .mos-tema-preview svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .mos-tema-label {
            font-size: .85rem;
            font-weight: 600;
        }

        .mos-tema-marca {
            font-size: .72rem;
            color: var(--text-secondary, #71767b);
            min-height: 1em;
        }

        /* ---------- Tamaño de fuente ---------- */
        .mos-fuente {
            padding: 0 16px 20px 16px;
        }

        .mos-fuente-etiquetas {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: var(--text-secondary, #71767b);
        }

        .mos-fuente-valor {
            font-weight: 700;
            color: var(--text-color, #e7e9ea);
            font-variant-numeric: tabular-nums;
        }

        .mos-fuente input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--border-color, #2f3336);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .mos-fuente input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--text-color, #e7e9ea);
            cursor: pointer;
            border: none;
        }

        .mos-fuente input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--text-color, #e7e9ea);
            cursor: pointer;
            border: none;
        }

        .mos-fuente input[type="range"]:focus-visible {
            outline: 2px solid var(--text-color, #e7e9ea);
            outline-offset: 4px;
        }

        /* ---------- Vista previa ---------- */
        .mos-preview {
            margin: 0 16px 24px 16px;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color, #2f3336);
            background: var(--bg-secondary, #16181c);
        }

        .mos-preview-cabecera {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .mos-preview-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-color, #2f3336);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--text-color, #e7e9ea);
        }

        .mos-preview-nombre {
            font-weight: 700;
            color: var(--text-color, #e7e9ea);
            font-size: var(--preview-size, 15px);
        }

        .mos-preview-handle {
            color: var(--text-secondary, #71767b);
            font-size: calc(var(--preview-size, 15px) * 0.8);
        }

        .mos-preview-texto {
            color: var(--text-color, #e7e9ea);
            font-size: var(--preview-size, 15px);
            line-height: 1.5;
        }
    </style>
</head>
<body class="cfg-page">

    <div id="cfgHeaderSlot"></div>

    <main class="cfg-content">

        <h2 class="cfg-section-title mos-seccion-titulo">Tema</h2>
        <div class="mos-temas" id="seccionTema" role="radiogroup" aria-label="Tema"></div>

        <h2 class="cfg-section-title mos-seccion-titulo">Tamaño de fuente</h2>
        <div class="mos-fuente">
            <div class="mos-fuente-etiquetas">
                <span style="font-size:.85rem;">A</span>
                <span class="mos-fuente-valor" id="fuenteValor">100%</span>
                <span style="font-size:1.4rem;">A</span>
            </div>
            <input type="range" id="fuenteSlider" min="80" max="140" step="10" value="100" aria-label="Tamaño de fuente" />
        </div>

        <h2 class="cfg-section-title mos-seccion-titulo">Vista previa</h2>
        <div class="mos-preview">
            <div class="mos-preview-cabecera">
                <div class="mos-preview-avatar">◈</div>
                <div>
                    <div class="mos-preview-nombre">Explorador</div>
                    <div class="mos-preview-handle">@explorador · ahora</div>
                </div>
            </div>
            <div class="mos-preview-texto">
                Así se verá el texto con tu tema y tamaño de fuente elegidos.
            </div>
        </div>

        <div class="cfg-footer">
            <strong>◈ Csariel's</strong> · Accesibilidad · Mostrar
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../../../shared/config-icons.js"></script>
    <script src="../../../shared/config-layout.js"></script>

    <script>
    (function () {
        'use strict';

        const $ = (sel) => document.querySelector(sel);

        cfgInitPage({
            title: 'Mostrar',
            subtitle: 'Tema · Fuente',
            backUrl: '/features/perfil/configuracion/index.html'
        });

        /* Temas válidos según apariencia-global.js v4.0.
           Las claves de preferencias son las mismas que usa ese archivo. */
        const TEMAS = [
            {
                id: 'bn-oscuro',
                label: 'Oscuro',
                marca: 'Negro con texto blanco',
                clasePreview: 'oscuro',
                svg: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
            },
            {
                id: 'bn-claro',
                label: 'Claro',
                marca: 'Blanco con texto negro',
                clasePreview: 'claro',
                svg: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
            }
        ];

        const PREF_KEYS = {
            tema: 'mostrar_tema',
            tamano_fuente: 'mostrar_tamano_fuente'
        };

        function getPref(clave, respaldo) {
            try {
                const valor = localStorage.getItem(clave);
                return valor !== null ? valor : respaldo;
            } catch (e) {
                return respaldo;
            }
        }

        function temaActual() {
            const guardado = getPref(PREF_KEYS.tema, 'bn-oscuro');
            return TEMAS.some(t => t.id === guardado) ? guardado : 'bn-oscuro';
        }

        function fuenteActual() {
            const n = parseInt(getPref(PREF_KEYS.tamano_fuente, 100), 10);
            return Number.isFinite(n) ? Math.max(80, Math.min(140, n)) : 100;
        }

        /* ---------- Tema ---------- */

        function pintarTemas() {
            const activo = temaActual();

            $('#seccionTema').innerHTML = TEMAS.map(function (t) {
                const esActivo = t.id === activo;
                return `
                    <button type="button" class="mos-tema-card"
                            role="radio"
                            aria-checked="${esActivo ? 'true' : 'false'}"
                            data-tema="${t.id}">
                        <span class="mos-tema-preview ${t.clasePreview}">${t.svg}</span>
                        <span class="mos-tema-label">${t.label}</span>
                        <span class="mos-tema-marca">${esActivo ? 'Activo' : t.marca}</span>
                    </button>`;
            }).join('');
        }

        function cambiarTema(id) {
            if (!TEMAS.some(t => t.id === id)) return;
            if (id === temaActual()) return;

            const api = window.SarielApariencia;
            if (api && typeof api.setTema === 'function') {
                api.setTema(id);
            } else {
                try { localStorage.setItem(PREF_KEYS.tema, id); } catch (e) {}
            }

            pintarTemas();
            cfgToast('Tema ' + (id === 'bn-oscuro' ? 'oscuro' : 'claro') + ' activado', 'success');
        }

        /* ---------- Fuente ---------- */

        function aplicarFuente(valor) {
            const api = window.SarielApariencia;
            if (api && typeof api.aplicarTamanoFuente === 'function') {
                api.aplicarTamanoFuente(valor);
                return;
            }
            document.documentElement.style.fontSize = (16 * valor / 100) + 'px';
            document.documentElement.style.setProperty('--preview-size', (15 * valor / 100) + 'px');
        }

        function guardarFuente(valor) {
            const api = window.SarielApariencia;
            if (api && typeof api.setFuente === 'function') {
                api.setFuente(valor);
            } else {
                try { localStorage.setItem(PREF_KEYS.tamano_fuente, String(valor)); } catch (e) {}
            }
        }

        function pintarFuente() {
            const valor = fuenteActual();
            const slider = $('#fuenteSlider');
            const etiqueta = $('#fuenteValor');
            if (slider) slider.value = valor;
            if (etiqueta) etiqueta.textContent = valor + '%';
            aplicarFuente(valor);
        }

        /* ---------- Inicio ---------- */

        function iniciar() {
            pintarTemas();
            pintarFuente();

            $('#seccionTema').addEventListener('click', function (e) {
                const boton = e.target.closest('[data-tema]');
                if (boton) cambiarTema(boton.dataset.tema);
            });

            const slider = $('#fuenteSlider');

            slider.addEventListener('input', function (e) {
                const valor = parseInt(e.target.value, 10);
                $('#fuenteValor').textContent = valor + '%';
                aplicarFuente(valor);
            });

            slider.addEventListener('change', function (e) {
                const valor = parseInt(e.target.value, 10);
                guardarFuente(valor);
                cfgToast('Tamaño de fuente: ' + valor + '%', 'success');
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', iniciar, { once: true });
        } else {
            iniciar();
        }

    })();
    </script>
</body>
</html>
