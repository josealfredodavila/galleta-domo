<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title data-clave="videos_titulo_pagina">◈ Videos · Csariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="/features/videos/css/videos-base.css">
    <link rel="stylesheet" href="/features/videos/css/videos-feed.css">
    <link rel="stylesheet" href="/features/videos/css/videos-hojas.css">
    <link rel="stylesheet" href="/features/videos/css/videos-publicar.css">
    <link rel="stylesheet" href="/features/videos/css/videos-composer-pro.css">

    <script src="/features/shared/js/api-config.js"></script>
    <script src="/features/shared/js/apariencia-global.js"></script>
</head>
<body>

    <header class="header">
        <div class="vf-fila1">
            <a href="/" class="logo">
                <span class="logo-hex">◈</span>
                <span class="logo-text">Csariel<span>'s</span></span>
            </a>
            <div class="header-actions">
                <button type="button" class="vf-btn" id="btnBuscar" aria-label="Buscar videos" title="Buscar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
                <button type="button" class="vf-btn" id="btnAbrirCamara" aria-label="Grabar video" title="Grabar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                </button>
                <button type="button" class="vf-btn" id="btnAbrirPublicar" aria-label="Subir video" title="Subir">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <span class="token-badge" id="tokenBadge">◈ <span id="tokenBadgeCantidad">0</span> Es.stoks</span>
                <a href="/features/perfil/perfil.html" class="header-avatar" id="headerAvatar" title="Mi perfil">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </a>
            </div>
        </div>

        <nav class="vf-tabs" role="tablist" aria-label="Secciones de videos">
            <button type="button" class="vf-tab active" data-tab="para_ti" role="tab">Para ti</button>
            <button type="button" class="vf-tab" data-tab="siguiendo" role="tab">Siguiendo</button>
            <button type="button" class="vf-tab" data-tab="puebla" role="tab">Puebla</button>
        </nav>

        <div class="vf-buscar" id="vfBuscar">
            <input type="search" id="inputBuscar" placeholder="Buscar por título, descripción o @usuario" autocomplete="off" />
        </div>
    </header>

    <!-- FEED EN CARRUSEL: desliza a los lados para cambiar de video -->
    <main id="videosContainer" aria-label="Carrusel de videos">
        <div class="empty-state">
            <span class="icon">◈</span>
            <h3 data-clave="videos_sin_videos">No hay videos aún</h3>
            <p data-clave="videos_se_el_primero">Sé el primero en compartir un video en Csariel's.</p>
        </div>
    </main>

    <div class="vf-indicador" id="vfIndicador" aria-hidden="true"></div>

    <div class="marketing-ad-container" id="marketingAdContainer" aria-hidden="true"></div>

    <!-- HOJA DE PUBLICAR -->
    <div class="hoja-fondo" id="hojaFondo"></div>

    <div class="hoja" id="hojaPublicar" role="dialog" aria-modal="true" aria-label="Crear publicación">
        <div class="hoja-tirador"></div>
        <div class="hoja-cab">
            <span class="hoja-titulo">Crear publicación</span>
            <button type="button" class="hoja-cerrar" data-cerrar="hojaPublicar" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="hoja-cuerpo">
            <div class="upload-section" id="uploadSection">
                <div class="pf-composer">
                    <div class="pf-composer-cabecera">
                        <span class="pf-composer-pulso" aria-hidden="true"></span>
                        <div>
                            <div class="pf-composer-titulo">Video</div>
                            <div class="pf-composer-sub">Texto, foto o video · #hashtags · @menciones</div>
                        </div>
                    </div>

                    <form id="formSubirVideo" onsubmit="event.preventDefault(); subirVideo();" style="margin:0;">
                        <div class="form-group-old">
                            <label>Título del video</label>
                            <input type="text" id="inputTituloVideo" placeholder="Ej: Mi primer video en Csariel's" maxlength="200" />
                        </div>

                        <textarea id="inputDescripcionVideo" placeholder="¿Qué piensas?" maxlength="2000"></textarea>
                        <input type="file" id="inputArchivoVideo" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" style="display: none;" />

                        <div class="pf-composer-barra">
                            <div class="pf-composer-iconos">
                                <button type="button" class="pf-composer-icono" id="btnEmoji" title="Emoji" aria-label="Emoji">
                                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                                </button>
                                <button type="button" class="pf-composer-icono" id="btnHashtag" title="Hashtag" aria-label="Hashtag">
                                    <svg viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
                                </button>
                                <button type="button" class="pf-composer-icono" id="btnFotoVideo" title="Galería" aria-label="Elegir de la galería">
                                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                                </button>
                            </div>

                            <div class="pf-composer-pie">
                                <div class="pf-composer-anillo" id="pfAnillo" aria-hidden="true">
                                    <svg viewBox="0 0 36 36">
                                        <circle class="fondo" cx="18" cy="18" r="15"/>
                                        <circle class="progreso" id="pfAnilloProgreso" cx="18" cy="18" r="15"/>
                                    </svg>
                                </div>
                                <span class="pf-composer-contador" id="pfContador">0 / 2000</span>
                                <button type="submit" id="btnSubirVideo">
                                    <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                                    Publicar
                                </button>
                            </div>
                        </div>

                        <div class="cola-estado" id="colaEstado" hidden>
                            <span id="colaTexto"></span>
                            <button type="button" id="colaCancelar" hidden>Cancelar</button>
                        </div>

                        <div id="uploadProgress" style="display:none;"></div>
                        <div id="progressFill" style="display:none;"></div>
                        <div id="progressText" style="display:none;"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- COMENTARIOS -->
    <div class="hoja" id="hojaComentarios" role="dialog" aria-modal="true" aria-label="Comentarios">
        <div class="hoja-tirador"></div>
        <div class="hoja-cab">
            <span class="hoja-titulo">Comentarios</span>
            <span class="hoja-cont" id="sheetContador">0</span>
            <button type="button" class="hoja-cerrar" data-cerrar="hojaComentarios" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="comentarios-lista" id="comentariosLista"></div>
        <div class="sheet-input">
            <input type="text" id="inputComentarioSheet" placeholder="Escribe un comentario…" maxlength="2000" autocomplete="off" />
            <button type="button" id="btnEnviarComentarioSheet" aria-label="Enviar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </div>
    </div>

    <!-- MENÚ DEL VIDEO -->
    <div class="hoja" id="hojaMenu" role="dialog" aria-modal="true" aria-label="Opciones">
        <div class="hoja-tirador"></div>
        <div class="hoja-cab">
            <span class="hoja-titulo" id="menuTitulo">Opciones</span>
            <button type="button" class="hoja-cerrar" data-cerrar="hojaMenu" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="hoja-lista" id="menuLista"></div>
    </div>

    <!-- MAPA -->
    <div class="hoja" id="hojaMapa" role="dialog" aria-modal="true" aria-label="Mapa de ubicación">
        <div class="hoja-tirador"></div>
        <div class="hoja-cab">
            <span class="hoja-titulo">Ubicación</span>
            <button type="button" class="hoja-cerrar" data-cerrar="hojaMapa" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="mapa-container">
            <div id="mapaLeaflet"></div>
        </div>
    </div>

    <button class="btn-audio-global" id="btnAudioGlobal" type="button" title="Activar sonido">
        <span class="ico"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg></span>
        <span class="txt">Activar sonido</span>
    </button>

    <div class="toast" id="toast"></div>

    <!-- ===== SCRIPTS (orden de carga importante) ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/features/shared/js/idiomas.js?v=6"></script>
    <script src="/features/shared/js/reacciones-global.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="/features/videos/js/videos-config.js"></script>
    <script src="/features/videos/js/videos-utils.js"></script>
    <script src="/features/videos/js/videos-hojas.js"></script>
    <script src="/features/videos/js/videos-sesion.js"></script>
    <script src="/features/videos/js/videos-audio.js"></script>
    <script src="/features/videos/js/videos-controles.js"></script>
    <script src="/features/videos/js/videos-feed.js"></script>
    <script src="/features/videos/js/videos-navegacion.js"></script>
    <script src="/features/videos/js/videos-reacciones.js"></script>
    <script src="/features/videos/js/videos-comentarios.js"></script>
    <script src="/features/videos/js/videos-menu.js"></script>
    <script src="/features/videos/js/videos-mapa.js"></script>
    <script src="/features/videos/js/videos-cola.js"></script>
    <script src="/features/videos/js/videos-atras.js"></script>
    <script src="/features/videos/js/videos-init.js"></script>

    <script src="/features/videos/js/videos-camara.js" defer></script>
    <script src="/features/videos/js/videos-publicar.js" defer></script>
</body>
</html>
