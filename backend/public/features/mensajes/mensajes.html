<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>◈ Mensajes · Sariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-dark: #b8923a;
            --gold-light: #e8c84a;
            --green-deep: #0F2D1A;
            --space: #05080f;
            --text-primary: #f0f4f8;
            --text-secondary: #c0d8e8;
            --text-muted: #8aa8b8;
            --glass-bg: rgba(15, 45, 26, 0.55);
            --glass-border: rgba(212, 175, 55, 0.15);
            --shadow-gold: 0 8px 32px rgba(212, 175, 55, 0.25);
            --shadow-gold-strong: 0 0 60px rgba(212, 175, 55, 0.15);
            --radius: 16px;
            --radius-xl: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00d68f;
            --danger: #ff3366;
            --warning: #f7d44a;
            --bg-card: rgba(15, 45, 26, 0.4);
            --bg-dark: rgba(5, 8, 15, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--space);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(26, 74, 42, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        #stars-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .nebula {
            position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.12; pointer-events: none; z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 { width: 700px; height: 700px; background: #2a6a3a; top: -15%; right: -15%; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-light); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.06; }
        .nebula-3 { width: 500px; height: 500px; background: #a855f7; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

        @keyframes nebula-drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--space); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

        .app {
            position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 16px 20px 30px;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0 14px; border-bottom: 1px solid var(--glass-border);
            flex-wrap: wrap; gap: 10px; background: rgba(5, 8, 15, 0.92);
            border-radius: var(--radius) var(--radius) 0 0; position: sticky; top: 0; z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-hex { font-size: 1.8rem; color: var(--gold); font-weight: 800; font-family: 'Orbitron', monospace; }
        .logo-text { font-family: 'Orbitron', monospace; font-size: 1.2rem; font-weight: 700; color: var(--text-primary); letter-spacing: 2px; }
        .logo-text span { color: var(--gold); }
        .logo-badge { font-size: 0.45rem; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--space); padding: 2px 10px; border-radius: 20px; font-weight: 700; text-transform: uppercase; }

        .idioma-selector {
            display: flex; align-items: center; gap: 6px; font-size: 0.65rem; color: var(--text-secondary);
            background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--glass-border);
        }
        .idioma-selector select { background: transparent; border: none; color: var(--gold); font-size: 0.65rem; outline: none; cursor: pointer; }

        .network-badge { display: flex; align-items: center; gap: 6px; font-size: 0.6rem; color: var(--gold); background: rgba(212, 175, 55, 0.1); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.15); }
        .network-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

        .main-nav {
            display: flex; gap: 4px; background: rgba(15, 45, 26, 0.3); border-radius: var(--radius);
            padding: 4px; border: 1px solid var(--glass-border); margin: 16px 0 20px; overflow-x: auto;
        }
        .main-nav .nav-link {
            padding: 8px 16px; border-radius: 12px; color: var(--text-muted); text-decoration: none;
            font-size: 0.7rem; font-weight: 500; transition: var(--transition); white-space: nowrap;
        }
        .main-nav .nav-link:hover { color: var(--text-primary); background: rgba(212, 175, 55, 0.05); }
        .main-nav .nav-link.active { background: rgba(212, 175, 55, 0.12); color: var(--gold); }
        .main-nav .nav-link.live { color: var(--danger); }

        .mensajes-wrapper {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl); overflow: hidden; backdrop-filter: blur(16px);
            min-height: 500px; display: flex; flex-direction: row; flex-wrap: wrap;
        }

        .mensajes-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; border-bottom: 1px solid var(--glass-border); background: rgba(0,0,0,0.15);
        }
        .mensajes-header h2 { font-family: 'Orbitron', monospace; font-size: 1rem; color: var(--gold); }

        .btn {
            display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 30px;
            font-size: 0.7rem; font-weight: 600; border: none; cursor: pointer; transition: var(--transition);
            background: transparent; color: var(--text-secondary); border: 1px solid var(--glass-border);
        }
        .btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--space); border: none;
        }
        .btn-sm { padding: 4px 12px; font-size: 0.6rem; }

        .conversaciones-panel { padding: 8px 12px; border-right: 1px solid var(--glass-border); max-height: 450px; overflow-y: auto; flex: 1; min-width: 210px; }
        
        .conversation-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
            background: transparent; border: 1px solid transparent; color: var(--text-primary); cursor: pointer;
            transition: var(--transition); width: 100%; text-align: left; margin-bottom: 2px;
        }
        .conversation-item:hover { background: rgba(212, 175, 55, 0.05); border-color: var(--glass-border); }
        .conversation-item.active { background: rgba(212, 175, 55, 0.08); border-color: rgba(212, 175, 55, 0.2); }
        
        .conversation-avatar {
            width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
            background: var(--bg-card); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; color: var(--gold);
        }
        .conversation-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .conversation-content { flex: 1; min-width: 0; }
        .conversation-content strong { display: block; font-size: 0.8rem; color: var(--text-primary); }
        .conversation-content span { display: block; font-size: 0.65rem; color: var(--text-muted); }

        .sin-conversaciones, .sin-mensajes { padding: 30px 10px; text-align: center; color: var(--text-muted); font-size: 0.8rem; }
        .sin-conversaciones .icono, .sin-mensajes .icono { font-size: 1.8rem; display: block; margin-bottom: 8px; }

        .chat-panel { display: flex; flex-direction: column; flex: 2; min-width: 260px; background: rgba(0,0,0,0.1); }
        .chat-header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--glass-border); background: rgba(0,0,0,0.15); }
        .chat-header .avatar { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: var(--bg-card); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; }
        .chat-header .nombre { font-weight: 600; font-size: 0.9rem; color: var(--text-primary); flex: 1; }

        .chat-messages { flex: 1; padding: 12px 16px; overflow-y: auto; max-height: 380px; display: flex; flex-direction: column; gap: 4px; }
        .chat-messages .message {
            display: flex; flex-direction: column; max-width: 78%; padding: 8px 14px; border-radius: 14px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); font-size: 0.8rem; align-self: flex-start; word-break: break-word;
        }
        .chat-messages .message.own { align-self: flex-end; background: rgba(212, 175, 55, 0.08); border-color: rgba(212, 175, 55, 0.12); }
        .chat-messages .message .message-meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 0.55rem; color: var(--text-muted); }
        .chat-messages .message .message-image img { max-width: 220px; max-height: 200px; border-radius: 8px; cursor: pointer; object-fit: contain; }

        .chat-input-area { display: flex; flex-direction: column; gap: 6px; padding: 8px 16px 12px; border-top: 1px solid var(--glass-border); background: rgba(0,0,0,0.1); }
        .chat-input-area .input-row { display: flex; gap: 8px; align-items: flex-end; }
        .chat-input-area textarea {
            flex: 1; padding: 8px 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 14px; color: var(--text-primary); font-size: 0.8rem; resize: none; outline: none; min-height: 38px; max-height: 100px;
        }
        .chat-input-area textarea:focus { border-color: var(--gold); }
        .chat-input-area .btn-enviar {
            padding: 8px 20px; border-radius: 30px; border: none; background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space); font-weight: 700; font-size: 0.75rem; cursor: pointer; white-space: nowrap;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px); display: none; justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-dark)); border: 2px solid var(--gold);
            border-radius: 20px; padding: 24px; max-width: 480px; width: 90%; max-height: 90vh; overflow-y: auto; position: relative;
        }
        .modal-content .close-btn { position: absolute; top: 12px; right: 15px; background: transparent; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }
        .modal-content h2 { color: var(--gold); font-family: 'Orbitron', monospace; font-size: 1.1rem; margin-bottom: 6px; }
        .modal-content .input-buscar {
            width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 12px; color: var(--text-primary); font-size: 0.85rem; outline: none; margin-top: 10px;
        }
        .resultados-busqueda { margin-top: 12px; max-height: 280px; overflow-y: auto; }
        .contacto-resultado { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; border: 1px solid transparent; }
        .contacto-resultado:hover { background: rgba(212, 175, 55, 0.05); border-color: var(--glass-border); }
        .contacto-avatar { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: var(--bg-card); display: flex; align-items: center; justify-content: center; color: var(--gold); }
        .contacto-info { flex: 1; }
        .contacto-info strong { font-size: 0.8rem; color: var(--text-primary); }
        .contacto-info span { font-size: 0.65rem; color: var(--text-muted); }
        .btn-agregar-contacto {
            padding: 4px 14px; border-radius: 20px; border: 1px solid var(--gold); background: transparent;
            color: var(--gold); font-size: 0.65rem; font-weight: 600; cursor: pointer;
        }
        .btn-agregar-contacto:hover { background: var(--gold); color: var(--space); }

        .modal-imagen-mensaje {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92);
            display: none; justify-content: center; align-items: center; z-index: 10000; padding: 20px;
        }
        .modal-imagen-mensaje.show { display: flex; }
        .modal-imagen-mensaje img { max-width: 90%; max-height: 85vh; border-radius: 12px; object-fit: contain; }

        .footer {
            margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: var(--text-muted);
        }
        .footer .brand { color: var(--gold); font-weight: 600; }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <div class="app">

        <header class="header">
            <a href="/" class="logo">
                <span class="logo-hex">◈</span>
                <span class="logo-text">Sariel<span>'s</span></span>
                <span class="logo-badge">✦ WEB3</span>
            </a>
            <div class="header-actions" style="display:flex;gap:8px;align-items:center;">
                <div class="idioma-selector">
                    <span>🌐</span>
                    <select id="selectorIdioma" onchange="cambiarIdioma(this.value)"></select>
                </div>
                <span class="network-badge"><span class="dot"></span> Polygon</span>
            </div>
        </header>

        <nav class="main-nav">
            <a href="/" class="nav-link">⌂ Inicio</a>
            <a href="/features/muro/muro.html" class="nav-link">◇ Muro</a>
            <a href="/features/perfil/perfil.html" class="nav-link">◆ Perfil</a>
            <a href="/features/mensajes/mensajes.html" class="nav-link active">◈ Mensajes</a>
            <a href="/features/live/live.html" class="nav-link live">◉ Live</a>
            <a href="/features/videos/videos.html" class="nav-link">🎬 Videos</a>
        </nav>

        <div class="mensajes-wrapper">
            <!-- Panel izquierdo: Conversaciones -->
            <div class="conversaciones-panel">
                <div class="mensajes-header" style="border-bottom:1px solid var(--glass-border);padding:8px 4px;">
                    <h2 style="font-size:0.85rem;">◈ Chats</h2>
                    <button class="btn btn-gold btn-sm" onclick="nuevaConversacion()">✚ Nuevo</button>
                </div>
                <div id="conversationList">
                    <div class="sin-conversaciones">
                        <span class="icono">💬</span>
                        <p>Cargando chats...</p>
                    </div>
                </div>
            </div>

            <!-- Panel derecho: Chat -->
            <div class="chat-panel">
                <div class="chat-header">
                    <div class="avatar" id="chatUserAvatar"><span>◈</span></div>
                    <span class="nombre" id="chatUserName">Selecciona una conversación</span>
                    <button class="btn btn-sm" onclick="eliminarConversacion()" style="color:var(--danger);">🗑️ Salir</button>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="sin-mensajes">
                        <span class="icono">💭</span>
                        <p>Selecciona una conversación</p>
                    </div>
                </div>

                <div class="chat-input-area">
                    <div class="input-row">
                        <button class="btn" onclick="document.getElementById('fileInput').click()" style="padding: 8px;">📎</button>
                        <input type="file" id="fileInput" accept="image/*,audio/*" style="display:none;" />
                        <textarea id="messageInput" rows="1" placeholder="Escribe un mensaje..." maxlength="2000"></textarea>
                        <button class="btn-enviar" id="sendMessageButton" onclick="enviarMensaje()">Enviar</button>
                    </div>
                    <div id="archivosSeleccionados"></div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <span><span class="brand">◈ Sariel's</span> · Red Social WEB3</span>
            <span>⚡ Powered by Polygon</span>
        </footer>

    </div>

    <!-- MODAL NUEVO CONTACTO -->
    <div class="modal-overlay" id="modalNuevoContacto">
        <div class="modal-content">
            <button class="close-btn" onclick="cerrarModalNuevoContacto()">✕</button>
            <h2>✦ Nueva conversación</h2>
            <input type="text" id="searchInputModal" class="input-buscar" placeholder="Buscar usuario..." autofocus />
            <div id="resultadosBusqueda" class="resultados-busqueda">
                <p style="text-align:center;color:var(--text-muted);font-size:0.75rem;padding:12px;">Escribe al menos 2 caracteres</p>
            </div>
        </div>
    </div>

    <!-- MODAL IMAGEN -->
    <div class="modal-imagen-mensaje" id="modalImagenMensaje">
        <button style="position:absolute;top:20px;right:30px;background:transparent;border:none;color:#fff;font-size:2rem;cursor:pointer;" onclick="document.getElementById('modalImagenMensaje').classList.remove('show')">×</button>
        <img src="" alt="Imagen ampliada" />
    </div>

    <!-- SCRIPTS DE PRODUCCIÓN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/app.js"></script>
    <script src="/features/shared/js/idiomas.js"></script>
    <script src="./mensajes.js"></script>

    <script>
        // Evento de búsqueda de usuarios usando el endpoint API
        document.getElementById('searchInputModal')?.addEventListener('input', async function(e) {
            const query = e.target.value.trim();
            const resultados = document.getElementById('resultadosBusqueda');
            if (!resultados) return;

            if (query.length < 2) {
                resultados.innerHTML = '<p style="text-align:center;color:var(--text-muted);font-size:0.75rem;padding:12px;">Escribe al menos 2 caracteres</p>';
                return;
            }

            try {
                const response = await fetch(`/api/mensajes/usuarios?query=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (!data.success || !data.usuarios || data.usuarios.length === 0) {
                    resultados.innerHTML = '<p style="text-align:center;color:var(--text-muted);font-size:0.75rem;padding:12px;">No se encontraron usuarios</p>';
                    return;
                }

                resultados.innerHTML = data.usuarios.map(u => `
                    <div class="contacto-resultado">
                        <div class="contacto-avatar">${u.avatar_url ? `<img src="${u.avatar_url}" style="width:100%;height:100%;object-fit:cover;"/>` : '◈'}</div>
                        <div class="contacto-info">
                            <strong>${u.username || 'Usuario'}</strong>
                        </div>
                        <button class="btn-agregar-contacto" onclick="iniciarConversacionConUsuario('${u.id}')">Chatear</button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error en búsqueda de usuarios:', error);
                resultados.innerHTML = '<p style="text-align:center;color:var(--text-muted);font-size:0.75rem;padding:12px;">Error al buscar usuarios</p>';
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.getElementById('modalImagenMensaje')?.classList.remove('show');
                cerrarModalNuevoContacto();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof cargarIdiomas === 'function') cargarIdiomas();
            if (typeof cargarConversaciones === 'function') cargarConversaciones();
        });
    </script>
</body>
</html>
