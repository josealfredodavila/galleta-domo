<script>
    // ================================================================
    // SARIEL'S - MENSAJES COMPLETO
    // VERSIÓN INLINE - SOLUCIÓN DEFINITIVA
    // ================================================================
    // INCLUYE:
    // ✅ Conversaciones
    // ✅ Mensajes en tiempo real
    // ✅ Videollamadas con LiveKit
    // ✅ Audio/Archivos
    // ✅ RPC de Supabase
    // ✅ Bloqueos, reportes, búsqueda
    // ================================================================

    // ================================================================
    // CONFIGURACIÓN GLOBAL
    // ================================================================

    var API_URL = window.location.origin;
    var SUPABASE_URL = 'https://zultnlogdoajehbswlih.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_S3jONAz3mRO4JKBRhUdI1A_-nsyVhKu';

    var supabase = window.supabase || supabaseClient;
    var usuarioActual = null;
    var conversacionActual = null;
    var mensajesCache = {};
    var realtimeChannel = null;
    var mediaRecorder = null;
    var audioChunks = [];
    var grabacionActiva = false;
    var archivosSeleccionados = [];
    var callState = {
        active: false,
        room: null,
        localTrack: null,
        audioTrack: null,
        screenTrack: null,
        callId: null,
        isInitiator: false,
        startTime: null,
        incomingCallId: null,
        incomingFrom: null,
        participants: [],
        durationInterval: null,
        _ringInterval: null
    };
    var callChannel = null;
    var callListeners = [];
    var audioMuted = false;
    var videoMuted = false;
    var screenSharing = false;

    // ================================================================
    // TOAST - NOTIFICACIONES
    // ================================================================

    function showToast(msg, type) {
        if (type === void 0) type = '';
        try {
            var t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.className = 'toast';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.className = 'toast show';
            if (type === 'error') t.classList.add('error');
            else if (type === 'warning') t.classList.add('warning');
            else if (type === 'success') t.classList.add('success');
            else t.classList.remove('error', 'warning', 'success');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(function() {
                t.classList.remove('show');
            }, 3500);
        } catch (e) {
            console.warn('Toast no disponible:', e);
            console.log('[' + (type || 'info') + '] ' + msg);
        }
    }

    // ================================================================
    // ESCAPE HTML
    // ================================================================

    function escapeHTML(texto) {
        if (!texto) return '';
        var div = document.createElement('div');
        div.textContent = texto;
        return div.innerHTML;
    }

    // ================================================================
    // OBTENER SESIÓN
    // ================================================================

    async function getSession() {
        try {
            var sessionData = await supabase.auth.getSession();
            if (sessionData.error) throw sessionData.error;
            return sessionData.data.session;
        } catch (e) {
            console.error('Error obteniendo sesión:', e);
            return null;
        }
    }

    // ================================================================
    // OBTENER USUARIO ACTUAL
    // ================================================================

    async function obtenerUsuarioActual() {
        try {
            var session = await getSession();
            if (session) {
                usuarioActual = session.user;
                return session.user;
            }
            return null;
        } catch (e) {
            console.error('Error obteniendo usuario:', e);
            return null;
        }
    }

    // ================================================================
    // VERIFICAR AUTENTICACIÓN
    // ================================================================

    async function verificarAutenticacion() {
        try {
            var session = await getSession();
            if (!session) {
                showToast('⚠️ Inicia sesión para usar el chat', 'error');
                return false;
            }
            usuarioActual = session.user;
            return true;
        } catch (e) {
            console.error('Error verificando autenticación:', e);
            return false;
        }
    }

    // ================================================================
    // CARGAR CONVERSACIONES (RPC)
    // ================================================================

    async function cargarConversaciones() {
        try {
            var ok = await verificarAutenticacion();
            if (!ok) return;

            var result = await supabase.rpc('obtener_conversaciones_usuario', {
                p_usuario_id: usuarioActual.id
            });

            if (result.error) throw result.error;

            var container = document.getElementById('conversacionesList');
            if (!container) return;

            if (!result.data || result.data.length === 0) {
                container.innerHTML = `
                    <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:0.8rem;">
                        ◈ No tienes conversaciones<br>
                        <span style="font-size:0.7rem;">Presiona ✎ para iniciar una</span>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            for (var i = 0; i < result.data.length; i++) {
                var conv = result.data[i];
                var otro = (conv.otros_participantes && conv.otros_participantes[0]) || { nombre: 'Usuario', avatar_url: null };
                var ultimo = conv.ultimo_mensaje || { contenido: 'Sin mensajes', created_at: '' };
                var hora = ultimo.created_at ? new Date(ultimo.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                var avatarInicial = otro.nombre ? otro.nombre.charAt(0).toUpperCase() : '◈';

                var item = document.createElement('div');
                item.className = 'conv-item' + (conv.id === (conversacionActual ? conversacionActual.id : null) ? ' active' : '');
                item.dataset.id = conv.id;
                item.onclick = function(id) {
                    return function() {
                        abrirConversacion(id);
                    };
                }(conv.id);

                var avatarHTML = otro.avatar_url ?
                    '<img src="' + otro.avatar_url + '" alt="' + escapeHTML(otro.nombre) + '" />' :
                    avatarInicial;

                var badgeHTML = '';
                if (ultimo.is_read === false && ultimo.sender_id !== usuarioActual.id) {
                    badgeHTML = '<span class="conv-badge">●</span>';
                }

                item.innerHTML = `
                    <div class="conv-avatar">${avatarHTML}</div>
                    <div class="conv-info">
                        <div class="conv-nombre">${escapeHTML(otro.nombre || 'Usuario')}</div>
                        <div class="conv-msg">${escapeHTML(ultimo.contenido || 'Sin mensajes')}</div>
                    </div>
                    <div class="conv-meta">
                        <div class="conv-hora">${hora}</div>
                        ${badgeHTML}
                    </div>
                `;

                container.appendChild(item);
            }

            // Si hay una conversación activa, actualizarla
            if (conversacionActual) {
                abrirConversacion(conversacionActual.id);
            }

        } catch (e) {
            console.error('Error cargando conversaciones:', e);
            showToast('❌ Error al cargar conversaciones', 'error');
        }
    }

    // ================================================================
    // ABRIR CONVERSACIÓN (RPC)
    // ================================================================

    async function abrirConversacion(conversacionId) {
        try {
            var ok = await verificarAutenticacion();
            if (!ok) return;

            // Actualizar UI de conversaciones
            var items = document.querySelectorAll('.conv-item');
            for (var i = 0; i < items.length; i++) {
                items[i].classList.remove('active');
            }
            var selected = document.querySelector('.conv-item[data-id="' + conversacionId + '"]');
            if (selected) selected.classList.add('active');

            // Obtener info del otro usuario
            var otroResult = await supabase
                .from('conversation_participants')
                .select('user_id, usuarios(nombre, avatar_url)')
                .eq('conversation_id', conversacionId)
                .neq('user_id', usuarioActual.id)
                .single();

            if (otroResult.error && otroResult.error.code !== 'PGRST116') {
                throw otroResult.error;
            }

            var otro = null;
            if (otroResult.data) {
                otro = otroResult.data.usuarios || { nombre: 'Usuario', avatar_url: null };
                otro.id = otroResult.data.user_id;
            }

            conversacionActual = {
                id: conversacionId,
                otro: otro || { id: null, nombre: 'Usuario', avatar_url: null }
            };

            if (otro) {
                document.getElementById('chatNombre').textContent = otro.nombre || 'Usuario';
                document.getElementById('chatAvatar').textContent = otro.nombre ? otro.nombre.charAt(0).toUpperCase() : '◈';
            }

            // Obtener mensajes con RPC
            var mensajesResult = await supabase.rpc('obtener_mensajes_conversacion', {
                p_conversacion_id: conversacionId,
                p_usuario_id: usuarioActual.id,
                p_limite: 50,
                p_desde: null
            });

            if (mensajesResult.error) throw mensajesResult.error;

            var container = document.getElementById('chatMessages');
            if (!container) return;

            if (!mensajesResult.data || mensajesResult.data.length === 0) {
                container.innerHTML = `
                    <div class="empty-chat">
                        <span class="icon">◈</span>
                        <h3>Sin mensajes</h3>
                        <p>Envía el primer mensaje</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            for (var j = 0; j < mensajesResult.data.length; j++) {
                var msg = mensajesResult.data[j];
                var esEnviado = msg.sender_id === usuarioActual.id;
                var html = crearMensajeHTML(msg, esEnviado);
                container.innerHTML += html;
            }

            container.scrollTop = container.scrollHeight;

            // Marcar mensajes como leídos
            var hayNoLeidos = mensajesResult.data.some(function(m) {
                return m.sender_id !== usuarioActual.id && !m.is_read;
            });

            if (hayNoLeidos) {
                marcarLeidos(conversacionId);
            }

            // Unirse al canal de tiempo real
            suscribirseAMensajes(conversacionId);

        } catch (e) {
            console.error('Error abriendo conversación:', e);
            showToast('❌ Error al abrir conversación', 'error');
        }
    }

    // ================================================================
    // CREAR MENSAJE HTML
    // ================================================================

    function crearMensajeHTML(msg, esEnviado) {
        var hora = msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

        var contenido = msg.contenido || '';

        if (msg.media_url) {
            if (msg.tipo === 'imagen') {
                contenido = '<img src="' + msg.media_url + '" alt="' + escapeHTML(msg.nombre_archivo || 'Imagen') + '" loading="lazy" />';
            } else if (msg.tipo === 'video') {
                contenido = '<video controls src="' + msg.media_url + '"></video>';
            } else if (msg.tipo === 'audio') {
                contenido = '<audio controls src="' + msg.media_url + '"></audio>';
            } else {
                contenido = '📎 <a href="' + msg.media_url + '" target="_blank" style="color:var(--gold);">' + escapeHTML(msg.nombre_archivo || 'Archivo') + '</a>';
            }
        }

        var html = '';

        if (esEnviado) {
            html = `
                <div class="msg-wrapper enviado">
                    <div class="burbuja">${contenido}</div>
                    <div class="meta">
                        ${hora}
                        ${msg.is_read ? '<span class="leido leido">◆◆</span>' : '<span class="leido no-leido">◈◈</span>'}
                    </div>
                </div>
            `;
        } else {
            var avatarInicial = msg.sender_nombre ? msg.sender_nombre.charAt(0).toUpperCase() : '◈';
            var avatarHTML = msg.sender_avatar ?
                '<img src="' + msg.sender_avatar + '" alt="' + escapeHTML(msg.sender_nombre) + '" />' :
                avatarInicial;

            html = `
                <div class="msg-wrapper recibido">
                    <div class="fila">
                        <div class="avatar estado-conectado">
                            ${avatarHTML}
                        </div>
                        <div class="burbuja">${contenido}</div>
                    </div>
                    <div class="meta">${hora}</div>
                </div>
            `;
        }

        return html;
    }

    // ================================================================
    // ENVIAR MENSAJE
    // ================================================================

    async function enviarMensaje() {
        var input = document.getElementById('chatInput');
        var texto = input.value.trim();

        if (!texto || !conversacionActual) {
            if (!conversacionActual) {
                showToast('⚠️ Selecciona una conversación', 'warning');
            }
            return;
        }

        try {
            var ok = await verificarAutenticacion();
            if (!ok) return;

            var mensaje = {
                conversation_id: conversacionActual.id,
                sender_id: usuarioActual.id,
                contenido: texto,
                tipo: 'texto',
                is_read: false,
                is_deleted: false
            };

            var result = await supabase
                .from('messages')
                .insert(mensaje)
                .select()
                .single();

            if (result.error) throw result.error;

            input.value = '';

            // Agregar a UI
            var container = document.getElementById('chatMessages');
            var empty = container.querySelector('.empty-chat');
            if (empty) empty.remove();

            var html = crearMensajeHTML(result.data, true);
            container.innerHTML += html;
            container.scrollTop = container.scrollHeight;

            // Actualizar lista de conversaciones
            cargarConversaciones();

        } catch (e) {
            console.error('Error enviando mensaje:', e);
            showToast('❌ Error al enviar mensaje', 'error');
        }
    }

    // ================================================================
    // MARCAR COMO LEÍDOS (RPC)
    // ================================================================

    async function marcarLeidos(conversacionId) {
        try {
            if (!conversacionActual || !conversacionActual.otro) return;

            var result = await supabase.rpc('marcar_mensajes_leidos', {
                p_remitente_id: conversacionActual.otro.id,
                p_destinatario_id: usuarioActual.id
            });

            if (result.error) throw result.error;

        } catch (e) {
            console.error('Error marcando leídos:', e);
        }
    }

    // ================================================================
    // SUSCRIBIRSE A MENSAJES EN TIEMPO REAL
    // ================================================================

    function suscribirseAMensajes(conversacionId) {
        if (realtimeChannel) {
            try {
                supabase.removeChannel(realtimeChannel);
            } catch (e) {}
            realtimeChannel = null;
        }

        realtimeChannel = supabase
            .channel('mensajes-' + conversacionId)
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'messages',
                filter: 'conversation_id=eq.' + conversacionId
            }, function(payload) {
                var msg = payload.new;
                if (msg.sender_id !== usuarioActual.id) {
                    // Mensaje recibido
                    var container = document.getElementById('chatMessages');
                    var empty = container.querySelector('.empty-chat');
                    if (empty) empty.remove();

                    var html = crearMensajeHTML(msg, false);
                    container.innerHTML += html;
                    container.scrollTop = container.scrollHeight;

                    // Marcar como leído
                    marcarLeidos(conversacionId);

                    // Actualizar lista de conversaciones
                    cargarConversaciones();
                }
            })
            .subscribe();

        console.log('📡 Suscrito a mensajes de la conversación:', conversacionId);
    }

    // ================================================================
    // ELIMINAR MENSAJE (SOFT DELETE)
    // ================================================================

    async function eliminarMensaje(messageId) {
        try {
            var ok = await verificarAutenticacion();
            if (!ok) return;

            if (!confirm('¿Eliminar este mensaje?')) return;

            var result = await supabase
                .from('messages')
                .update({ is_deleted: true, deleted_at: new Date().toISOString() })
                .eq('id', messageId)
                .eq('sender_id', usuarioActual.id);

            if (result.error) throw result.error;

            showToast('🗑️ Mensaje eliminado', 'success');
            abrirConversacion(conversacionActual.id);

        } catch (e) {
            console.error('Error eliminando mensaje:', e);
            showToast('❌ Error al eliminar mensaje', 'error');
        }
    }

    // ================================================================
    // EDITAR MENSAJE
    // ================================================================

    async function editarMensaje(messageId, nuevoContenido) {
        try {
            var ok = await verificarAutenticacion();
            if (!ok) return;

            if (!nuevoContenido || !nuevoContenido.trim()) {
                showToast('⚠️ El mensaje no puede estar vacío', 'warning');
                return;
            }

            var result = await supabase
                .from('messages')
                .update({
                    contenido: nuevoContenido.trim(),
                    editado: true,
                    updated_at: new Date().toISOString()
                })
                .eq('id', messageId)
                .eq('sender_id', usuarioActual.id);

            if (result.error) throw result.error;

            showToast('✏️ Mensaje editado', 'success');
            abrirConversacion(conversacionActual.id);

        } catch (e) {
            console.error('Error editando mensaje:', e);
            showToast('❌ Error al editar mensaje', 'error');
        }
    }

    // ================================================================
    // ELIMINAR CONVERSACIÓN
    // ================================================================

    async function eliminarConversacion(conversacionId) {
        try {
            var ok = await verificarAutenticacion();
            if (!ok) return;

            if (!confirm('¿Eliminar esta conversación?')) return;

            var result = await supabase
                .from('conversation_participants')
                .delete()
                .eq('conversation_id', conversacionId)
                .eq('user_id', usuarioActual.id);

            if (result.error) throw result.error;

            if (conversacionActual && conversacionActual.id === conversacionId) {
                conversacionActual = null;
                document.getElementById('chatNombre').textContent = 'Selecciona una conversación';
                document.getElementById('chatMessages').innerHTML = `
                    <div class="empty-chat">
                        <span class="icon">◈</span>
                        <h3>Selecciona una conversación</h3>
                        <p>Elige un chat para empezar a hablar</p>
                    </div>
                `;
            }

            showToast('🗑️ Conversación eliminada', 'success');
            cargarConversaciones();

        } catch (e) {
            console.error('Error eliminando conversación:', e);
            showToast('❌ Error al eliminar conversación', 'error');
        }
    }

    // ================================================================
    // BLOQUEAR USUARIO (RPC)
    // ================================================================

    async function bloquearUsuario(usuarioId) {
        try {
            var ok = await verificarAutenticacion();
            if (!ok) return;

            if (!confirm('¿Bloquear a este usuario?')) return;

            var result = await supabase.rpc('bloquear_usuario', {
                p_usuario_id: usuarioActual.id,
                p_bloqueado_id: usuarioId
            });

            if (result.error) throw result.error;

            showToast('🚫 Usuario bloqueado', 'success');
            eliminarConversacion(conversacionActual.id);

        } catch (e) {
            console.error('Error bloqueando usuario:', e);
            showToast('❌ Error al bloquear usuario', 'error');
        }
    }

    // ================================================================
    // REPORTAR MENSAJE
    // ================================================================

    async function reportarMensaje(messageId, motivo) {
        try {
            var ok = await verificarAutenticacion();
            if (!ok) return;

            if (!motivo || !motivo.trim()) {
                showToast('⚠️ Escribe un motivo para el reporte', 'warning');
                return;
            }

            var result = await supabase
                .from('mensajes_reportes')
                .insert({
                    mensaje_id: messageId,
                    usuario_id: usuarioActual.id,
                    motivo: motivo.trim()
                });

            if (result.error) throw result.error;

            showToast('⚠️ Mensaje reportado', 'success');

        } catch (e) {
            console.error('Error reportando mensaje:', e);
            showToast('❌ Error al reportar mensaje', 'error');
        }
    }

    // ================================================================
    // BUSCAR EN CONVERSACIÓN
    // ================================================================

    async function buscarEnConversacion(query) {
        if (!query || !query.trim()) {
            showToast('⚠️ Escribe algo para buscar', 'warning');
            return;
        }

        if (!conversacionActual) {
            showToast('⚠️ Selecciona una conversación', 'error');
            return;
        }

        try {
            var session = await getSession();
            if (!session) return;

            var result = await supabase.rpc('buscar_mensajes_conversacion', {
                p_conversacion_id: conversacionActual.id,
                p_usuario_id: session.user.id,
                p_busqueda: query.trim(),
                p_limite: 50
            });

            if (result.error) throw result.error;

            var container = document.getElementById('chatMessages');

            if (!result.data || result.data.length === 0) {
                container.innerHTML = `
                    <div class="empty-chat">
                        <span class="icon">◈</span>
                        <h3>No se encontraron resultados</h3>
                        <p>No hay mensajes que coincidan con "${escapeHTML(query)}"</p>
                        <button onclick="abrirConversacion('${conversacionActual.id}')" style="margin-top:12px;padding:8px 20px;background:var(--gold);color:var(--space);border:none;border-radius:8px;cursor:pointer;">
                            ↩ Volver
                        </button>
                    </div>
                `;
                return;
            }

            var html = '';
            for (var i = 0; i < result.data.length; i++) {
                var msg = result.data[i];
                var esEnviado = msg.sender_id === session.user.id;
                html += crearMensajeHTML(msg, esEnviado);
            }

            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;

            showToast('🔍 Encontrados ' + result.data.length + ' mensajes', 'success');

        } catch (e) {
            console.error('Error buscando:', e);
            showToast('❌ Error al buscar', 'error');
        }
    }

    // ================================================================
    // NUEVA CONVERSACIÓN
    // ================================================================

    function nuevaConversacion() {
        var modal = document.getElementById('modalNuevoContacto');
        if (modal) {
            modal.classList.add('show');
            var input = document.getElementById('searchInputModal');
            if (input) {
                input.value = '';
                input.focus();
            }
            var resultados = document.getElementById('resultadosBusqueda');
            if (resultados) {
                resultados.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:20px;">Escribe al menos 2 caracteres para buscar</div>';
            }
        }
    }

    function cerrarModalNuevoContacto() {
        var modal = document.getElementById('modalNuevoContacto');
        if (modal) {
            modal.classList.remove('show');
        }
    }

    // ================================================================
    // BUSCAR CONTACTOS
    // ================================================================

    async function buscarContactos(query) {
        if (!query || query.length < 2) {
            var resultados = document.getElementById('resultadosBusqueda');
            if (resultados) {
                resultados.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:20px;">Escribe al menos 2 caracteres para buscar</div>';
            }
            return;
        }

        try {
            var session = await getSession();
            if (!session) return;

            var result = await supabase
                .from('usuarios')
                .select('id, nombre, email, avatar_url')
                .neq('id', session.user.id)
                .or('nombre.ilike.%' + query + '%,email.ilike.%' + query + '%')
                .limit(10);

            if (result.error) throw result.error;

            var container = document.getElementById('resultadosBusqueda');
            if (!container) return;

            if (!result.data || result.data.length === 0) {
                container.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:20px;">No se encontraron usuarios</div>';
                return;
            }

            var html = '';
            for (var i = 0; i < result.data.length; i++) {
                var user = result.data[i];
                var avatarInicial = user.nombre ? user.nombre.charAt(0).toUpperCase() : '◈';
                var avatarHTML = user.avatar_url ?
                    '<img src="' + user.avatar_url + '" style="width:40px;height:40px;border-radius:50%;object-fit:cover;" />' :
                    avatarInicial;

                html += `
                    <div class="resultado-item" onclick="agregarContacto('${user.id}')" style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid rgba(212,175,55,0.05);cursor:pointer;transition:all 0.3s;">
                        <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--green-deep),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:700;color:white;font-size:1rem;flex-shrink:0;overflow:hidden;">
                            ${avatarHTML}

    function seleccionarArchivo() {
        var input = document.getElementById('fileInput');
        if (input) {
            input.click();
        }
    }

    async function handleFileSelect(event) {
        var files = event.target.files;
        if (!files || files.length === 0) return;

        for (var i = 0; i < files.length; i++) {
            await subirArchivo(files[i]);
        }

        event.target.value = '';
    }

    async function subirArchivo(file) {
        try {
            var ok = await verificarAutenticacion();
            if (!ok) return;

            if (!conversacionActual) {
                showToast('⚠️ Selecciona una conversación', 'error');
                return;
            }

            if (file.size > 50 * 1024 * 1024) {
                showToast('⚠️ Archivo excede 50MB', 'error');
                return;
            }

            // Subir a Supabase Storage
            var ext = file.name.split('.').pop() || 'bin';
            var fileName = Date.now() + '_' + Math.random().toString(36).substr(2, 6) + '.' + ext;
            var filePath = 'mensajes/' + fileName;

            // Determinar tipo de archivo
            var tipo = 'archivo';
            if (file.type.startsWith('image/')) tipo = 'imagen';
            else if (file.type.startsWith('video/')) tipo = 'video';
            else if (file.type.startsWith('audio/')) tipo = 'audio';

            var uploadResult = await supabase.storage
                .from('chat-files')
                .upload(filePath, file, {
                    contentType: file.type,
                    cacheControl: '3600',
                    upsert: false
                });

            if (uploadResult.error) throw uploadResult.error;

            var publicUrlResult = supabase.storage
                .from('chat-files')
                .getPublicUrl(filePath);

            var mensaje = {
                conversation_id: conversacionActual.id,
                sender_id: usuarioActual.id,
                contenido: file.name,
                media_url: publicUrlResult.data.publicUrl,
                tipo: tipo,
                nombre_archivo: file.name,
                tamano_bytes: file.size,
                mime_type: file.type,
                is_read: false,
                is_deleted: false
            };

            var result = await supabase
                .from('messages')
                .insert(mensaje)
                .select()
                .single();

            if (result.error) throw result.error;

            // Agregar a UI
            var container = document.getElementById('chatMessages');
            var empty = container.querySelector('.empty-chat');
            if (empty) empty.remove();

            var html = crearMensajeHTML(result.data, true);
            container.innerHTML += html;
            container.scrollTop = container.scrollHeight;

            // Actualizar lista de conversaciones
            cargarConversaciones();

            showToast('✅ Archivo subido: ' + file.name, 'success');

        } catch (e) {
            console.error('Error subiendo archivo:', e);
            showToast('❌ Error al subir archivo', 'error');
        }
    }

    // ================================================================
    // GRABAR AUDIO
    // ================================================================

    async function toggleGrabacionVoz() {
        var btn = document.getElementById('btnAudio');

        if (grabacionActiva) {
            // Detener grabación
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                mediaRecorder = null;
            }
            grabacionActiva = false;
            if (btn) {
                btn.classList.remove('grabando');
                btn.textContent = '🎙️';
            }
            showToast('⏹️ Grabación detenida', '');
            return;
        }

        try {
            var stream = await navigator.mediaDevices.getUserMedia({ audio: true });

            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = function(event) {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = async function() {
                var audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                var audioFile = new File([audioBlob], 'audio-' + Date.now() + '.webm', { type: 'audio/webm' });
                await subirArchivo(audioFile);
                stream.getTracks().forEach(function(track) { track.stop(); });
            };

            mediaRecorder.start();
            grabacionActiva = true;

            if (btn) {
                btn.classList.add('grabando');
                btn.textContent = '⏹️';
            }

            showToast('🎙️ Grabando... presiona de nuevo para detener', '');

        } catch (e) {
            console.error('Error grabando audio:', e);
            showToast('❌ Error al acceder al micrófono', 'error');
        }
    }

    // ================================================================
    // VIDEOLLAMADA - FUNCIONES PRINCIPALES
    // ================================================================

    async function obtenerTokenLiveKit(roomName, participantName) {
        try {
            var session = await getSession();
            if (!session) {
                throw new Error('No autenticado');
            }

            var response = await fetch('/api/livekit/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + session.access_token
                },
                body: JSON.stringify({
                    roomName: roomName,
                    participantName: participantName
                })
            });

            if (!response.ok) {
                var errorData = await response.json();
                throw new Error(errorData.error || 'Error al obtener token');
            }

            var data = await response.json();
            return data;

        } catch (e) {
            console.error('Error obteniendo token LiveKit:', e);
            throw e;
        }
    }

    async function iniciarVideollamada() {
        if (!conversacionActual) {
            showToast('⚠️ Selecciona una conversación para llamar', 'warning');
            return;
        }

        if (callState.active) {
            mostrarLlamada();
            return;
        }

        try {
            var session = await getSession();
            if (!session) {
                showToast('⚠️ Inicia sesión para llamar', 'error');
                return;
            }

            // Verificar si el otro usuario existe
            var usuarioResult = await supabase
                .from('usuarios')
                .select('id, nombre')
                .eq('id', conversacionActual.otro.id)
                .single();

            if (usuarioResult.error) {
                showToast('❌ Usuario no encontrado', 'error');
                return;
            }

            // Verificar si ya hay una llamada activa
            var llamadaActiva = await supabase
                .from('llamadas')
                .select('id, estado')
                .or('and(creador_id.eq.' + session.user.id + ',destinatario_id.eq.' + conversacionActual.otro.id + '),and(creador_id.eq.' + conversacionActual.otro.id + ',destinatario_id.eq.' + session.user.id + ')')
                .in('estado', ['ringing', 'active'])
                .maybeSingle();

            if (llamadaActiva.data) {
                showToast('⚠️ Ya hay una llamada en curso con este usuario', 'warning');
                return;
            }

            // Crear la llamada en la BD
            var callId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).substr(2);
            var roomName = 'call_' + callId;

            var crearLlamada = await supabase
                .from('llamadas')
                .insert({
                    id: callId,
                    creador_id: session.user.id,
                    destinatario_id: conversacionActual.otro.id,
                    tipo: 'video',
                    estado: 'ringing',
                    room_name: roomName,
                    conversation_id: conversacionActual.id
                });

            if (crearLlamada.error) throw crearLlamada.error;

            // Registrar participante origen
            await supabase
                .from('llamadas_participantes')
                .insert({
                    llamada_id: callId,
                    usuario_id: session.user.id,
                    rol: 'creador',
                    estado: 'conectado',
                    entro_at: new Date().toISOString()
                });

            // Guardar estado de la llamada
            callState.callId = callId;
            callState.isInitiator = true;
            callState.active = true;

            // Mostrar la interfaz de llamada
            mostrarLlamada();

            // Obtener y conectar a LiveKit
            await conectarALiveKit(roomName, session.user.id, callId);

            // Iniciar el temporizador de duración
            iniciarContadorDuracion();

            // Suscribirse a cambios en la llamada
            suscribirseALlamada(callId);

            showToast('📞 Llamando a ' + (conversacionActual.otro.nombre || 'usuario') + '...', '');

            // Actualizar botón
            var btnCall = document.getElementById('btnVideoCall');
            if (btnCall) {
                btnCall.textContent = '📞';
                btnCall.classList.add('active-call');
            }

        } catch (e) {
            console.error('Error iniciando videollamada:', e);
            showToast('❌ Error al iniciar llamada: ' + e.message, 'error');
            limpiarLlamada();
        }
    }

    async function conectarALiveKit(roomName, participantId, callId) {
        try {
            // Obtener token del servidor
            var tokenData = await obtenerTokenLiveKit(roomName, participantId);

            // Verificar que LiveKit está cargado
            if (typeof LivekitClient === 'undefined') {
                showToast('⚠️ LiveKit no está cargado. Recarga la página.', 'error');
                return;
            }

            // Conectar a LiveKit
            var room = new LivekitClient.Room();

            room.on(LivekitClient.RoomEvent.TrackSubscribed, function(track, publication, participant) {
                if (track.kind === 'video' && !track.isLocal) {
                    var videoElement = document.getElementById('remoteVideo');
                    if (videoElement) {
                        track.attach(videoElement);
                        var placeholder = document.getElementById('remoteAvatarPlaceholder');
                        if (placeholder) placeholder.style.display = 'none';
                    }
                }
                if (track.kind === 'audio' && !track.isLocal) {
                    track.attach();
                }
            });

            room.on(LivekitClient.RoomEvent.ParticipantConnected, function(participant) {
                actualizarParticipantes(room);
                showToast('👤 ' + (participant.name || 'Usuario') + ' se unió a la llamada', 'success');
            });

            room.on(LivekitClient.RoomEvent.ParticipantDisconnected, function(participant) {
                actualizarParticipantes(room);
                showToast('👤 ' + (participant.name || 'Usuario') + ' abandonó la llamada', 'warning');
            });

            room.on(LivekitClient.RoomEvent.Disconnected, function() {
                if (callState.active) {
                    colgarLlamada();
                }
            });

            await room.connect(tokenData.url, tokenData.token);

            // Publicar tracks locales
            await publicarTracksLocales(room);

            callState.room = room;
            callState.active = true;

            // Actualizar participantes iniciales
            actualizarParticipantes(room);

            showToast('✅ Conectado a la videollamada', 'success');

        } catch (e) {
            console.error('Error conectando a LiveKit:', e);
            showToast('❌ Error al conectar a la videollamada: ' + e.message, 'error');
            colgarLlamada();
            throw e;
        }
    }

    async function publicarTracksLocales(room) {
        try {
            var stream = await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: {
                    facingMode: 'user',
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            });

            var audioTrack = stream.getAudioTracks()[0];
            if (audioTrack) {
                await room.localParticipant.publishTrack(audioTrack, {
                    name: 'microphone',
                    source: LivekitClient.TrackSource.Microphone
                });
                callState.audioTrack = audioTrack;
            }

            var videoTrack = stream.getVideoTracks()[0];
            if (videoTrack) {
                await room.localParticipant.publishTrack(videoTrack, {
                    name: 'camera',
                    source: LivekitClient.TrackSource.Camera
                });
                callState.localTrack = videoTrack;

                var localVideo = document.getElementById('localVideo');
                if (localVideo) {
                    localVideo.srcObject = new MediaStream([videoTrack]);
                    var placeholder = document.getElementById('localAvatarPlaceholder');
                    if (placeholder) placeholder.style.display = 'none';
                }
            }

            return stream;

        } catch (e) {
            console.error('Error publicando tracks locales:', e);
            // Intentar solo audio
            try {
                var audioOnly = await navigator.mediaDevices.getUserMedia({ audio: true });
                var audioTrack = audioOnly.getAudioTracks()[0];
                if (audioTrack) {
                    await room.localParticipant.publishTrack(audioTrack, {
                        name: 'microphone',
                        source: LivekitClient.TrackSource.Microphone
                    });
                    callState.audioTrack = audioTrack;
                    showToast('🎤 Audio disponible (cámara no accesible)', 'warning');
                }
            } catch (audioError) {
                showToast('⚠️ No se pudo acceder a cámara ni micrófono', 'error');
            }
        }
    }

    function mostrarLlamada() {
        var overlay = document.getElementById('callOverlay');
        if (overlay) {
            overlay.classList.add('show');
        }

        document.getElementById('remoteAvatarPlaceholder').style.display = 'block';
        document.getElementById('localAvatarPlaceholder').style.display = 'block';
        document.getElementById('remoteVideo').srcObject = null;
        document.getElementById('localVideo').srcObject = null;
    }

    function ocultarLlamada() {
        var overlay = document.getElementById('callOverlay');
        if (overlay) {
            overlay.classList.remove('show');
        }
    }

    function minimizarLlamada() {
        ocultarLlamada();
        showToast('📹 Llamada minimizada', '');
    }

    function iniciarContadorDuracion() {
        callState.startTime = Date.now();
        if (callState.durationInterval) {
            clearInterval(callState.durationInterval);
        }

        callState.durationInterval = setInterval(function() {
            if (!callState.active) {
                clearInterval(callState.durationInterval);
                return;
            }
            var elapsed = Math.floor((Date.now() - callState.startTime) / 1000);
            var mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            var secs = String(elapsed % 60).padStart(2, '0');
            var durationEl = document.getElementById('callDuration');
            if (durationEl) {
                durationEl.textContent = mins + ':' + secs;
            }
        }, 1000);
    }

    function suscribirseALlamada(callId) {
        if (callChannel) {
            try {
                supabase.removeChannel(callChannel);
            } catch (e) {}
            callChannel = null;
        }

        callChannel = supabase
            .channel('call-' + callId)
            .on('postgres_changes', {
                event: 'UPDATE',
                schema: 'public',
                table: 'llamadas',
                filter: 'id=eq.' + callId
            }, function(payload) {
                manejarCambioLlamada(payload.new);
            })
            .subscribe();
    }

    function manejarCambioLlamada(data) {
        console.log('Cambio en llamada:', data);

        if (data.estado === 'ended' || data.estado === 'rejected' || data.estado === 'missed') {
            if (callState.active) {
                showToast('📞 La llamada ha terminado', 'warning');
                colgarLlamada();
            }
        }

        if (data.estado === 'active' && callState.isInitiator) {
            showToast('✅ Llamada conectada', 'success');
        }
    }

    function suscribirseALlamadas() {
        callListeners.forEach(function(listener) {
            try {
                supabase.removeChannel(listener);
            } catch (e) {}
        });
        callListeners = [];

        getSession().then(function(session) {
            if (!session) return;

            var channel = supabase
                .channel('llamadas-entrantes')
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'llamadas'
                }, function(payload) {
                    var data = payload.new;
                    if (data.estado === 'ringing' && usuarioActual && data.destinatario_id === usuarioActual.id) {
                        mostrarLlamadaEntrante(data);
                    }
                })
                .subscribe();

            callListeners.push(channel);
        });
    }

    function mostrarLlamadaEntrante(data) {
        if (callState.active) {
            rechazarLlamada(data.id);
            return;
        }

        var incoming = document.getElementById('callIncoming');
        if (incoming && incoming.classList.contains('show')) {
            return;
        }

        callState.incomingCallId = data.id;
        callState.incomingFrom = data.creador_id;

        supabase
            .from('usuarios')
            .select('nombre, avatar_url')
            .eq('id', data.creador_id)
            .single()
            .then(function(result) {
                if (!result.error && result.data) {
                    document.getElementById('callerName').textContent = result.data.nombre || 'Usuario';
                    var avatar = document.getElementById('callerAvatar');
                    if (result.data.avatar_url) {
                        avatar.innerHTML = '';
                    } else {
                        avatar.textContent = (result.data.nombre || 'U')[0].toUpperCase();
                    }
                }
            });

        if (incoming) incoming.classList.add('show');

        // Sonido de llamada
        try {
            var audioContext = new (window.AudioContext || window.webkitAudioContext)();
            var oscillator = audioContext.createOscillator();
            var gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.value = 440;
            oscillator.type = 'sine';
            gainNode.gain.value = 0.15;
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.3);

            var interval = setInterval(function() {
                var incomingEl = document.getElementById('callIncoming');
                if (!incomingEl || !incomingEl.classList.contains('show')) {
                    clearInterval(interval);
                    return;
                }
                var osc = audioContext.createOscillator();
                var gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 440;
                osc.type = 'sine';
                gain.gain.value = 0.15;
                osc.start();
                osc.stop(audioContext.currentTime + 0.3);
            }, 2000);

            callState._ringInterval = interval;

        } catch (e) {
            // Silencio
        }
    }

    async function aceptarLlamadaEntrante() {
        var callId = callState.incomingCallId;
        if (!callId) return;

        try {
            var session = await getSession();
            if (!session) {
                showToast('⚠️ Inicia sesión para aceptar', 'error');
                return;
            }

            await supabase
                .from('llamadas')
                .update({
                    estado: 'active',
                    contestada_at: new Date().toISOString()
                })
                .eq('id', callId);

            await supabase
                .from('llamadas_participantes')
                .insert({
                    llamada_id: callId,
                    usuario_id: session.user.id,
                    rol: 'invitado',
                    estado: 'conectado',
                    entro_at: new Date().toISOString()
                });

            var llamadaData = await supabase
                .from('llamadas')
                .select('room_name, creador_id')
                .eq('id', callId)
                .single();

            if (llamadaData.error) throw llamadaData.error;

            callState.callId = callId;
            callState.isInitiator = false;
            callState.active = true;

            document.getElementById('callIncoming').classList.remove('show');
            mostrarLlamada();

            await conectarALiveKit(llamadaData.data.room_name, session.user.id, callId);
            iniciarContadorDuracion();
            suscribirseALlamada(callId);

            if (callState._ringInterval) {
                clearInterval(callState._ringInterval);
                callState._ringInterval = null;
            }

            showToast('✅ Llamada aceptada', 'success');

            var btnCall = document.getElementById('btnVideoCall');
            if (btnCall) {
                btnCall.textContent = '📞';
                btnCall.classList.add('active-call');
            }

        } catch (e) {
            console.error('Error aceptando llamada:', e);
            showToast('❌ Error al aceptar llamada: ' + e.message, 'error');
            limpiarLlamada();
        }
    }

    function rechazarLlamadaEntrante() {
        var callId = callState.incomingCallId;
        if (!callId) return;

        rechazarLlamada(callId);
        document.getElementById('callIncoming').classList.remove('show');

        if (callState._ringInterval) {
            clearInterval(callState._ringInterval);
            callState._ringInterval = null;
        }

        showToast('❌ Llamada rechazada', 'warning');
    }

    async function rechazarLlamada(callId) {
        try {
            await supabase
                .from('llamadas')
                .update({
                    estado: 'rejected',
                    finalizada_at: new Date().toISOString()
                })
                .eq('id', callId);
        } catch (e) {
            console.error('Error rechazando llamada:', e);
        }
    }

    async function colgarLlamada() {
        if (!callState.active && !callState.callId) return;

        try {
            var session = await getSession();

            if (callState.callId) {
                await supabase
                    .from('llamadas')
                    .update({
                        estado: 'ended',
                        finalizada_at: new Date().toISOString()
                    })
                    .eq('id', callState.callId);

                if (session) {
                    await supabase
                        .from('llamadas_participantes')
                        .update({
                            estado: 'desconectado',
                            salio_at: new Date().toISOString()
                        })
                        .eq('llamada_id', callState.callId)
                        .eq('usuario_id', session.user.id)
                        .eq('estado', 'conectado');
                }
            }

            limpiarRecursosLiveKit();
            limpiarLlamada();
            ocultarLlamada();
            document.getElementById('callIncoming').classList.remove('show');

            var btnCall = document.getElementById('btnVideoCall');
            if (btnCall) {
                btnCall.textContent = '📹';
                btnCall.classList.remove('active-call');
            }

            showToast('📞 Llamada finalizada', '');

        } catch (e) {
            console.error('Error colgando llamada:', e);
            limpiarRecursosLiveKit();
            limpiarLlamada();
            ocultarLlamada();
        }
    }

    function limpiarRecursosLiveKit() {
        try {
            if (callState.room) {
                callState.room.disconnect();
                callState.room = null;
            }

            if (callState.localTrack) {
                callState.localTrack.stop();
                callState.localTrack = null;
            }

            if (callState.audioTrack) {
                callState.audioTrack.stop();
                callState.audioTrack = null;
            }

            if (callState.screenTrack) {
                callState.screenTrack.stop();
                callState.screenTrack = null;
            }

            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteAvatarPlaceholder').style.display = 'block';
            document.getElementById('localAvatarPlaceholder').style.display = 'block';

            if (callChannel) {
                try {
                    supabase.removeChannel(callChannel);
                } catch (e) {}
                callChannel = null;
            }

            if (callState.durationInterval) {
                clearInterval(callState.durationInterval);
                callState.durationInterval = null;
            }

            if (callState._ringInterval) {
                clearInterval(callState._ringInterval);
                callState._ringInterval = null;
            }

        } catch (e) {
            console.error('Error limpiando recursos LiveKit:', e);
        }
    }

    function limpiarLlamada() {
        callState.active = false;
        callState.room = null;
        callState.localTrack = null;
        callState.audioTrack = null;
        callState.screenTrack = null;
        callState.callId = null;
        callState.isInitiator = false;
        callState.startTime = null;
        callState.incomingCallId = null;
        callState.incomingFrom = null;
        callState.participants = [];

        document.getElementById('participantsList').innerHTML = '';
        document.getElementById('participantsCount').textContent = '0';
        document.getElementById('callDuration').textContent = '00:00';
    }

    function actualizarParticipantes(room) {
        if (!room) return;

        var participants = [];
        var localIdentity = room.localParticipant.identity;

        participants.push({
            identity: localIdentity,
            name: room.localParticipant.name || 'Tú',
            isLocal: true
        });

        room.participants.forEach(function(p) {
            participants.push({
                identity: p.identity,
                name: p.name || 'Participante',
                isLocal: false
            });
        });

        callState.participants = participants;

        var list = document.getElementById('participantsList');
        var count = document.getElementById('participantsCount');

        if (list) {
            list.innerHTML = participants.map(function(p) {
                return '<div style="padding:4px 8px;font-size:0.8rem;color:var(--text-secondary);">' +
                    escapeHTML(p.name) + (p.isLocal ? ' (Tú)' : '') +
                    '</div>';
            }).join('');
        }

        if (count) {
            count.textContent = participants.length;
        }
    }

    function toggleAudio() {
        var btn = document.getElementById('btnToggleAudio');
        if (!callState.room) return;

        try {
            audioMuted = !audioMuted;
            if (callState.audioTrack) {
                callState.audioTrack.enabled = !audioMuted;
            }

            if (audioMuted) {
                btn.classList.add('muted');
                btn.textContent = '🔇';
                document.getElementById('localMuteIndicator').classList.add('show');
            } else {
                btn.classList.remove('muted');
                btn.textContent = '🎤';
                document.getElementById('localMuteIndicator').classList.remove('show');
            }

            showToast(audioMuted ? '🔇 Micrófono silenciado' : '🎤 Micrófono activado', '');

        } catch (e) {
            console.error('Error toggling audio:', e);
        }
    }

    function toggleVideo() {
        var btn = document.getElementById('btnToggleVideo');
        if (!callState.room) return;

        try {
            videoMuted = !videoMuted;
            if (callState.localTrack) {
                callState.localTrack.enabled = !videoMuted;
            }

            if (videoMuted) {
                btn.classList.add('muted');
                btn.textContent = '📷❌';
                document.getElementById('localVideo').style.display = 'none';
                document.getElementById('localAvatarPlaceholder').style.display = 'block';
            } else {
                btn.classList.remove('muted');
                btn.textContent = '📷';
                document.getElementById('localVideo').style.display = 'block';
                document.getElementById('localAvatarPlaceholder').style.display = 'none';
            }

            showToast(videoMuted ? '📷 Cámara desactivada' : '📷 Cámara activada', '');

        } catch (e) {
            console.error('Error toggling video:', e);
        }
    }

    async function toggleScreenShare() {
        var btn = document.getElementById('btnToggleScreen');
        if (!callState.room) return;

        try {
            if (!screenSharing) {
                var stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: 'always' },
                    audio: true
                });

                var videoTrack = stream.getVideoTracks()[0];
                if (videoTrack) {
                    await callState.room.localParticipant.publishTrack(videoTrack, {
                        name: 'screen',
                        source: LivekitClient.TrackSource.ScreenShare
                    });
                    callState.screenTrack = videoTrack;
                    screenSharing = true;
                    btn.classList.add('active');
                    btn.textContent = '🖥️⏹️';

                    videoTrack.onended = function() {
                        detenerScreenShare();
                    };

                    showToast('🖥️ Compartiendo pantalla', 'success');
                }
            } else {
                detenerScreenShare();
            }

        } catch (e) {
            console.error('Error toggling screen share:', e);
            if (e.name === 'NotAllowedError') {
                showToast('⚠️ Permiso denegado para compartir pantalla', 'warning');
            } else {
                showToast('❌ Error al compartir pantalla: ' + e.message, 'error');
            }
        }
    }

    async function detenerScreenShare() {
        try {
            if (callState.screenTrack) {
                await callState.room.localParticipant.unpublishTrack(callState.screenTrack);
                callState.screenTrack.stop();
                callState.screenTrack = null;
            }
            screenSharing = false;
            var btn = document.getElementById('btnToggleScreen');
            if (btn) {
                btn.classList.remove('active');
                btn.textContent = '🖥️';
            }
            showToast('🖥️ Compartir pantalla detenido', '');

        } catch (e) {
            console.error('Error deteniendo screen share:', e);
        }
    }

    function toggleParticipantsPanel() {
        var panel = document.getElementById('participantsPanel');
        if (panel) {
            panel.classList.toggle('show');
        }
    }

    // ================================================================
    // LIMPIEZA DE RECURSOS
    // ================================================================

    function limpiarRecursosMensajes() {
        if (realtimeChannel) {
            try {
                supabase.removeChannel(realtimeChannel);
            } catch (e) {}
            realtimeChannel = null;
        }

        if (mediaRecorder && mediaRecorder.state === 'recording') {
            try {
                mediaRecorder.stop();
            } catch (e) {}
        }

        audioChunks = [];
        grabacionActiva = false;
        archivosSeleccionados = [];

        limpiarRecursosLiveKit();

        callListeners.forEach(function(listener) {
            try {
                supabase.removeChannel(listener);
            } catch (e) {}
        });
        callListeners = [];
    }
