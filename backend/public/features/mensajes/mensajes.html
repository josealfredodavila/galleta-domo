<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sariel · Mensajes</title>

  <!-- ============================================
  ESTILOS GLOBALES (no rompen nada)
  ============================================ -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0e14;
      color: #e8edf5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      display: flex;
      width: 100%;
      max-width: 1300px;
      height: 95vh;
      background: #131a24;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.15);
    }

    /* === SIDEBAR === */
    .sidebar {
      width: 320px;
      background: #0f161e;
      border-right: 1px solid rgba(212, 175, 55, 0.1);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 18px 20px 12px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.08);
    }

    .sidebar-header h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #d4af37;
      letter-spacing: 0.5px;
    }

    .sidebar-header h2 span {
      opacity: 0.4;
      font-weight: 300;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .search-box input {
      flex: 1;
      padding: 8px 14px;
      border-radius: 30px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      background: #1a232e;
      color: #e8edf5;
      font-size: 0.8rem;
      outline: none;
      transition: 0.25s;
    }

    .search-box input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }

    .search-box button {
      background: #d4af37;
      border: none;
      border-radius: 30px;
      padding: 0 16px;
      font-weight: 600;
      font-size: 0.75rem;
      color: #0b0e14;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }

    .search-box button:hover {
      background: #c49a2a;
      transform: scale(0.97);
    }

    /* === LISTA DE CONVERSACIONES === */
    .conversaciones {
      flex: 1;
      overflow-y: auto;
      padding: 8px 6px;
    }

    .conversaciones::-webkit-scrollbar {
      width: 4px;
    }

    .conversaciones::-webkit-scrollbar-thumb {
      background: #d4af37;
      border-radius: 10px;
    }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 16px;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 2px;
      border: 1px solid transparent;
    }

    .conv-item:hover {
      background: #1a232e;
      border-color: rgba(212, 175, 55, 0.06);
    }

    .conv-item.active {
      background: #1e293b;
      border-color: rgba(212, 175, 55, 0.25);
    }

    .conv-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a2a1a, #d4af37);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }

    .conv-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .conv-info {
      flex: 1;
      min-width: 0;
    }

    .conv-nombre {
      font-weight: 600;
      font-size: 0.9rem;
      color: #e8edf5;
    }

    .conv-msg {
      font-size: 0.75rem;
      color: #8899aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .conv-badge {
      background: #d4af37;
      color: #0b0e14;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 30px;
      min-width: 18px;
      text-align: center;
    }

    .conv-hora {
      font-size: 0.55rem;
      color: #667788;
    }

    /* === CHAT PRINCIPAL === */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0f161e;
    }

    .chat-header {
      padding: 14px 22px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.08);
      display: flex;
      align-items: center;
      gap: 14px;
      background: #0f161e;
      flex-shrink: 0;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a2a1a, #d4af37);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .chat-info {
      flex: 1;
    }

    .chat-nombre {
      font-weight: 600;
      font-size: 1rem;
    }

    .chat-estado {
      font-size: 0.7rem;
      color: #667788;
    }

    .chat-estado.online {
      color: #4ade80;
    }

    .chat-actions {
      display: flex;
      gap: 8px;
    }

    .chat-actions button {
      background: transparent;
      border: none;
      color: #8899aa;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 30px;
      transition: 0.2s;
    }

    .chat-actions button:hover {
      background: #1a232e;
      color: #d4af37;
    }

    /* === MENSAJES === */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #d4af37;
      border-radius: 10px;
    }

    .empty-chat {
      text-align: center;
      margin: auto;
      color: #556677;
    }

    .empty-chat .icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 12px;
      opacity: 0.3;
    }

    .empty-chat h3 {
      font-weight: 400;
      font-size: 1.1rem;
    }

    .empty-chat p {
      font-size: 0.8rem;
      opacity: 0.6;
    }

    /* === BURBUJAS === */
    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .msg-wrapper.enviado {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-wrapper.recibido {
      align-self: flex-start;
      align-items: flex-start;
    }

    .burbuja {
      background: #1a232e;
      padding: 10px 16px;
      border-radius: 18px 18px 18px 4px;
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
      border: 1px solid rgba(212, 175, 55, 0.05);
    }

    .msg-wrapper.enviado .burbuja {
      background: #d4af37;
      color: #0b0e14;
      border-radius: 18px 18px 4px 18px;
    }

    .msg-wrapper .fila {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .msg-wrapper .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1a232e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #d4af37;
      border: 1px solid rgba(212, 175, 55, 0.15);
      flex-shrink: 0;
    }

    .meta {
      font-size: 0.55rem;
      color: #667788;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta button {
      background: none;
      border: none;
      color: #667788;
      cursor: pointer;
      font-size: 0.55rem;
      padding: 0 2px;
    }

    .meta button:hover {
      color: #d4af37;
    }

    .leido.leido {
      color: #4ade80;
    }

    .leido.no-leido {
      color: #667788;
    }

    /* === INPUT === */
    .chat-input-area {
      padding: 12px 20px 16px;
      border-top: 1px solid rgba(212, 175, 55, 0.06);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #0f161e;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-row input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 30px;
      border: 1px solid rgba(212, 175, 55, 0.12);
      background: #1a232e;
      color: #e8edf5;
      font-size: 0.85rem;
      outline: none;
      transition: 0.25s;
    }

    .input-row input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.08);
    }

    .input-row button {
      background: #d4af37;
      border: none;
      border-radius: 30px;
      width: 42px;
      height: 42px;
      font-size: 1.1rem;
      color: #0b0e14;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .input-row button:hover {
      background: #c49a2a;
      transform: scale(0.95);
    }

    .input-row button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .input-actions {
      display: flex;
      gap: 8px;
    }

    .input-actions button {
      background: transparent;
      border: none;
      color: #667788;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 30px;
      transition: 0.2s;
    }

    .input-actions button:hover {
      background: #1a232e;
      color: #d4af37;
    }

    .file-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px 0;
    }

    /* === MODAL === */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: #131a24;
      border-radius: 28px;
      padding: 28px 32px;
      max-width: 440px;
      width: 90%;
      border: 1px solid rgba(212, 175, 55, 0.15);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
    }

    .modal h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #d4af37;
    }

    .modal input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 30px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      background: #1a232e;
      color: #e8edf5;
      font-size: 0.85rem;
      outline: none;
    }

    .modal input:focus {
      border-color: #d4af37;
    }

    .modal-close {
      margin-top: 16px;
      background: #1a232e;
      border: none;
      padding: 8px 20px;
      border-radius: 30px;
      color: #8899aa;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.2s;
    }

    .modal-close:hover {
      background: #2a3344;
      color: #fff;
    }

    .resultados-busqueda {
      margin-top: 12px;
      max-height: 260px;
      overflow-y: auto;
    }

    .resultados-busqueda::-webkit-scrollbar {
      width: 3px;
    }

    .resultados-busqueda::-webkit-scrollbar-thumb {
      background: #d4af37;
      border-radius: 10px;
    }

    /* === TOAST === */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a232e;
      color: #e8edf5;
      padding: 10px 24px;
      border-radius: 60px;
      font-size: 0.8rem;
      border: 1px solid rgba(212, 175, 55, 0.1);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      opacity: 0;
      transition: 0.35s ease;
      pointer-events: none;
      z-index: 9999;
      backdrop-filter: blur(8px);
    }

    .toast.show {
      opacity: 1;
      pointer-events: auto;
    }

    .toast.error {
      border-color: #ef4444;
    }

    .toast.success {
      border-color: #4ade80;
    }

    .toast.warning {
      border-color: #fbbf24;
    }

    /* === RESPONSIVE === */
    @media (max-width: 700px) {
      .sidebar {
        width: 72px;
      }
      .sidebar-header h2 span,
      .conv-info,
      .conv-meta .conv-hora,
      .conv-meta .conv-badge {
        display: none;
      }
      .conv-item {
        justify-content: center;
        padding: 10px 4px;
      }
      .chat-container {
        border-radius: 0;
        height: 100vh;
      }
      .chat-messages {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- ============================================
  TOAST
  ============================================ -->
  <div id="toast" class="toast"></div>

  <!-- ============================================
  MODAL NUEVO CONTACTO
  ============================================ -->
  <div id="modalNuevoContacto" class="modal-overlay">
    <div class="modal">
      <h3>◈ Nuevo contacto</h3>
      <input
        type="text"
        id="searchInputModal"
        placeholder="Buscar por nombre o usuario..."
        autocomplete="off"
      />
      <div id="resultadosBusqueda" class="resultados-busqueda">
        <div style="padding:20px;text-align:center;color:#667788;font-size:0.75rem;">
          Escribe al menos 2 caracteres
        </div>
      </div>
      <button class="modal-close" onclick="cerrarModalNuevoContacto()">✕ Cerrar</button>
    </div>
  </div>

  <!-- ============================================
  CHAT PRINCIPAL
  ============================================ -->
  <div class="chat-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>◈ <span>mensajes</span></h2>
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar contacto..."
            autocomplete="off"
          />
          <button onclick="nuevaConversacion()">+</button>
        </div>
      </div>

      <div id="conversacionesList" class="conversaciones">
        <!-- renderizado por JS -->
        <div style="padding:40px 20px;text-align:center;color:#667788;font-size:0.8rem;">
          <div style="font-size:2rem;margin-bottom:10px;">◈</div>
          <p>Cargando conversaciones...</p>
        </div>
      </div>
    </aside>

    <!-- CHAT -->
    <main class="chat-main">

      <!-- HEADER -->
      <div class="chat-header">
        <div class="chat-avatar">◈</div>
        <div class="chat-info">
          <div class="chat-nombre" id="chatNombre">Selecciona un chat</div>
          <div class="chat-estado" id="chatEstado">⚪ Desconectado</div>
        </div>
        <div class="chat-actions">
          <button id="btnVideoCall" onclick="iniciarVideollamada()" title="Videollamada">📹</button>
          <button onclick="buscarEnConversacion(prompt('🔍 Buscar en esta conversación:'))" title="Buscar">🔍</button>
          <button onclick="if(conversacionActual)eliminarConversacion(conversacionActual.id)" title="Eliminar conversación">🗑️</button>
        </div>
      </div>

      <!-- MENSAJES -->
      <div id="chatMessages" class="chat-messages">
        <div class="empty-chat">
          <span class="icon">◈</span>
          <h3>Selecciona una conversación</h3>
          <p>Elige un contacto para empezar</p>
        </div>
      </div>

      <!-- INPUT -->
      <div class="chat-input-area">
        <div class="file-preview" id="filePreview"></div>
        <div class="input-row">
          <input
            type="text"
            id="chatInput"
            placeholder="Escribe un mensaje..."
            autocomplete="off"
          />
          <div class="input-actions">
            <button onclick="toggleGrabacionVoz()" id="btnGrabarVoz" title="Grabar voz">🎙️</button>
            <button onclick="seleccionarArchivo()" title="Adjuntar archivo">📎</button>
            <input
              type="file"
              id="fileInput"
              multiple
              accept="image/*,audio/*"
              style="display:none"
              onchange="handleFileSelect(event)"
            />
            <button id="btnEnviar" title="Enviar">➤</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- ============================================
  SCRIPTS
  ============================================ -->

  <!-- LiveKit (SDK) -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js">
  </script>

  <!-- Supabase (global) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
  </script>

  <!-- ✅ MENSAJES JS (CORREGIDO) -->
  <script src="/features/mensajes/mensajes.js"></script>

</body>
</html>
