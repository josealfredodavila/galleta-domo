<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>◈ Mensajes · Sariel's</title>
    
    <!-- ===== CSS ===== -->
    <style>
        /* ================================================================
           MENSAJES ULTRA MEGA PRO - SARIEL'S
           VERSIÓN COMPLETA CON RPC + SOCKET.IO + LIVEKIT
           ================================================================ */

        :root {
            --gold: #D4AF37;
            --gold-dark: #b8923a;
            --gold-light: #e8c84a;
            --gold-bright: #f0d060;
            --green-deep: #0F2D1A;
            --green-mid: #1a4a2a;
            --green-bright: #2a6a3a;
            --space: #05080f;
            --text-primary: #f0f4f8;
            --text-secondary: #c0d8e8;
            --text-muted: #8aa8b8;
            --glass-bg: rgba(15, 45, 26, 0.55);
            --glass-border: rgba(212, 175, 55, 0.15);
            --shadow-gold: 0 8px 32px rgba(212, 175, 55, 0.25);
            --shadow-gold-strong: 0 0 60px rgba(212, 175, 55, 0.15);
            --radius: 16px;
            --radius-xl: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00d68f;
            --danger: #ff3366;
            --warning: #f7d44a;
            --cyan: #00e5ff;
            --purple: #a855f7;
            --pink: #ec4899;
            --live-red: #ff0044;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--space);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(26, 74, 42, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
            will-change: transform;
        }
        .nebula-1 { width: 700px; height: 700px; background: var(--green-bright); top: -15%; right: -15%; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-light); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.06; }
        .nebula-3 { width: 500px; height: 500px; background: var(--purple); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

        @keyframes nebula-drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--space); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 20px 30px;
            contain: layout style;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 14px;
            border-bottom: 1px solid var(--glass-border);
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 8, 15, 0.92);
            border-radius: var(--radius) var(--radius) 0 0;
            contain: layout style;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: var(--transition);
        }
        .logo:hover { opacity: 0.85; }
        .logo-hex {
            font-size: 1.8rem;
            color: var(--gold);
            font-weight: 800;
            font-family: 'Orbitron', monospace;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            animation: glow-pulse 3s ease-in-out infinite;
            will-change: text-shadow;
        }
        @keyframes glow-pulse {
            0%, 100% { text-shadow: 0 0 30px rgba(212, 175, 55, 0.3); }
            50% { text-shadow: 0 0 60px rgba(212, 175, 55, 0.6); }
        }
        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 2px;
        }
        .logo-text span { color: var(--gold); }
        .logo-badge {
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--space);
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .network-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.6rem;
            color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .network-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
            will-change: transform, opacity;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .main-nav {
            display: flex;
            gap: 4px;
            background: rgba(15, 45, 26, 0.3);
            border-radius: var(--radius);
            padding: 4px;
            border: 1px solid var(--glass-border);
            margin: 16px 0 20px;
            overflow-x: auto;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
            contain: layout style;
        }
        .main-nav .nav-link {
            padding: 8px 16px;
            border-radius: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
        }
        .main-nav .nav-link::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: var(--transition);
            transform: translateX(-50%);
            border-radius: 2px;
        }
        .main-nav .nav-link:hover::after,
        .main-nav .nav-link.active::after {
            width: 60%;
        }
        .main-nav .nav-link:hover {
            color: var(--text-primary);
            background: rgba(212, 175, 55, 0.05);
        }
        .main-nav .nav-link.active {
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold);
        }
        .main-nav .nav-link.live {
            color: var(--live-red);
        }
        .main-nav .nav-link.live:hover {
            background: rgba(255, 0, 68, 0.08);
        }

        .chat-panel {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 0;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            overflow: hidden;
            min-height: 520px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: var(--transition-slow);
        }
        .chat-panel:hover {
            border-color: rgba(212, 175, 55, 0.2);
            box-shadow: var(--shadow-gold);
        }

        .conversaciones {
            border-right: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            overflow-y: auto;
            max-height: 600px;
        }
        .conversaciones::-webkit-scrollbar {
            width: 3px;
        }
        .conversaciones::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 2px;
        }
        .conversaciones .header-conv {
            padding: 16px 18px;
            border-bottom: 1px solid var(--glass-border);
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            color: var(--gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.5px;
        }
        .conversaciones .header-conv .btn-nuevo {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .conversaciones .header-conv .btn-nuevo:hover {
            color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }

        .conv-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.04);
            cursor: pointer;
            transition: var(--transition);
        }
        .conv-item:hover {
            background: rgba(212, 175, 55, 0.05);
        }
        .conv-item.active {
            background: rgba(212, 175, 55, 0.10);
            border-left: 3px solid var(--gold);
        }
        .conv-item .conv-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green-deep), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 1rem;
            flex-shrink: 0;
            font-family: 'Orbitron', monospace;
        }
        .conv-item .conv-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .conv-item .conv-info {
            flex: 1;
            min-width: 0;
        }
        .conv-item .conv-info .conv-nombre {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }
        .conv-item .conv-info .conv-msg {
            font-size: 0.7rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item .conv-meta {
            text-align: right;
            flex-shrink: 0;
        }
        .conv-item .conv-meta .conv-hora {
            font-size: 0.6rem;
            color: var(--text-muted);
        }
        .conv-item .conv-meta .conv-badge {
            background: var(--gold);
            color: var(--space);
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 2px;
            font-family: 'Orbitron', monospace;
        }

        .chat-area {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 520px;
        }
        .chat-area .chat-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.1);
        }
        .chat-area .chat-header .chat-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green-deep), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 0.9rem;
            flex-shrink: 0;
            font-family: 'Orbitron', monospace;
        }
        .chat-area .chat-header .chat-info {
            flex: 1;
        }
        .chat-area .chat-header .chat-nombre {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }
        .chat-area .chat-header .chat-estado {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
        .chat-area .chat-header .chat-estado.online {
            color: var(--success);
        }
        .chat-area .chat-header .chat-actions {
            display: flex;
            gap: 4px;
        }
        .chat-area .chat-header .chat-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .chat-area .chat-header .chat-actions button:hover {
            color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }
        .chat-area .chat-header .chat-actions button.llamar:hover {
            color: var(--success);
        }
        .chat-area .chat-header .chat-actions button.colgar:hover {
            color: var(--danger);
        }

        .chat-messages {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            background: rgba(0, 0, 0, 0.05);
        }
        .chat-messages::-webkit-scrollbar {
            width: 3px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 2px;
        }

        /* ===== BURBUJAS ===== */
        .msg-wrapper.enviado {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            animation: fadeIn 0.3s ease;
            width: 100%;
        }
        .msg-wrapper.enviado .burbuja {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            border-radius: 18px 18px 4px 18px;
            padding: 10px 16px;
            max-width: 75%;
            word-wrap: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            font-size: 0.9rem;
            line-height: 1.5;
            transition: var(--transition);
        }
        .msg-wrapper.enviado .burbuja:hover {
            transform: scale(1.01);
        }
        .msg-wrapper.enviado .meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
            font-size: 0.6rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
        .msg-wrapper.enviado .meta .leido {
            font-size: 0.65rem;
        }
        .msg-wrapper.enviado .meta .leido.no-leido {
            color: var(--text-muted);
        }
        .msg-wrapper.enviado .meta .leido.leido {
            color: var(--gold);
        }

        .msg-wrapper.recibido {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            animation: fadeIn 0.3s ease;
            width: 100%;
        }
        .msg-wrapper.recibido .fila {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 85%;
        }
        .msg-wrapper.recibido .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green-deep), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 0.8rem;
            flex-shrink: 0;
            font-family: 'Orbitron', monospace;
            transition: var(--transition);
            position: relative;
            border: 2px solid rgba(212, 175, 55, 0.2);
        }
        .msg-wrapper.recibido .avatar.estado-conectado {
            border-color: var(--success);
            box-shadow: 0 0 20px rgba(0, 214, 143, 0.2);
        }
        .msg-wrapper.recibido .avatar.estado-desconectado {
            border-color: var(--text-muted);
            opacity: 0.6;
        }
        .msg-wrapper.recibido .burbuja {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            border-radius: 18px 18px 18px 4px;
            padding: 10px 16px;
            word-wrap: break-word;
            border: 1px solid var(--glass-border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            font-size: 0.9rem;
            line-height: 1.5;
            transition: var(--transition);
        }
        .msg-wrapper.recibido .burbuja:hover {
            background: rgba(255, 255, 255, 0.10);
        }
        .msg-wrapper.recibido .meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
            margin-left: 44px;
            font-size: 0.6rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
        .msg-wrapper.recibido .burbuja img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
        }
        .msg-wrapper.recibido .burbuja video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
        }
        .msg-wrapper.recibido .burbuja audio {
            width: 100%;
            margin-top: 4px;
        }
        .msg-wrapper.enviado .burbuja img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
        }
        .msg-wrapper.enviado .burbuja video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
        }
        .msg-wrapper.enviado .burbuja audio {
            width: 100%;
            margin-top: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .chat-input {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.1);
            flex-wrap: wrap;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            outline: none;
            min-width: 120px;
        }
        .chat-input input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.05);
        }
        .chat-input input::placeholder {
            color: var(--text-muted);
        }
        .chat-input .btn-enviar {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.65rem;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.5px;
        }
        .chat-input .btn-enviar:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-gold);
        }
        .chat-input .btn-enviar:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .chat-input .btn-adjuntar {
            background: none;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 10px 14px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
        }
        .chat-input .btn-adjuntar:hover {
            color: var(--gold);
            border-color: var(--gold);
        }
        .chat-input .btn-audio {
            background: none;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 10px 14px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
        }
        .chat-input .btn-audio:hover {
            color: var(--gold);
            border-color: var(--gold);
        }
        .chat-input .btn-audio.grabando {
            color: var(--danger);
            border-color: var(--danger);
            animation: pulse-audio 1s infinite;
        }
        @keyframes pulse-audio {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .chat-input .btn-audio svg {
            display: block;
        }

        .empty-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: var(--text-muted);
            text-align: center;
            padding: 40px 20px;
        }
        .empty-chat .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
            font-family: 'Orbitron', monospace;
            color: var(--gold);
            opacity: 0.4;
            letter-spacing: 2px;
        }
        .empty-chat h3 {
            font-family: 'Orbitron', monospace;
            color: var(--text-secondary);
            font-size: 1rem;
            letter-spacing: 1px;
            font-weight: 400;
        }
        .empty-chat p {
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        /* ===== VIDEO LLAMADA OVERLAY ===== */
        .video-call-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .video-call-overlay.active {
            display: flex;
        }
        .video-call-overlay .videos-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }
        .video-call-overlay .videos-container video {
            width: 45%;
            max-width: 600px;
            border-radius: 16px;
            background: #111;
            border: 2px solid var(--gold);
            object-fit: cover;
            min-height: 200px;
        }
        .video-call-overlay .videos-container video.local {
            width: 30%;
            max-width: 400px;
            border-color: var(--text-muted);
        }
        .video-call-overlay .call-controls {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 60px;
            backdrop-filter: blur(10px);
        }

    <!-- ================================================================
    JAVASCRIPT COMPLETO
    ================================================================ -->
    <script>
        // ================================================================
        // CONFIGURACIÓN
        // ================================================================

        const SUPABASE_URL = 'https://zultnlogdoajehbswlih.supabase.co';
        const SUPABASE_ANON_KEY = 'TU_ANON_KEY_AQUI'; // <-- REEMPLAZAR
        const API_URL = 'https://galleta-domo-production.up.railway.app'; // <-- REEMPLAZAR
        const LIVEKIT_URL = 'wss://tu-livekit-server.livekit.cloud'; // <-- REEMPLAZAR

        // ================================================================
        // ESTADO GLOBAL
        // ================================================================

        let supabase = null;
        let socket = null;
        let currentUser = null;
        let currentConversationId = null;
        let currentOtherUser = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let socketConnected = false;
        let room = null;
        let localTrack = null;
        let remoteTrack = null;
        let isMicMuted = false;
        let isCamOff = false;
        let callActive = false;

        // ================================================================
        // INICIALIZAR SUPABASE
        // ================================================================

        function initSupabase() {
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('✅ Supabase inicializado');
                return true;
            } catch (error) {
                console.error('❌ Error inicializando Supabase:', error);
                return false;
            }
        }

        // ================================================================
        // AUTENTICACIÓN
        // ================================================================

        async function getCurrentUser() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error) throw error;
                if (!session) {
                    // Redirigir a login si no hay sesión
                    showToast('⚠️ Inicia sesión para usar el chat', 'error');
                    return null;
                }
                currentUser = session.user;
                document.getElementById('userInfo').textContent = `✦ ${currentUser.email || currentUser.id}`;
                return currentUser;
            } catch (error) {
                console.error('❌ Error obteniendo usuario:', error);
                return null;
            }
        }

        // ================================================================
        // INICIALIZAR SOCKET.IO
        // ================================================================

        function initSocket() {
            try {
                socket = io(API_URL, {
                    auth: {
                        token: localStorage.getItem('supabase_access_token') || ''
                    },
                    transports: ['websocket', 'polling']
                });

                socket.on('connect', () => {
                    console.log('✅ Socket.io conectado');
                    socketConnected = true;
                    if (currentUser) {
                        socket.emit('usuario_conectado', currentUser.id);
                    }
                });

                socket.on('disconnect', () => {
                    console.log('❌ Socket.io desconectado');
                    socketConnected = false;
                });

                socket.on('nuevo_mensaje', (data) => {
                    console.log('📩 Nuevo mensaje recibido:', data);
                    if (data.conversation_id === currentConversationId) {
                        agregarMensajeUI(data, 'recibido');
                        marcarLeidos(currentConversationId);
                    } else {
                        // Actualizar lista de conversaciones
                        cargarConversaciones();
                    }
                    showToast('📩 Nuevo mensaje de ' + (data.sender_nombre || 'Usuario'));
                });

                socket.on('mensaje_leido', (data) => {
                    console.log('📖 Mensaje leído:', data);
                    actualizarEstadoLectura(data.message_id);
                });

                socket.on('usuario_escribiendo', (data) => {
                    if (data.user_id !== currentUser?.id && data.conversation_id === currentConversationId) {
                        document.getElementById('chatEstado').textContent = '✎ Escribiendo...';
                        clearTimeout(window.typingTimeout);
                        window.typingTimeout = setTimeout(() => {
                            document.getElementById('chatEstado').textContent = '◉ En línea';
                        }, 2000);
                    }
                });

                socket.on('llamada_entrante', async (data) => {
                    console.log('📞 Llamada entrante:', data);
                    if (data.creador_id !== currentUser?.id) {
                        const aceptar = confirm(`📞 ${data.creador_nombre || 'Usuario'} te está llamando. ¿Aceptas?`);
                        if (aceptar) {
                            await unirseLlamada(data.id, data.room_name);
                        } else {
                            await rechazarLlamada(data.id);
                        }
                    }
                });

                socket.on('llamada_finalizada', (data) => {
                    console.log('📞 Llamada finalizada:', data);
                    if (callActive) {
                        colgarLlamada();
                        showToast('📞 La llamada ha terminado');
                    }
                });

                return true;
            } catch (error) {
                console.error('❌ Error inicializando Socket.io:', error);
                return false;
            }
        }

        // ================================================================
        // FUNCIONES RPC - CONVERSACIONES
        // ================================================================

        async function cargarConversaciones() {
            try {
                if (!currentUser) return;

                const { data, error } = await supabase
                    .rpc('obtener_conversaciones_usuario', {
                        p_usuario_id: currentUser.id
                    });

                if (error) throw error;

                const container = document.getElementById('conversacionesList');
                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:0.8rem;">
                            ◈ No tienes conversaciones<br>
                            <span style="font-size:0.7rem;">Presiona ✎ para iniciar una</span>
                        </div>
                    `;
                    return;
                }

                data.forEach(conv => {
                    const otro = conv.otros_participantes?.[0] || { nombre: 'Usuario', avatar_url: null };
                    const ultimo = conv.ultimo_mensaje || { contenido: 'Sin mensajes', created_at: '' };
                    const hora = ultimo.created_at ? new Date(ultimo.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

                    const item = document.createElement('div');
                    item.className = 'conv-item' + (conv.id === currentConversationId ? ' active' : '');
                    item.dataset.id = conv.id;
                    item.onclick = () => seleccionarConversacion(conv.id);

                    const avatarInicial = otro.nombre ? otro.nombre.charAt(0).toUpperCase() : '◈';

                    item.innerHTML = `
                        <div class="conv-avatar">
                            ${otro.avatar_url ? `<img src="${otro.avatar_url}" alt="${otro.nombre}" />` : avatarInicial}
                        </div>
                        <div class="conv-info">
                            <div class="conv-nombre">${otro.nombre || 'Usuario'}</div>
                            <div class="conv-msg">${ultimo.contenido || 'Sin mensajes'}</div>
                        </div>
                        <div class="conv-meta">
                            <div class="conv-hora">${hora}</div>
                            ${ultimo.is_read === false && ultimo.sender_id !== currentUser.id ? '<span class="conv-badge">●</span>' : ''}
                        </div>
                    `;

                    container.appendChild(item);
                });

            } catch (error) {
                console.error('❌ Error cargando conversaciones:', error);
                showToast('Error al cargar conversaciones', 'error');
            }
        }

        // ================================================================
        // FUNCIONES RPC - MENSAJES
        // ================================================================

        async function seleccionarConversacion(conversationId) {
            try {
                if (!currentUser) return;

                currentConversationId = conversationId;

                // Actualizar UI de conversaciones
                document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
                const selected = document.querySelector(`.conv-item[data-id="${conversationId}"]`);
                if (selected) selected.classList.add('active');

                // Obtener mensajes con RPC
                const { data, error } = await supabase
                    .rpc('obtener_mensajes_conversacion', {
                        p_conversacion_id: conversationId,
                        p_usuario_id: currentUser.id,
                        p_limite: 50,
                        p_desde: null
                    });

                if (error) throw error;

                const container = document.getElementById('chatMessages');
                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-chat">
                            <span class="icon">◈</span>
                            <h3>Sin mensajes</h3>
                            <p>Envía el primer mensaje</p>
                        </div>
                    `;
                    return;
                }

                // Obtener info del otro usuario
                const { data: convData } = await supabase
                    .from('conversation_participants')
                    .select('user_id, usuarios(nombre, avatar_url)')
                    .eq('conversation_id', conversationId)
                    .neq('user_id', currentUser.id)
                    .single();

                if (convData) {
                    const otro = convData.usuarios || { nombre: 'Usuario', avatar_url: null };
                    currentOtherUser = { id: convData.user_id, ...otro };
                    document.getElementById('chatNombre').textContent = otro.nombre || 'Usuario';
                    document.getElementById('chatAvatar').textContent = otro.nombre ? otro.nombre.charAt(0).toUpperCase() : '◈';
                }

                // Renderizar mensajes
                data.forEach(msg => {
                    const esEnviado = msg.sender_id === currentUser.id;
                    agregarMensajeUI(msg, esEnviado ? 'enviado' : 'recibido', false);
                });

                container.scrollTop = container.scrollHeight;

                // Marcar mensajes como leídos
                if (data.some(m => m.sender_id !== currentUser.id && !m.is_read)) {
                    marcarLeidos(conversationId);
                }

                // Unirse al room de Socket.io
                if (socketConnected) {
                    socket.emit('unirse_room', conversationId);
                }

            } catch (error) {
                console.error('❌ Error cargando mensajes:', error);
                showToast('Error al cargar mensajes', 'error');
            }
        }

        // ================================================================
        // ENVIAR MENSAJE
        // ================================================================

        async function enviarMensaje() {
            const input = document.getElementById('chatInput');
            const texto = input.value.trim();
            if (!texto || !currentConversationId || !currentUser) return;

            try {
                const mensaje = {
                    conversation_id: currentConversationId,
                    sender_id: currentUser.id,
                    contenido: texto,
                    tipo: 'texto',
                    is_read: false,
                    is_deleted: false
                };

                const { data, error } = await supabase
                    .from('messages')
                    .insert(mensaje)
                    .select()
                    .single();

                if (error) throw error;

                // Agregar a UI
                agregarMensajeUI(data, 'enviado');
                input.value = '';
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;

                // Enviar por Socket.io
                if (socketConnected) {
                    socket.emit('enviar_mensaje', {
                        ...data,
                        sender_nombre: currentUser.user_metadata?.nombre || 'Yo'
                    });
                }

                // Actualizar lista de conversaciones
                cargarConversaciones();

            } catch (error) {
                console.error('❌ Error enviando mensaje:', error);
                showToast('Error al enviar mensaje', 'error');
            }
        }

        // ================================================================
        // MARCAR COMO LEÍDOS (RPC)
        // ================================================================

        async function marcarLeidos(conversationId) {
            try {
                if (!currentUser) return;

                const { error } = await supabase
                    .rpc('marcar_mensajes_leidos', {
                        p_remitente_id: currentOtherUser?.id,
                        p_destinatario_id: currentUser.id
                    });

                if (error) throw error;

                if (socketConnected) {
                    socket.emit('mensajes_leidos', {
                        conversation_id: conversationId,
                        user_id: currentUser.id
                    });
                }

            } catch (error) {
                console.error('❌ Error marcando leídos:', error);
            }
        }

        // ================================================================
        // SUBIR ARCHIVOS
        // ================================================================

        function adjuntarArchivo() {
            document.getElementById('fileInput').click();
        }

        async function procesarArchivos(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            for (const file of files) {
                await subirArchivo(file);
            }
            event.target.value = '';
        }

        async function subirArchivo(file) {
            try {
                if (!currentUser || !currentConversationId) {
                    showToast('Selecciona una conversación primero', 'error');
                    return;
                }

                // Validar tamaño (50MB)
                if (file.size > 50 * 1024 * 1024) {
                    showToast('Archivo excede 50MB', 'error');
                    return;
                }

                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch(`${API_URL}/api/mensajes/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('supabase_access_token')}`
                    },
                    body: formData
                });

                const result = await response.json();
                if (!result.success) throw new Error(result.error);

                // Determinar tipo
                const tipo = file.type.startsWith('image/') ? 'imagen' :
                             file.type.startsWith('video/') ? 'video' :
                             file.type.startsWith('audio/') ? 'audio' : 'archivo';

                const mensaje = {
                    conversation_id: currentConversationId,
                    sender_id: currentUser.id,
                    contenido: file.name,
                    media_url: result.url,
                    tipo: tipo,
                    nombre_archivo: file.name,
                    tamano_bytes: file.size,
                    mime_type: file.type,
                    is_read: false,
                    is_deleted: false
                };

                const { data, error } = await supabase
                    .from('messages')
                    .insert(mensaje)
                    .select()
                    .single();

                if (error) throw error;

                agregarMensajeUI(data, 'enviado');
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;

                if (socketConnected) {
                    socket.emit('enviar_mensaje', {
                        ...data,
                        sender_nombre: currentUser.user_metadata?.nombre || 'Yo'
                    });
                }

                cargarConversaciones();
                showToast(`✅ Archivo subido: ${file.name}`);

            } catch (error) {
                console.error('❌ Error subiendo archivo:', error);
                showToast('Error al subir archivo', 'error');
            }
        }

        // ================================================================
        // GRABAR AUDIO (NOTAS DE VOZ)
        // ================================================================

        async function toggleGrabacion() {
            const btn = document.getElementById('btnAudio');

            if (isRecording) {
                // Detener grabación
                if (mediaRecorder) {
                    mediaRecorder.stop();
                    mediaRecorder = null;
                }
                isRecording = false;
                btn.classList.remove('grabando');
                btn.textContent = '🎙️';
                showToast('⏹️ Grabación detenida');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioFile = new File([audioBlob], `audio-${Date.now()}.webm`, { type: 'audio/webm' });
                    await subirArchivo(audioFile);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('grabando');
                btn.textContent = '⏹️';
                showToast('🎙️ Grabando... presiona de nuevo para detener');

            } catch (error) {
                console.error('❌ Error grabando audio:', error);
                showToast('Error al acceder al micrófono', 'error');
            }
        }

        // ================================================================
        // NUEVA CONVERSACIÓN (RPC)
        // ================================================================

        async function nuevaConversacion() {
            try {
                if (!currentUser) {
                    showToast('Inicia sesión primero', 'error');
                    return;
                }

                const nombre = prompt('◈ Buscar usuario por nombre o email:');
                if (!nombre || !nombre.trim()) return;

                // Buscar usuario
                const { data: usuarios, error } = await supabase
                    .from('usuarios')
                    .select('id, nombre, email')
                    .neq('id', currentUser.id)
                    .or(`nombre.ilike.%${nombre.trim()}%,email.ilike.%${nombre.trim()}%`)
                    .limit(5);

                if (error) throw error;

                if (!usuarios || usuarios.length === 0) {
                    showToast('No se encontraron usuarios', 'error');
                    return;
                }

                if (usuarios.length > 1) {
                    const opciones = usuarios.map((u, i) => `${i+1}. ${u.nombre || u.email}`).join('\n');
                    const seleccion = prompt(`Selecciona un usuario:\n${opciones}`);
                    if (!seleccion) return;
                    const idx = parseInt(seleccion) - 1;
                    if (isNaN(idx) || idx < 0 || idx >= usuarios.length) {
                        showToast('Selección inválida', 'error');
                        return;
                    }
                    const target = usuarios[idx];
                    await crearConversacionCon(target.id);
                } else {
                    await crearConversacionCon(usuarios[0].id);
                }

            } catch (error) {
                console.error('❌ Error buscando usuario:', error);
                showToast('Error al buscar usuario', 'error');
            }
        }

        async function crearConversacionCon(targetUserId) {
            try {
                const { data, error } = await supabase
                    .rpc('crear_conversacion_directa', {
                        p_usuario_a_id: currentUser.id,
                        p_usuario_b_id: targetUserId
                    });

                if (error) throw error;

                const convId = data[0]?.conversation_id;
                if (convId) {
                    showToast('✅ Conversación creada');
                    await cargarConversaciones();
                    setTimeout(() => seleccionarConversacion(convId), 300);
                }

            } catch (error) {
                console.error('❌ Error creando conversación:', error);
                showToast('Error al crear conversación', 'error');
            }
        }

        // ================================================================
        // LIVEKIT - VIDE0LLAMADAS
        // ================================================================

        async function iniciarLlamada(tipo = 'video') {
            try {
                if (!currentConversationId || !currentOtherUser) {
                    showToast('Selecciona una conversación primero', 'error');
                    return;
                }

                if (callActive) {
                    showToast('Ya hay una llamada activa', 'error');
                    return;
                }

                const roomName = `room-${currentConversationId}-${Date.now()}`;

                // Crear llamada en Supabase
                const { data: llamada, error } = await supabase
                    .from('llamadas')
                    .insert({
                        conversation_id: currentConversationId,
                        creador_id: currentUser.id,
                        destinatario_id: currentOtherUser.id,
                        room_name: roomName,
                        tipo: tipo,
                        estado: 'ringing'
                    })
                    .select()
                    .single();

                if (error) throw error;

                // Notificar por Socket.io
                if (socketConnected) {
                    socket.emit('iniciar_llamada', {
                        ...llamada,
                        creador_nombre: currentUser.user_metadata?.nombre || 'Usuario'
                    });
                }

                // Unirse a la llamada
                await unirseLlamada(llamada.id, roomName);

            } catch (error) {
                console.error('❌ Error iniciando llamada:', error);
                showToast('Error al iniciar llamada', 'error');
            }
        }

        async function unirseLlamada(llamadaId, roomName) {
            try {
                const token = await obtenerTokenLiveKit(roomName, currentUser.id);

                room = new LivekitClient.Room();

                room.on('participantConnected', (participant) => {
                    console.log('👤 Participante conectado:', participant.identity);
                    document.getElementById('callInfo').textContent = '◈ En llamada';
                });

                room.on('participantDisconnected', () => {
                    console.log('👤 Participante desconectado');
                    colgarLlamada();
                });

                room.on('trackSubscribed', (track, publication, participant) => {
                    if (track.kind === 'video' || track.kind === 'audio') {
                        const videoEl = document.getElementById('remoteVideo');
                        videoEl.srcObject = new MediaStream([track.mediaStreamTrack]);
                    }
                });

                await room.connect(LIVEKIT_URL, token);

                // Publicar video y audio
                localTrack = await LivekitClient.createLocalVideoTrack();
                await room.localParticipant.publishTrack(localTrack);
                document.getElementById('localVideo').srcObject = new MediaStream([localTrack.mediaStreamTrack]);

                const audioTrack = await LivekitClient.createLocalAudioTrack();
                await room.localParticipant.publishTrack(audioTrack);

                callActive = true;
                document.getElementById('videoCallOverlay').classList.add('active');
                document.getElementById('callInfo').textContent = '◈ Llamada en curso';

                // Actualizar estado de la llamada
                await supabase
                    .from('llamadas')
                    .update({ estado: 'active', contestada_at: new Date().toISOString() })
                    .eq('id', llamadaId);

                if (socketConnected) {
                    socket.emit('llamada_activa', { llamada_id: llamadaId });
                }

                showToast('📞 Llamada conectada');

            } catch (error) {
                console.error('❌ Error uniéndose a llamada:', error);
                showToast('Error al unirse a la llamada', 'error');
                colgarLlamada();
            }
        }

        function colgarLlamada() {
            if (room) {
                room.disconnect();
                room = null;
            }

            if (localTrack) {
                localTrack.stop();
                localTrack = null;
            }

            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('videoCallOverlay').classList.remove('active');

            callActive = false;
            isMicMuted = false;
            isCamOff = false;
            document.getElementById('btnMic').classList.remove('muted');
            document.getElementById('btnCam').classList.remove('off');

            if (socketConnected) {
                socket.emit('finalizar_llamada', { conversation_id: currentConversationId });
            }

            showToast('📞 Llamada finalizada');
        }

        async function obtenerTokenLiveKit(roomName, userId) {
            try {
                const response = await fetch(`${API_URL}/api/livekit/token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('supabase_access_token')}`
                    },
                    body: JSON.stringify({ room_name: roomName, user_id: userId })
                });

                const data = await response.json();
                if (!data.success) throw new Error(data.error);
                return data.token;

            } catch (error) {
                console.error('❌ Error obteniendo token LiveKit:', error);
                throw error;
            }
        }

        function toggleMic() {
            if (!room) return;
            isMicMuted = !isMicMuted;
            document.getElementById('btnMic').classList.toggle('muted');

            room.localParticipant.audioTracks.forEach(track => {
                track.setMuted(isMicMuted);
            });
        }

        function toggleCam() {
            if (!room) return;
            isCamOff = !isCamOff;
            document.getElementById('btnCam').classList.toggle('off');

            room.localParticipant.videoTracks.forEach(track => {
                track.setMuted(isCamOff);
            });
        }

        async function rechazarLlamada(llamadaId) {
            try {
                await supabase
                    .from('llamadas')
                    .update({ estado: 'ended', finalizada_at: new Date().toISOString() })
                    .eq('id', llamadaId);
            } catch (error) {
                console.error('❌ Error rechazando llamada:', error);
            }
        }

        // ================================================================
        // UI HELPERS
        // ================================================================

        function agregarMensajeUI(msg, tipo, guardar = true) {
            const container = document.getElementById('chatMessages');
            const empty = container.querySelector('.empty-chat');
            if (empty) empty.remove();

            const isEnviado = tipo === 'enviado' || msg.sender_id === currentUser?.id;
            const wrapperClass = isEnviado ? 'enviado' : 'recibido';

            const hora = msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

            // Renderizar contenido según tipo
            let contenido = msg.contenido || '';
            if (msg.media_url) {
                if (msg.tipo === 'imagen') {
                    contenido = `<img src="${msg.media_url}" alt="${msg.nombre_archivo || 'Imagen'}" loading="lazy" />`;
                } else if (msg.tipo === 'video') {
                    contenido = `<video controls src="${msg.media_url}"></video>`;
                } else if (msg.tipo === 'audio') {
                    contenido = `<audio controls src="${msg.media_url}"></audio>`;
                } else {
                    contenido = `📎 <a href="${msg.media_url}" target="_blank" style="color:var(--gold);">${msg.nombre_archivo || 'Archivo'}</a>`;
                }
            }

            let html = '';
            if (isEnviado) {
                html = `
                    <div class="msg-wrapper enviado">
                        <div class="burbuja">${contenido}</div>
                        <div class="meta">
                            ${hora}
                            ${msg.is_read ? '<span class="leido leido">◆◆</span>' : '<span class="leido no-leido">◈◈</span>'}
                        </div>
                    </div>
                `;
            } else {
                const avatar = msg.sender_nombre ? msg.sender_nombre.charAt(0).toUpperCase() : '◈';
                const estado = 'conectado';
                html = `
                    <div class="msg-wrapper recibido">
                        <div class="fila">
                            <div class="avatar estado-${estado}">
                                ${avatar}
                            </div>
                            <div class="burbuja">${contenido}</div>
                        </div>
                        <div class="meta">${hora}</div>
                    </div>
                `;
            }

            container.insertAdjacentHTML('beforeend', html);
            container.scrollTop = container.scrollHeight;
        }

        function actualizarEstadoLectura(messageId) {
            // Buscar y actualizar el ícono de leído
            const items = document.querySelectorAll('.msg-wrapper.enviado');
            // Por simplicidad, recargar mensajes
            if (currentConversationId) {
                seleccionarConversacion(currentConversationId);
            }
        }

        // ================================================================
        // TOAST
        // ================================================================

        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show';
            if (type === 'error') t.classList.add('error');
            else t.classList.remove('error');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3500);
        }

        // ================================================================
        // FONDO ESTELAR
        // ================================================================

        function initStars() {
            const canvas = document.getElementById('stars-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height, stars = [];
            let animId = null;
            let isVisible = true;

            const isMobile = window.innerWidth < 600;
            const STAR_COUNT = isMobile ? 40 : 100;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                createStars();
            }

            function createStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 0.8 + 0.2,
                        speed: Math.random() * 0.005 + 0.002,
                        opacity: Math.random() * 0.5 + 0.2,
                        twinklePhase: Math.random() * Math.PI * 2
                    });
                }
            }

            function draw() {
                if (!isVisible) {
                    animId = requestAnimationFrame(draw);
                    return;
                }
                ctx.clearRect(0, 0, width, height);
                for (let star of stars) {
                    const opacity = star.opacity * (0.6 + 0.4 * Math.sin(star.twinklePhase));
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fill();
                    star.twinklePhase += 0.02;
                    star.y += star.speed;
                    if (star.y > height) {
                        star.y = 0;
                        star.x = Math.random() * width;
                    }
                }
                animId = requestAnimationFrame(draw);
            }

            function pauseAnimation() { isVisible = false; }
            function resumeAnimation() { isVisible = true; }

            resize();
            draw();

            window.addEventListener('resize', resize);
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) pauseAnimation();
                else resumeAnimation();
            });

            return { pauseAnimation, resumeAnimation };
        }

        // ================================================================
        // INICIALIZACIÓN COMPLETA
        // ================================================================

        async function init() {
            console.log('◈ Sariel\'s - Mensajes Ultra Mega Pro');
            console.log('✦ Con RPC + Socket.io + LiveKit');

            // 1. Inicializar Supabase
            if (!initSupabase()) {
                showToast('Error al inicializar Supabase', 'error');
                return;
            }

            // 2. Obtener usuario actual
            const user = await getCurrentUser();
            if (!user) {
                // Redirigir a login
                window.location.href = '/login.html';
                return;
            }

            // 3. Inicializar Socket.io
            initSocket();

            // 4. Cargar conversaciones
            await cargarConversaciones();

            // 5. Event listeners
            document.getElementById('btnEnviar').addEventListener('click', enviarMensaje);
            document.getElementById('chatInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') enviarMensaje();
                if (e.key.length > 0 && currentConversationId && socketConnected) {
                    socket.emit('escribiendo', {
                        conversation_id: currentConversationId,
                        user_id: currentUser.id
                    });
                }
            });

            // 6. Fondo estelar
            initStars();

            // 7. Verificar llamadas activas
            setInterval(() => {
                if (currentConversationId) {
                    verificarLlamadaActiva(currentConversationId);
                }
            }, 30000);

            console.log('✅ Sariel\'s Mensajes listo');
            showToast('◈ Bienvenido al chat');
        }

        // ================================================================
        // VERIFICAR LLAMADA ACTIVA
        // ================================================================

        async function verificarLlamadaActiva(conversationId) {
            try {
                const { data, error } = await supabase
                    .from('llamadas')
                    .select('*')
                    .eq('conversation_id', conversationId)
                    .in('estado', ['ringing', 'active'])
                    .order('created_at', { ascending: false })
                    .maybeSingle();

                if (error) throw error;

                if (data && data.estado === 'active' && !callActive) {
                    // Unirse a llamada activa
                    await unirseLlamada(data.id, data.room_name);
                }

            } catch (error) {
                console.error('❌ Error verificando llamada:', error);
            }
        }

        // ================================================================
        // EXPONER FUNCIONES GLOBALES
        // ================================================================

        window.nuevaConversacion = nuevaConversacion;
        window.seleccionarConversacion = seleccionarConversacion;
        window.enviarMensaje = enviarMensaje;
        window.adjuntarArchivo = adjuntarArchivo;
        window.procesarArchivos = procesarArchivos;
        window.toggleGrabacion = toggleGrabacion;
        window.iniciarLlamada = iniciarLlamada;
        window.colgarLlamada = colgarLlamada;
        window.toggleMic = toggleMic;
        window.toggleCam = toggleCam;
        window.showToast = showToast;

        // ================================================================
        // INICIAR
        // ================================================================

        document.addEventListener('DOMContentLoaded', init);
    </script>
