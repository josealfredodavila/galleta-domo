<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>◈ Carrito · Sariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <script src="/features/shared/js/apariencia-global.js"></script>

    <style>
        :root {
            --gold: #D4AF37;
            --gold-dark: #b8923a;
            --gold-light: #e8c84a;
            --gold-bright: #f0d060;
            --green-deep: #0F2D1A;
            --green-mid: #1a4a2a;
            --green-bright: #2a6a3a;
            --space: #05080f;
            --text-primary: #f0f4f8;
            --text-secondary: #c0d8e8;
            --text-muted: #8aa8b8;
            --glass-bg: rgba(15, 45, 26, 0.55);
            --glass-border: rgba(212, 175, 55, 0.15);
            --shadow-gold: 0 8px 32px rgba(212, 175, 55, 0.25);
            --radius: 16px;
            --radius-xl: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00d68f;
            --danger: #ff3366;
            --warning: #f7d44a;
            --cyan: #00e5ff;
            --purple: #a855f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--space);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(26, 74, 42, 0.4) 0%, transparent 60%), radial-gradient(ellipse at 80% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            padding-bottom: 130px;
        }

        .nebula { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.12; pointer-events: none; z-index: 0; animation: nebula-drift 25s ease-in-out infinite alternate; }
        .nebula-1 { width: 700px; height: 700px; background: var(--green-bright); top: -15%; right: -15%; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-light); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.06; }
        .nebula-3 { width: 500px; height: 500px; background: var(--purple); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }
        @keyframes nebula-drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px,-30px) scale(1.15); } }

        .app { position: relative; z-index: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 12px 16px 30px; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0 14px; border-bottom: 1px solid var(--glass-border);
            background: rgba(5, 8, 15, 0.92); position: sticky; top: 0; z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-hex { font-size: 1.8rem; color: var(--gold); font-family: 'Orbitron', monospace; }
        .logo-text { font-family: 'Orbitron', monospace; font-size: 1.2rem; color: var(--text-primary); letter-spacing: 2px; }
        .logo-text span { color: var(--gold); }
        .logo-badge { font-size: 0.45rem; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--space); padding: 2px 10px; border-radius: 20px; font-weight: 700; }
        .token-badge { display: flex; align-items: center; gap: 6px; background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.15); padding: 4px 14px; border-radius: 20px; font-size: 0.7rem; color: var(--gold); font-family: 'Orbitron', monospace; cursor: pointer; }

        .main-nav {
            display: flex; gap: 4px; background: rgba(15,45,26,0.3); border-radius: var(--radius);
            padding: 4px; border: 1px solid var(--glass-border); margin: 16px 0 20px; overflow-x: auto;
        }
        .main-nav .nav-link { padding: 8px 16px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; white-space: nowrap; transition: var(--transition); }
        .main-nav .nav-link:hover { color: var(--text-primary); background: rgba(212,175,55,0.05); }
        .main-nav .nav-link.active { background: rgba(212,175,55,0.12); color: var(--gold); }
        .main-nav .nav-link.live { color: var(--danger); }

        .btn-back {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
            color: var(--text-muted); padding: 8px 16px; border-radius: 30px;
            font-size: 0.72rem; text-decoration: none; margin-bottom: 16px;
            transition: var(--transition); cursor: pointer;
        }
        .btn-back:hover { border-color: var(--gold); color: var(--gold); }

        .carrito-titulo {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .carrito-titulo h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold);
        }
        .carrito-titulo .count {
            font-size: 0.65rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.35);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .tienda-info {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tienda-info .nombre {
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            color: var(--gold);
            font-weight: 700;
        }
        .tienda-info .lbl {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tienda-info .btn-cambiar {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.65rem;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }
        .tienda-info .btn-cambiar:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .items-lista {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .item-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            transition: var(--transition);
        }
        .item-card:hover { border-color: var(--gold); }
        .item-card .foto {
            width: 70px; height: 70px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--green-deep), var(--green-mid));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            color: var(--gold);
            border: 1px solid var(--glass-border);
        }
        .item-card .foto img { width: 100%; height: 100%; object-fit: cover; }
        .item-card .info { flex: 1; min-width: 0; }
        .item-card .info .nombre {
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .item-card .info .precio-unit {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .item-card .info .cantidad-control {
            display: inline-flex;
            align-items: center;
            gap: 0;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
        }
        .item-card .info .cantidad-control button {
            background: transparent;
            border: none;
            color: var(--gold);
            font-size: 1rem;
            font-weight: 700;
            width: 30px;
            height: 30px;
            cursor: pointer;
            transition: var(--transition);
        }
        .item-card .info .cantidad-control button:hover { background: rgba(212,175,55,0.1); }
        .item-card .info .cantidad-control button:disabled { opacity: 0.3; cursor: not-allowed; }
        .item-card .info .cantidad-control .cantidad {
            min-width: 32px;
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .item-card .acciones {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }
        .item-card .acciones .subtotal {
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--gold);
        }
        .item-card .acciones .btn-eliminar {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 0.7rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 10px;
            transition: var(--transition);
        }
        .item-card .acciones .btn-eliminar:hover { background: rgba(255,51,102,0.1); }

        .resumen-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 20px;
            margin-bottom: 20px;
        }
        .resumen-card .fila {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .resumen-card .fila.total {
            border-top: 1px solid var(--glass-border);
            margin-top: 8px;
            padding-top: 12px;
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold);
        }
        .resumen-card .fila.comision {
            font-size: 0.7rem;
            color: var(--warning);
        }

        .acciones-bottom {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-vaciar {
            flex: 1;
            padding: 14px;
            border-radius: 30px;
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            min-width: 120px;
        }
        .btn-vaciar:hover { border-color: var(--danger); color: var(--danger); }
        .btn-checkout {
            flex: 2;
            padding: 14px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            border: none;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            min-width: 180px;
        }
        .btn-checkout:hover { transform: translateY(-2px); box-shadow: var(--shadow-gold); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
        }
        .empty-state .icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 16px;
            color: var(--gold);
            opacity: 0.4;
        }
        .empty-state h3 {
            font-family: 'Orbitron', monospace;
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .empty-state .btn-ir-mercado {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            border: none;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }
        .empty-state .btn-ir-mercado:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-gold);
        }

        .barra-inferior {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 500;
            background: rgba(15, 25, 20, 0.98);
            backdrop-filter: blur(12px);
            border-top: 2px solid var(--gold);
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0));
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            box-shadow: 0 -4px 30px rgba(0,0,0,0.6);
        }
        .barra-inferior .info-total .lbl {
            font-size: 0.55rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .barra-inferior .info-total .total {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold);
        }
        .barra-inferior .btn-continuar {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            border: none;
            padding: 14px 24px;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }
        .barra-inferior .btn-continuar:hover {
            transform: scale(1.03);
            box-shadow: var(--shadow-gold);
        }

        .toast {
            position: fixed; bottom: 100px; right: 20px;
            background: var(--green-deep); border: 1px solid var(--gold);
            color: var(--gold); padding: 12px 22px;
            border-radius: 12px; font-size: 0.75rem;
            transform: translateY(100px); opacity: 0;
            transition: all 0.4s ease; z-index: 9999;
            max-width: 320px; pointer-events: none;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error { border-color: var(--danger); color: var(--danger); }
        .toast.warning { border-color: var(--warning); color: var(--warning); }
        .toast.success { border-color: var(--success); color: var(--success); }

        .footer {
            margin-top: 30px; padding-top: 16px;
            border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.7rem; color: var(--text-muted);
            flex-wrap: wrap; gap: 10px;
            padding-bottom: 100px;
        }
        .footer .brand { color: var(--gold); font-weight: 600; }
        .footer-links { display: flex; gap: 12px; flex-wrap: wrap; }
        .footer-links a { color: var(--text-muted); text-decoration: none; }
        .footer-links a:hover { color: var(--gold); }

        html.tema-dia, html[data-tema="dia"] {
            --space: #f5f7fa;
            --text-primary: #1a2332;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(0, 0, 0, 0.1);
        }
        html.tema-dia body, html[data-tema="dia"] body {
            background: #f5f7fa !important;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 60%), radial-gradient(ellipse at 80% 50%, rgba(42, 106, 58, 0.05) 0%, transparent 60%) !important;
            color: var(--text-primary) !important;
        }
        html.tema-dia .nebula, html[data-tema="dia"] .nebula { display: none !important; }
        html.tema-dia .header, html[data-tema="dia"] .header { background: rgba(255, 255, 255, 0.95) !important; border-bottom-color: rgba(0, 0, 0, 0.1) !important; }
        html.tema-dia .logo-text, html[data-tema="dia"] .logo-text { color: var(--text-primary) !important; }
        html.tema-dia .main-nav, html[data-tema="dia"] .main-nav { background: rgba(255, 255, 255, 0.7) !important; border-color: rgba(0, 0, 0, 0.1) !important; }
        html.tema-dia .main-nav .nav-link, html[data-tema="dia"] .main-nav .nav-link { color: #718096 !important; }
        html.tema-dia .main-nav .nav-link.active, html[data-tema="dia"] .main-nav .nav-link.active { background: rgba(212, 175, 55, 0.15) !important; color: var(--gold) !important; }
        html.tema-dia .barra-inferior, html[data-tema="dia"] .barra-inferior { background: rgba(255, 255, 255, 0.98) !important; }
        html.tema-dia .footer, html[data-tema="dia"] .footer { color: #718096 !important; border-top-color: rgba(0, 0, 0, 0.1) !important; }

        @media (max-width: 480px) {
            .item-card .foto { width: 60px; height: 60px; font-size: 1.5rem; }
            .item-card .info .nombre { font-size: 0.75rem; }
            .barra-inferior .btn-continuar { padding: 12px 18px; font-size: 0.75rem; }
            .acciones-bottom { flex-direction: column; }
            .btn-vaciar, .btn-checkout { width: 100%; }
        }
    </style>
</head>

var supabaseKey = 'sb_publishable_S3jONAz3mRO4JKBRhUdI1A_-nsyVhKu';
var supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
window.supabaseClient = supabaseClient;

function mostrarErrorEnPantalla(mensaje) {
    var banner = document.getElementById('errorBanner');
    var texto = document.getElementById('errorBannerText');
    if (banner && texto) { texto.textContent = mensaje; banner.style.display = 'block'; }
}
window.addEventListener('error', function (event) {
    mostrarErrorEnPantalla((event.message || 'Error desconocido') + ' — línea ' + event.lineno);
});
window.addEventListener('unhandledrejection', function (event) {
    mostrarErrorEnPantalla('Promesa rechazada: ' + (event.reason && event.reason.message ? event.reason.message : event.reason));
});

// ================================================================
// TOAST
// ================================================================
function showToast(mensaje, tipo) {
    try {
        var toastEl = document.getElementById('toast');
        if (!toastEl) { console.warn(mensaje); return; }
        toastEl.textContent = mensaje;
        toastEl.className = 'toast show';
        if (tipo === 'error') toastEl.classList.add('error');
        else if (tipo === 'warning') toastEl.classList.add('warning');
        else if (tipo === 'success') toastEl.classList.add('success');
        clearTimeout(toastEl._timeout);
        toastEl._timeout = setTimeout(function() {
            toastEl.classList.remove('show');
        }, 3000);
    } catch (e) { console.warn('Toast error:', e); }
}

// ================================================================
// ESCAPE HTML
// ================================================================
function escapeHTML(texto) {
    if (!texto) return '';
    var div = document.createElement('div');
    div.textContent = texto;
    return div.innerHTML;
}

function formatearPrecio(n) {
    return '$' + parseFloat(n || 0).toFixed(2);
}

// ================================================================
// CARGAR USUARIO
// ================================================================
async function cargarUsuarioActual() {
    try {
        var result = await supabase.auth.getSession();
        var session = result.data.session;
        if (!session) { sessionUser = null; return null; }
        sessionUser = session.user;
        var u = await supabase
            .from('usuarios')
            .select('nombre, handle, avatar_url, tokens')
            .eq('id', session.user.id)
            .single();
        if (!u.error && u.data) {
            var badge = document.getElementById('tokenBadgeCantidad');
            if (badge) badge.textContent = u.data.tokens || 0;
        }
        return u.data || null;
    } catch (e) { console.error('Error cargando usuario:', e); return null; }
}

// ================================================================
// CARRITO - localStorage
// ================================================================
function cargarCarrito() {
    try {
        var raw = localStorage.getItem('mercado_carrito');
        if (!raw) { carrito = []; return; }
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) carrito = arr;
        else carrito = [];
    } catch (e) {
        console.warn('Error cargando carrito:', e);
        carrito = [];
    }
}

function guardarCarrito() {
    try {
        localStorage.setItem('mercado_carrito', JSON.stringify(carrito));
    } catch (e) { console.warn('Error guardando carrito:', e); }
}

// ================================================================
// CAMBIAR CANTIDAD
// ================================================================
function cambiarCantidad(productoId, delta) {
    var item = carrito.find(function (c) { return c.producto_id === productoId; });
    if (!item) return;

    var nueva = item.cantidad + delta;

    if (nueva <= 0) {
        eliminarDelCarrito(productoId);
        return;
    }

    if (!item.stock_ilimitado && nueva > item.stock) {
        showToast('⚠️ No hay más stock disponible', 'warning');
        return;
    }

    if (nueva > 99) {
        showToast('⚠️ Máximo 99 unidades', 'warning');
        return;
    }

    item.cantidad = nueva;
    guardarCarrito();
    renderizarCarrito();
}

// ================================================================
// ELIMINAR DEL CARRITO
// ================================================================
function eliminarDelCarrito(productoId) {
    if (!confirm('¿Eliminar este producto del carrito?')) return;
    carrito = carrito.filter(function (c) { return c.producto_id !== productoId; });
    guardarCarrito();
    showToast('🗑️ Producto eliminado', 'success');
    renderizarCarrito();
}

// ================================================================
// VACIAR CARRITO
// ================================================================
function vaciarCarrito() {
    if (carrito.length === 0) return;
    if (!confirm('¿Vaciar todo el carrito?')) return;
    carrito = [];
    guardarCarrito();
    showToast('🗑️ Carrito vaciado', 'success');
    renderizarCarrito();
}

// ================================================================
// CALCULAR TOTALES
// ================================================================
function calcularTotales() {
    var subtotal = 0;
    var totalItems = 0;
    carrito.forEach(function (c) {
        subtotal += c.precio * c.cantidad;
        totalItems += c.cantidad;
    });
    var comision = subtotal * COMISION_PORCENTAJE;
    var total = subtotal;

    return {
        subtotal: subtotal,
        comision: comision,
        total: total,
        totalItems: totalItems
    };
}

// ================================================================
// RENDERIZAR CARRITO
// ================================================================
function renderizarCarrito() {
    var container = document.getElementById('carritoContainer');
    var barra = document.getElementById('barraInferior');
    var barraTotal = document.getElementById('barraTotal');

    if (!container) return;

    if (carrito.length === 0) {
        container.innerHTML = '<div class="empty-state">' +
            '<span class="icon">🛒</span>' +
            '<h3 data-clave="mercado_carrito_vacio">Tu carrito está vacío</h3>' +
            '<p data-clave="mercado_carrito_vacio_desc">Explora las tiendas del Mercado y agrega productos.</p>' +
            '<a href="/features/mercado/index.html" class="btn-ir-mercado">' +
                '🛒 <span data-clave="mercado_ir_mercado">Ir al Mercado</span>' +
            '</a>' +
        '</div>';
        if (barra) barra.style.display = 'none';
        if (typeof window.aplicarTraducciones === 'function') window.aplicarTraducciones(container);
        return;
    }

    var tiendaNombre = carrito[0].tienda_nombre || 'Tienda';
    var tiendaSlug = carrito[0].tienda_slug || '';

    var totales = calcularTotales();

    var html = '';

    html += '<div class="carrito-titulo">';
    html += '<h1 data-clave="mercado_mi_carrito">◈ Mi Carrito</h1>';
    html += '<span class="count">' + totales.totalItems + ' item' + (totales.totalItems !== 1 ? 's' : '') + '</span>';
    html += '</div>';

    html += '<div class="tienda-info">';
    html += '<div>';
    html += '<div class="lbl" data-clave="mercado_comprando_en">Comprando en</div>';
    html += '<div class="nombre">' + escapeHTML(tiendaNombre) + '</div>';
    html += '</div>';
    if (tiendaSlug) {
        html += '<a href="/features/mercado/tienda.html?slug=' + encodeURIComponent(tiendaSlug) + '" class="btn-cambiar">' +
            '<span data-clave="mercado_agregar_mas">+ Agregar más</span>' +
        '</a>';
    }
    html += '</div>';

    html += '<div class="items-lista">';
    carrito.forEach(function (item) {
        var subtotal = item.precio * item.cantidad;
        var fotoContent = item.foto_url
            ? '<img src="' + escapeHTML(item.foto_url) + '" alt="' + escapeHTML(item.nombre) + '" onerror="this.style.display=\'none\';this.parentElement.textContent=\'🍽️\';" />'
            : '🍽️';

        var puedeRestar = item.cantidad > 1;
        var puedeSumar = item.stock_ilimitado || item.cantidad < item.stock;

        html += '<div class="item-card" data-producto-id="' + item.producto_id + '">' +
            '<div class="foto">' + fotoContent + '</div>' +
            '<div class="info">' +
                '<div class="nombre">' + escapeHTML(item.nombre) + '</div>' +
                '<div class="precio-unit">' + formatearPrecio(item.precio) + ' c/u</div>' +
                '<div class="cantidad-control">' +
                    '<button onclick="cambiarCantidad(' + item.producto_id + ', -1)" ' + (puedeRestar ? '' : 'disabled') + '>−</button>' +
                    '<span class="cantidad">' + item.cantidad + '</span>' +
                    '<button onclick="cambiarCantidad(' + item.producto_id + ', 1)" ' + (puedeSumar ? '' : 'disabled') + '>+</button>' +
                '</div>' +
            '</div>' +
            '<div class="acciones">' +
                '<div class="subtotal">' + formatearPrecio(subtotal) + '</div>' +
                '<button class="btn-eliminar" onclick="eliminarDelCarrito(' + item.producto_id + ')">🗑️ Eliminar</button>' +
            '</div>' +
        '</div>';
    });
    html += '</div>';

    html += '<div class="resumen-card">';
    html += '<div class="fila"><span data-clave="mercado_subtotal">Subtotal</span><span>' + formatearPrecio(totales.subtotal) + '</span></div>';
    html += '<div class="fila"><span data-clave="mercado_envio">Envío</span><span data-clave="mercado_envio_calcular">A calcular</span></div>';
    html += '<div class="fila total"><span data-clave="mercado_total">Total</span><span>' + formatearPrecio(totales.total) + '</span></div>';
    html += '<div class="fila comision"><span>◈ Comisión Sariel\'s (2%): ' + formatearPrecio(totales.comision) + '</span></div>';
    html += '</div>';

    html += '<div class="acciones-bottom">';
    html += '<button class="btn-vaciar" onclick="vaciarCarrito()" data-clave="mercado_vaciar">🗑️ Vaciar carrito</button>';
    html += '<button class="btn-checkout" onclick="irACheckout()" data-clave="mercado_ir_checkout">◆ Continuar con el pedido</button>';
    html += '</div>';

    container.innerHTML = html;

    if (barra) {
        barra.style.display = 'flex';
        if (barraTotal) barraTotal.textContent = formatearPrecio(totales.total);
    }

    if (typeof window.aplicarTraducciones === 'function') window.aplicarTraducciones(container);
}

// ================================================================
// IR A CHECKOUT → redirige a checkout.html
// ================================================================
function irACheckout() {
    if (carrito.length === 0) {
        showToast('🛒 Tu carrito está vacío', 'warning');
        return;
    }
    window.location.href = '/features/mercado/checkout.html';
}

// ================================================================
// VER TOKENS
// ================================================================
function verTokens() { window.location.href = '/features/perfil/perfil.html'; }

// ================================================================
// INICIALIZACIÓN
// ================================================================
document.addEventListener('DOMContentLoaded', async function () {
    cargarCarrito();
    await cargarUsuarioActual();
    renderizarCarrito();

    setTimeout(async function () {
        try {
            if (typeof window.inicializarIdiomas === 'function') {
                await window.inicializarIdiomas();
                console.log('✅ Idiomas aplicados al carrito');
            }
        } catch (e) { console.warn('Error idiomas:', e); }
    }, 400);
});

// ================================================================
// EXPOSICIÓN GLOBAL
// ================================================================
window.cambiarCantidad = cambiarCantidad;
window.eliminarDelCarrito = eliminarDelCarrito;
window.vaciarCarrito = vaciarCarrito;
window.irACheckout = irACheckout;
window.verTokens = verTokens;
window.showToast = showToast;
</script>
</body>
</html>
