            position: relative;
            padding-left: 24px;

        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: var(--glass-border);
        }
        .timeline-item {
            position: relative;
            padding: 10px 0;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 14px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--gold);
            border: 2px solid var(--space);

// ================================================================
// BANNER DE ERRORES
// ================================================================
function mostrarErrorEnPantalla(mensaje) {
    var banner = document.getElementById('errorBanner');
    var texto = document.getElementById('errorBannerText');
    if (banner && texto) { texto.textContent = mensaje; banner.style.display = 'block'; }
}
window.addEventListener('error', function (event) {
    mostrarErrorEnPantalla((event.message || 'Error desconocido') + ' — línea ' + event.lineno);
});
window.addEventListener('unhandledrejection', function (event) {
    mostrarErrorEnPantalla('Promesa rechazada: ' + (event.reason && event.reason.message ? event.reason.message : event.reason));
});

// ================================================================
// TOAST
// ================================================================
function showToast(mensaje, tipo) {
    try {
        var toastEl = document.getElementById('toast');
        if (!toastEl) { console.warn(mensaje); return; }
        toastEl.textContent = mensaje;
        toastEl.className = 'toast show';
        if (tipo === 'error') toastEl.classList.add('error');
        else if (tipo === 'warning') toastEl.classList.add('warning');
        else if (tipo === 'success') toastEl.classList.add('success');
        clearTimeout(toastEl._timeout);
        toastEl._timeout = setTimeout(function() { toastEl.classList.remove('show'); }, 3500);
    } catch (e) { console.warn('Toast error:', e); }
}

// ================================================================
// HELPERS
// ================================================================
function escapeHTML(texto) {
    if (!texto) return '';
    var div = document.createElement('div');
    div.textContent = texto;
    return div.innerHTML;
}

function formatearFecha(fecha) {
    if (!fecha) return '—';
    try {
        var d = new Date(fecha);
        return d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' }) +
            ' · ' +
            d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return '—'; }
}

function calcularDiasRestantes(fecha) {
    if (!fecha) return 0;
    var diff = new Date(fecha) - new Date();
    return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
}

// ================================================================
// CARGAR USUARIO
// ================================================================
async function cargarUsuarioActual() {
    try {
        var result = await supabase.auth.getSession();
        var session = result.data.session;
        if (!session) { sessionUser = null; return null; }
        sessionUser = session.user;
        var u = await supabase
            .from('usuarios')
            .select('nombre, handle, tokens')
            .eq('id', session.user.id)
            .single();
        if (!u.error && u.data) {
            var badge = document.getElementById('tokenBadgeCantidad');
            if (badge) badge.textContent = u.data.tokens || 0;
        }
        return u.data || null;
    } catch (e) { console.error('Error usuario:', e); return null; }
}

// ================================================================
// CARGAR DATOS DEL REPARTIDOR
// ================================================================
async function cargarDatosRepartidor() {
    try {
        var result = await supabase
            .from('mercado_repartidores')
            .select(`
                id,
                usuario_id,
                estado_verificacion,
                score_confianza,
                motivo_rechazo,
                intentos_verificacion,
                telefono_verificado,
                email_verificado,
                curp_valida,
                ocr_nombre_coincide,
                face_match_score,
                vehiculo_verificado,
                terminos_aceptados,
                aprobado_en,
                en_lista_negra,
                created_at,
                updated_at,
                nombre_completo,
                telefono,
                email,
                ciudad,
                pais,
                vehiculo
            `)
            .eq('usuario_id', sessionUser.id)
            .maybeSingle();

        if (result.error && result.error.code !== 'PGRST116') throw result.error;
        repartidorData = result.data || null;
        return repartidorData;
    } catch (e) {
        console.error('Error cargando repartidor:', e);
        throw e;
    }
}

// ================================================================
// CARGAR HISTORIAL DE CAMBIOS
// ================================================================
async function cargarHistorial() {
    if (!repartidorData || !repartidorData.id) return [];

    try {
        var result = await supabase
            .from('mercado_repartidores_historial')
            .select('*')
            .eq('repartidor_id', repartidorData.id)
            .order('created_at', { ascending: false })
            .limit(20);

        if (result.error) throw result.error;
        historialCambios = result.data || [];
        return historialCambios;
    } catch (e) {
        console.error('Error cargando historial:', e);
        return [];
    }
}

// ================================================================
// RENDER: CHECKLIST DE REQUISITOS
// ================================================================
function renderChecklist() {
    var items = [
        {
            key: 'telefono_verificado',
            titulo: 'Teléfono verificado',
            desc: 'Código SMS confirmado'
        },
        {
            key: 'email_verificado',
            titulo: 'Email verificado',
            desc: 'Código enviado al correo'
        },
        {
            key: 'curp_valida',
            titulo: 'CURP válida',
            desc: 'Validada con algoritmo oficial'
        },
        {
            key: 'ocr_nombre_coincide',
            titulo: 'Documento de identidad',
            desc: 'Nombre coincide con el INE'
        },
        {
            key: 'face_match_score',
            titulo: 'Verificación facial',
            desc: 'Selfie comparada con el INE',
            custom: function (v) {
                if (v >= 0.8) return { estado: 'ok', extra: 'Score: ' + (v * 100).toFixed(0) + '%' };
                if (v > 0) return { estado: 'pendiente', extra: 'Score bajo: ' + (v * 100).toFixed(0) + '%' };
                return null;
            }
        },
        {
            key: 'vehiculo_verificado',
            titulo: 'Vehículo verificado',
            desc: 'Foto con placas visibles'
        },
        {
            key: 'terminos_aceptados',
            titulo: 'Términos aceptados',
            desc: 'Servicio, privacidad, conducta, ubicación'
        }
    ];

    var html = '<div class="checklist">';

    items.forEach(function (item) {
        var valor = repartidorData[item.key];

        var estado = 'pendiente';
        var extra = item.desc;

        if (item.custom) {
            var custom = item.custom(valor);
            if (custom) {
                estado = custom.estado;
                extra = custom.extra || item.desc;
            } else {
                estado = 'pendiente';
            }
        } else {
            if (valor === true) {
                estado = 'ok';
                extra = item.desc;
            } else if (valor === false) {
                estado = 'pendiente';
            } else if (valor === null || valor === undefined) {
                estado = 'pendiente';
            }
        }

        var icono = estado === 'ok' ? '✅' : '⏳';
        var clase = estado === 'ok' ? 'ok' : 'pendiente';

        html += '<div class="checklist-item ' + clase + '">' +
            '<div class="check-icono">' + icono + '</div>' +
            '<div class="check-info">' +
                '<div class="titulo">' + item.titulo + '</div>' +
                '<div class="desc">' + escapeHTML(extra) + '</div>' +
            '</div>' +
        '</div>';
    });

    html += '</div>';
    return html;
}

// ================================================================
// RENDER: TIMELINE DE HISTORIAL
// ================================================================
function renderHistorialTimeline() {
    if (!historialCambios || historialCambios.length === 0) return '';

    var html = '' +
        '<div class="seccion-card">' +
            '<h2>📜 Historial de cambios</h2>' +
            '<div class="timeline">';

    historialCambios.forEach(function (h, index) {
        var estadoNuevo = h.estado_nuevo || 'desconocido';
        var titulo = traducirEstado(estadoNuevo);

        html += '<div class="timeline-item ' + (index === 0 ? 'actual' : '') + '">' +
            '<div class="timeline-fecha">' + formatearFecha(h.created_at) + '</div>' +
            '<div class="timeline-titulo">' + escapeHTML(titulo) + '</div>' +
            (h.motivo ? '<div class="timeline-motivo">' + escapeHTML(h.motivo) + '</div>' : '') +
        '</div>';
    });

    html += '</div></div>';
    return html;
}

function traducirEstado(estado) {
    var mapa = {
        'pendiente_registro': '⏳ Pendiente de registro',
        'procesando': '🔄 Procesando verificación',
        'activo': '✅ Verificado y activo',
        'revision_manual': '👀 En revisión manual',
        'rechazado': '❌ Rechazado',
        'suspendido': '⏸️ Suspendido'
    };
    return mapa[estado] || estado;
}

// ================================================================
// RENDER PRINCIPAL
// ================================================================
function renderEstado() {
    var cont = document.getElementById('contenidoEstado');
    if (!cont) return;

    if (!repartidorData) {
        cont.innerHTML = renderSinRegistro();
        return;
    }

    var estado = repartidorData.estado_verificacion || 'pendiente_registro';

    if (estado === 'activo') {
        cont.innerHTML = renderActivo();
    } else if (estado === 'procesando' || estado === 'revision_manual') {
        cont.innerHTML = renderProcesando(estado);
    } else if (estado === 'rechazado') {
        cont.innerHTML = renderRechazado();
    } else if (estado === 'suspendido') {
        cont.innerHTML = renderSuspendido();
    } else {
        // pendiente_registro u otro
        cont.innerHTML = renderSinRegistro();
    }

    if (typeof window.aplicarTraducciones === 'function') window.aplicarTraducciones(cont);
}

function renderSuspendido() {
    return '' +
        '<div class="hero-estado rechazado">' +
            '<span class="icono-estado">⏸️</span>' +
            '<h1 style="color: var(--warning);">Cuenta suspendida</h1>' +
            '<p>Tu cuenta como repartidor está suspendida temporalmente. Contacta a soporte para más información.</p>' +
        '</div>' +
        '<div class="botones-accion">' +
            '<a href="/features/mercado/index.html" class="btn-secundario">' +
                '🛒 Volver al Mercado' +
            '</a>' +
        '</div>';
}

// ================================================================
// REINTENTAR REGISTRO
// ================================================================
async function reintentarRegistro() {
    var btn = document.getElementById('btnReintentar');
    if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Preparando...'; }

    try {
        var session = await supabase.auth.getSession();
        var token = session.data.session ? session.data.session.access_token : null;

        if (!token) throw new Error('Sin sesión activa');

        var resp = await fetch(API_BASE + '/api/mercado/repartidor/reintentar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({})
        });

        var data = await resp.json();

        if (!resp.ok) {
            throw new Error(data.error || 'No se pudo iniciar el reintento');
        }

        showToast('✅ Puedes volver a intentar', 'success');

        setTimeout(function () {
            window.location.href = '/features/mercado/repartidor/registro.html';
        }, 1200);

    } catch (e) {
        console.error('Error reintentando:', e);
        showToast('❌ ' + e.message, 'error');
        if (btn) {
            btn.disabled = false;
            btn.innerHTML = '🔄 Volver a intentar';
        }
    }
}

// ================================================================
// RECARGAR ESTADO
// ================================================================
async function recargarEstado() {
    showToast('🔄 Actualizando...', 'success');
    await cargarDatosRepartidor();
    await cargarHistorial();
    renderEstado();
}

// ================================================================
// VER TOKENS
// ================================================================
function verTokens() { window.location.href = '/features/perfil/perfil.html'; }

// ================================================================
// INICIALIZACIÓN
// ================================================================
document.addEventListener('DOMContentLoaded', async function () {
    await cargarUsuarioActual();

    if (!sessionUser) {
        window.location.href = '/';
        return;
    }

    try {
        await cargarDatosRepartidor();

        if (repartidorData && repartidorData.id) {
            await cargarHistorial();
        }

        renderEstado();

        // Auto-refresh si está en proceso
        if (repartidorData && (repartidorData.estado_verificacion === 'procesando' || repartidorData.estado_verificacion === 'revision_manual')) {
            setInterval(async function () {
                if (document.hidden) return;
                await cargarDatosRepartidor();
                if (repartidorData.estado_verificacion === 'activo') {
                    renderEstado();
                    showToast('🎉 ¡Ya estás verificado!', 'success');
                }
            }, 20000);
        }

    } catch (e) {
        console.error('Error cargando:', e);
        document.getElementById('contenidoEstado').innerHTML =
            '<div class="seccion-card">' +
                '<div style="text-align: center; padding: 40px 20px; color: var(--danger);">' +
                    '<div style="font-size: 3rem; margin-bottom: 12px;">⚠️</div>' +
                    '<h3 style="color: var(--danger); margin-bottom: 8px;">Error al cargar</h3>' +
                    '<p style="font-size: 0.8rem;">' + escapeHTML(e.message) + '</p>' +
                '</div>' +
            '</div>';
    }

    setTimeout(async function () {
        try {
            if (typeof window.inicializarIdiomas === 'function') {
                await window.inicializarIdiomas();
            }
        } catch (e) { /* silencioso */ }
    }, 400);
});

// ================================================================
// EXPOSICIÓN GLOBAL
// ================================================================
window.verTokens = verTokens;
window.showToast = showToast;
window.reintentarRegistro = reintentarRegistro;
window.recargarEstado = recargarEstado;
</script>
