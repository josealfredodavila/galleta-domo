    <style>
        :root {
            --gold: #D4AF37;
            --gold-dark: #b8923a;
            --gold-light: #e8c84a;
            --green-deep: #0F2D1A;
            --green-mid: #1a4a2a;

            font-family: 'Inter', sans-serif;
            min-height: 100vh;

        }

        .nebula { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.12; pointer-events: none; z-index: 0; animation: nebula-drift 25s ease-in-out infinite alternate; }
        .nebula-1 { width: 700px; height: 700px; background: var(--green-bright); top: -15%; right: -15%; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-light); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.06; }
        .nebula-3 { width: 500px; height: 500px; background: var(--purple); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }
        @keyframes nebula-drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px,-30px) scale(1.15); } }

        .app { position: relative; z-index: 1; max-width: 900px; width: 100%; margin: 0 auto; padding: 12px 16px 30px; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0 14px; border-bottom: 1px solid var(--glass-border);
            background: rgba(5, 8, 15, 0.92); position: sticky; top: 0; z-index: 100;

        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-hex { font-size: 1.8rem; color: var(--gold); font-family: 'Orbitron', monospace; }

        .logo-text span { color: var(--gold); }
        .logo-badge { font-size: 0.45rem; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--space); padding: 2px 10px; border-radius: 20px; font-weight: 700; }
        .token-badge { display: flex; align-items: center; gap: 6px; background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.15); padding: 4px 14px; border-radius: 20px; font-size: 0.7rem; color: var(--gold); font-family: 'Orbitron', monospace; cursor: pointer; }

        .main-nav {

        .tienda-info .header-info {

        .meta-chip.success .simbolo { color: var(--success); }

        .tienda-info .contacto-row {
            display: flex; gap: 8px; flex-wrap: wrap;
        }
        .btn-contacto {
            padding: 9px 16px;
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            border-radius: 20px;

        .categorias-tienda-scroll {

        .seccion-titulo {

        }
        .producto-card .badge-destacado {
            position: absolute; top: 8px; right: 8px;
            background: rgba(212,175,55,0.9);

            font-size: 0.65rem;
            font-weight: 700;

        .producto-card .info {
            padding: 10px 12px 12px;

            flex-direction: column;
        }
        .producto-card .info .nombre {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-primary);

        .producto-card .info .desc {

            -webkit-box-orient: vertical;

        .producto-card .btn-agregar {

            color: var(--space);
            border: none;
            border-radius: 20px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.68rem;

            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;

            color: var(--space);
            padding: 12px 24px;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;

            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);

            transform: translateX(-50%) translateY(0);

            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; padding: 20px; overflow-y: auto;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: linear-gradient(135deg, var(--glass-bg), rgba(5,8,15,0.98));
            border: 2px solid var(--gold);
            border-radius: var(--radius-xl);
            padding: 24px 22px; max-width: 460px; width: 100%;
            max-height: 90vh; overflow-y: auto;
            position: relative; animation: scaleIn 0.3s ease;

        @keyframes scaleIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }

            background: transparent; border: none;
            color: var(--text-muted); font-size: 1.5rem;
            cursor: pointer; transition: var(--transition);
            z-index: 3;

        .modal .close-btn:hover { color: var(--text-primary); transform: rotate(90deg); }

            width: 100%; height: 180px;
            background: linear-gradient(135deg, var(--green-deep), var(--green-mid));
            border-radius: 14px;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem;
            color: var(--gold);
            font-family: 'Orbitron', monospace;
            margin-bottom: 14px;
        }
        .modal .foto-m img { width: 100%; height: 100%; object-fit: cover; }

            font-family: 'Orbitron', monospace;
            font-size: 1.05rem;
            color: var(--text-primary);
            font-weight: 700;
            margin-bottom: 6px;
        }

<script>
var supabaseUrl = 'https://zultnlogdoajehbswlih.supabase.co';
var supabaseKey = 'sb_publishable_S3jONAz3mRO4JKBRhUdI1A_-nsyVhKu';
var supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
window.supabaseClient = supabaseClient;
var supabase = supabaseClient;

var CARRITO_KEY = 'mercado_carrito_v1';

var sessionUser = null;
var tiendaId = null;
var tienda = null;
var productosCache = [];
var productosFiltrados = [];
var categoriasCache = [];
var filtroCategoria = null;
var productoActual = null;
var cantidadActual = 1;

function mostrarErrorEnPantalla(mensaje) {
    var banner = document.getElementById('errorBanner');
    var texto = document.getElementById('errorBannerText');
    if (banner && texto) { texto.textContent = mensaje; banner.style.display = 'block'; }
}
window.addEventListener('error', function (event) {
    mostrarErrorEnPantalla((event.message || 'Error desconocido') + ' — línea ' + event.lineno);
});
window.addEventListener('unhandledrejection', function (event) {
    mostrarErrorEnPantalla('Promesa rechazada: ' + (event.reason && event.reason.message ? event.reason.message : event.reason));
});

function showToast(mensaje, tipo) {
    try {
        var toastEl = document.getElementById('toast');
        if (!toastEl) { console.warn(mensaje); return; }
        toastEl.textContent = mensaje;
        toastEl.className = 'toast show';
        if (tipo === 'error') toastEl.classList.add('error');
        else if (tipo === 'warning') toastEl.classList.add('warning');
        else if (tipo === 'success') toastEl.classList.add('success');
        clearTimeout(toastEl._timeout);
        toastEl._timeout = setTimeout(function() { toastEl.classList.remove('show'); }, 3000);
    } catch (e) { console.warn('Toast error:', e); }
}

function escapeHTML(texto) {
    if (!texto) return '';
    var div = document.createElement('div');
    div.textContent = texto;
    return div.innerHTML;
}

function formatearPrecio(n) {
    return '$' + parseFloat(n || 0).toFixed(2);
}

function getParamURL(nombre) {
    try {
        var params = new URLSearchParams(window.location.search);
        return params.get(nombre);
    } catch (e) { return null; }
}

function fotoPrincipal(producto) {
    if (!producto) return null;
    if (Array.isArray(producto.fotos) && producto.fotos.length > 0) {
        return producto.fotos[0];
    }
    return null;
}

function precioActual(producto) {
    if (!producto) return 0;
    var promo = parseFloat(producto.precio_promocion || 0);
    var base = parseFloat(producto.precio_mxn || 0);
    if (promo > 0 && promo < base) return promo;
    return base;
}

function tienePromo(producto) {
    var promo = parseFloat(producto.precio_promocion || 0);
    var base = parseFloat(producto.precio_mxn || 0);
    return promo > 0 && promo < base;
}

function tiendaEstaAbierta(t) {
    if (!t.horario_apertura || !t.horario_cierre) return null;
    try {
        var ahora = new Date();
        var ahoraMin = ahora.getHours() * 60 + ahora.getMinutes();
        var ap = String(t.horario_apertura).split(':');
        var ci = String(t.horario_cierre).split(':');
        var apMin = parseInt(ap[0]) * 60 + parseInt(ap[1] || 0);
        var ciMin = parseInt(ci[0]) * 60 + parseInt(ci[1] || 0);
        if (ciMin < apMin) return ahoraMin >= apMin || ahoraMin <= ciMin;
        return ahoraMin >= apMin && ahoraMin <= ciMin;
    } catch (e) { return null; }
}

function leerCarrito() {
    try {
        var raw = localStorage.getItem(CARRITO_KEY);
        if (!raw) return [];
        var data = JSON.parse(raw);
        return Array.isArray(data) ? data : [];
    } catch (e) { return []; }
}

function guardarCarrito(items) {
    try {
        localStorage.setItem(CARRITO_KEY, JSON.stringify(items));
        actualizarContadorCarrito();
    } catch (e) { console.warn('Error guardando carrito:', e); }
}

function agregarAlCarrito(producto, cantidad) {
    if (!tienda) return;
    var items = leerCarrito();

    var otrasTiendas = items.filter(function (it) {
        return it.tienda_id !== tienda.id;
    });

    if (otrasTiendas.length > 0) {
        var confirmar = confirm(
            'Tu carrito tiene productos de otra tienda. ¿Quieres vaciarlo y empezar con los de ' + tienda.nombre_negocio + '?'
        );
        if (!confirmar) return;
        items = [];
    }

    var existente = items.find(function (it) {
        return it.producto_id === producto.id;
    });

    if (existente) {
        existente.cantidad += cantidad;
        existente.subtotal = existente.cantidad * existente.precio_unitario;
    } else {
        items.push({
            producto_id: producto.id,
            tienda_id: tienda.id,
            tienda_nombre: tienda.nombre_negocio,
            nombre: producto.nombre,
            precio_unitario: precioActual(producto),
            precio_original: parseFloat(producto.precio_mxn || 0),
            tiene_promo: tienePromo(producto),
            cantidad: cantidad,
            subtotal: precioActual(producto) * cantidad,
            foto_url: fotoPrincipal(producto)
        });
    }

    guardarCarrito(items);
    showToast('● Agregado al carrito', 'success');
    cerrarModalProducto();
}

function actualizarContadorCarrito() {
    var items = leerCarrito();
    var total = items.reduce(function (sum, it) { return sum + (it.cantidad || 0); }, 0);
    var contador = document.getElementById('carritoContador');
    var flotante = document.getElementById('carritoFlotante');
    if (contador) contador.textContent = total;
    if (flotante) {
        if (total > 0) flotante.classList.add('show');
        else flotante.classList.remove('show');
    }
}

async function cargarUsuarioActual() {
    try {
        var result = await supabase.auth.getSession();
        var session = result.data.session;
        if (!session) return null;
        sessionUser = session.user;
        var u = await supabase
            .from('usuarios')
            .select('nombre, handle, tokens')
            .eq('id', session.user.id)
            .single();
        if (!u.error && u.data) {
            var badge = document.getElementById('tokenBadgeCantidad');
            if (badge) badge.textContent = u.data.tokens || 0;
        }
        return u.data || null;
    } catch (e) { console.error('Error cargando usuario:', e); return null; }
}

async function cargarCategorias() {
    try {
        var result = await supabase
            .from('mercado_categorias')
            .select('id, slug, nombre, icono')
            .eq('activa', true)
            .order('orden', { ascending: true });
        if (result.error) throw result.error;
        categoriasCache = result.data || [];
        return categoriasCache;
    } catch (e) {
        console.error('Error cargando categorías:', e);
        categoriasCache = [];
        return [];
    }
}

async function cargarTienda() {
    var container = document.getElementById('tiendaContainer');
    if (!container) return;

    try {
        var result = await supabase
            .from('mercado_tiendas')
            .select('*')
            .eq('id', tiendaId)
            .maybeSingle();

        if (result.error) throw result.error;

        if (!result.data) {
            container.innerHTML = '<div class="empty-state">' +
                '<span class="icon">◈</span>' +
                '<h3 data-clave="mercado_tienda_no_existe">Tienda no encontrada</h3>' +
                '<p data-clave="mercado_tienda_no_existe_desc">Puede que el enlace sea incorrecto.</p>' +
                '<a href="/features/mercado/index.html" class="btn-back" style="margin-top:16px;"><span class="simbolo">◈</span> <span data-clave="mercado_volver_mercado">Volver al Mercado</span></a>' +
            '</div>';
            return;
        }

        tienda = result.data;

        if (tienda.estado !== 'activa') {
            container.innerHTML = '<div class="empty-state">' +
                '<span class="icon">✶</span>' +
                '<h3>Esta tienda no está disponible</h3>' +
                '<p>Estado: ' + escapeHTML(tienda.estado) + '</p>' +
                '<a href="/features/mercado/index.html" class="btn-back" style="margin-top:16px;"><span class="simbolo">◈</span> Volver al Mercado</a>' +
            '</div>';
            return;
        }

        await cargarProductos();
        renderTienda();

    } catch (e) {
        console.error('Error cargando tienda:', e);
        container.innerHTML = '<div class="empty-state">' +
            '<span class="icon">✶</span>' +
            '<h3>Error al cargar la tienda</h3>' +
            '<p>' + escapeHTML(e.message) + '</p>' +
        '</div>';
    }
}

async function cargarProductos() {
    try {
        var result = await supabase
            .from('mercado_productos')
            .select('*')
            .eq('tienda_id', tiendaId)
            .eq('activo', true)
            .order('destacado', { ascending: false })
            .order('orden', { ascending: true })
            .order('created_at', { ascending: false });

        if (result.error) throw result.error;
        productosCache = result.data || [];
        productosFiltrados = productosCache.slice();
        return productosCache;
    } catch (e) {
        console.error('Error cargando productos:', e);
        productosCache = [];
        productosFiltrados = [];
        return [];
    }
}

function renderTienda() {
    var container = document.getElementById('tiendaContainer');
    if (!container || !tienda) return;

    var categoria = categoriasCache.find(function (c) { return c.id === tienda.categoria_id; }) || null;
    var nivel = (tienda.nivel || 'basico').toLowerCase();
    var abierta = tiendaEstaAbierta(tienda);
    var rating = parseFloat(tienda.calificacion_promedio || 0);
    var totalResenas = parseInt(tienda.total_resenas || 0);

    var portadaHTML = tienda.portada_url
        ? '<img src="' + escapeHTML(tienda.portada_url) + '" alt="" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<div class=&quot;emoji-grande&quot;>◈</div>\';" />'
        : '<div class="emoji-grande">◈</div>';

    var logoHTML = tienda.logo_url
        ? '<img src="' + escapeHTML(tienda.logo_url) + '" alt="" onerror="this.style.display=\'none\';this.parentElement.textContent=\'◈\';" />'
        : '◈';

    var horarioBadge = '';
    if (abierta === true) horarioBadge = '<span class="badge-horario abierto">● Abierto</span>';
    else if (abierta === false) horarioBadge = '<span class="badge-horario cerrado">○ Cerrado</span>';

    var nivelHTML = '';
    if (nivel === 'max') nivelHTML = '<span class="badge-nivel max">✪ MAX</span>';
    else if (nivel === 'pro') nivelHTML = '<span class="badge-nivel pro">✦ PRO</span>';
    else nivelHTML = '<span class="badge-nivel basico">● BÁSICO</span>';

    var chips = '';
    chips += '<span class="meta-chip gold"><span class="simbolo">✩</span> ' + (tienda.total_pedidos || 0) + ' pedidos</span>';
    if (totalResenas > 0) {
        chips += '<span class="meta-chip gold"><span class="simbolo">★</span> ' + rating.toFixed(1) + ' (' + totalResenas + ')</span>';
    }
    if (tienda.acepta_delivery) chips += '<span class="meta-chip cyan"><span class="simbolo">◆</span> Delivery</span>';
    if (tienda.acepta_pickup) chips += '<span class="meta-chip purple"><span class="simbolo">◇</span> Recoger</span>';

    var envioMxn = parseFloat(tienda.envio_mxn || 0);
    if (envioMxn > 0) {
        chips += '<span class="meta-chip success"><span class="simbolo">◆</span> Envío ' + formatearPrecio(envioMxn) + '</span>';
    } else if (tienda.acepta_delivery) {
        chips += '<span class="meta-chip"><span class="simbolo">◈</span> Envío a coordinar</span>';
    }

    if (tienda.horario_apertura && tienda.horario_cierre) {
        chips += '<span class="meta-chip"><span class="simbolo">◈</span> ' + String(tienda.horario_apertura).substring(0,5) + ' - ' + String(tienda.horario_cierre).substring(0,5) + '</span>';
    }

    var html = '';

    html += '<div class="tienda-portada">' +
        portadaHTML +
        '<a href="/features/mercado/index.html" class="btn-atras-overlay" aria-label="Atrás">◈</a>' +
    '</div>';

    html += '<div class="tienda-info">' +
        '<div class="logo-wrap">' +
            '<div class="logo">' + logoHTML + '</div>' +
        '</div>' +

        '<div class="header-info">' +
            '<div>' +
                '<div class="nombre-t">' +
                    escapeHTML(tienda.nombre_negocio) +
                    nivelHTML +
                    horarioBadge +
                '</div>' +
                '<div class="categoria-t">' +
                    '<span class="simbolo">◆</span> ' +
                    (categoria ? escapeHTML(categoria.nombre) : 'General') +
                '</div>' +
            '</div>' +
        '</div>' +

        (tienda.descripcion ? '<div class="descripcion-t">' + escapeHTML(tienda.descripcion) + '</div>' : '') +

        '<div class="meta-chips">' + chips + '</div>' +

        '<div class="contacto-row" id="contactoRow"></div>' +
    '</div>';

    html += '<div class="seccion-titulo">' +
        '<span><span class="simbolo">◈</span> <span data-clave="mercado_productos">Productos</span></span>' +
        '<span class="contador" id="contadorProductos">' + productosFiltrados.length + '</span>' +
    '</div>';

    html += '<div class="categorias-tienda-scroll" id="categoriasTiendaScroll"></div>';

    html += '<div class="productos-grid" id="productosGrid"></div>';

    container.innerHTML = html;

    renderContacto();
    renderCategoriasTienda();
    renderProductos();

    if (typeof window.aplicarTraducciones === 'function') window.aplicarTraducciones(container);
}

function renderContacto() {
    var row = document.getElementById('contactoRow');
    if (!row || !tienda) return;

    var html = '';

    if (tienda.whatsapp) {
        var waNum = String(tienda.whatsapp).replace(/\D/g, '');
        html += '<a href="https://wa.me/' + waNum + '?text=' + encodeURIComponent('Hola, vi tu tienda ' + tienda.nombre_negocio + ' en el Mercado') + '" target="_blank" rel="noopener" class="btn-contacto whatsapp">' +
            '<span class="simbolo">●</span> WhatsApp' +
        '</a>';
    }

    if (tienda.telefono) {
        html += '<a href="tel:' + escapeHTML(tienda.telefono) + '" class="btn-contacto">' +
            '<span class="simbolo">◆</span> Llamar' +
        '</a>';
    }

    if (tienda.instagram) {
        var igHandle = String(tienda.instagram).replace('@', '');
        html += '<a href="https://instagram.com/' + igHandle + '" target="_blank" rel="noopener" class="btn-contacto">' +
            '<span class="simbolo">◇</span> Instagram' +
        '</a>';
    }

    if (tienda.facebook) {
        html += '<a href="' + escapeHTML(tienda.facebook) + '" target="_blank" rel="noopener" class="btn-contacto">' +
            '<span class="simbolo">◆</span> Facebook' +
        '</a>';
    }

    if (tienda.direccion) {
        html += '<span class="btn-contacto" style="cursor:default;">' +
            '<span class="simbolo">●</span> ' + escapeHTML(tienda.direccion) +
        '</span>';
    }

    row.innerHTML = html;
}

function renderCategoriasTienda() {
    var scroll = document.getElementById('categoriasTiendaScroll');
    if (!scroll) return;

    var idsUsados = [];
    productosCache.forEach(function (p) {
        if (p.categoria_id && idsUsados.indexOf(p.categoria_id) === -1) {
            idsUsados.push(p.categoria_id);
        }
    });

    if (idsUsados.length < 2) {
        scroll.innerHTML = '';
        return;
    }

    var html = '<button class="cat-t-btn ' + (filtroCategoria === null ? 'active' : '') + '" onclick="filtrarCategoriaTienda(null, this)"><span class="simbolo">◈</span> Todos</button>';

    idsUsados.forEach(function (catId) {
        var cat = categoriasCache.find(function (c) { return c.id === catId; });
        if (!cat) return;
        html += '<button class="cat-t-btn ' + (filtroCategoria === catId ? 'active' : '') + '" onclick="filtrarCategoriaTienda(' + catId + ', this)">' +
            '<span class="simbolo">◆</span> ' + escapeHTML(cat.nombre) +
        '</button>';
    });

    scroll.innerHTML = html;
}

function filtrarCategoriaTienda(catId, btn) {
    filtroCategoria = catId;
    if (catId === null) {
        productosFiltrados = productosCache.slice();
    } else {
        productosFiltrados = productosCache.filter(function (p) { return p.categoria_id === catId; });
    }

    document.querySelectorAll('.cat-t-btn').forEach(function (b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');

    var contador = document.getElementById('contadorProductos');
    if (contador) contador.textContent = productosFiltrados.length;

    renderProductos();
}

function renderProductos() {
    var grid = document.getElementById('productosGrid');
    if (!grid) return;

    if (productosFiltrados.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">' +
            '<span class="icon">◈</span>' +
            '<h3 data-clave="mercado_sin_productos">Sin productos</h3>' +
            '<p data-clave="mercado_sin_productos_desc">Esta tienda aún no ha publicado productos.</p>' +
        '</div>';
        if (typeof window.aplicarTraducciones === 'function') window.aplicarTraducciones(grid);
        return;
    }

    var html = '';
    productosFiltrados.forEach(function (p) {
        var foto = fotoPrincipal(p);
        var precio = precioActual(p);
        var original = parseFloat(p.precio_mxn || 0);
        var promo = tienePromo(p);
        var stock = parseInt(p.stock || 0);
        var ilimitado = !!p.stock_ilimitado;

        var fotoHTML = foto
            ? '<img src="' + escapeHTML(foto) + '" alt="" onerror="this.style.display=\'none\';this.parentElement.textContent=\'◈\';" />'
            : '◈';

        var stockBadge = '';
        if (ilimitado) {
            stockBadge = '<span class="stock-badge ilimitado"><span class="simbolo">◆</span> Disponible</span>';
        } else if (stock <= 0) {
            stockBadge = '<span class="stock-badge agotado"><span class="simbolo">✶</span> Agotado</span>';
        } else if (stock <= 5) {
            stockBadge = '<span class="stock-badge pocas"><span class="simbolo">✧</span> Solo ' + stock + '</span>';
        } else {
            stockBadge = '<span class="stock-badge disponible"><span class="simbolo">●</span> ' + stock + '</span>';
        }

        var agotado = !ilimitado && stock <= 0;

        html += '<div class="producto-card" onclick="abrirDetalleProducto(' + p.id + ')">' +
            '<div class="foto">' +
                fotoHTML +
                (promo ? '<span class="badge-promo">✶ -' + Math.round((1 - precio / original) * 100) + '%</span>' : '') +
                (p.destacado ? '<span class="badge-destacado">✦</span>' : '') +
            '</div>' +
            '<div class="info">' +
                '<div class="nombre">' + escapeHTML(p.nombre) + '</div>' +
                (p.descripcion ? '<div class="desc">' + escapeHTML(p.descripcion) + '</div>' : '') +
                '<div class="precio-box">' +
                    '<div class="precios">' +
                        '<span class="precio-promo">' + formatearPrecio(precio) + '</span>' +
                        (promo ? '<span class="precio-original">' + formatearPrecio(original) + '</span>' : '') +
                    '</div>' +
                    stockBadge +
                '</div>' +
                '<button class="btn-agregar" ' + (agotado ? 'disabled' : '') + ' onclick="event.stopPropagation();abrirDetalleProducto(' + p.id + ')">' +
                    (agotado ? '<span class="simbolo">✶</span> Agotado' : '<span class="simbolo">◆</span> Agregar') +
                '</button>' +
            '</div>' +
        '</div>';
    });

    grid.innerHTML = html;
    if (typeof window.aplicarTraducciones === 'function') window.aplicarTraducciones(grid);
}

function abrirDetalleProducto(productoId) {
    var p = productosCache.find(function (x) { return x.id === productoId; });
    if (!p) return;

    productoActual = p;
    cantidadActual = 1;

    renderModalProducto();
    document.getElementById('modalProducto').classList.add('show');
}

function renderModalProducto() {
    var cont = document.getElementById('modalProductoContenido');
    if (!cont || !productoActual) return;

    var p = productoActual;
    var foto = fotoPrincipal(p);
    var precio = precioActual(p);
    var original = parseFloat(p.precio_mxn || 0);
    var promo = tienePromo(p);
    var stock = parseInt(p.stock || 0);
    var ilimitado = !!p.stock_ilimitado;
    var maxCantidad = ilimitado ? 99 : stock;

    var fotoHTML = foto
        ? '<img src="' + escapeHTML(foto) + '" alt="" onerror="this.style.display=\'none\';this.parentElement.textContent=\'◈\';" />'
        : '◈';

    var html = '' +
        '<div class="foto-m">' + fotoHTML + '</div>' +
        '<div class="nombre-m">' + escapeHTML(p.nombre) + '</div>' +
        (p.descripcion ? '<div class="desc-m">' + escapeHTML(p.descripcion) + '</div>' : '') +
        '<div class="precio-m">' + formatearPrecio(precio) + '</div>' +
        (promo ? '<div class="precio-original-m">Antes: ' + formatearPrecio(original) + '</div>' : '');

    if (ilimitado || stock > 0) {
        html += '<div class="cantidad-box">' +
            '<button onclick="cambiarCantidad(-1)" ' + (cantidadActual <= 1 ? 'disabled' : '') + '>−</button>' +
            '<span class="cantidad-valor">' + cantidadActual + '</span>' +
            '<button onclick="cambiarCantidad(1)" ' + (cantidadActual >= maxCantidad ? 'disabled' : '') + '>+</button>' +
        '</div>' +
        '<div class="subtotal-m">Subtotal: <strong>' + formatearPrecio(precio * cantidadActual) + '</strong></div>' +
        '<button class="btn-primario" onclick="agregarSeleccionado()">' +
            '<span class="simbolo">◆</span> Agregar ' + cantidadActual + ' al carrito' +
        '</button>';
    } else {
        html += '<div style="text-align:center; padding:14px; color:var(--danger); font-size:0.8rem;">' +
            '<span style="font-family:Orbitron,monospace;">✶</span> Producto agotado' +
        '</div>';
    }

    cont.innerHTML = html;
}

function cambiarCantidad(delta) {
    if (!productoActual) return;
    var stock = parseInt(productoActual.stock || 0);
    var ilimitado = !!productoActual.stock_ilimitado;
    var max = ilimitado ? 99 : stock;

    var nueva = cantidadActual + delta;
    if (nueva < 1) nueva = 1;
    if (nueva > max) nueva = max;
    cantidadActual = nueva;

    renderModalProducto();
}

function agregarSeleccionado() {
    if (!productoActual) return;
    agregarAlCarrito(productoActual, cantidadActual);
}

function cerrarModalProducto() {
    document.getElementById('modalProducto').classList.remove('show');
    productoActual = null;
    cantidadActual = 1;
}

function verTokens() { window.location.href = '/features/perfil/perfil.html'; }

document.addEventListener('DOMContentLoaded', async function () {
    tiendaId = getParamURL('id');

    if (!tiendaId) {
        document.getElementById('tiendaContainer').innerHTML = '<div class="empty-state">' +
            '<span class="icon">◈</span>' +
            '<h3>Falta el ID de la tienda</h3>' +
            '<a href="/features/mercado/index.html" class="btn-back" style="margin-top:16px;"><span class="simbolo">◈</span> Volver al Mercado</a>' +
        '</div>';
        return;
    }

    actualizarContadorCarrito();
    await cargarUsuarioActual();
    await cargarCategorias();
    await cargarTienda();

    setTimeout(async function () {
        try {
            if (typeof window.inicializarIdiomas === 'function') {
                await window.inicializarIdiomas();
            }
        } catch (e) { console.warn('Error idiomas:', e); }
    }, 400);
});

document.addEventListener('click', function (e) {
    var modal = document.getElementById('modalProducto');
    if (e.target === modal) cerrarModalProducto();
});

window.verTokens = verTokens;
window.showToast = showToast;
window.abrirDetalleProducto = abrirDetalleProducto;
window.cerrarModalProducto = cerrarModalProducto;
window.cambiarCantidad = cambiarCantidad;
window.agregarSeleccionado = agregarSeleccionado;
window.filtrarCategoriaTienda = filtrarCategoriaTienda;
window.actualizarContadorCarrito = actualizarContadorCarrito;
</script>
</body>
</html>
