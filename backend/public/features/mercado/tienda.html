<!-- ================================================================
     MERCADO - SARIEL'S ECOSYSTEM
     Vista de una tienda + catálogo de productos + carrito
     ================================================================ -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>◈ Tienda · Sariel's</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <script src="/features/shared/js/apariencia-global.js"></script>

    <style>
        :root {
            --gold: #D4AF37;
            --gold-dark: #b8923a;
            --gold-light: #e8c84a;
            --gold-bright: #f0d060;
            --green-deep: #0F2D1A;
            --green-mid: #1a4a2a;
            --green-bright: #2a6a3a;
            --space: #05080f;
            --text-primary: #f0f4f8;
            --text-secondary: #c0d8e8;
            --text-muted: #8aa8b8;
            --glass-bg: rgba(15, 45, 26, 0.55);
            --glass-border: rgba(212, 175, 55, 0.15);
            --shadow-gold: 0 8px 32px rgba(212, 175, 55, 0.25);
            --shadow-gold-strong: 0 0 60px rgba(212, 175, 55, 0.15);
            --radius: 16px;
            --radius-xl: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00d68f;
            --danger: #ff3366;
            --warning: #f7d44a;
            --cyan: #00e5ff;
            --purple: #a855f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--space);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(26, 74, 42, 0.4) 0%, transparent 60%), radial-gradient(ellipse at 80% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            padding-bottom: 90px;
        }

        .nebula { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.12; pointer-events: none; z-index: 0; animation: nebula-drift 25s ease-in-out infinite alternate; }
        .nebula-1 { width: 700px; height: 700px; background: var(--green-bright); top: -15%; right: -15%; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-light); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.06; }
        .nebula-3 { width: 500px; height: 500px; background: var(--purple); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }
        @keyframes nebula-drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px,-30px) scale(1.15); } }

        .app { position: relative; z-index: 1; max-width: 100%; width: 100%; margin: 0 auto; padding: 12px 16px 30px; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0 14px; border-bottom: 1px solid var(--glass-border);
            background: rgba(5, 8, 15, 0.92); position: sticky; top: 0; z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-hex { font-size: 1.8rem; color: var(--gold); font-family: 'Orbitron', monospace; }
        .logo-text { font-family: 'Orbitron', monospace; font-size: 1.2rem; color: var(--text-primary); letter-spacing: 2px; }
        .logo-text span { color: var(--gold); }
        .logo-badge { font-size: 0.45rem; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--space); padding: 2px 10px; border-radius: 20px; font-weight: 700; }
        .network-badge { display: flex; align-items: center; gap: 6px; font-size: 0.6rem; color: var(--gold); background: rgba(212,175,55,0.1); padding: 4px 12px; border-radius: 20px; }
        .token-badge { display: flex; align-items: center; gap: 6px; background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.15); padding: 4px 14px; border-radius: 20px; font-size: 0.7rem; color: var(--gold); font-family: 'Orbitron', monospace; cursor: pointer; }

        .main-nav {
            display: flex; gap: 4px; background: rgba(15,45,26,0.3); border-radius: var(--radius);
            padding: 4px; border: 1px solid var(--glass-border); margin: 16px 0 20px; overflow-x: auto;
        }
        .main-nav .nav-link { padding: 8px 16px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; white-space: nowrap; transition: var(--transition); }
        .main-nav .nav-link:hover { color: var(--text-primary); background: rgba(212,175,55,0.05); }
        .main-nav .nav-link.active { background: rgba(212,175,55,0.12); color: var(--gold); }
        .main-nav .nav-link.live { color: var(--danger); }

        /* Botón atrás */
        .btn-back {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
            color: var(--text-muted); padding: 8px 16px; border-radius: 30px;
            font-size: 0.72rem; text-decoration: none; margin-bottom: 16px;
            transition: var(--transition); cursor: pointer;
        }
        .btn-back:hover { border-color: var(--gold); color: var(--gold); }

        /* HERO TIENDA */
        .tienda-hero {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }
        .tienda-hero .portada {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, var(--green-deep), var(--green-mid));
            display: flex; align-items: center; justify-content: center;
            color: var(--gold); font-size: 3.5rem;
            position: relative;
        }
        .tienda-hero .portada img { width: 100%; height: 100%; object-fit: cover; }
        .tienda-hero .portada .badge-nivel {
            position: absolute; top: 14px; right: 14px;
            font-size: 0.55rem; padding: 4px 12px; border-radius: 14px;
            font-family: 'Orbitron', monospace; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
        }
        .tienda-hero .portada .badge-nivel.max {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff; box-shadow: 0 0 15px rgba(168,85,247,0.5);
        }
        .tienda-hero .portada .badge-nivel.pro {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
        }
        .tienda-hero .info-principal {
            padding: 16px 20px 20px;
            position: relative;
            display: flex;
            gap: 16px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .tienda-hero .logo-big {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green-deep), var(--gold));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; color: #fff;
            border: 3px solid var(--space);
            overflow: hidden; flex-shrink: 0;
            margin-top: -40px;
            font-family: 'Orbitron', monospace;
            position: relative;
            z-index: 2;
        }
        .tienda-hero .logo-big img { width: 100%; height: 100%; object-fit: cover; }
        .tienda-hero .info-texto { flex: 1; min-width: 200px; }
        .tienda-hero .info-texto h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem; font-weight: 700;
            color: var(--gold);
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .tienda-hero .info-texto .categoria-rating {
            display: flex; align-items: center; gap: 12px;
            font-size: 0.7rem; color: var(--text-muted);
            flex-wrap: wrap; margin-bottom: 8px;
        }
        .tienda-hero .info-texto .categoria-rating .rating {
            color: var(--warning); font-weight: 600;
        }
        .tienda-hero .info-texto .descripcion {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 10px;
        }
        .tienda-hero .info-texto .contacto {
            display: flex; flex-direction: column; gap: 4px;
            font-size: 0.7rem; color: var(--text-muted);
        }
        .tienda-hero .info-texto .contacto span { display: flex; align-items: center; gap: 6px; }
        .tienda-hero .info-texto .contacto a { color: var(--cyan); text-decoration: none; }
        .tienda-hero .info-texto .contacto a:hover { text-decoration: underline; }

        /* Estado abierto/cerrado */
        .estado-tienda {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.65rem; font-weight: 600;
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.3);
            margin-top: 8px;
        }
        .estado-tienda.abierto { color: var(--success); border-color: var(--success); }
        .estado-tienda.cerrado { color: var(--danger); border-color: var(--danger); }

        /* Formas de entrega */
        .formas-entrega {
            display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
        }
        .forma-entrega {
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.6rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
        }
        .forma-entrega.activa { color: var(--gold); border-color: var(--gold); background: rgba(212,175,55,0.1); }

        /* CATEGORÍAS DE PRODUCTOS */
        .productos-nav {
            display: flex; gap: 6px; overflow-x: auto;
            padding: 4px 0; margin-bottom: 16px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .productos-nav::-webkit-scrollbar { display: none; }
        .prod-cat-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex; align-items: center; gap: 6px;
            white-space: nowrap;
        }
        .prod-cat-btn:hover { border-color: var(--gold); color: var(--gold); }
        .prod-cat-btn.active {
            background: rgba(212,175,55,0.15);
            border-color: var(--gold);
            color: var(--gold);
            font-weight: 600;
        }

        /* TÍTULO SECCIÓN */
        .seccion-titulo {
            display: flex; justify-content: space-between; align-items: center;
            margin: 20px 0 12px;
            padding: 0 4px;
        }
        .seccion-titulo h2 {
            font-family: 'Orbitron', monospace;
            color: var(--gold);
            font-size: 0.95rem;
            font-weight: 600;
        }
        .seccion-titulo .count {
            font-size: 0.65rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.35);
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        /* LISTA DE PRODUCTOS */
        .productos-lista {
            display: flex; flex-direction: column; gap: 12px;
        }

        .producto-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            transition: var(--transition);
        }
        .producto-card:hover {
            border-color: var(--gold);
        }
        .producto-card.agotado { opacity: 0.55; }
        .producto-card .foto {
            width: 80px; height: 80px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--green-deep), var(--green-mid));
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
            color: var(--gold);
            border: 1px solid var(--glass-border);
        }
        .producto-card .foto img { width: 100%; height: 100%; object-fit: cover; }
        .producto-card .info { flex: 1; min-width: 0; }
        .producto-card .info .nombre {
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .producto-card .info .desc {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .producto-card .info .precio-row {
            display: flex; align-items: center; gap: 10px;
            flex-wrap: wrap;
        }
        .producto-card .info .precio {
            font-family: 'Orbitron', monospace;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--gold);
        }
        .producto-card .info .precio-tachado {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }
        .producto-card .info .stock {
            font-size: 0.6rem;
            color: var(--text-muted);
        }
        .producto-card .info .stock.agotado-txt {
            color: var(--danger);
            font-weight: 600;
        }
        .producto-card .acciones {
            flex-shrink: 0;
            display: flex; flex-direction: column; gap: 6px;
            align-items: flex-end;
        }
        .btn-agregar {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Orbitron', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex; align-items: center; gap: 4px;
            white-space: nowrap;
        }
        .btn-agregar:hover:not(:disabled) { transform: scale(1.03); box-shadow: var(--shadow-gold); }
        .btn-agregar:disabled {
            background: rgba(0,0,0,0.4);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Badge destacado */
        .badge-destacado {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.5rem;
            background: rgba(212,175,55,0.15);
            color: var(--gold);
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* CARRITO FLOTANTE */
        .carrito-flotante {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 500;
            background: rgba(15, 25, 20, 0.98);
            backdrop-filter: blur(12px);
            border-top: 2px solid var(--gold);
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0));
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: 0 -4px 30px rgba(0,0,0,0.6);
            max-width: 100%;
            animation: slideUpCarrito 0.3s ease;
        }
        .carrito-flotante.visible { display: flex; }
        @keyframes slideUpCarrito {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .carrito-flotante .icono {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
            position: relative;
            flex-shrink: 0;
        }
        .carrito-flotante .icono .contador {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            border: 2px solid var(--space);
        }
        .carrito-flotante .resumen {
            flex: 1;
            min-width: 0;
        }
        .carrito-flotante .resumen .lbl {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .carrito-flotante .resumen .total {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold);
        }
        .carrito-flotante .btn-ver-carrito {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }
        .carrito-flotante .btn-ver-carrito:hover {
            transform: scale(1.03);
            box-shadow: var(--shadow-gold);
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .loading-state .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(212, 175, 55, 0.15);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
        }
        .empty-state .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 16px;
            color: var(--gold);
            opacity: 0.4;
            font-family: 'Orbitron', monospace;
        }
        .empty-state h3 {
            font-family: 'Orbitron', monospace;
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 8px;
        }

        /* Toast */
        .toast {
            position: fixed; bottom: 90px; right: 20px;
            background: var(--green-deep); border: 1px solid var(--gold);
            color: var(--gold); padding: 12px 22px;
            border-radius: 12px; font-size: 0.75rem;
            transform: translateY(100px); opacity: 0;
            transition: all 0.4s ease; z-index: 9999;
            max-width: 320px; pointer-events: none;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error { border-color: var(--danger); color: var(--danger); }
        .toast.warning { border-color: var(--warning); color: var(--warning); }
        .toast.success { border-color: var(--success); color: var(--success); }

        .footer {
            margin-top: 30px; padding-top: 16px;
            border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.7rem; color: var(--text-muted);
            flex-wrap: wrap; gap: 10px;
        }
        .footer .brand { color: var(--gold); font-weight: 600; }
        .footer-links { display: flex; gap: 12px; flex-wrap: wrap; }
        .footer-links a { color: var(--text-muted); text-decoration: none; }
        .footer-links a:hover { color: var(--gold); }

        /* TEMA DÍA */
        html.tema-dia, html[data-tema="dia"] {
            --space: #f5f7fa;
            --text-primary: #1a2332;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(0, 0, 0, 0.1);
        }
        html.tema-dia body, html[data-tema="dia"] body {
            background: #f5f7fa !important;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 60%), radial-gradient(ellipse at 80% 50%, rgba(42, 106, 58, 0.05) 0%, transparent 60%) !important;
            color: var(--text-primary) !important;
        }
        html.tema-dia .nebula, html[data-tema="dia"] .nebula { display: none !important; }
        html.tema-dia .header, html[data-tema="dia"] .header { background: rgba(255, 255, 255, 0.95) !important; border-bottom-color: rgba(0, 0, 0, 0.1) !important; }
        html.tema-dia .logo-text, html[data-tema="dia"] .logo-text { color: var(--text-primary) !important; }
        html.tema-dia .main-nav, html[data-tema="dia"] .main-nav { background: rgba(255, 255, 255, 0.7) !important; border-color: rgba(0, 0, 0, 0.1) !important; }
        html.tema-dia .main-nav .nav-link, html[data-tema="dia"] .main-nav .nav-link { color: #718096 !important; }
        html.tema-dia .main-nav .nav-link.active, html[data-tema="dia"] .main-nav .nav-link.active { background: rgba(212, 175, 55, 0.15) !important; color: var(--gold) !important; }
        html.tema-dia .carrito-flotante, html[data-tema="dia"] .carrito-flotante {
            background: rgba(255, 255, 255, 0.98) !important;
        }
        html.tema-dia .footer, html[data-tema="dia"] .footer { color: #718096 !important; border-top-color: rgba(0, 0, 0, 0.1) !important; }

        @media (max-width: 480px) {
            .tienda-hero .portada { height: 130px; }
            .tienda-hero .info-texto h1 { font-size: 1rem; }
            .producto-card .foto { width: 65px; height: 65px; font-size: 1.6rem; }
            .producto-card .info .nombre { font-size: 0.8rem; }
            .producto-card .info .precio { font-size: 0.85rem; }
            .btn-agregar { padding: 6px 12px; font-size: 0.6rem; }
            .carrito-flotante .btn-ver-carrito { padding: 10px 14px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <div class="nebula nebula-1" aria-hidden="true"></div>
    <div class="nebula nebula-2" aria-hidden="true"></div>
    <div class="nebula nebula-3" aria-hidden="true"></div>

// ================================================================
// BANNER DE ERRORES
// ================================================================
function mostrarErrorEnPantalla(mensaje) {
    var banner = document.getElementById('errorBanner');
    var texto = document.getElementById('errorBannerText');
    if (banner && texto) { texto.textContent = mensaje; banner.style.display = 'block'; }
}
window.addEventListener('error', function (event) {

window.addEventListener('unhandledrejection', function (event) {

});

// ================================================================
// TOAST
// ================================================================
function showToast(mensaje, tipo) {
    try {
        var toastEl = document.getElementById('toast');
        if (!toastEl) { console.warn(mensaje); return; }
        toastEl.textContent = mensaje;
        toastEl.className = 'toast show';
        if (tipo === 'error') toastEl.classList.add('error');
        else if (tipo === 'warning') toastEl.classList.add('warning');
        else if (tipo === 'success') toastEl.classList.add('success');
        clearTimeout(toastEl._timeout);
        toastEl._timeout = setTimeout(function() {
            toastEl.classList.remove('show');
        }, 3000);
    } catch (e) { console.warn('Toast error:', e); }
}

// ================================================================
// ESCAPE HTML

function escapeHTML(texto) {
    if (!texto) return '';
    var div = document.createElement('div');
    div.textContent = texto;

}

// ================================================================
// CALCULAR SI LA TIENDA ESTÁ ABIERTA AHORA
// ================================================================
function estaAbiertaAhora(tienda) {
    if (!tienda.horario_apertura || !tienda.horario_cierre) return null;
    try {
        var ahora = new Date();
        var minutosAhora = ahora.getHours() * 60 + ahora.getMinutes();
        var ap = tienda.horario_apertura.split(':');
        var ci = tienda.horario_cierre.split(':');
        var apMin = parseInt(ap[0]) * 60 + parseInt(ap[1] || 0);
        var ciMin = parseInt(ci[0]) * 60 + parseInt(ci[1] || 0);
        if (ciMin < apMin) {
            // Cruza medianoche
            return minutosAhora >= apMin || minutosAhora <= ciMin;
        }
        return minutosAhora >= apMin && minutosAhora <= ciMin;
    } catch (e) { return null; }
}

// ================================================================

async function cargarTienda(slug) {
    var container = document.getElementById('tiendaContainer');
    if (!container) return;

    try {
        var result = await supabase
            .from('mercado_tiendas')
            .select('*')
            .eq('slug', slug)
            .maybeSingle();

        if (result.error) throw result.error;

        if (!result.data) {
            container.innerHTML = '<div class="empty-state">' +
                '<span class="icon">🛒</span>' +
                '<h3 data-clave="mercado_tienda_no_encontrada">Tienda no encontrada</h3>' +
                '<p data-clave="mercado_tienda_no_encontrada_desc">Puede que se haya eliminado o el enlace sea incorrecto.</p>' +
                '<a href="/features/mercado/index.html" class="btn-back" style="margin-top:16px;">← <span data-clave="mercado_volver">Volver al Mercado</span></a>' +
            '</div>';
            if (typeof window.aplicarTraducciones === 'function') window.aplicarTraducciones(container);
            return;
        }

        // Verificar vigencia
        if (result.data.activa_hasta && new Date(result.data.activa_hasta) < new Date()) {
            container.innerHTML = '<div class="empty-state">' +
                '<span class="icon">⏱️</span>' +
                '<h3 data-clave="mercado_tienda_pausada">Tienda pausada</h3>' +
                '<p data-clave="mercado_tienda_pausada_desc">El vendedor aún no renovó su membresía.</p>' +
                '<a href="/features/mercado/index.html" class="btn-back" style="margin-top:16px;">← <span data-clave="mercado_volver">Volver al Mercado</span></a>' +
            '</div>';
            if (typeof window.aplicarTraducciones === 'function') window.aplicarTraducciones(container);
            return;
        }

        tiendaActual = result.data;
        await cargarProductos(tiendaActual.id);
        renderizarTienda();
    } catch (e) {
        console.error('Error cargando tienda:', e);
        container.innerHTML = '<div class="empty-state"><span class="icon">⚠️</span><h3>Error al cargar la tienda</h3><p>' + escapeHTML(e.message) + '</p></div>';
    }
}

// ================================================================
// CARGAR PRODUCTOS DE LA TIENDA
// ================================================================
async function cargarProductos(tiendaId) {
    try {
        var result = await supabase
            .from('mercado_productos')
            .select('*')
            .eq('tienda_id', tiendaId)
            .eq('activo', true)
            .order('destacado', { ascending: false })
            .order('orden', { ascending: true })
            .order('id', { ascending: true });

        if (result.error) throw result.error;
        productosCache = result.data || [];
        return productosCache;
    } catch (e) {
        console.error('Error cargando productos:', e);
        productosCache = [];
        return [];
    }
}

// ================================================================
// RENDERIZAR TIENDA + PRODUCTOS
// ================================================================
function renderizarTienda() {
    var container = document.getElementById('tiendaContainer');
    if (!container || !tiendaActual) return;

    var t = tiendaActual;

    // Categoría
    var categoriaNombre = 'Sin categoría';
    var categoriaIcono = '◈';
    if (t.categoria_id) {
        var cat = categoriasCache.find(function (c) { return c.id === t.categoria_id; });
        if (cat) {
            categoriaNombre = cat.nombre;
            categoriaIcono = cat.icono || '◈';
        }
    }

    // Badge de nivel
    var nivel = (t.nivel || 'basico').toLowerCase();
    var badgeNivel = '';
    if (nivel === 'max') badgeNivel = '<span class="badge-nivel max" data-clave="mercado_max">✦ Max</span>';
    else if (nivel === 'pro') badgeNivel = '<span class="badge-nivel pro" data-clave="mercado_pro">◆ Pro</span>';

    // Portada
    var portadaContent = t.portada_url
        ? '<img src="' + escapeHTML(t.portada_url) + '" alt="' + escapeHTML(t.nombre_negocio) + '" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<span>🛒</span>\';" />'
        : '<span>🛒</span>';

    // Logo
    var logoContent = t.logo_url
        ? '<img src="' + escapeHTML(t.logo_url) + '" alt="Logo" onerror="this.style.display=\'none\';this.parentElement.textContent=\'◈\';" />'
        : '◈';

    // Estado abierto/cerrado
    var abierta = estaAbiertaAhora(t);
    var estadoHtml = '';
    if (abierta === true) {
        estadoHtml = '<span class="estado-tienda abierto">● <span data-clave="mercado_abierto">Abierto</span></span>';
    } else if (abierta === false) {
        estadoHtml = '<span class="estado-tienda cerrado">● <span data-clave="mercado_cerrado">Cerrado</span></span>';
    }

    // Formas de entrega
    var deliveryHtml = '';
    if (t.acepta_delivery) {
        deliveryHtml += '<span class="forma-entrega activa">🛵 <span data-clave="mercado_delivery">Delivery</span></span>';
    }
    if (t.acepta_pickup) {
        deliveryHtml += '<span class="forma-entrega activa">🏪 <span data-clave="mercado_pickup">Recoger</span></span>';
    }

    // Rating
    var rating = parseFloat(t.calificacion_promedio || 0).toFixed(1);
    var totalResenas = t.total_resenas || 0;

    // Contacto
    var contactoHtml = '';
    if (t.direccion) {
        contactoHtml += '<span>📍 ' + escapeHTML(t.direccion) + '</span>';
    }
    if (t.telefono) {
        contactoHtml += '<span>📞 ' + escapeHTML(t.telefono) + '</span>';
    }
    if (t.whatsapp) {
        var waNum = t.whatsapp.replace(/\D/g, '');
        contactoHtml += '<span>💬 <a href="https://wa.me/' + waNum + '" target="_blank" rel="noopener">WhatsApp</a></span>';
    }
    if (t.instagram) {
        contactoHtml += '<span>📷 <a href="https://instagram.com/' + escapeHTML(t.instagram.replace('@', '')) + '" target="_blank" rel="noopener">' + escapeHTML(t.instagram) + '</a></span>';
    }
    if (t.horario_apertura && t.horario_cierre) {
        contactoHtml += '<span>🕐 ' + escapeHTML(t.horario_apertura) + ' - ' + escapeHTML(t.horario_cierre) + '</span>';
    }

    // HTML completo
    var html = '';

    html += '<div class="tienda-hero">';
    html += '<div class="portada">' + badgeNivel + portadaContent + '</div>';
    html += '<div class="info-principal">';
    html += '<div class="logo-big">' + logoContent + '</div>';
    html += '<div class="info-texto">';
    html += '<h1>' + escapeHTML(t.nombre_negocio) + '</h1>';
    html += '<div class="categoria-rating">';
    html += '<span>' + escapeHTML(categoriaIcono) + ' ' + escapeHTML(categoriaNombre) + '</span>';
    html += '<span class="rating">⭐ ' + rating + ' <span style="color:var(--text-muted);font-weight:400;">(' + totalResenas + ')</span></span>';
    html += '</div>';
    if (t.descripcion) {

    }
    if (contactoHtml) {
        html += '<div class="contacto">' + contactoHtml + '</div>';

    if (estadoHtml) html += estadoHtml;
    if (deliveryHtml) html += '<div class="formas-entrega">' + deliveryHtml + '</div>';
    html += '</div>';
    html += '</div>';
    html += '</div>';

    // Título productos + filtro

    html += '<h2 data-clave="mercado_productos_titulo">◈ Productos</h2>';

    html += '</div>';

    // Filtros de categorías de productos (si hay más de 1 categoría en los productos)
    var categoriasEnProductos = [];
    productosCache.forEach(function (p) {

    if (categoriasEnProductos.length > 1) {

        html += '<button class="prod-cat-btn active" data-cat="todas" onclick="filtrarProductosCat(\'todas\', this)"><span>◈</span> <span data-clave="mercado_todas">Todas</span></button>';

                html += '<button class="prod-cat-btn" data-cat="' + cat.id + '" onclick="filtrarProductosCat(\'' + cat.id + '\', this)"><span>' + escapeHTML(cat.icono) + '</span> <span>' + escapeHTML(cat.nombre) + '</span></button>';
            }
        });
        html += '</div>';
    }

    // Lista de productos
    html += '<div class="productos-lista" id="productosLista"></div>';

    container.innerHTML = html;

    // Renderizar productos
    renderizarProductos();

    // Aplicar i18n
    if (typeof window.aplicarTraducciones === 'function') {
        window.aplicarTraducciones(container);
    }

    // Actualizar carrito flotante
    actualizarCarritoFlotante();

// ================================================================
// RENDERIZAR PRODUCTOS
// ================================================================
function renderizarProductos() {
    var lista = document.getElementById('productosLista');
    var contador = document.getElementById('contadorProductos');
    if (!lista) return;

    var filtrados = productosCache.slice();
    if (categoriaProductoActiva !== 'todas') {
        filtrados = filtrados.filter(function (p) { return String(p.categoria_id) === String(categoriaProductoActiva); });
    }

    if (contador) contador.textContent = filtrados.length;

    if (filtrados.length === 0) {
        lista.innerHTML = '<div class="empty-state">' +
            '<span class="icon">🍽️</span>' +
            '<h3 data-clave="mercado_sin_productos">Sin productos aquí</h3>' +
            '<p data-clave="mercado_sin_productos_desc">Esta tienda todavía no ha subido productos.</p>' +
        '</div>';
        if (typeof window.aplicarTraducciones === 'function') window.aplicarTraducciones(lista);
        return;
    }

    var html = '';

    filtrados.forEach(function (p) {
        var tieneStock = p.stock_ilimitado === true || (p.stock && p.stock > 0);
        var agotado = !tieneStock;
        var enCarrito = carrito.find(function (c) { return c.producto_id === p.id; });

        // Foto
        var fotos = Array.isArray(p.fotos) ? p.fotos : [];
        var primeraFoto = fotos.length > 0 ? fotos[0] : null;
        if (typeof primeraFoto === 'object' && primeraFoto !== null) {
            primeraFoto = primeraFoto.url || primeraFoto.src || null;
        }

        var fotoContent = primeraFoto
            ? '<img src="' + escapeHTML(primeraFoto) + '" alt="' + escapeHTML(p.nombre) + '" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.textContent=\'🍽️\';" />'
            : '🍽️';

        // Precio (con promoción si aplica)
        var precioHtml = '<span class="precio">' + formatearPrecio(p.precio_mxn) + '</span>';
        if (p.precio_promocion && p.precio_promocion > 0 && p.precio_promocion < p.precio_mxn) {
            precioHtml = '<span class="precio">' + formatearPrecio(p.precio_promocion) + '</span>' +
                         '<span class="precio-tachado">' + formatearPrecio(p.precio_mxn) + '</span>';
        }

        // Stock
        var stockHtml = '';
        if (p.stock_ilimitado) {
            stockHtml = '<span class="stock">Disponible</span>';
        } else if (agotado) {
            stockHtml = '<span class="stock agotado-txt" data-clave="mercado_agotado">Agotado</span>';
        } else if (p.stock <= 5) {
            stockHtml = '<span class="stock" style="color:var(--warning);">Quedan ' + p.stock + '</span>';
        } else {
            stockHtml = '<span class="stock">' + p.stock + ' disponibles</span>';
        }

        // Badge destacado
        var badgeDestacado = p.destacado ? '<span class="badge-destacado">★ <span data-clave="mercado_destacado">Destacado</span></span>' : '';

        // Botón agregar
        var botonHtml = '';
        if (agotado) {
            botonHtml = '<button class="btn-agregar" disabled data-clave="mercado_agotado">Agotado</button>';
        } else if (enCarrito) {
            botonHtml = '<button class="btn-agregar" onclick="abrirCarrito()">✓ <span>En carrito</span></button>';
        } else {
            botonHtml = '<button class="btn-agregar" onclick="agregarAlCarrito(' + p.id + ')">+ <span data-clave="mercado_agregar">Agregar</span></button>';
        }

        html += '<div class="producto-card ' + (agotado ? 'agotado' : '') + '" data-producto-id="' + p.id + '">' +
            '<div class="foto">' + fotoContent + '</div>' +
            '<div class="info">' +
                '<div class="nombre">' + escapeHTML(p.nombre) + badgeDestacado + '</div>' +
                (p.descripcion ? '<div class="desc">' + escapeHTML(p.descripcion) + '</div>' : '') +
                '<div class="precio-row">' + precioHtml + stockHtml + '</div>' +
            '</div>' +
            '<div class="acciones">' + botonHtml + '</div>' +
        '</div>';
    });

    lista.innerHTML = html;

    if (typeof window.aplicarTraducciones === 'function') {
        window.aplicarTraducciones(lista);
    }
}

// ================================================================
// FILTRAR PRODUCTOS POR CATEGORÍA
// ================================================================
function filtrarProductosCat(catId, btn) {
    categoriaProductoActiva = catId;
    document.querySelectorAll('.prod-cat-btn').forEach(function (b) {
        b.classList.remove('active');
    });
    if (btn) btn.classList.add('active');
    renderizarProductos();
}

// ================================================================
// CARRITO - GUARDAR Y CARGAR
// ================================================================
function guardarCarrito() {
    try {
        localStorage.setItem('mercado_carrito', JSON.stringify(carrito));
    } catch (e) { console.warn('Error guardando carrito:', e); }
}

function cargarCarritoGuardado() {
    try {
        var raw = localStorage.getItem('mercado_carrito');
        if (!raw) return;
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) {
            carrito = arr;
        }
    } catch (e) {
        console.warn('Error cargando carrito:', e);
        carrito = [];
    }
}

// ================================================================
// AGREGAR AL CARRITO
// ================================================================
function agregarAlCarrito(productoId) {
    if (!tiendaActual) { showToast('⚠️ No hay tienda cargada', 'warning'); return; }

    var producto = productosCache.find(function (p) { return p.id === productoId; });
    if (!producto) { showToast('❌ Producto no encontrado', 'error'); return; }

    // Verificar stock
    if (!producto.stock_ilimitado && producto.stock <= 0) {
        showToast('❌ Producto agotado', 'error');
        return;
    }

    // Si el carrito ya tenía productos de OTRA tienda, preguntar si reiniciar
    if (carrito.length > 0) {
        var tiendaIdActual = carrito[0].tienda_id;
        if (tiendaIdActual !== tiendaActual.id) {
            var confirmar = confirm('Tu carrito tiene productos de otra tienda. ¿Quieres vaciarlo y empezar de nuevo con esta tienda?');
            if (!confirmar) return;
            carrito = [];
        }
    }

    // Ver si ya existe
    var existente = carrito.find(function (c) { return c.producto_id === productoId; });
    if (existente) {
        // Aumentar cantidad (respetando stock)
        var maxCantidad = producto.stock_ilimitado ? 99 : producto.stock;
        if (existente.cantidad >= maxCantidad) {
            showToast('⚠️ No hay más stock disponible', 'warning');
            return;
        }
        existente.cantidad += 1;
        showToast('✓ Cantidad actualizada', 'success');
    } else {
        // Precio unitario (con promoción si aplica)
        var precioUnit = producto.precio_promocion && producto.precio_promocion > 0
            ? parseFloat(producto.precio_promocion)
            : parseFloat(producto.precio_mxn);

        // Foto
        var fotos = Array.isArray(producto.fotos) ? producto.fotos : [];
        var fotoUrl = fotos.length > 0 ? fotos[0] : null;
        if (typeof fotoUrl === 'object' && fotoUrl !== null) {
            fotoUrl = fotoUrl.url || fotoUrl.src || null;
        }

        carrito.push({
            producto_id: producto.id,
            tienda_id: tiendaActual.id,
            tienda_slug: tiendaActual.slug,
            tienda_nombre: tiendaActual.nombre_negocio,
            nombre: producto.nombre,
            precio: precioUnit,
            cantidad: 1,
            stock: producto.stock,
            stock_ilimitado: producto.stock_ilimitado || false,
            foto_url: fotoUrl
        });
        showToast('✓ Agregado al carrito', 'success');
    }

    guardarCarrito();
    actualizarCarritoFlotante();
    renderizarProductos();
}

// ================================================================
// ACTUALIZAR CARRITO FLOTANTE
// ================================================================
function actualizarCarritoFlotante() {
    var carritoEl = document.getElementById('carritoFlotante');
    var contadorEl = document.getElementById('carritoContador');
    var totalEl = document.getElementById('carritoTotal');
    if (!carritoEl) return;

    if (carrito.length === 0) {
        carritoEl.classList.remove('visible');
        return;
    }

    var totalCantidad = 0;
    var totalPrecio = 0;
    carrito.forEach(function (c) {
        totalCantidad += c.cantidad;
        totalPrecio += c.cantidad * c.precio;
    });

    if (contadorEl) contadorEl.textContent = totalCantidad;
    if (totalEl) totalEl.textContent = formatearPrecio(totalPrecio);

    carritoEl.classList.add('visible');
}
