<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Marquinhos</title>
<style>
body { background: #05080f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, monospace; padding: 20px; font-size: 15px; line-height: 1.5; }
h1 { color: #D4AF37; font-size: 22px; margin-bottom: 20px; }
.box { padding: 14px 16px; border-radius: 10px; margin: 10px 0; font-weight: 600; font-size: 14px; word-wrap: break-word; }
.ok { background: #0a2a1a; border-left: 5px solid #00d68f; color: #00d68f; }
.fail { background: #2a0a1a; border-left: 5px solid #ff3366; color: #ff3366; }
.wait { background: #1a1a0a; border-left: 5px solid #FFD700; color: #FFD700; }
.info { background: #0a1a2a; border-left: 5px solid #00E5FF; color: #00E5FF; }
</style>
</head>
<body>

<h1>◈ Test de Marquinhos</h1>
<div id="resultado"></div>

<script>
const cont = document.getElementById('resultado');
function addBox(clase, texto) {
    const div = document.createElement('div');
    div.className = 'box ' + clase;
    div.textContent = texto;
    cont.appendChild(div);
}

fetch('/features/marquinhos/marquinhos-pet.js', { method: 'HEAD' })
    .then(r => {
        if (r.status === 200) addBox('ok', '✅ marquinhos-pet.js EXISTE (200)');
        else addBox('fail', '❌ marquinhos-pet.js NO EXISTE (' + r.status + ')');
    })
    .catch(e => addBox('fail', '❌ JS — ERROR: ' + e.message));

fetch('/features/marquinhos/marquinhos-pet.css', { method: 'HEAD' })
    .then(r => {
        if (r.status === 200) addBox('ok', '✅ marquinhos-pet.css EXISTE (200)');
        else addBox('fail', '❌ marquinhos-pet.css NO EXISTE (' + r.status + ')');
    })
    .catch(e => addBox('fail', '❌ CSS — ERROR: ' + e.message));

setTimeout(() => {
    addBox('info', '⏳ Cargando el script para verificar...');
    const s = document.createElement('script');
    s.src = '/features/marquinhos/marquinhos-pet.js';
    s.onload = () => {
        setTimeout(() => {
            if (typeof window.Marquinhos === 'object' && window.Marquinhos !== null) {
                addBox('ok', '✅ El script se ejecuta. window.Marquinhos existe.');
                addBox('info', '🎭 ¿Ves el robotito flotante abajo a la derecha?');
            } else {
                addBox('fail', '❌ El script cargó pero NO se ejecutó correctamente.');
            }
        }, 1500);
    };
    s.onerror = () => addBox('fail', '❌ No se pudo cargar el script.');
    document.body.appendChild(s);

    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = '/features/marquinhos/marquinhos-pet.css';
    document.head.appendChild(link);
}, 500);

setTimeout(() => {
    addBox('info', '📁 Ruta actual: ' + location.pathname);
}, 3000);
</script>

</body>
</html>
