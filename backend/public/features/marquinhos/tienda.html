<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>◈ Tienda de Marquinhos · Sariel's</title>
<meta name="theme-color" content="#05080f">

<link rel="stylesheet" href="/features/marquinhos/tienda.css">
<!-- ✅ apariencia-global.js se carga al final del body (con defer) -->
</head>
<body>

<div class="tienda-app">

    <!-- Header -->
    <header class="tienda-header">
        <a href="/features/perfil/configuracion/marquinhos.html" class="tienda-volver" aria-label="Volver">
            <span class="tienda-volver-icon">←</span>
            <span class="tienda-volver-text">Volver</span>
        </a>
        <a href="/" class="tienda-logo">
            <span class="tienda-logo-hex">◈</span>
            <span class="tienda-logo-text">Sariel's</span>
        </a>
        <div class="tienda-saldo" id="tiendaSaldo">
            <span class="saldo-icon">◈</span>
            <span class="saldo-valor" id="saldoValor">...</span>
            <span class="saldo-label" id="saldoLabel">USDT</span>
        </div>
    </header>

    <!-- Preview del avatar -->
    <section class="tienda-preview">
        <div class="preview-avatar">
            <!-- El cuerpo y sus grupos data-acc-slot se generan en JS desde MarquinhosAccesoriosSVG.cuerpoBase() -->
            <svg id="mqPreviewSvg" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg" class="preview-svg" role="img" aria-label="Marquinhos"></svg>
        </div>
        <div class="preview-info">
            <h1 class="preview-title">Marquinhos</h1>
            <p class="preview-sub">Pruébate los accesorios antes de comprar · Paga con USDT/USDC</p>
            <p class="preview-prueba" id="previewPrueba" hidden></p>
            <button class="preview-reset" id="btnResetAccesorios" type="button">
                Quitar todos los accesorios
            </button>
        </div>
    </section>

    <!-- Filtros -->
    <nav class="tienda-filtros">
        <button class="filtro-btn active" data-cat="todos" type="button">Todos</button>
        <button class="filtro-btn" data-cat="sombrero" type="button">🎩 Sombreros</button>
        <button class="filtro-btn" data-cat="playera" type="button">👕 Playeras</button>
        <button class="filtro-btn" data-cat="pantalon" type="button">👖 Pantalones</button>
        <button class="filtro-btn" data-cat="zapatos" type="button">👟 Zapatos</button>
        <button class="filtro-btn" data-cat="lentes" type="button">🕶️ Lentes</button>
        <button class="filtro-btn" data-cat="accesorio" type="button">🎒 Accesorios</button>
        <button class="filtro-btn" data-cat="disfraz" type="button">🎃 Disfraces</button>
    </nav>

    <!-- Grid -->
    <section class="tienda-grid" id="tiendaGrid">
        <div class="tienda-loading">Cargando accesorios...</div>
    </section>

    <footer class="tienda-footer">
        <span>◈ Sariel's · Tienda de Marquinhos</span>
        <a href="/features/perfil/configuracion/marquinhos.html">Volver a Marquinhos</a>
    </footer>
</div>

<div class="tienda-toast" id="tiendaToast"></div>

<!-- ✅ Scripts al final del body (orden importante) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- Sistema de coordenadas compartidas -->
<script src="/features/marquinhos/marquinhos-fit.js"></script>

<!-- Biblioteca de SVG de accesorios y disfraces (v2.1) -->
<script src="/features/marquinhos/marquinhos-accesorios-svg.js"></script>

<!-- Pinta el cuerpo base de Marquinhos en el preview antes de que tienda.js lo use -->
<script>
(function () {
    var svg = document.getElementById('mqPreviewSvg');
    if (svg && window.MarquinhosAccesoriosSVG) {
        svg.innerHTML = window.MarquinhosAccesoriosSVG.cuerpoBase();
        window.tiendaPreviewSvg = svg;
    }
})();
</script>

<!-- Tienda -->
<script src="/features/marquinhos/tienda.js"></script>

<!-- Apariencia global (con defer) -->
<script src="/features/shared/js/apariencia-global.js" defer></script>

</body>
</html>
