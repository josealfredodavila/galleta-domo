            }
        }
    } catch (_) {}
    if (!hayRastroSesion) {
        document.documentElement.classList.remove('verificando');
    }

    var SUPABASE_URL = 'https://zultnlogdoajehbswlih.supabase.co';

    window.__sarielsAuthenticated = null;
    window.supabaseClient = window.supabaseClient || null;
    window.__sarielsSupabaseSingleton = window.__sarielsSupabaseSingleton || null;
    window.supabaseReady = null;
    window.supabaseError = null;

    function getSupabase() {
        if (window.__sarielsSupabaseSingleton) return window.__sarielsSupabaseSingleton;
        if (window.supabaseClient) {
            window.__sarielsSupabaseSingleton = window.supabaseClient;
            return window.supabaseClient;
        }
        var SDK = window.SupabaseSDK || window.supabase;
        if (!SDK || typeof SDK.createClient !== 'function') throw new Error('Supabase SDK no disponible.');

        return c;
    }
    window.getSupabase = getSupabase;
    window.getSupabaseClient = function () { return window.supabaseReady; };

    function esRutaInternaSegura(v) {
        if (typeof v !== 'string') return false;
        if (!v.startsWith('/')) return false;
        if (v.startsWith('//')) return false;
        if (v.startsWith('/\\')) return false;
        return true;
    }

    async function inicializarSupabase() {
        try {
            var client = getSupabase();
            var r = await client.auth.getSession();
            var session = r && r.data ? r.data.session : null;
            window.__sarielsAuthenticated = !!session;

            console.error('[Index] Error inicializando Supabase:', e);

function showToast(msg, type, duration) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(el._timer);
    el._timer = setTimeout(function () { el.className = 'toast'; }, duration || 3500);
}

    document.documentElement.classList.remove('verificando');
}

async function redirigirSiYaHaySesion() {
    if (/type=recovery/.test(window.location.hash) || /type=recovery/.test(window.location.search)) {
        mostrarLogin();
        return;
    }
    try {
        const client = window.getSupabase ? window.getSupabase() : null;
        if (!client || !client.auth) { mostrarLogin(); return; }
        const limite = setTimeout(mostrarLogin, 4000);
        const r = await client.auth.getSession();
        clearTimeout(limite);
        const s = r && r.data ? r.data.session : null;
        if (s) {
            window.location.replace(RUTA_PERFIL);
            return;
        }
    } catch (e) {}
    mostrarLogin();
}

async function iniciarSesionDesdeIndex() {
    const emailEl = document.getElementById('loginEmail');
    const passEl = document.getElementById('loginPassword');
    const btn = document.getElementById('loginBtn');
    if (!emailEl || !passEl) return;
    const email = emailEl.value.trim();
    const password = passEl.value;
    if (!email || !password) { showToast('⚠️ Completa correo y contraseña', 'warning'); return; }
    const orig = btn ? btn.textContent : '◈ Iniciar sesión';
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Entrando...'; }
    try {
        const client = window.getSupabase();
        if (!client) throw new Error('Supabase no disponible.');
        const r = await client.auth.signInWithPassword({ email, password });
        if (r && r.error) throw new Error(r.error.message);
        if (!r || !r.data || !r.data.session) throw new Error('No se pudo iniciar sesión');
        emailEl.value = ''; passEl.value = '';
        window.location.replace(RUTA_PERFIL);
    } catch (e) {
        var m = (e && e.message) ? e.message : 'Error';
        var lm = m.toLowerCase();
        if (lm.includes('invalid login credentials')) m = 'Correo o contraseña incorrectos.';
        else if (lm.includes('email not confirmed')) m = 'Debes confirmar tu correo antes de iniciar sesión.';
        showToast('❌ ' + m, 'error', 6000);
        if (btn) { btn.disabled = false; btn.textContent = orig; }
    }
}
window.iniciarSesionDesdeIndex = iniciarSesionDesdeIndex;

function abrirModalRecuperar() {
    const modal = document.getElementById('modalRecuperar');
    if (!modal) return;
    const a = document.getElementById('loginEmail');
    const b = document.getElementById('recuperarEmail');
    if (a && b && a.value && a.value.trim()) b.value = a.value.trim();
    modal.classList.add('active');
    setTimeout(function () { if (b) b.focus(); }, 100);
}
window.abrirModalRecuperar = abrirModalRecuperar;

function cerrarModalRecuperar() {
    const modal = document.getElementById('modalRecuperar');
    if (modal) modal.classList.remove('active');
}
window.cerrarModalRecuperar = cerrarModalRecuperar;

async function enviarRecuperacion() {
    const emailEl = document.getElementById('recuperarEmail');
    const btn = document.getElementById('recuperarBtn');
    if (!emailEl) return;
    const email = emailEl.value.trim();
    if (!email) { showToast('⚠️ Escribe tu correo', 'warning'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('⚠️ Correo inválido', 'warning'); return; }
    const orig = btn ? btn.textContent : 'Enviar enlace';
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Enviando...'; }
    try {
        const client = window.getSupabase();
        if (!client) throw new Error('Sin conexión');
        var redirectTo = window.location.origin + RUTA_ACTUALIZAR_CONTRASENA;
        const r = await client.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });
        if (r && r.error) throw new Error(r.error.message);
        showToast('✅ Revisa tu correo. Te enviamos un enlace.', 'success', 6000);
        cerrarModalRecuperar();
    } catch (e) {
        showToast('❌ ' + (e && e.message ? e.message : 'Error'), 'error', 5000);
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = orig; }
    }
}
window.enviarRecuperacion = enviarRecuperacion;

/* ============================================================
   CARRUSEL
   - Con lives activos: muestra quién está transmitiendo ahora
     (lives normales y canales públicos).
   - Sin lives: muestra invitaciones a unirse al ecosistema.
   Los datos vienen de /api/livekit/streams (público, sin sesión).
   Todo texto se inserta con textContent: nunca HTML desde el servidor.
   ============================================================ */
var CARRUSEL_DURACION_MS = 6500;
var CARRUSEL_REFRESCO_MS = 30000;
var carrusel = { slides: [], idx: 0, timer: null, pausado: false, modo: null, timerRefresco: null };

var GRADIENTES = [
    'linear-gradient(135deg,#ff2e97 0%,#ff7a00 50%,#ffd60a 100%)',
    'linear-gradient(135deg,#00f0ff 0%,#2563eb 50%,#8b5cf6 100%)',
    'linear-gradient(135deg,#b6ff00 0%,#00b37e 50%,#00f0ff 100%)',
    'linear-gradient(135deg,#8b5cf6 0%,#ff2e97 50%,#ff7a00 100%)',
    'linear-gradient(135deg,#ff7a00 0%,#ff2e97 45%,#7b2ff7 100%)',
    'linear-gradient(135deg,#00f0ff 0%,#b6ff00 50%,#ffd60a 100%)'
];

var INVITACIONES = [
    {
        badge: 'Únete hoy',
        titulo: 'Tu comunidad empieza aquí',
        texto: 'Crea tu cuenta en Sariel\'s y conecta con creadores, comunidades y personas de tu zona.',
        cta: 'Crear mi cuenta',
        href: '/registro.html'
    },
    {
        badge: 'Canales',
        titulo: 'Transmite como en TikTok',
        texto: 'Crea tu canal y sal al aire con tu comunidad. Cada persona tiene 2 horas al día para transmitir, sin costo.',
        cta: 'Explorar canales',
        href: '/features/grupos/grupos.html'
    },
    {
        badge: 'Donaciones',
        titulo: 'Apoya a tus creadores favoritos',
        texto: 'Envía donaciones en USDT o USDC durante sus lives. El 50% va directo al creador.',
        cta: 'Ver lives',
        href: '/features/live/live.html'
    },
    {
        badge: 'Ecosistema WEB3',
        titulo: 'Mercado, Muro, Internet y más',
        texto: 'Todo lo que necesitas en un solo lugar: compra, vende, conéctate y crece con la comunidad.',
        cta: 'Entrar a mi cuenta',
        href: '#login'
    }
];

function crearEl(tag, clase, texto) {
    var n = document.createElement(tag);
    if (clase) n.className = clase;
    if (texto !== undefined && texto !== null) n.textContent = String(texto);
    return n;
}

function textoPrecioCarrusel(precio) {
    var p = Number(precio) || 0;
    return p > 0 ? ('$' + p.toFixed(2) + ' USD de acceso') : 'Entrada gratis';
}

function tiempoDesde(fecha) {
    if (!fecha) return '';
    var mins = Math.max(0, Math.floor((Date.now() - new Date(fecha).getTime()) / 60000));
    if (mins < 1) return 'recién empezó';
    if (mins < 60) return 'hace ' + mins + ' min';
    return 'hace ' + Math.floor(mins / 60) + ' h';
}

function slideDeLive(live, i) {
    var esCanal = live.tipo === 'canal';
    var meta = [];
    if (esCanal) {
        meta.push(live.canal_nombre || 'Canal');
    } else {
        meta.push(live.categoria || 'General');
    }
    meta.push((Number(live.viewers_count) || 0) + ' viendo');
    meta.push(textoPrecioCarrusel(live.precio_acceso));
    meta.push(tiempoDesde(live.fecha_inicio));

    return {
        tipo: 'live',
        gradiente: GRADIENTES[i % GRADIENTES.length],
        badge: esCanal ? 'EN VIVO · CANAL' : 'EN VIVO',
        titulo: live.titulo || (esCanal ? 'Canal en vivo' : 'Transmisión en vivo'),
        meta: meta.filter(Boolean),
        cta: esCanal ? 'Ver el canal' : 'Ver el live',
        href: esCanal
            ? '/features/grupos/grupos.html?grupo=' + encodeURIComponent(live.grupo_id || '')
            : '/features/live/live.html'
    };
}

function slideDeInvitacion(inv, i) {
    return {
        tipo: 'invitacion',
        gradiente: GRADIENTES[i % GRADIENTES.length],
        badge: inv.badge,
        titulo: inv.titulo,
        texto: inv.texto,
        cta: inv.cta,
        href: inv.href
    };
}

function construirSlide(s) {
    var slide = crearEl('article', 'slide');
    slide.style.background = s.gradiente;
    slide.setAttribute('role', 'group');

    var badge = crearEl('span', 'slide-badge' + (s.tipo === 'live' ? ' live' : ''));
    if (s.tipo === 'live') badge.appendChild(crearEl('span', 'pt'));
    badge.appendChild(document.createTextNode(s.badge));
    slide.appendChild(badge);

    slide.appendChild(crearEl('div', 'slide-titulo', s.titulo));

    if (s.texto) slide.appendChild(crearEl('div', 'slide-texto', s.texto));

    if (s.meta && s.meta.length) {
        var meta = crearEl('div', 'slide-meta');
        s.meta.forEach(function (m) { meta.appendChild(crearEl('span', null, m)); });
        slide.appendChild(meta);
    }

    var a = crearEl('a', 'slide-cta', s.cta);
    a.href = s.href;
    slide.appendChild(a);

    return slide;
}

function marcarActiva(i) {
    carrusel.idx = i;
    var viewport = document.getElementById('carruselViewport');
    var slides = viewport ? viewport.querySelectorAll('.slide') : [];
    slides.forEach(function (s, k) { s.classList.toggle('activa', k === i); });

    var dots = document.querySelectorAll('#carruselDots .carrusel-dot');
    dots.forEach(function (d, k) {
        d.classList.toggle('activa', k === i);
        d.setAttribute('aria-current', k === i ? 'true' : 'false');
    });

    var contador = document.getElementById('carruselContador');
    if (contador) contador.textContent = (i + 1) + ' / ' + carrusel.slides.length;
}

function iniciarBarra() {
    var barra = document.getElementById('carruselBarra');
    if (!barra) return;
    barra.classList.remove('corre');
    void barra.offsetWidth;
    barra.style.setProperty('--dur', (CARRUSEL_DURACION_MS / 1000) + 's');
    barra.classList.add('corre');
}

function pararTimer() {
    if (carrusel.timer) { clearTimeout(carrusel.timer); carrusel.timer = null; }
}

function programarSiguiente() {
    pararTimer();
    if (carrusel.pausado || carrusel.slides.length < 2) return;
    iniciarBarra();
    carrusel.timer = setTimeout(function () {
        irA((carrusel.idx + 1) % carrusel.slides.length);
    }, CARRUSEL_DURACION_MS);
}

function irA(i) {
    if (!carrusel.slides.length) return;
    marcarActiva(i);
    programarSiguiente();
}

function renderCarrusel(slides, modo) {
    carrusel.slides = slides;
    carrusel.modo = modo;
    var viewport = document.getElementById('carruselViewport');
    var dotsCont = document.getElementById('carruselDots');
    var etiqueta = document.getElementById('carruselEtiqueta');
    var dot = document.getElementById('carruselDot');
    var contador = document.getElementById('carruselContador');
    var flechas = document.querySelectorAll('.carrusel-flecha');
    if (!viewport || !dotsCont) return;

    viewport.replaceChildren();
    dotsCont.replaceChildren();

    slides.forEach(function (s, i) {
        viewport.appendChild(construirSlide(s));
        var d = crearEl('button', 'carrusel-dot');
        d.type = 'button';
        d.setAttribute('aria-label', 'Ir a la diapositiva ' + (i + 1));
        d.addEventListener('click', function () { irA(i); });
        dotsCont.appendChild(d);
    });

    if (modo === 'live') {
        etiqueta.textContent = 'EN VIVO AHORA';
        dot.classList.remove('static');
    } else {
        etiqueta.textContent = 'ÚNETE A SARIEL\'S';
        dot.classList.add('static');
    }

    var multiple = slides.length > 1;
    flechas.forEach(function (f) { f.style.display = multiple ? '' : 'none'; });
    dotsCont.style.display = multiple ? '' : 'none';
    if (!multiple && contador) contador.textContent = '';

    carrusel.idx = 0;
    marcarActiva(0);
    programarSiguiente();
}

async function cargarEnVivoCarrusel() {
    var lives = [];
    try {
        var r = await fetch('/api/livekit/streams', { headers: { 'Accept': 'application/json' } });
        if (r.ok) {
            var d = await r.json();
            lives = Array.isArray(d.data) ? d.data : [];
        }
    } catch (e) {
        lives = [];
    }

    if (lives.length > 0) {
        var slides = lives.slice(0, 12).map(slideDeLive);
        renderCarrusel(slides, 'live');
    } else {
        var inv = INVITACIONES.map(slideDeInvitacion);
        renderCarrusel(inv, 'invitacion');
    }
}

function iniciarCarrusel() {
    var cont = document.getElementById('carruselEnVivo');
    if (!cont) return;

    // Carga inicial con las invitaciones para que nunca quede vacío
    renderCarrusel(INVITACIONES.map(slideDeInvitacion), 'invitacion');
    cargarEnVivoCarrusel();

    if (carrusel.timerRefresco) clearInterval(carrusel.timerRefresco);
    carrusel.timerRefresco = setInterval(function () {
        if (document.visibilityState === 'visible') cargarEnVivoCarrusel();
    }, CARRUSEL_REFRESCO_MS);

    document.getElementById('carruselPrev').addEventListener('click', function () {
        if (!carrusel.slides.length) return;
        irA((carrusel.idx - 1 + carrusel.slides.length) % carrusel.slides.length);
    });
    document.getElementById('carruselNext').addEventListener('click', function () {
        if (!carrusel.slides.length) return;
        irA((carrusel.idx + 1) % carrusel.slides.length);
    });

    // Pausa al pasar el cursor o tocar el carrusel
    cont.addEventListener('mouseenter', function () { carrusel.pausado = true; pararTimer(); });
    cont.addEventListener('mouseleave', function () { carrusel.pausado = false; programarSiguiente(); });
    cont.addEventListener('touchstart', function () { carrusel.pausado = true; pararTimer(); }, { passive: true });

    // Deslizar con el dedo (móvil)
    var inicioX = null;
    cont.addEventListener('touchstart', function (e) { inicioX = e.touches[0].clientX; }, { passive: true });
    cont.addEventListener('touchend', function (e) {
        if (inicioX === null) return;
        var dx = e.changedTouches[0].clientX - inicioX;
        inicioX = null;
        if (Math.abs(dx) > 40 && carrusel.slides.length > 1) {
            irA(dx < 0 ? (carrusel.idx + 1) % carrusel.slides.length : (carrusel.idx - 1 + carrusel.slides.length) % carrusel.slides.length);
        }
        carrusel.pausado = false;
        programarSiguiente();
    }, { passive: true });

    // Teclado: flechas izquierda/derecha cuando el carrusel tiene el foco
    cont.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') irA((carrusel.idx + 1) % carrusel.slides.length);
        if (e.key === 'ArrowLeft') irA((carrusel.idx - 1 + carrusel.slides.length) % carrusel.slides.length);
    });
    cont.setAttribute('tabindex', '0');
}

document.addEventListener('DOMContentLoaded', function () {
    redirigirSiYaHaySesion();

    var loginForm = document.getElementById('loginForm');
    if (loginForm) {
        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            iniciarSesionDesdeIndex();
        });
    }

    var formRecuperar = document.getElementById('formRecuperar');
    if (formRecuperar) {
        formRecuperar.addEventListener('submit', function (e) {
            e.preventDefault();
            enviarRecuperacion();
        });
    }

    var btnOlvidePass = document.getElementById('btnOlvidePass');
    if (btnOlvidePass) {
        btnOlvidePass.addEventListener('click', function (e) {
            e.preventDefault();
            abrirModalRecuperar();
        });
    }

    var btnCerrarModal = document.getElementById('btnCerrarModal');
    if (btnCerrarModal) {
        btnCerrarModal.addEventListener('click', function (e) {
            e.preventDefault();
            cerrarModalRecuperar();
        });
    }

    const modal = document.getElementById('modalRecuperar');
    if (modal) modal.addEventListener('click', function (e) { if (e.target === modal) cerrarModalRecuperar(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarModalRecuperar(); });

    iniciarCarrusel();

    setTimeout(async function () {
        try { if (typeof window.inicializarIdiomas === 'function') await window.inicializarIdiomas(); } catch (e) {}
    }, 300);
});
</script>
