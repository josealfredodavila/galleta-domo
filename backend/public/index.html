<!-- =========================================================
     SUPABASE
     La librería se carga una sola vez.
     La configuración pública se obtiene del backend.
========================================================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
    (function () {
        'use strict';

        window.__sarielsAuthenticated = false;
        window.supabaseReady = null;

        window.supabaseReady = (async function () {
            try {
                if (
                    !window.supabase ||
                    typeof window.supabase.createClient !== 'function'
                ) {
                    throw new Error(
                        'Supabase SDK no disponible.'
                    );
                }

                /*
                 * Obtener configuración pública desde el backend.
                 * Nunca colocar la URL o la clave directamente aquí.
                 */
                const response = await fetch(
                    '/api/config/public',
                    {
                        method: 'GET',
                        credentials: 'same-origin',
                        cache: 'no-store',
                        headers: {
                            'Accept': 'application/json'
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        'No fue posible obtener la configuración pública de Supabase. HTTP ' +
                        response.status
                    );
                }

                const config = await response.json();

                const supabaseUrl =
                    config && config.supabaseUrl;

                const supabaseAnonKey =
                    config && config.supabaseAnonKey;

                if (
                    !supabaseUrl ||
                    !supabaseAnonKey
                ) {
                    throw new Error(
                        'La configuración pública de Supabase está incompleta.'
                    );
                }

                /*
                 * Crear el cliente UNA sola vez.
                 * app.js reutilizará este cliente.
                 */
                if (!window.supabaseClient) {
                    window.supabaseClient =
                        window.supabase.createClient(
                            supabaseUrl,
                            supabaseAnonKey
                        );

                    console.log(
                        '[Index Guardián] ✅ supabaseClient creado mediante /api/config/public.'
                    );
                } else {
                    console.log(
                        '[Index Guardián] ✅ Reutilizando supabaseClient existente.'
                    );
                }

                /*
                 * Comprobar sesión actual.
                 */
                const resultado =
                    await window.supabaseClient.auth.getSession();

                const session =
                    resultado &&
                    resultado.data
                        ? resultado.data.session
                        : null;

                window.__sarielsAuthenticated =
                    !!session;

                /*
                 * Guardar returnTo si viene en la URL.
                 */
                const urlParams =
                    new URLSearchParams(
                        window.location.search
                    );

                const returnTo =
                    urlParams.get('returnTo');

                if (returnTo) {
                    localStorage.setItem(
                        'wallet_returnTo',
                        returnTo
                    );
                }

                /*
                 * Mantener actualizado el estado
                 * de autenticación.
                 */
                window.supabaseClient.auth.onAuthStateChange(
                    function (_event, sessionActual) {
                        window.__sarielsAuthenticated =
                            !!sessionActual;
                    }
                );

                return window.supabaseClient;

            } catch (error) {
                console.error(
                    '[Index Guardián] Error inicializando Supabase:',
                    error
                );

                window.__sarielsAuthenticated = false;

                throw error;
            }
        })();
    })();
</script>
