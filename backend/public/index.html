<script>
    (function () {
        'use strict';

        window.__sarielsAuthenticated = null;
        window.__sarielsAuthReady = null;
        window.supabaseClient = window.supabaseClient || null;
        window.supabaseReady = null;
        window.supabaseError = null;

        window.getSupabaseClient = function () {
            return window.supabaseReady;
        };

        function esRutaInternaSegura(valor) {
            if (typeof valor !== 'string') return false;
            if (!valor.startsWith('/')) return false;
            if (valor.startsWith('//')) return false;
            if (valor.startsWith('/\\')) return false;
            return true;
        }

        async function inicializarSupabase() {
            try {
                if (
                    !window.supabase ||
                    typeof window.supabase.createClient !== 'function'
                ) {
                    throw new Error('Supabase SDK no disponible.');
                }

                if (!window.supabaseClient) {
                    var supabaseUrl = null;
                    var supabaseAnonKey = null;

                    try {
                        const response = await fetch('/api/config/public', {
                            method: 'GET',
                            credentials: 'same-origin',
                            cache: 'no-store',
                            headers: { 'Accept': 'application/json' }
                        });

                        if (response.ok) {
                            const config = await response.json();
                            supabaseUrl = config && config.supabaseUrl;
                            supabaseAnonKey = config && config.supabaseAnonKey;
                        }
                    } catch (fetchErr) {
                        console.warn('[Index Guardián] No se pudo consultar /api/config/public.', fetchErr);
                    }

                    if (!supabaseUrl || !supabaseAnonKey) {
                        supabaseUrl = 'https://zultnlogdoajehbswlih.supabase.co';
                        supabaseAnonKey = 'sb_publishable_S3jONAz3mRO4JKBRhUdI1A_-nsyVhKu';
                    }

                    window.SupabaseSDK = window.supabase;

                    window.supabaseClient = window.SupabaseSDK.createClient(
                        supabaseUrl,
                        supabaseAnonKey,
                        {
                            auth: {
                                persistSession: true,
                                autoRefreshToken: true,
                                detectSessionInUrl: true
                            }
                        }
                    );

                    console.log('[Index Guardián] ✅ supabaseClient creado.');
                }

                const resultado = await window.supabaseClient.auth.getSession();
                const session = resultado && resultado.data ? resultado.data.session : null;

                window.__sarielsAuthenticated = !!session;

                const urlParams = new URLSearchParams(window.location.search);
                const returnTo = urlParams.get('returnTo');

                if (returnTo && esRutaInternaSegura(returnTo)) {
                    try {
                        localStorage.setItem('wallet_returnTo', returnTo);
                    } catch (_) {}
                }

                window.supabaseClient.auth.onAuthStateChange(
                    function (_event, sessionActual) {
                        window.__sarielsAuthenticated = !!sessionActual;
                    }
                );

                return window.supabaseClient;
            } catch (error) {
                console.error('[Index Guardián] Error inicializando Supabase:', error);
                window.__sarielsAuthenticated = false;
                window.supabaseError = error;
                return null;
            }
        }

        window.supabaseReady = inicializarSupabase();
        window.__sarielsAuthReady = window.supabaseReady.then(function () {
            return window.__sarielsAuthenticated;
        });
    })();
</script>

<script>
/* ========================================================
   ESTRELLAS
======================================================== */
(function initStars() {
    const canvas = document.getElementById('stars-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        createStars();
    }

    function createStars() {
        const amount = Math.min(180, Math.floor(window.innerWidth * window.innerHeight / 9000));
        stars = [];
        for (let i = 0; i < amount; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.4 + 0.2,
                opacity: Math.random() * 0.7 + 0.15,
                speed: Math.random() * 0.004 + 0.001
            });
        }
    }

    function drawStars(time) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(function (star) {
            const pulse = star.opacity + Math.sin(time * star.speed) * 0.12;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.globalAlpha = Math.max(0.05, Math.min(1, pulse));
            ctx.fillStyle = '#D4AF37';
            ctx.fill();
        });
        ctx.globalAlpha = 1;
        requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    requestAnimationFrame(drawStars);
})();

/* ========================================================
   ERRORES EN PANTALLA
======================================================== */
function mostrarErrorEnPantalla(mensaje) {
    const banner = document.getElementById('errorBanner');
    const texto = document.getElementById('errorBannerText');
    if (banner && texto) {
        texto.textContent = mensaje;
        banner.style.display = 'block';
    }
}

window.addEventListener('error', function (event) {
    mostrarErrorEnPantalla((event.message || 'Error desconocido') + ' — línea ' + event.lineno);
});

window.addEventListener('unhandledrejection', function (event) {
    mostrarErrorEnPantalla('Promesa rechazada: ' + (event.reason?.message || event.reason));
});

/* ========================================================
   REDIRECCIÓN AUTOMÁTICA AL PERFIL SI YA HAY SESIÓN
======================================================== */
const RUTA_PERFIL = '/features/perfil/perfil.html';

async function redirigirSiYaHaySesion() {
    try {
        const client = await window.getSupabaseClient();
        if (!client) return;

        const resultado = await client.auth.getSession();
        const session = resultado && resultado.data ? resultado.data.session : null;

        if (session) {
            window.location.replace(RUTA_PERFIL);
        }
    } catch (e) {
        console.warn('[Index] No se pudo verificar sesión:', e);
    }
}

/* ========================================================
   LOGIN
======================================================== */
async function iniciarSesionDesdeIndex() {
    const emailEl = document.getElementById('loginEmail');
    const passEl = document.getElementById('loginPassword');
    const btn = document.getElementById('loginBtn');

    if (!emailEl || !passEl) return;

    const email = emailEl.value.trim();
    const password = passEl.value;

    if (!email || !password) {
        if (window.showToast) {
            window.showToast('⚠️ Completa correo y contraseña', 'warning');
        }
        return;
    }

    if (!window.app || typeof window.app.iniciarSesion !== 'function') {
        if (window.showToast) {
            window.showToast('⚠️ Sistema de login no disponible. Recarga la página.', 'error');
        }
        return;
    }

    const originalText = btn ? btn.textContent : '◈ Iniciar sesión';
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Entrando...'; }

    try {
        await window.app.iniciarSesion(email, password);

        if (emailEl) emailEl.value = '';
        if (passEl) passEl.value = '';

        window.location.replace(RUTA_PERFIL);
    } catch (e) {
        console.error('Error en iniciarSesionDesdeIndex:', e);
        if (btn) { btn.disabled = false; btn.textContent = originalText; }
    }
}

/* ========================================================
   CARRUSEL EN VIVO
======================================================== */
async function cargarCarruselEnVivo() {
    const wrapper = document.getElementById('carruselEnVivo');
    if (!wrapper) return;

    try {
        if (!window.supabaseClient || typeof window.supabaseClient.from !== 'function') {
            throw new Error('Cliente Supabase no disponible');
        }

        let { data: transmisiones, error } = await window.supabaseClient
            .from('transmisiones')
            .select(`
                id,
                titulo,
                room_name,
                espectadores,
                viewers_count,
                streamer_id,
                estado,
                is_live,
                grupo_id,
                grupo:grupos_video!transmisiones_grupo_id_fkey (
                    id,
                    nombre,
                    avatar_url,
                    categoria_id,
                    ciudad
                )
            `)
            .eq('is_live', true)
            .order('created_at', { ascending: false })
            .limit(12);

        if (error) {
            console.warn('[Carrusel] Falló consulta con join, reintentando sin join:', error.message);

            const fallback = await window.supabaseClient
                .from('transmisiones')
                .select('id, titulo, room_name, espectadores, viewers_count, streamer_id, estado, is_live, grupo_id')
                .eq('is_live', true)
                .order('created_at', { ascending: false })
                .limit(12);

            if (fallback.error) throw fallback.error;

            transmisiones = (fallback.data || []).map(function (t) {
                return Object.assign({}, t, { grupo: null });
            });
        }

        const ESTADOS_VALIDOS = ['en_vivo', 'en vivo', 'live', 'EN_VIVO', 'EN VIVO', 'activo', 'activa'];

        const activas = (transmisiones || []).filter(function (t) {
            if (!t.is_live) return false;
            if (!t.estado) return true;
            return ESTADOS_VALIDOS.indexOf(t.estado) !== -1;
        });

        if (activas.length === 0) {
            wrapper.innerHTML = `
                <div class="carrusel-titulo">
                    <span class="dot static"></span>
                    <span>EN VIVO AHORA</span>
                </div>
                <div class="carrusel-vacio">
                    <span class="icon">◈</span>
                    <p>Nadie al aire por ahora... sé el primero en transmitir</p>
                </div>
            `;
            return;
        }

        const escaparHTML = function (valor) {
            return String(valor == null ? '' : valor)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        };

        const generarItemHTML = function (t) {
            const g = t.grupo || {};
            const avatar = g.avatar_url || '';
            const nombre = escaparHTML(g.nombre || 'Canal');
            const titulo = escaparHTML(t.titulo || 'Transmisión en vivo');
            const grupoId = encodeURIComponent(t.grupo_id || g.id || '');
            const espectadores = Number(t.espectadores != null ? t.espectadores : (t.viewers_count || 0));

            const fondoHTML = avatar
                ? `<img src="${escaparHTML(avatar)}" alt="${nombre}" loading="lazy" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0.55;">`
                : `<div style="position:absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:3rem; color:var(--gold); opacity:0.3;">◈</div>`;

            return `
                <div class="carrusel-item" onclick="abrirCanalDesdeCarrusel('${grupoId}')">
                    <div class="live-tag">🔴 EN VIVO</div>
                    ${espectadores > 0 ? `<div class="espectadores-tag">👁 ${espectadores}</div>` : ''}
                    ${fondoHTML}
                    <div class="etiqueta">
                        <span class="canal">◈ ${nombre}</span>
                        <span class="titulo">${titulo}</span>
                    </div>
                </div>
            `;
        };

        const mitad = Math.ceil(activas.length / 2);
        const fila1 = activas.slice(0, mitad);
        const fila2 = activas.slice(mitad);

        const construirFila = function (items, clase) {
            const itemsFila = items.length > 0 ? items : activas;
            const itemsHTML = itemsFila.map(generarItemHTML).join('');
            const itemsDuplicados = itemsFila.map(generarItemHTML).join('');
            return `
                <div class="carrusel-fila ${clase}">
                    ${itemsHTML}
                    ${itemsDuplicados}
                </div>
            `;
        };

        wrapper.innerHTML = `
            <div class="carrusel-titulo">
                <span class="dot"></span>
                <span>EN VIVO AHORA</span>
            </div>
            ${construirFila(fila1, 'derecha')}
            ${construirFila(fila2, 'izquierda')}
        `;

    } catch (e) {
        console.error('Error cargando carrusel en vivo:', e);
        wrapper.innerHTML = `
            <div class="carrusel-titulo">
                <span class="dot static"></span>
                <span>EN VIVO AHORA</span>
            </div>
            <div class="carrusel-vacio">
                <span class="icon">◈</span>
                <p>Error al cargar transmisiones. Reintentando...</p>
            </div>
        `;
    }
}

function abrirCanalDesdeCarrusel(grupoId) {
    if (!grupoId || grupoId === '') return;
    window.location.href = '/features/grupos/grupos.html?grupo=' + grupoId;
}

/* ========================================================
   EXPONER AL WINDOW
======================================================== */
window.mostrarErrorEnPantalla = mostrarErrorEnPantalla;
window.iniciarSesionDesdeIndex = iniciarSesionDesdeIndex;
window.abrirCanalDesdeCarrusel = abrirCanalDesdeCarrusel;
window.cargarCarruselEnVivo = cargarCarruselEnVivo;

/* ========================================================
   DOM READY
======================================================== */
document.addEventListener('DOMContentLoaded', function () {

    redirigirSiYaHaySesion();

    (async function cargarCuandoListo() {
        const client = await window.getSupabaseClient();
        if (!client) return;

        if (window.__sarielsAuthenticated) return;

        await cargarCarruselEnVivo();
        setInterval(cargarCarruselEnVivo, 30000);
    })();

    setTimeout(async function () {
        try {
            if (typeof window.inicializarIdiomas === 'function') {
                await window.inicializarIdiomas();
            }
        } catch (error) {
            console.error('Error inicializando idiomas:', error);
        }
    }, 300);
});
