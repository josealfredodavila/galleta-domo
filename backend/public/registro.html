<script>
(function () {
    'use strict';

    var SUPABASE_URL = 'https://zultnlogdoajehbswlih.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_S3jONAz3mRO4JKBRhUdI1A_-nsyVhKu';

    window.__sarielsAuthenticated = null;
    window.supabaseClient = window.supabaseClient || null;
    window.__sarielsSupabaseSingleton = window.__sarielsSupabaseSingleton || null;
    window.supabaseReady = null;
    window.supabaseError = null;

    function getSupabase() {
        if (window.__sarielsSupabaseSingleton) return window.__sarielsSupabaseSingleton;
        if (window.supabaseClient) {
            window.__sarielsSupabaseSingleton = window.supabaseClient;
            return window.supabaseClient;
        }
        var SDK = window.SupabaseSDK || window.supabase;
        if (!SDK || typeof SDK.createClient !== 'function') throw new Error('Supabase SDK no disponible.');
        var c = SDK.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        window.supabaseClient = c;
        window.__sarielsSupabaseSingleton = c;
        return c;
    }
    window.getSupabase = getSupabase;
    window.getSupabaseClient = function () { return window.supabaseReady; };

    async function inicializarSupabase() {
        try {
            var client = getSupabase();
            var r = await client.auth.getSession();
            var session = r && r.data ? r.data.session : null;
            window.__sarielsAuthenticated = !!session;
            client.auth.onAuthStateChange(function (_e, s) { window.__sarielsAuthenticated = !!s; });
            return client;
        } catch (e) {
            console.error('[Registro] Error inicializando Supabase:', e);
            window.__sarielsAuthenticated = false;
            window.supabaseError = e;
            return null;
        }

<style>
:root {

@keyframes float { from { transform:translate3d(0,-15px,0) scale(.9); } to { transform:translate3d(35px,35px,0) scale(1.15); } }

.footer { margin-top:30px; padding-top:16px; border-top:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; font-size:.7rem; color:var(--muted); }
.footer .brand-foot { color:var(--text); font-family:Orbitron,sans-serif; font-size:.7rem; font-weight:700; letter-spacing:.6px; }
.footer .brand-foot span { color:var(--green); }

.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px); background:rgba(7,17,13,.96); border:1px solid var(--border); padding:12px 24px; border-radius:30px; color:var(--text); font-size:.85rem; z-index:99999; opacity:0; pointer-events:none; max-width:90vw; transition:all .4s; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.error { border-color:var(--danger); color:var(--danger); }
.toast.warning { border-color:var(--warning); color:var(--warning); }
.toast.success { border-color:var(--success); color:var(--success); }

@media (max-width:768px) {

    .register-card { padding:26px 20px 22px; }

@media (prefers-reduced-motion: reduce) {
    .orb, .net-dot { animation:none !important; }
}
</style>

<script>
'use strict';

/* ================= CONFIGURACIÓN ================= */
var RUTA_PERFIL = '/features/perfil/perfil.html';
var TURNSTILE_SITE_KEY = ''; // Pon aquí la clave del sitio de Cloudflare Turnstile

var turnstileWidgetId = null;

function showToast(msg, type, duration) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(el._timer);
    el._timer = setTimeout(function () { el.className = 'toast'; }, duration || 3500);
}
window.showToast = showToast;

function traducirErrorSupabase(mensaje) {
    if (!mensaje || typeof mensaje !== 'string') return 'Error desconocido';
    var m = mensaje.toLowerCase();
    if (m.includes('user already registered') || m.includes('already registered')) return 'Ese correo ya está registrado. Inicia sesión en su lugar.';
    if (m.includes('password should be at least')) return 'La contraseña es muy corta. Usa al menos 6 caracteres.';
    if (m.includes('invalid email')) return 'El correo no tiene un formato válido.';
    if (m.includes('signup is disabled')) return 'El registro está temporalmente deshabilitado.';
    if (m.includes('too many requests') || m.includes('rate limit')) return 'Demasiados intentos. Espera unos minutos.';
    if (m.includes('captcha')) return 'No pudimos verificar que eres una persona. Intenta de nuevo.';
    if (m.includes('network') || m.includes('failed to fetch')) return 'Sin conexión con el servidor. Revisa tu internet.';
    return mensaje;
}

/* ================= TURNSTILE ================= */
function montarTurnstile() {
    var wrap = document.getElementById('turnstileWrap');
    if (!wrap || !TURNSTILE_SITE_KEY) return;
    if (!window.turnstile || typeof window.turnstile.render !== 'function') {
        setTimeout(montarTurnstile, 300);
        return;
    }
    if (turnstileWidgetId !== null) return;
    turnstileWidgetId = window.turnstile.render(wrap, {
        sitekey: TURNSTILE_SITE_KEY,
        theme: 'dark',
        size: 'flexible'
    });
}

function obtenerTokenTurnstile() {
    if (!TURNSTILE_SITE_KEY) return '';
    if (!window.turnstile || turnstileWidgetId === null) return '';
    return window.turnstile.getResponse(turnstileWidgetId) || '';
}

function reiniciarTurnstile() {
    if (window.turnstile && turnstileWidgetId !== null) {
        window.turnstile.reset(turnstileWidgetId);
    }
}

/* ================= SESIÓN ================= */
async function redirigirSiYaHaySesion() {
    try {
        var client = window.getSupabase ? window.getSupabase() : null;
        if (!client || !client.auth) return;
        var r = await client.auth.getSession();
        var s = r && r.data ? r.data.session : null;
        if (s) window.location.replace(RUTA_PERFIL);
    } catch (e) {
        console.warn('[Registro] No se pudo verificar sesión:', e);
    }
}

/* ================= REGISTRO ================= */
async function registrarDesdeRegistro() {
    var emailEl = document.getElementById('regEmail');
    var passEl = document.getElementById('regPassword');
    var nameEl = document.getElementById('regName');
    var btn = document.getElementById('registerBtn');
    if (!emailEl || !passEl) return;

    var email = emailEl.value.trim();
    var password = passEl.value;
    var name = nameEl ? nameEl.value.trim() : '';

    if (!email || !password) { showToast('Completa correo y contraseña', 'warning'); return; }
    if (password.length < 6) { showToast('La contraseña debe tener al menos 6 caracteres', 'warning'); return; }

    var tokenTurnstile = obtenerTokenTurnstile();
    if (TURNSTILE_SITE_KEY && !tokenTurnstile) {
        showToast('Confirma que no eres un robot', 'warning');
        return;
    }

    var textoOriginal = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Creando cuenta...'; }

    try {
        var client = window.getSupabase();
        if (!client) throw new Error('No hay conexión con el servidor. Recarga la página.');

        var opciones = {
            data: { nombre: name || email.split('@')[0] },
            emailRedirectTo: window.location.origin + RUTA_PERFIL
        };
        if (tokenTurnstile) opciones.captchaToken = tokenTurnstile;

        var resultado = await client.auth.signUp({ email: email, password: password, options: opciones });
        var data = resultado ? resultado.data : null;
        var error = resultado ? resultado.error : null;

        if (error) throw new Error(error.message || 'No se pudo crear la cuenta');
        if (!data || !data.user) throw new Error('No se pudo crear la cuenta');

        if (!data.session) {
            showToast('Cuenta creada. Revisa tu correo para confirmarla.', 'success', 6000);
            emailEl.value = ''; passEl.value = ''; if (nameEl) nameEl.value = '';
            reiniciarTurnstile();
            if (btn) { btn.disabled = false; btn.innerHTML = textoOriginal; }
            return;
        }

        emailEl.value = ''; passEl.value = ''; if (nameEl) nameEl.value = '';
        window.location.replace(RUTA_PERFIL);
    } catch (e) {
        console.error('[Registro] Error:', e);
        showToast(traducirErrorSupabase(e && e.message ? e.message : ''), 'error', 5000);
        reiniciarTurnstile();
        if (btn) { btn.disabled = false; btn.innerHTML = textoOriginal; }
    }
}
window.registrarDesdeRegistro = registrarDesdeRegistro;

/* ================= ARRANQUE ================= */
document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('registerForm');
    if (form) {
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            registrarDesdeRegistro();
        });
    }

    redirigirSiYaHaySesion();
    montarTurnstile();

    setTimeout(async function () {
        try {
            if (typeof window.inicializarIdiomas === 'function') await window.inicializarIdiomas();
        } catch (e) {
            console.error('Error inicializando idiomas:', e);
        }
    }, 300);
});
</script>
