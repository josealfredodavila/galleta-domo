<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>◈ Generador de QRs · Sariel's</title>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ================================================================
           ESTILOS PROFESIONALES - GENERADOR DE QRs
           ================================================================ */
        :root {
            --gold: #D4AF37;
            --gold-dark: #b8923a;
            --gold-light: #e8c84a;
            --green-deep: #0F2D1A;
            --green-mid: #1a3d2a;
            --space: #05080f;
            --text-primary: #f0f4f8;
            --text-secondary: #a0b8cc;
            --text-muted: #5a7a8a;
            --glass-bg: rgba(15, 45, 26, 0.4);
            --glass-border: rgba(212, 175, 55, 0.1);
            --shadow-gold: 0 8px 32px rgba(212, 175, 55, 0.15);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00b894;
            --danger: #ff3366;
            --bronze: #CD7F32;
            --bronze-light: #D4A574;
            --bronze-dark: #8B5A2B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--space);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(15, 45, 26, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 60%);
            padding: 20px;
        }

        /* ===== SCROLL ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--space); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 2px solid var(--glass-border);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-hex {
            font-size: 2rem;
            color: var(--gold);
            font-weight: 800;
            font-family: 'Orbitron', monospace;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }
        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
        }
        .logo-text span { color: var(--gold); }
        .logo-badge {
            font-size: 0.5rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ===== BOTONES ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
        }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: var(--shadow-gold); }
        .btn-gold:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--glass-border);
        }
        .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
        .btn-success {
            background: linear-gradient(135deg, var(--success), #00a876);
            color: var(--space);
            box-shadow: 0 4px 20px rgba(0, 214, 143, 0.2);
        }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 214, 143, 0.3); }
        .btn-danger {
            background: rgba(255, 51, 102, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 51, 102, 0.2);
        }
        .btn-danger:hover { background: rgba(255, 51, 102, 0.2); }
        .btn-sm { padding: 4px 12px; font-size: 0.55rem; }

        /* ===== PANEL ===== */
        .panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.15);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .panel-header h2 {
            font-family: 'Orbitron', monospace;
            color: var(--gold);
            font-size: 1.1rem;
        }
        .panel-header .badge {
            font-size: 0.55rem;
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }
        .panel-body { display: flex; flex-direction: column; gap: 16px; }

        /* ===== FORM ===== */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .form-group input, .form-group select {
            padding: 10px 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.05);
        }
        .form-group select option { background: var(--green-deep); }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* ===== QR GRID ===== */
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .qr-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            transition: var(--transition);
        }
        .qr-card:hover {
            border-color: var(--gold);
            transform: translateY(-3px);
            box-shadow: var(--shadow-gold);
        }
        .qr-card canvas, .qr-card img {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            background: white;
            padding: 8px;
        }
        .qr-card .qr-id {
            font-family: 'Orbitron', monospace;
            font-size: 0.5rem;
            color: var(--text-muted);
            margin-top: 8px;
            word-break: break-all;
        }
        .qr-card .qr-status {
            font-size: 0.6rem;
            margin-top: 4px;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
        }
        .qr-card .qr-status.usado {
            background: rgba(255, 51, 102, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 51, 102, 0.2);
        }
        .qr-card .qr-status.disponible {
            background: rgba(0, 184, 148, 0.1);
            color: var(--success);
            border: 1px solid rgba(0, 184, 148, 0.2);
        }
        .qr-card .qr-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 8px;
        }
        .qr-card .qr-actions .btn { font-size: 0.5rem; padding: 3px 10px; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--green-deep);
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
            box-shadow: var(--shadow-gold-strong);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 9999;
            max-width: 400px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error { border-color: var(--danger); color: var(--danger); }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon { font-size: 3rem; display: block; margin-bottom: 12px; }
        .empty-state h3 { font-family: 'Orbitron', monospace; color: var(--text-secondary); font-size: 1rem; }
        .empty-state p { font-size: 0.85rem; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .qr-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .header { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; flex-wrap: wrap; }
        }

        @media (max-width: 480px) {
            .qr-grid { grid-template-columns: 1fr; }
            .panel { padding: 16px; }
            .qr-card canvas, .qr-card img { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <a href="/" class="logo">
                <span class="logo-hex">◈</span>
                <span class="logo-text">Sariel<span>'s</span></span>
                <span class="logo-badge">✦ ADMIN</span>
            </a>
            <div class="header-actions">
                <span class="badge" style="font-size:0.6rem;color:var(--gold);background:rgba(212,175,55,0.1);padding:4px 14px;border-radius:20px;border:1px solid rgba(212,175,55,0.2);">
                    🔒 Panel de administración
                </span>
                <a href="/" class="btn btn-outline btn-sm">🏠 Inicio</a>
                <a href="/features/admin/qr-generator.html" class="btn btn-gold btn-sm">📱 QRs</a>
                <a href="/features/admin/internet-admin.html" class="btn btn-outline btn-sm">🌐 Internet</a>
            </div>
        </header>

        <!-- ===== PANEL: GENERAR QR ===== -->
        <div class="panel">
            <div class="panel-header">
                <h2>📱 Generar QR para domo</h2>
                <span class="badge">Un solo uso</span>
            </div>
            <div class="panel-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>Cantidad de QRs</label>
                        <input type="number" id="qrCantidad" value="1" min="1" max="50" />
                    </div>
                    <div class="form-group">
                        <label>Producto</label>
                        <select id="qrProducto">
                            <option value="domo">🍪 Domo de galleta</option>
                            <option value="internet">🌐 Internet / SIM</option>
                            <option value="promocion">🎁 Promoción especial</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-gold" onclick="generarQRs()" style="width:100%;justify-content:center;padding:12px;">
                    🚀 Generar QRs
                </button>
                <div id="generacionStatus" style="font-size:0.7rem;color:var(--text-muted);text-align:center;min-height:20px;margin-top:4px;"></div>
            </div>
        </div>

        <!-- ===== PANEL: QRs GENERADOS ===== -->
        <div class="panel">
            <div class="panel-header">
                <h2>📋 QRs generados</h2>
                <span class="badge" id="qrTotal">0 QRs</span>
            </div>
            <div class="panel-body">
                <div class="qr-grid" id="qrGrid">
                    <div class="empty-state">
                        <span class="icon">📭</span>
                        <h3>No hay QRs generados</h3>
                        <p>Genera QRs para tus domos y pégalos dentro de cada producto</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== PANEL: ESCANEAR QR (SIMULACIÓN) ===== -->
        <div class="panel">
            <div class="panel-header">
                <h2>📲 Escanear QR (Simulación)</h2>
                <span class="badge">Prueba</span>
            </div>
            <div class="panel-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>ID del QR</label>
                        <input type="text" id="qrEscaneado" placeholder="DOMO-1702900000-abc123-0" />
                    </div>
                    <div class="form-group">
                        <label>Wallet del cliente</label>
                        <input type="text" id="qrWallet" placeholder="0x1234...5678" />
                    </div>
                </div>
                <button class="btn btn-success" onclick="simularEscaneo()" style="width:100%;justify-content:center;padding:12px;">
                    🔍 Simular escaneo
                </button>
                <div id="escaneoStatus" style="font-size:0.7rem;color:var(--text-muted);text-align:center;min-height:20px;margin-top:4px;"></div>
            </div>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        // ================================================================
        // TOAST
        // ================================================================
        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show';
            if (type === 'error') t.classList.add('error');
            else t.classList.remove('error');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3500);
        }

        // ================================================================
        // CARGAR QRs GUARDADOS
        // ================================================================
        function cargarQRs() {
            const saved = localStorage.getItem('sariels_qrs');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {}
            }
            return [];
        }

        function guardarQRs(qrs) {
            localStorage.setItem('sariels_qrs', JSON.stringify(qrs));
        }

        // ================================================================
        // RENDERIZAR QRs
        // ================================================================
        function renderizarQRs() {
            const qrs = cargarQRs();
            const grid = document.getElementById('qrGrid');
            const total = document.getElementById('qrTotal');

            total.textContent = `${qrs.length} QRs`;

            if (qrs.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <span class="icon">📭</span>
                        <h3>No hay QRs generados</h3>
                        <p>Genera QRs para tus domos y pégalos dentro de cada producto</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = qrs.map(qr => `
                <div class="qr-card" id="qr-${qr.id}">
                    <div id="qr-${qr.id}-canvas"></div>
                    <div class="qr-id">${qr.id}</div>
                    <div class="qr-status ${qr.usado ? 'usado' : 'disponible'}">
                        ${qr.usado ? '❌ Usado' : '✅ Disponible'}
                    </div>
                    <div style="font-size:0.5rem;color:var(--text-muted);margin-top:2px;">
                        ${qr.fecha ? new Date(qr.fecha).toLocaleDateString() : ''}
                    </div>
                    <div class="qr-actions">
                        ${!qr.usado ? `<button class="btn btn-success btn-sm" onclick="marcarUsado('${qr.id}')">✅ Marcar usado</button>` : ''}
                        <button class="btn btn-outline btn-sm" onclick="descargarQR('${qr.id}')">📥 Descargar</button>
                        <button class="btn btn-danger btn-sm" onclick="eliminarQR('${qr.id}')">🗑️</button>
                    </div>
                </div>
            `).join('');

            // Generar códigos QR
            qrs.forEach(qr => {
                const container = document.getElementById(`qr-${qr.id}-canvas`);
                if (container) {
                    container.innerHTML = '';
                    try {
                        new QRCode(container, {
                            text: JSON.stringify({ qrId: qr.id, producto: qr.producto || 'domo' }),
                            width: 150,
                            height: 150,
                            colorDark: '#0F2D1A',
                            colorLight: '#ffffff'
                        });
                    } catch (e) {
                        container.innerHTML = '<div style="width:150px;height:150px;background:#f0f0f0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#999;">QR</div>';
                    }
                }
            });
        }

        // ================================================================
        // GENERAR QRs
        // ================================================================
        function generarQRs() {
            const cantidad = parseInt(document.getElementById('qrCantidad').value) || 1;
            const producto = document.getElementById('qrProducto').value;
            const status = document.getElementById('generacionStatus');

            if (cantidad < 1 || cantidad > 50) {
                showToast('⚠️ Cantidad inválida (1-50)', 'error');
                return;
            }

            const qrs = cargarQRs();
            const nuevos = [];

            for (let i = 0; i < cantidad; i++) {
                const id = `DOMO-${Date.now()}-${Math.random().toString(36).substring(2, 8)}-${i}`;
                nuevos.push({
                    id: id,
                    producto: producto,
                    usado: false,
                    fecha: new Date().toISOString(),
                    escaneadoPor: null,
                    fechaEscaneo: null
                });
            }

            const todos = [...qrs, ...nuevos];
            guardarQRs(todos);
            renderizarQRs();

            status.innerHTML = `✅ ${cantidad} QR(s) generados correctamente`;
            showToast(`✅ ${cantidad} QR(s) generados`);

            // Imprimir etiquetas (simulación)
            setTimeout(() => {
                if (confirm(`¿Imprimir etiquetas para ${cantidad} QR(s)?`)) {
                    status.innerHTML = `🖨️ Enviando a impresión... ${cantidad} etiquetas`;
                    setTimeout(() => {
                        status.innerHTML = `✅ ${cantidad} etiquetas enviadas a impresión`;
                    }, 1500);
                }
            }, 500);
        }

        // ================================================================
        // MARCAR QR COMO USADO
        // ================================================================
        function marcarUsado(id) {
            const qrs = cargarQRs();
            const qr = qrs.find(q => q.id === id);
            if (qr) {
                qr.usado = true;
                qr.fechaEscaneo = new Date().toISOString();
                guardarQRs(qrs);
                renderizarQRs();
                showToast(`✅ QR ${id} marcado como usado`);
            }
        }

        // ================================================================
        // ELIMINAR QR
        // ================================================================
        function eliminarQR(id) {
            if (!confirm(`¿Eliminar QR ${id}?`)) return;
            const qrs = cargarQRs().filter(q => q.id !== id);
            guardarQRs(qrs);
            renderizarQRs();
            showToast(`🗑️ QR eliminado`);
        }

        // ================================================================
        // DESCARGAR QR
        // ================================================================
        function descargarQR(id) {
            const qrs = cargarQRs();
            const qr = qrs.find(q => q.id === id);
            if (!qr) return;

            const canvas = document.querySelector(`#qr-${id}-canvas canvas`);
            if (!canvas) {
                showToast('⚠️ No se encontró el QR', 'error');
                return;
            }

            const link = document.createElement('a');
            link.download = `QR-${id}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast(`📥 QR descargado: ${id}`);
        }

        // ================================================================
        // SIMULAR ESCANEO
        // ================================================================
        function simularEscaneo() {
            const qrId = document.getElementById('qrEscaneado').value.trim();
            const wallet = document.getElementById('qrWallet').value.trim();
            const status = document.getElementById('escaneoStatus');

            if (!qrId) {
                status.innerHTML = '⚠️ Ingresa un ID de QR';
                return;
            }

            if (!wallet || wallet.length < 10) {
                status.innerHTML = '⚠️ Ingresa una wallet válida';
                return;
            }

            const qrs = cargarQRs();
            const qr = qrs.find(q => q.id === qrId);

            if (!qr) {
                status.innerHTML = '❌ QR no encontrado';
                showToast('❌ QR no encontrado', 'error');
                return;
            }

            if (qr.usado) {
                status.innerHTML = '❌ Este QR ya fue utilizado';
                showToast('❌ QR ya usado', 'error');
                return;
            }

            // Marcar como usado
            qr.usado = true;
            qr.escaneadoPor = wallet;
            qr.fechaEscaneo = new Date().toISOString();
            guardarQRs(qrs);

            // Simular envío de token
            status.innerHTML = `
                ✅ <strong>¡QR escaneado exitosamente!</strong><br>
                📤 1 <strong>Es.stoks</strong> enviado a ${wallet.slice(0, 6)}...${wallet.slice(-4)}<br>
                📦 Producto: ${qr.producto || 'domo'}
            `;

            showToast('✅ Token Es.stoks enviado al cliente');
            renderizarQRs();
        }

        // ================================================================
        // INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderizarQRs();

            // Enter para generar
            document.getElementById('qrCantidad').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') generarQRs();
            });

            console.log('◈ Sariel\'s - Generador de QRs');
            console.log(`📦 QRs guardados: ${cargarQRs().length}`);
        });

        // Exponer funciones globales
        window.generarQRs = generarQRs;
        window.marcarUsado = marcarUsado;
        window.eliminarQR = eliminarQR;
        window.descargarQR = descargarQR;
        window.simularEscaneo = simularEscaneo;
        window.showToast = showToast;
    </script>
</body>
</html>
