<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>◈ Contactos · Sariel's</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/features/mensajes/contactos.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <style>
        /* ================================================================
           CONTACTOS ULTRA MEGA PRO - SARIEL'S
           ================================================================ */

        :root {
            --gold: #D4AF37;
            --gold-dark: #b8923a;
            --gold-light: #e8c84a;
            --gold-bright: #f0d060;
            --green-deep: #0F2D1A;
            --green-mid: #1a4a2a;
            --green-bright: #2a6a3a;
            --space: #05080f;
            --text-primary: #f0f4f8;
            --text-secondary: #c0d8e8;
            --text-muted: #8aa8b8;
            --glass-bg: rgba(15, 45, 26, 0.45);
            --glass-border: rgba(212, 175, 55, 0.12);
            --glass-border-hover: rgba(212, 175, 55, 0.3);
            --shadow-gold: 0 8px 40px rgba(212, 175, 55, 0.2);
            --shadow-gold-strong: 0 0 60px rgba(212, 175, 55, 0.12);
            --shadow-card: 0 4px 30px rgba(0, 0, 0, 0.3);
            --radius: 16px;
            --radius-xl: 24px;
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00d68f;
            --danger: #ff3366;
            --warning: #f7d44a;
            --cyan: #00e5ff;
            --purple: #a855f7;
            --pink: #ec4899;
            --live-red: #ff0044;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--space);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(26, 74, 42, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== FONDO ESTELAR ===== */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
            will-change: transform;
        }
        .nebula-1 { width: 700px; height: 700px; background: var(--green-bright); top: -15%; right: -15%; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-light); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.06; }
        .nebula-3 { width: 500px; height: 500px; background: var(--purple); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

        @keyframes nebula-drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--space); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

        /* ===== APP ===== */
        .app {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 20px 30px;
            contain: layout style;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 14px;
            border-bottom: 1px solid var(--glass-border);
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 8, 15, 0.92);
            border-radius: var(--radius) var(--radius) 0 0;
            contain: layout style;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: var(--transition);
        }
        .logo:hover { opacity: 0.85; }
        .logo-hex {
            font-size: 1.8rem;
            color: var(--gold);
            font-weight: 800;
            font-family: 'Orbitron', monospace;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            animation: glow-pulse 3s ease-in-out infinite;
            will-change: text-shadow;
        }
        @keyframes glow-pulse {
            0%, 100% { text-shadow: 0 0 30px rgba(212, 175, 55, 0.3); }
            50% { text-shadow: 0 0 60px rgba(212, 175, 55, 0.6); }
        }
        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 2px;
        }
        .logo-text span { color: var(--gold); }
        .logo-badge {
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--space);
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .network-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.6rem;
            color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .network-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
            will-change: transform, opacity;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* ===== NAVEGACIÓN ===== */
        .main-nav {
            display: flex;
            gap: 4px;
            background: rgba(15, 45, 26, 0.3);
            border-radius: var(--radius);
            padding: 4px;
            border: 1px solid var(--glass-border);
            margin: 16px 0 20px;
            overflow-x: auto;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
            contain: layout style;
        }
        .main-nav .nav-link {
            padding: 8px 16px;
            border-radius: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
        }
        .main-nav .nav-link::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: var(--transition);
            transform: translateX(-50%);
            border-radius: 2px;
        }
        .main-nav .nav-link:hover::after,
        .main-nav .nav-link.active::after {
            width: 60%;
        }
        .main-nav .nav-link:hover {
            color: var(--text-primary);
            background: rgba(212, 175, 55, 0.05);
        }
        .main-nav .nav-link.active {
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold);
        }
        .main-nav .nav-link.live {
            color: var(--live-red);
        }
        .main-nav .nav-link.live:hover {
            background: rgba(255, 0, 68, 0.08);
        }

        /* ================================================================
           CONTACTOS CONTAINER
           ================================================================ */

        .contactos-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* ===== CONTADORES ===== */
        .contactos-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 12px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .contactos-stats span {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .contactos-stats .numero {
            color: var(--gold);
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            background: rgba(212, 175, 55, 0.08);
            padding: 0 10px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.06);
        }

        /* ===== BUSCADOR ===== */
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            outline: none;
            min-width: 200px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            letter-spacing: 0.3px;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.08), inset 0 0 40px rgba(212, 175, 55, 0.02);
        }
        .search-bar input::placeholder {
            color: var(--text-muted);
            letter-spacing: 0.5px;
            opacity: 0.6;
        }
        .search-bar .btn-agregar {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.8px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
        }
        .search-bar .btn-agregar:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 40px rgba(212, 175, 55, 0.3);
        }
        .search-bar .btn-agregar:active {
            transform: scale(0.97);
        }

        /* ===== FILTROS ===== */
        .filtros {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            padding: 4px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
        }
        .filtros .filtro {
            padding: 6px 18px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.5px;
        }
        .filtros .filtro:hover {
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
        }
        .filtros .filtro.active {
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.05);
        }

        /* ===== LISTA DE CONTACTOS ===== */
        .contactos-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        /* ===== TARJETA DE CONTACTO ===== */
        .contacto-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            transition: var(--transition-slow);
            cursor: default;
            position: relative;
            overflow: hidden;
        }
        .contacto-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.02), transparent);
            opacity: 0;
            transition: var(--transition-slow);
            pointer-events: none;
        }
        .contacto-card:hover {
            border-color: var(--glass-border-hover);
            transform: translateY(-3px);
            box-shadow: var(--shadow-gold);
        }
        .contacto-card:hover::before {
            opacity: 1;
        }
        .contacto-card::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--gold);
            opacity: 0;
            transition: var(--transition);
            border-radius: 0 3px 3px 0;
        }
        .contacto-card:hover::after {
            opacity: 1;
        }

        /* ===== AVATAR ===== */
        .contacto-card .contacto-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green-deep), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 1.2rem;
            overflow: hidden;
            flex-shrink: 0;
            font-family: 'Orbitron', monospace;
            position: relative;
            border: 2px solid rgba(212, 175, 55, 0.2);
            transition: var(--transition);
        }
        .contacto-card .contacto-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .contacto-card .contacto-avatar.online {
            border-color: var(--success);
            box-shadow: 0 0 30px rgba(0, 214, 143, 0.15);
        }
        .contacto-card .contacto-avatar.offline {
            border-color: var(--text-muted);
            opacity: 0.5;
        }
        .contacto-card .contacto-avatar .online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--success);
            border: 2px solid var(--space);
            box-shadow: 0 0 20px rgba(0, 214, 143, 0.3);
        }
        .contacto-card .contacto-avatar .favorito-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 0.5rem;
            background: var(--gold);
            color: var(--space);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--space);
            font-family: 'Orbitron', monospace;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        /* ===== INFO ===== */
        .contacto-card .contacto-info {
            flex: 1;
            min-width: 0;
        }
        .contacto-card .contacto-info .nombre {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .contacto-card .contacto-info .nombre .verified {
            font-size: 0.45rem;
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            padding: 2px 10px;
            border-radius: 12px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            border: 1px solid rgba(212, 175, 55, 0.08);
        }
        .contacto-card .contacto-info .estado {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .contacto-card .contacto-info .estado.online {
            color: var(--success);
        }
        .contacto-card .contacto-info .estado.offline {
            color: var(--text-muted);
        }
        .contacto-card .contacto-info .contacto-meta {
            display: flex;
            gap: 14px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .contacto-card .contacto-info .contacto-meta span {
            font-size: 0.6rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.2px;
            opacity: 0.7;
        }

        /* ===== ACCIONES ===== */
        .contacto-card .contacto-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .contacto-card .contacto-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            padding: 6px 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            position: relative;
        }
        .contacto-card .contacto-actions button::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 10px;
            background: rgba(212, 175, 55, 0.05);
            opacity: 0;
            transition: var(--transition);
        }
        .contacto-card .contacto-actions button:hover::before {
            opacity: 1;
        }
        .contacto-card .contacto-actions button:hover {
            color: var(--gold);
            transform: translateY(-1px);
        }
        .contacto-card .contacto-actions button.mensaje:hover {
            color: var(--success);
        }
        .contacto-card .contacto-actions button.favorito.active {
            color: var(--gold);
        }
        .contacto-card .contacto-actions button.favorito.active::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: pulse-border 2s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .contacto-card .contacto-actions button.eliminar:hover {
            color: var(--danger);
        }
        .contacto-card .contacto-actions button.bloquear:hover {
            color: var(--danger);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
        .empty-state .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 16px;
            font-family: 'Orbitron', monospace;
            color: var(--gold);
            opacity: 0.3;
            letter-spacing: 4px;
        }
        .empty-state h3 {
            font-family: 'Orbitron', monospace;
            color: var(--text-secondary);
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            font-weight: 400;
        }
        .empty-state p {
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }
        .empty-state .btn-accion {
            margin-top: 20px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            border: none;
            padding: 10px 30px;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.8px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
        }
        .empty-state .btn-accion:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(212, 175, 55, 0.3);
        }

        /* ================================================================
           TOAST
           ================================================================ */

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--green-deep);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 500;
            box-shadow: var(--shadow-gold-strong);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9999;
            max-width: 400px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            letter-spacing: 0.3px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error { border-color: var(--danger); color: var(--danger); }

        /* ================================================================
           FOOTER
           ================================================================ */

        .footer {
            margin-top: 30px;
            padding-top: 16px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.7rem;
            color: var(--text-muted);
            padding-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .footer .brand { color: var(--gold); font-weight: 600; letter-spacing: 1px; }
        .footer-links { display: flex; gap: 12px; flex-wrap: wrap; }
        .footer-links a { color: var(--text-muted); text-decoration: none; transition: var(--transition); }
        .footer-links a:hover { color: var(--gold); }

        /* ================================================================
           RESPONSIVE
           ================================================================ */

        @media (max-width: 768px) {
            .app { padding: 12px 14px; }
            .contactos-container { padding: 0; }
            .search-bar { flex-direction: column; }
            .search-bar .btn-agregar { width: 100%; justify-content: center; }
            .contacto-card { padding: 12px 14px; flex-wrap: wrap; gap: 10px; }
            .contacto-card .contacto-actions { 
                width: 100%; 
                justify-content: flex-end; 
                padding-top: 8px; 
                border-top: 1px solid var(--glass-border);
            }
            .filtros { gap: 4px; padding: 4px; }
            .filtros .filtro { font-size: 0.55rem; padding: 4px 12px; }
            .contactos-stats { font-size: 0.6rem; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
            .main-nav .nav-link { font-size: 0.6rem; padding: 6px 10px; }

        @media (max-width: 480px) {

            .empty-state .icon {

            .empty-state h3 {

            .filtros .filtro {
                font-size: 0.5rem;
                padding: 3px 10px;
            }
            .main-nav .nav-link { font-size: 0.55rem; padding: 4px 8px; }
        }
    </style>
</head>
<body>

                <span style="opacity:0.3;">⚡ Polygon</span>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.0/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
    <script src="/features/mensajes/contactos.js"></script>
    <script>
        // ================================================================
        // CONTACTOS - LÓGICA ADICIONAL - SIN REDIRECCIÓN
        // ================================================================

        // ================================================================
        // TOAST
        // ================================================================
        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            if (t) {
                t.textContent = msg;
                t.className = 'toast show';
                if (type === 'error') t.classList.add('error');
                else t.classList.remove('error');
                clearTimeout(t._timeout);
                t._timeout = setTimeout(() => t.classList.remove('show'), 3500);
            }
        }

        // ================================================================
        // INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            initStars();

            // Verificar token - SIN REDIRIGIR
            const token = localStorage.getItem('galleta_token');
            if (!token) {
                showToast('⚠️ Conecta tu wallet para ver contactos', 'warning');
            } else {
                console.log('✅ Token encontrado');
            }

            // Cargar contactos simulados
            cargarContactosSimulados();

            // Configurar filtros
            document.querySelectorAll('.filtro').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filtro').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const filtro = this.dataset.filtro;
                    showToast(`◈ Filtro: ${this.textContent.trim()}`);
                    filtrarContactos(filtro);
                });
            });

            // Configurar búsqueda
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    const query = this.value.toLowerCase().trim();
                    filtrarContactosPorBusqueda(query);
                });
            }

            // Configurar botón agregar
            const btnAgregar = document.getElementById('btnAgregar');
            if (btnAgregar) {
                btnAgregar.addEventListener('click', function() {
                    const nombre = prompt('◈ Nombre del contacto:');
                    if (nombre && nombre.trim()) {
                        showToast(`◆ Contacto ${nombre.trim()} agregado`);
                        agregarContactoSimulado(nombre.trim());
                    }
                });
            }

            console.log('◈ Sariel\'s - Contactos Ultra Mega Pro');
            console.log('◆ Lista de contactos cargada');
        });

        function initStars() {
            const canvas = document.getElementById('stars-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height, stars = [];
            let animId = null;
            let isVisible = true;

            const isMobile = window.innerWidth < 600;
            const STAR_COUNT = isMobile ? 40 : 100;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                createStars();
            }

            function createStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 0.8 + 0.2,
                        speed: Math.random() * 0.005 + 0.002,
                        opacity: Math.random() * 0.5 + 0.2,
                        twinklePhase: Math.random() * Math.PI * 2
                    });
                }
            }

            function draw() {
                if (!isVisible) {
                    animId = requestAnimationFrame(draw);
                    return;
                }
                ctx.clearRect(0, 0, width, height);
                for (let star of stars) {
                    const opacity = star.opacity * (0.6 + 0.4 * Math.sin(star.twinklePhase));
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fill();
                    star.twinklePhase += 0.02;
                    star.y += star.speed;
                    if (star.y > height) {
                        star.y = 0;
                        star.x = Math.random() * width;
                    }
                }
                animId = requestAnimationFrame(draw);
            }

            function pauseAnimation() { isVisible = false; }
            function resumeAnimation() { isVisible = true; }

            resize();
            draw();

            window.addEventListener('resize', resize);
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) pauseAnimation();
                else resumeAnimation();
            });

            return { pauseAnimation, resumeAnimation };
        }

        // ================================================================
        // CONTACTOS SIMULADOS
        // ================================================================
        let contactosSimulados = [
            { id: 1, nombre: 'Ana Martínez', estado: 'online', avatar: '✦', verificado: true, favorito: true },
            { id: 2, nombre: 'Carlos López', estado: 'offline', avatar: '◆', verificado: false, favorito: false },
            { id: 3, nombre: 'María García', estado: 'online', avatar: '◈', verificado: true, favorito: false },
            { id: 4, nombre: 'Juan Pérez', estado: 'offline', avatar: '◇', verificado: false, favorito: false },
            { id: 5, nombre: 'Sofia Ramírez', estado: 'online', avatar: '✦', verificado: true, favorito: true }
        ];

        function cargarContactosSimulados() {
            const list = document.getElementById('contactosList');
            const totalEl = document.getElementById('totalContactos');
            const onlineEl = document.getElementById('onlineContactos');

            if (totalEl) totalEl.textContent = contactosSimulados.length;
            if (onlineEl) onlineEl.textContent = contactosSimulados.filter(c => c.estado === 'online').length;

            renderizarContactos(contactosSimulados);
        }

        function renderizarContactos(lista) {
            const list = document.getElementById('contactosList');
            if (!list) return;

            if (!lista || lista.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">◈</span>
                        <h3>Sin contactos</h3>
                        <p>Comienza a agregar personas a tu red</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = lista.map(c => `
                <div class="contacto-card" data-id="${c.id}">
                    <div class="contacto-avatar ${c.estado} ${c.favorito ? 'favorito' : ''}">
                        ${c.avatar}
                        ${c.estado === 'online' ? '<span class="online-dot"></span>' : ''}
                        ${c.favorito ? '<span class="favorito-badge">◆</span>' : ''}
                    </div>
                    <div class="contacto-info">
                        <div class="nombre">
                            ${c.nombre}
                            ${c.verificado ? '<span class="verified">✦ VERIFICADO</span>' : ''}
                        </div>
                        <div class="estado ${c.estado}">
                            ${c.estado === 'online' ? '◉ En línea' : '◈ Desconectado'}
                        </div>
                        <div class="contacto-meta">
                            <span>◈ 0x7F3a...9Bc2</span>
                        </div>
                    </div>
                    <div class="contacto-actions">
                        <button class="mensaje" onclick="showToast('◈ Abriendo conversación con ${c.nombre}')">◈</button>
                        <button class="favorito ${c.favorito ? 'active' : ''}" onclick="toggleFavoritoSimulado(${c.id})">◆</button>
                        <button class="bloquear" onclick="showToast('⊘ Usuario bloqueado')">⊘</button>
                        <button class="eliminar" onclick="eliminarContactoSimulado(${c.id})">✕</button>
                    </div>
                </div>
            `).join('');
        }

        function filtrarContactos(filtro) {
            let lista = [...contactosSimulados];
            if (filtro === 'online') {
                lista = lista.filter(c => c.estado === 'online');
            } else if (filtro === 'favoritos') {
                lista = lista.filter(c => c.favorito);
            }
            renderizarContactos(lista);
        }

        function filtrarContactosPorBusqueda(query) {
            if (!query) {
                renderizarContactos(contactosSimulados);
                return;
            }
            const lista = contactosSimulados.filter(c => 
                c.nombre.toLowerCase().includes(query)
            );
            renderizarContactos(lista);
        }

        function toggleFavoritoSimulado(id) {
            const contacto = contactosSimulados.find(c => c.id === id);
            if (contacto) {
                contacto.favorito = !contacto.favorito;
                cargarContactosSimulados();
                showToast(contacto.favorito ? '◆ Agregado a favoritos' : '◆ Favorito eliminado');
            }
        }

        function eliminarContactoSimulado(id) {
            if (!confirm('¿Eliminar este contacto?')) return;
            contactosSimulados = contactosSimulados.filter(c => c.id !== id);
            cargarContactosSimulados();
            showToast('✕ Contacto eliminado');
        }

        function agregarContactoSimulado(nombre) {
            contactosSimulados.push({
                id: Date.now(),
                nombre: nombre,
                estado: 'offline',
                avatar: '✦',
                verificado: false,
                favorito: false
            });
            cargarContactosSimulados();
        }
    </script>
</body>
