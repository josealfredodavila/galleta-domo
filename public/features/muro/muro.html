<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sariel's - Muro Ultra Mega Pro</title>
    <!-- CSS del Muro -->
    <link rel="stylesheet" href="muro.css">
    <!-- Carga del cliente de Supabase JS (Obligatorio antes de muro.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="app">
        <!-- HEADER -->
        <header class="header">
            <a href="#" class="logo">
                <span class="logo-hex">◈</span>
                <span class="logo-text">Sariel'<span>s</span></span>
                <span class="logo-badge">PRO</span>
            </a>
            <div class="header-actions">
                <div class="network-badge">
                    <span class="dot"></span> Polygon
                </div>
                <div class="token-badge" onclick="verTokens()">
                    ◈ <span id="tokenBadgeCantidad">0</span> Tokens
                </div>
            </div>
        </header>

        <!-- FORMULARIO DE PUBLICACIÓN -->
        <section class="post-form">
            <div class="form-header">
                <div class="avatar" id="userAvatar">◈</div>
                <div>
                    <div class="nombre" id="userName">Explorador</div>
                    <div class="handle">@conectado</div>
                </div>
            </div>
            <textarea id="postContent" placeholder="¿Qué estás pensando en el ecosistema Web3?..."></textarea>
            <div class="form-actions">
                <div class="tools">
                    <button type="button" onclick="showToast('📌 Funcionalidad de adjuntos')">📎 Adjuntar</button>
                </div>
                <button type="button" id="btnPublicar" class="btn-publicar" onclick="publicar()">🚀 Publicar</button>
            </div>
        </section>

        <!-- FEED DE PUBLICACIONES -->
        <main id="feedContainer">
            <!-- Las publicaciones se cargan dinámicamente -->
        </main>

        <button id="btnCargarMas" class="btn-vender-token" style="display:none; margin: 20px auto;" onclick="cargarPublicaciones(paginaActual + 1)">Cargar más</button>
    </div>

    <!-- Cargar la lógica JS de muro al final -->
    <script src="muro.js"></script>
</body>
</html>
