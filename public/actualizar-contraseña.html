<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>◈ Nueva contraseña · Sariel's</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <style>
        /* ================================================================
           ESTILOS - ACTUALIZAR CONTRASEÑA
           ================================================================ */
        :root {
            --gold: #D4AF37;
            --gold-dark: #b8923a;
            --gold-light: #e8c84a;
            --gold-bright: #f0d060;
            --green-deep: #0F2D1A;
            --green-mid: #1a4a2a;
            --green-bright: #2a6a3a;
            --space: #05080f;
            --text-primary: #f0f4f8;
            --text-secondary: #c0d8e8;
            --text-muted: #8aa8b8;
            --glass-bg: rgba(15, 45, 26, 0.55);
            --glass-border: rgba(212, 175, 55, 0.15);
            --shadow-gold: 0 8px 32px rgba(212, 175, 55, 0.25);
            --shadow-gold-strong: 0 0 60px rgba(212, 175, 55, 0.15);
            --radius: 16px;
            --radius-xl: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00d68f;
            --danger: #ff3366;
            --warning: #f7d44a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--space);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(26, 74, 42, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            padding: 20px;
        }

        /* ===== FONDO ESTELAR ===== */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
        }
        .nebula-1 { width: 700px; height: 700px; background: var(--green-bright); top: -15%; right: -15%; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-light); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.06; }
        .nebula-3 { width: 500px; height: 500px; background: #a855f7; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

        @keyframes nebula-drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--space); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

        /* ===== CONTAINER ===== */
        .reset-container {
            position: relative;
            z-index: 1;
            max-width: 440px;
            width: 100%;
            padding: 36px 32px 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-gold-strong);
            animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reset-container .logo-icon {
            text-align: center;
            font-size: 2.8rem;
            display: block;
            margin-bottom: 6px;
            font-family: 'Orbitron', monospace;
            color: var(--gold);
        }

        .reset-container h2 {
            font-family: 'Orbitron', monospace;
            color: var(--gold);
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .reset-container .sub {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .reset-container .sub strong {
            color: var(--gold);
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.08);
            background: rgba(0, 0, 0, 0.45);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .form-group .input-hint {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        .password-strength {
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
            transition: var(--transition);
        }

        .password-strength .fill {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        .password-strength .fill.weak { background: var(--danger); width: 33%; }
        .password-strength .fill.medium { background: var(--warning); width: 66%; }
        .password-strength .fill.strong { background: var(--success); width: 100%; }

        /* ===== BOTONES ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
        }

        .btn-gold:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-gold);
        }

        .btn-gold:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--glass-border);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }

        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #00a876);
            color: var(--space);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--green-deep);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 500;
            box-shadow: var(--shadow-gold-strong);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9999;
            max-width: 400px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            letter-spacing: 0.3px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error { border-color: var(--danger); color: var(--danger); }
        .toast.success { border-color: var(--success); color: var(--success); }

        /* ===== FOOTER ===== */
        .reset-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--glass-border);
            text-align: center;
            font-size: 0.6rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        .reset-footer a {
            color: var(--gold);
            text-decoration: none;
            transition: var(--transition);
        }

        .reset-footer a:hover {
            text-decoration: underline;
        }

        .reset-footer .lock-icon {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 4px;
            opacity: 0.6;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .reset-container {
                padding: 24px 18px 20px;
            }
            .reset-container h2 {
                font-size: 1rem;
            }
            .reset-container .sub {
                font-size: 0.75rem;
            }
            .form-group input {
                padding: 10px 14px;
                font-size: 0.85rem;
            }
            .btn {
                padding: 12px;
                font-size: 0.7rem;
            }
            .toast {
                bottom: 16px;
                right: 16px;
                padding: 10px 18px;
                font-size: 0.7rem;
                max-width: 90%;
            }
        }
    </style>
</head>
<body>

    <!-- ===== FONDO ESTELAR ===== -->
    <canvas id="stars-canvas"></canvas>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <!-- ===== CONTAINER ===== -->
    <div class="reset-container" id="resetContainer">
        <span class="logo-icon">◈</span>
        <h2>◈ Nueva contraseña</h2>
        <p class="sub">
            Crea una nueva contraseña segura para tu cuenta.<br>
            <strong>Mínimo 6 caracteres</strong>
        </p>

        <!-- ===== FORM ===== -->
        <div class="form-group">
            <label>Nueva contraseña</label>
            <input type="password" id="newPassword" placeholder="Ingresa tu nueva contraseña" autofocus />
            <div class="password-strength">
                <div class="fill" id="passwordStrengthFill"></div>
            </div>
            <div class="input-hint" id="passwordHint">Usa al menos 6 caracteres</div>
        </div>

        <div class="form-group">
            <label>Confirmar contraseña</label>
            <input type="password" id="confirmPassword" placeholder="Confirma tu nueva contraseña" />
            <div class="input-hint" id="confirmHint">Las contraseñas deben coincidir</div>
        </div>

        <button class="btn btn-gold" id="btnGuardar" onclick="guardarNuevaContraseña()">
            ⟡ Guardar y entrar
        </button>

        <!-- ===== FOOTER ===== -->
        <div class="reset-footer">
            <span class="lock-icon">🔒</span>
            Este enlace expira en <strong>1 hora</strong> por seguridad.<br>
            <a href="/">← Volver al inicio</a>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        // ================================================================
        // SUPABASE
        // ================================================================
        const supabase = window.supabase.createClient(
            'https://hbbwopkfpkvahgtawqke.supabase.co',
            'sb_publishable_4gJWA-t7Eg6ruuI2EF-K2A_GQlahb2j'
        );

        // ================================================================
        // TOAST
        // ================================================================
        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show';
            if (type === 'error') t.classList.add('error');
            else if (type === 'success') t.classList.add('success');
            else t.classList.remove('error', 'success');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 4000);
        }

        // ================================================================
        // FORTALEZA DE CONTRASEÑA
        // ================================================================
        document.getElementById('newPassword').addEventListener('input', function() {
            const password = this.value;
            const fill = document.getElementById('passwordStrengthFill');
            const hint = document.getElementById('passwordHint');

            if (password.length === 0) {
                fill.className = 'fill';
                fill.style.width = '0%';
                hint.textContent = 'Usa al menos 6 caracteres';
                return;
            }

            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            let level = 'weak';
            let text = 'Débil';
            let width = 33;

            if (strength >= 4) {
                level = 'strong';
                text = 'Fuerte';
                width = 100;
            } else if (strength >= 2) {
                level = 'medium';
                text = 'Media';
                width = 66;
            }

            fill.className = 'fill ' + level;
            fill.style.width = width + '%';
            hint.textContent = 'Fortaleza: ' + text + (password.length < 6 ? ' (mínimo 6 caracteres)' : '');
            hint.style.color = level === 'strong' ? 'var(--success)' : level === 'medium' ? 'var(--warning)' : 'var(--text-muted)';
        });

        // ================================================================
        // CONFIRMAR CONTRASEÑA
        // ================================================================
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const confirm = this.value;
            const password = document.getElementById('newPassword').value;
            const hint = document.getElementById('confirmHint');

            if (confirm.length === 0) {
                hint.textContent = 'Las contraseñas deben coincidir';
                hint.style.color = 'var(--text-muted)';
                return;
            }

            if (confirm === password) {
                hint.textContent = '✅ Las contraseñas coinciden';
                hint.style.color = 'var(--success)';
            } else {
                hint.textContent = '❌ Las contraseñas no coinciden';
                hint.style.color = 'var(--danger)';
            }
        });

        // ================================================================
        // ENTER PARA GUARDAR
        // ================================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active && (active.id === 'newPassword' || active.id === 'confirmPassword')) {
                    e.preventDefault();
                    guardarNuevaContraseña();
                }
            }
        });

        // ================================================================
        // GUARDAR NUEVA CONTRASEÑA
        // ================================================================
        async function guardarNuevaContraseña() {
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('btnGuardar');

            // Validaciones
            if (!newPass || newPass.length < 6) {
                showToast('⚠️ La contraseña debe tener al menos 6 caracteres', 'error');
                document.getElementById('newPassword').focus();
                return;
            }

            if (newPass !== confirmPass) {
                showToast('⚠️ Las contraseñas no coinciden', 'error');
                document.getElementById('confirmPassword').focus();
                return;
            }

            // Deshabilitar botón
            btn.disabled = true;
            btn.textContent = '⏳ Actualizando...';

            try {
                const { data, error } = await supabase.auth.updateUser({
                    password: newPass
                });

                if (error) throw error;

                showToast('✅ ¡Contraseña actualizada! Ahora inicia sesión con la nueva.', 'success');

                // Redirigir después de 2 segundos
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);

            } catch (error) {
                console.error('Error actualizando contraseña:', error);
                showToast('❌ Error: ' + (error.message || 'No se pudo actualizar la contraseña'), 'error');
                btn.disabled = false;
                btn.textContent = '⟡ Guardar y entrar';
            }
        }

        // ================================================================
        // ESTRELLAS
        // ================================================================
        function initStars() {
            const canvas = document.getElementById('stars-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height, stars = [];
            let isVisible = true;

            const isMobile = window.innerWidth < 600;
            const STAR_COUNT = isMobile ? 40 : 100;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                createStars();
            }

            function createStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 0.8 + 0.2,
                        speed: Math.random() * 0.005 + 0.002,
                        opacity: Math.random() * 0.5 + 0.2,
                        twinklePhase: Math.random() * Math.PI * 2
                    });
                }
            }

            function draw() {
                if (!isVisible) {
                    requestAnimationFrame(draw);
                    return;
                }
                ctx.clearRect(0, 0, width, height);
                for (let star of stars) {
                    const opacity = star.opacity * (0.6 + 0.4 * Math.sin(star.twinklePhase));
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fill();
                    star.twinklePhase += 0.02;
                    star.y += star.speed;
                    if (star.y > height) {
                        star.y = 0;
                        star.x = Math.random() * width;
                    }
                }
                requestAnimationFrame(draw);
            }

            function pauseAnimation() { isVisible = false; }
            function resumeAnimation() { isVisible = true; }

            resize();
            draw();

            window.addEventListener('resize', resize);
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) pauseAnimation();
                else resumeAnimation();
            });
        }

        // ================================================================
        // INICIALIZAR
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            initStars();
            console.log('◈ Sariel\'s - Actualizar contraseña');
            console.log('🔒 Enlace seguro para restablecer contraseña');
        });
    </script>
</body>
</html>
