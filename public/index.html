<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>◈ Muro · Sariel's</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/features/muro/muro.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='12' fill='%230F2D1A' stroke='%23D4AF37' stroke-width='4'/><text x='50' y='68' font-family='Orbitron, monospace' font-size='50' font-weight='900' fill='%23D4AF37' text-anchor='middle'>◈</text></svg>" />
    <style>
        /* ================================================================
           MURO ULTRA MEGA PRO - SARIEL'S
           ================================================================ */

        :root {
            --gold: #D4AF37;
            --gold-dark: #b8923a;
            --gold-light: #e8c84a;
            --gold-bright: #f0d060;
            --green-deep: #0F2D1A;
            --green-mid: #1a4a2a;
            --green-bright: #2a6a3a;
            --space: #05080f;
            --text-primary: #f0f4f8;
            --text-secondary: #c0d8e8;
            --text-muted: #8aa8b8;
            --glass-bg: rgba(15, 45, 26, 0.55);
            --glass-border: rgba(212, 175, 55, 0.15);
            --shadow-gold: 0 8px 32px rgba(212, 175, 55, 0.25);
            --shadow-gold-strong: 0 0 60px rgba(212, 175, 55, 0.15);
            --radius: 16px;
            --radius-xl: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00d68f;
            --danger: #ff3366;
            --warning: #f7d44a;
            --cyan: #00e5ff;
            --purple: #a855f7;
            --pink: #ec4899;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--space);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(26, 74, 42, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* ===== FONDO ESTELAR ===== */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            animation: nebula-drift 25s ease-in-out infinite alternate;
            will-change: transform;
        }
        .nebula-1 { width: 700px; height: 700px; background: var(--green-bright); top: -15%; right: -15%; }
        .nebula-2 { width: 600px; height: 600px; background: var(--gold-light); bottom: -15%; left: -15%; animation-delay: -8s; opacity: 0.06; }
        .nebula-3 { width: 500px; height: 500px; background: var(--purple); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s; opacity: 0.04; }

        @keyframes nebula-drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--space); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

        /* ===== APP ===== */
        .app {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 20px 30px;
            contain: layout style;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 14px;
            border-bottom: 1px solid var(--glass-border);
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 8, 15, 0.92);
            border-radius: var(--radius) var(--radius) 0 0;
            contain: layout style;
            transition: background 0.5s ease, border-color 0.5s ease;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: var(--transition);
        }
        .logo:hover { opacity: 0.85; }
        .logo-hex {
            font-size: 1.8rem;
            color: var(--gold);
            font-weight: 800;
            font-family: 'Orbitron', monospace;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            animation: glow-pulse 3s ease-in-out infinite;
            will-change: text-shadow;
        }
        @keyframes glow-pulse {
            0%, 100% { text-shadow: 0 0 30px rgba(212, 175, 55, 0.3); }
            50% { text-shadow: 0 0 60px rgba(212, 175, 55, 0.6); }
        }
        .logo-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 2px;
        }
        .logo-text span { color: var(--gold); }
        .logo-badge {
            font-size: 0.45rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--space);
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .network-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.6rem;
            color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .network-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
            will-change: transform, opacity;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* ===== TOKEN BADGE EN HEADER ===== */
        .token-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: var(--gold);
            font-family: 'Orbitron', monospace;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .token-badge:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.25);
            transform: translateY(-2px);
            box-shadow: var(--shadow-gold);
        }
        .token-badge #tokenBadgeCantidad {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--gold-bright);
        }

        /* ===== NAVEGACIÓN ===== */
        .main-nav {
            display: flex;
            gap: 4px;
            background: rgba(15, 45, 26, 0.3);
            border-radius: var(--radius);
            padding: 4px;
            border: 1px solid var(--glass-border);
            margin: 16px 0 20px;
            overflow-x: auto;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
            contain: layout style;
            transition: background 0.5s ease, border-color 0.5s ease;
        }
        .main-nav .nav-link {
            padding: 8px 16px;
            border-radius: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
        }
        .main-nav .nav-link::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: var(--transition);
            transform: translateX(-50%);
            border-radius: 2px;
        }
        .main-nav .nav-link:hover::after,
        .main-nav .nav-link.active::after {
            width: 60%;
        }
        .main-nav .nav-link:hover {
            color: var(--text-primary);
            background: rgba(212, 175, 55, 0.05);
        }
        .main-nav .nav-link.active {
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold);
        }
        .main-nav .nav-link.live {
            color: var(--danger);
        }
        .main-nav .nav-link.live:hover {
            background: rgba(255, 51, 102, 0.08);
        }

        /* ===== VALOR DE MERCADO ===== */
        .valor-mercado {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 16px 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: var(--transition-slow);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
        }
        .valor-mercado:hover {
            border-color: rgba(212, 175, 55, 0.2);
            box-shadow: var(--shadow-gold);
        }
        .valor-mercado .info .titulo {
            font-family: 'Orbitron', monospace;
            color: var(--text-muted);
            font-size: 0.6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .valor-mercado .info .precio {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
        }
        .valor-mercado .info .precio .moneda {
            font-size: 1rem;
            color: var(--text-muted);
        }
        .valor-mercado .info .detalles {
            display: flex;
            gap: 16px;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .valor-mercado .info .detalles span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .valor-mercado .info .detalles .up { color: var(--success); }
        .valor-mercado .info .detalles .down { color: var(--danger); }
        .valor-mercado .info .extra {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .valor-mercado .btn-vender-token {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .valor-mercado .btn-vender-token:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-gold);
        }

        /* ===== TRENDING TOPICS ===== */
        .trending-section {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 16px 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: var(--transition-slow);
        }
        .trending-section:hover {
            border-color: rgba(212, 175, 55, 0.2);
            box-shadow: var(--shadow-gold);
        }
        .trending-section .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .trending-section .header h3 {
            font-family: 'Orbitron', monospace;
            color: var(--gold);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .trending-section .header .actualizado {
            font-size: 0.55rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .trending-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .trending-tags .tag {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.08);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }
        .trending-tags .tag:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.2);
            color: var(--gold);
            transform: translateY(-2px);
        }
        .trending-tags .tag .count {
            font-size: 0.55rem;
            color: var(--text-muted);
            margin-left: 4px;
        }

        /* ===== FORMULARIO ===== */
        .post-form {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 20px 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: var(--transition-slow);
        }
        .post-form:hover {
            border-color: rgba(212, 175, 55, 0.2);
            box-shadow: var(--shadow-gold);
        }
        .post-form .form-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .post-form .form-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green-deep), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            font-family: 'Orbitron', monospace;
        }
        .post-form .form-header .nombre {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.85rem;
        }
        .post-form .form-header .handle {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .post-form textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            min-height: 80px;
            transition: var(--transition);
            outline: none;
        }
        .post-form textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.05);
            background: rgba(0, 0, 0, 0.35);
        }
        .post-form .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        .post-form .form-actions .tools {
            display: flex;
            gap: 4px;
        }
        .post-form .form-actions .tools button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            padding: 4px 10px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .post-form .form-actions .tools button:hover {
            color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }
        .post-form .form-actions .tools button.venta {
            color: var(--success);
            border: 1px solid rgba(0, 214, 143, 0.15);
        }
        .post-form .form-actions .tools button.venta:hover {
            background: rgba(0, 214, 143, 0.08);
        }
        .btn-publicar {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--space);
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 1px;
        }
        .btn-publicar:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-gold);
        }
        .btn-publicar:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== POST CARD ===== */
        .post-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 20px 24px;
            margin-bottom: 16px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: var(--transition-slow);
            animation: fadeInUp 0.4s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .post-card:hover {
            border-color: rgba(212, 175, 55, 0.2);
            box-shadow: var(--shadow-gold);
            transform: translateY(-2px);
        }
        .post-card .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .post-card .post-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green-deep), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 1.2rem;
            overflow: hidden;
            flex-shrink: 0;
            font-family: 'Orbit
